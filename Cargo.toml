# One Cargo workspace for every first-party Rust crate in the monorepo.
#
# Pulsar, the BLE gateway, the Windows logon provider and the station helper
# share a single dependency view, one lockfile and one compiler toolchain.
# Cargo is the dependency source of truth; Bazel reads this manifest through
# crate_universe (see MODULE.bazel) and builds the same crates hermetically.
[workspace]
members = [
    "packages/rust/*",
    "projects/station/ble-gateway/crates/*",
    "projects/station/pulsar/satellite/crates/*",
    "projects/station/tools/voice-recorder/helper",
    "solutions/windows-logon-provider/crates/*",
    "solutions/wakegrant/crates/*",
    "solutions/voice-proxy/crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"
publish = false

# Every external dependency is declared here and pinned exactly; members use
# `dep = { workspace = true }` (dev-dependencies add `features = ["test-util"]`
# to tokio). Upstream Pulsar patches that touch Cargo.toml map their pins here.
[workspace.dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal", "process", "io-util", "fs"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-log = { version = "=0.2.0", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
thiserror = "=2.0.21"
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# Unicode speech rules (DECISIONS 41): the voice-proxy sanitizer needs the same
# Unicode space set, NFKC and full case folding as the Go implementation.
# `regex` has no lookahead, so the sentence scanner stays a small state machine.
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
caseless = "=0.2.2"
# Incremental SSE decoding of the upstream response body.
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
futures-core = { version = "=0.3.34", default-features = false }
anyhow = "=1.0.104"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# HTTP-клиент станции (pulsar-update): только HTTP/1, rustls с провайдером ring и
# собственными корнями из CA-бандла прошивки. aws-lc-rs не собирается
# zig-тулчейном; http2, cookies, gzip, charset и system-proxy не нужны.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }
getrandom = "=0.3.4"
hex = "=0.4.3"
# protobuf-кодек ESPHome Native API (esphome-proto): только ручные `derive(Message)`,
# без protoc и рефлексии; `no-recursion-limit` не нужен, вложенность сообщений фиксирована.
prost = { version = "=0.14.4", default-features = false, features = ["std", "derive"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
http = { version = "=1.5.0", default-features = false, features = ["std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
ring = "=0.17.14"
log = { version = "=0.4.34", features = ["std"] }
libc = "=0.2.191"
libloading = "=0.9.0"
# Safe syscall wrappers (errno, pwrite) for the shared Linux helpers.
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "time"] }
# snow: нужны только примитивы Noise_NNpsk0_25519_ChaChaPoly_SHA256; фичи по умолчанию (`std`,
# `default-resolver-crypto`) тянут ещё ring, BLAKE2 и AES-GCM — они не нужны (ring в сборке и так
# есть для rustls).
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
socket2 = { version = "=0.6.5", features = ["all"] }
cc = "=1.10.0"
# BlueZ is reached over the system bus. zbus is a pure-Rust implementation and
# its `tokio` feature uses the same runtime as the rest of the daemon; it does
# not link libdbus (unlike `dbus`/`bluer`).
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
# std::time cannot format local calendar timestamps without unsafe libc calls;
# `time` keeps the BLE gateway log format identical to the former Go daemon.
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "local-offset", "macros"] }
# Server-side configuration and SQLite/HTTP primitives for the home services
# (DECISIONS 41). `rusqlite` is bundled so the static musl image carries its
# own SQLite.
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Scheduler ids (DECISIONS 41): `v5` reproduces Go's UUIDv5/DNS event ids and
# `v7` the same 36-character time-ordered format as `uuid.NewV7`.
uuid = { version = "=1.29.0", features = ["v4", "v5", "v7"] }
# IANA time zones with a bundled tzdb (no system tzdata on the station image):
# `tzdb-bundle-always` keeps DST/gap/fold behaviour reproducible. Pinned so a
# tzdb update cannot change scheduler occurrences silently.
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tzdb-bundle-always"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["limit", "timeout"] }
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
# ricardo.v1 over the official Connect runtime: `connectrpc` transports and
# serves the protocol, `buffa` owns protobuf messages and protojson
# (DECISIONS 41, spike #134). Only the client and JSON codec are needed by the
# home services' executor/queue clients.
# No `client` feature: it enables hyper/http2 workspace-wide (h2 in every
# hyper user, +580 KB in the station firmware). home-proto implements the
# client transport over the workspace reqwest (HTTP/1.1) instead.
connectrpc = { version = "=0.9.1", default-features = false, features = ["json"] }
buffa = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
# Used only by packages/rust/home-proto/generate.sh in its throwaway build
# project; pinned here so the code generator cannot drift silently.
connectrpc-build = "=0.9.0"
# Exponential backoff of the shared worker loop; `tokio-sleep` keeps the retry
# future async without pulling the blocking or wasm sleepers.
backon = { version = "=1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
# Windows API surface: `crates/*/src/bindings.rs` is generated by
# windows-bindgen (see solutions/windows-logon-provider/bindings.txt), so the
# runtime needs only the small `windows-core`/`windows-link` support crates.
windows-core = "=0.62.2"
windows-link = "=0.2.1"

# Cargo cannot set panic per package. `release` stays unwinding so the logon
# provider's COM boundary can catch panics; `station` is the aborting profile
# for the Linux station daemons. The real artifacts are built by Bazel, which
# keeps the per-target `-C panic`/LTO/strip select()es.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
strip = false

[profile.station]
inherits = "release"
panic = "abort"

# Shared lint policy. CI builds with `-D warnings`; Bazel forwards these exact
# entries through `extract_cargo_lints` (see the per-package `workspace_lints`
# targets), so cargo and Bazel lint the same set.
#
# `suboptimal_flops`/`imprecise_flops` are deliberately absent: Pulsar's FMA
# rule forbids rewriting float expressions to `mul_add`, and both lints push
# exactly that (see projects/station/pulsar/docs/architecture.md).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
assigning_clones = "warn"
checked_conversions = "warn"
format_push_string = "warn"
if_not_else = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
option_if_let_else = "warn"
redundant_closure_for_method_calls = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
significant_drop_tightening = "warn"
single_match_else = "warn"
unused_async = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
