[workspace]
members = [
    "packages/rust/*",
    "platform/deploy-rs",
    "projects/home-assistant/deploy/health-exporter/crates/*",
    "projects/station/ble-gateway/crates/*",
    "projects/station/pulsar/installer",
    "projects/station/pulsar/satellite/crates/*",
    "projects/station/tools/voice-recorder/helper",
    "solutions/windows-logon-provider/crates/*",
    "solutions/wakegrant/crates/*",
    "solutions/voice-proxy/crates/*",
    "solutions/scheduler/crates/*",
    "solutions/ha-bridge/crates/*",
    "solutions/ha-config-sync/crates/*",
    "solutions/mcp-gateway/crates/*",
    "solutions/currency-bot/crates/*",
    "solutions/intercom/crates/*",
    "solutions/phone-push/crates/*",
    "solutions/secrets-gateway/crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal", "process", "io-util", "fs"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt", "codec"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-log = { version = "=0.2.0", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
thiserror = "=2.0.21"
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "raw_value"] }
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
serde_urlencoded = "=0.7.1"
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
caseless = "=0.2.2"
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
futures-core = { version = "=0.3.34", default-features = false }
futures = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
anyhow = "=1.0.104"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "query", "form"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
prost = { version = "=0.14.4", default-features = false, features = ["std", "derive"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
http = { version = "=1.5.0", default-features = false, features = ["std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
ring = "=0.17.14"
log = { version = "=0.4.35", features = ["std"] }
libc = "=0.2.191"
libloading = "=0.9.0"
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "time", "termios", "event"] }
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
socket2 = { version = "=0.6.5", features = ["all"] }
str0m = { version = "=0.25.0", default-features = false, features = ["rust-crypto"] }
cc = "=1.11.1"
zbus = { version = "=6.2.1", default-features = false, features = ["tokio", "proxy", "service", "object-manager"] }
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "parsing", "local-offset", "macros"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
uuid = { version = "=1.29.1", features = ["v4", "v5", "v7"] }
sha1_smol = "=1.0.1"
jiff = { version = "=0.2.41", default-features = false, features = ["std", "tzdb-bundle-always"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["limit", "timeout"] }
prometheus-client = { version = "=0.25.2", default-features = false }
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
connectrpc = { version = "=0.9.1", default-features = false, features = ["json"] }
buffa = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
connectrpc-build = "=0.9.0"
backon = { version = "=1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
hmac = "=0.13.0"
sha1 = { version = "=0.11.0", default-features = false }
sha2 = "=0.11.1"
x509-parser = { version = "=0.18.1", default-features = false, features = ["verify"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
rand = "=0.10.3"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
windows-core = "=0.62.2"
windows-link = "=0.2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
strip = false

[profile.station]
inherits = "release"
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
missing_safety_doc = "allow"
assigning_clones = "warn"
checked_conversions = "warn"
format_push_string = "warn"
if_not_else = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
option_if_let_else = "warn"
redundant_closure_for_method_calls = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
semicolon_if_nothing_returned = "warn"
significant_drop_tightening = "warn"
single_match_else = "warn"
unused_async = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
