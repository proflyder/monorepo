# --- offsite backup install (restic → Google Drive) --------------------------
# No OFFSITE_RCLONE_CONF on purpose: rclone refreshes the OAuth token inside
# /var/lib/offsite-backup/rclone.conf on the node, and re-uploading the copy
# from OpenBao would overwrite a newer token. First install only:
#   mise run secrets:exec -- -P offsite exec -- env OFFSITE_RCLONE_CONF=<file> …
[profiles.offsite.secrets]
OFFSITE_ENV_FILE = { provider = "infra_backup", value = "offsite/offsite_backup_env", as_file = true }
OFFSITE_RESTIC_PASSWORD_FILE = { provider = "infra_backup", value = "offsite/offsite_restic_password", as_file = true }
OFFSITE_HA_TOKEN_FILE = { provider = "infra_backup", value = "offsite/offsite_ha_token", as_file = true }
OFFSITE_BB_KEY_FILE = { provider = "infra_ssh", value = "offsite-bb/offsite_bb_key", as_file = true }
OFFSITE_BB_KNOWN_HOSTS_FILE = { provider = "infra_ssh", value = "offsite-bb/offsite_bb_known_hosts", as_file = true }

# --- service deploy scripts run by hand (CI gets the same values by OIDC) ----
