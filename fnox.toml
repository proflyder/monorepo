[providers.infra_kubernetes]
type = "vault"
path = "secret/infra/kubernetes"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_cloudflare]
type = "vault"
path = "secret/infra/cloudflare"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_backup]
type = "vault"
path = "secret/infra/backup"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_ssh]
type = "vault"
path = "secret/infra/ssh"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_station]
type = "vault"
path = "secret/infra/station"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.k8s_home_assistant]
type = "vault"
path = "secret/k8s/home-assistant"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.ci]
type = "vault"
path = "secret/ci"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[profiles.kube.secrets]
KUBECONFIG = { provider = "infra_kubernetes", value = "admin/admin_kubeconfig", as_file = true }

[profiles.ingress.secrets]
INGRESS_PRIVATE_ENV = { provider = "infra_kubernetes", value = "values-private/ingress_env", as_file = true }
CLOUDFLARE_API_TOKEN_FILE = { provider = "infra_cloudflare", value = "vpn-dns/cloudflare_env", as_file = true }
SCHEDULER_TOKEN_FILE = { provider = "k8s_home_assistant", value = "scheduler-auth/token", as_file = true }
HA_TOKEN_FILE = { provider = "k8s_home_assistant", value = "ha-bridge-ha/token", as_file = true }
KUBECONFIG = { provider = "infra_kubernetes", value = "admin/admin_kubeconfig", as_file = true }

[profiles.openbao.secrets]
INGRESS_PRIVATE_ENV = { provider = "infra_kubernetes", value = "values-private/ingress_env", as_file = true }
CLOUDFLARE_API_TOKEN_FILE = { provider = "infra_cloudflare", value = "vpn-dns/cloudflare_env", as_file = true }
KUBECONFIG = { provider = "infra_kubernetes", value = "admin/admin_kubeconfig", as_file = true }

[profiles.heartbeat.secrets]
HEARTBEAT_ENV_FILE = { provider = "infra_cloudflare", value = "workers/heartbeat_env", as_file = true }
CLOUDFLARE_ENV_FILE = { provider = "infra_cloudflare", value = "workers/cloudflare_workers_env", as_file = true }

[profiles.offsite.secrets]
OFFSITE_ENV_FILE = { provider = "infra_backup", value = "offsite/offsite_backup_env", as_file = true }
OFFSITE_RESTIC_PASSWORD_FILE = { provider = "infra_backup", value = "offsite/offsite_restic_password", as_file = true }
OFFSITE_HA_TOKEN_FILE = { provider = "infra_backup", value = "offsite/offsite_ha_token", as_file = true }
OFFSITE_BB_KEY_FILE = { provider = "infra_ssh", value = "offsite-bb/offsite_bb_key", as_file = true }
OFFSITE_BB_KNOWN_HOSTS_FILE = { provider = "infra_ssh", value = "offsite-bb/offsite_bb_known_hosts", as_file = true }

[profiles.station.secrets]
STATION_HOST = { provider = "infra_station", value = "access/station_host_txt" }
HA_TOKEN_FILE = { provider = "k8s_home_assistant", value = "ha-bridge-ha/token", as_file = true }

[profiles.android.secrets]
SIGNING_KEYSTORE_B64_FILE = { provider = "ci", value = "android-distribute/signing_keystore_b64", as_file = true }
SIGNING_STORE_PASSWORD_FILE = { provider = "ci", value = "android-distribute/signing_store_password", as_file = true }
SIGNING_KEY_PASSWORD_FILE = { provider = "ci", value = "android-distribute/signing_key_password", as_file = true }
SIGNING_KEY_ALIAS = { provider = "ci", value = "android-distribute/signing_key_alias" }
SIGNING_CERT_SHA256 = { provider = "ci", value = "android-distribute/signing_cert_sha256" }
GOOGLE_APPLICATION_CREDENTIALS = { provider = "ci", value = "android-distribute/firebase_service_account_json", as_file = true }
