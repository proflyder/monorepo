# Secrets for local scripts — references to OpenBao only, never values.
#
# Entry point: `mise run admin:<task>` (each task picks its profile) or
# `mise run secrets:exec -- -P <profile> exec -- <command>`. fnox resolves the
# profile's secrets, writes `as_file` ones to private temp files (0600, deleted
# when the command exits) and passes their paths in the variables the scripts
# already read. Nothing persists on disk; the shell stays clean.
#
# Providers: one per OpenBao folder, because fnox references are `<leaf>/<field>`
# (no nested paths). Address: VAULT_ADDR (mise env, secrets/openbao/addr).
# Token: the machine's operator token via `workstation.py token`, which also
# renews it. `vault` is a shim to `bao` (platform/workstation/bin/vault).
# Every reference is checked against platform/workstation/catalog.json by
# test_workstation.py and against OpenBao by `mise run secrets:check`.

[providers.infra_kubernetes]
type = "vault"
path = "secret/infra/kubernetes"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_cloudflare]
type = "vault"
path = "secret/infra/cloudflare"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_backup]
type = "vault"
path = "secret/infra/backup"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_ssh]
type = "vault"
path = "secret/infra/ssh"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.infra_station]
type = "vault"
path = "secret/infra/station"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.k8s_home_assistant]
type = "vault"
path = "secret/k8s/home-assistant"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

[providers.ci]
type = "vault"
path = "secret/ci"
credential_command = 'r="$(git rev-parse --show-toplevel)" && "$r/platform/workstation/run.sh" "$r/platform/workstation/workstation.py" token'

# --- admin kubeconfig: deploy:status --live, rollback, cluster-wide scripts --
[profiles.kube.secrets]
KUBECONFIG = { provider = "infra_kubernetes", value = "admin/admin_kubeconfig", as_file = true }

# --- ingress: Traefik/cert-manager deploy and verify ------------------------
[profiles.ingress.secrets]
INGRESS_PRIVATE_ENV = { provider = "infra_kubernetes", value = "values-private/ingress_env", as_file = true }
CLOUDFLARE_API_TOKEN_FILE = { provider = "infra_cloudflare", value = "vpn-dns/cloudflare_env", as_file = true }
SCHEDULER_TOKEN_FILE = { provider = "k8s_home_assistant", value = "scheduler-auth/token", as_file = true }
HA_TOKEN_FILE = { provider = "k8s_home_assistant", value = "ha-bridge-ha/token", as_file = true }
KUBECONFIG = { provider = "infra_kubernetes", value = "admin/admin_kubeconfig", as_file = true }

