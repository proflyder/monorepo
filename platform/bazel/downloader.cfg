# Bazel downloader rewrites for CI.
#
# `__NEXUS_HOST__` is replaced by `.github/actions/nexus-cache/action.yml` with
# the public cache hostname from the repository variable NEXUS_HOST. The file
# is never used locally: the action writes the rendered copy under
# $RUNNER_TEMP and points `~/.bazelrc` at it.
#
# Every host has two rules: the original upstream URL first, then the Nexus
# proxy as a fallback. GitHub-hosted runners are in Azure and reach Maven
# Central, PyPI and npm directly from their own IP; that is fast and does not
# share one bottleneck. Nexus sits behind the home uplink (~2 MB/s per stream,
# shared by every runner), so it is only used when the direct download fails
# with 429/5xx or a dropped connection. Bazel tries the matching rewrites in
# rule order, so the direct URL wins whenever it works.
#
# GitHub releases, codeload and nodejs.org are not rewritten. Their archives
# are large (rules_rust, Kotlin, KSP, python-build-standalone) and twenty
# parallel runners pulling them through the home uplink and tunnel ended in
# `Premature EOF`. They come from the Bazel repository cache that the develop
# `warm-android` / `warm-rust` jobs save and every PR job restores through the
# `bazel-repository-cache` composite action.

# Maven Central and Google Maven each go to their own proxy, never through the
# maven-public group: some coordinates (com.android.tools.build:transform-api)
# exist in both with different bytes, the group answers with the Central copy
# and maven_install.json pins the Google one.
rewrite ^repo1\.maven\.org/maven2/(.*)$ repo1.maven.org/maven2/$1
rewrite ^repo1\.maven\.org/maven2/(.*)$ __NEXUS_HOST__/repository/maven-central/$1
rewrite ^repo\.maven\.apache\.org/maven2/(.*)$ repo.maven.apache.org/maven2/$1
rewrite ^repo\.maven\.apache\.org/maven2/(.*)$ __NEXUS_HOST__/repository/maven-central/$1
rewrite ^maven\.google\.com/(.*)$ maven.google.com/$1
rewrite ^maven\.google\.com/(.*)$ __NEXUS_HOST__/repository/google-maven/$1

# PyPI artifacts fetched directly by Bazel rules.
rewrite ^files\.pythonhosted\.org/(.*)$ files.pythonhosted.org/$1
rewrite ^files\.pythonhosted\.org/(.*)$ __NEXUS_HOST__/repository/pypi/$1

# npm tarballs fetched directly by Bazel rules.
rewrite ^registry\.npmjs\.org/(.*)$ registry.npmjs.org/$1
rewrite ^registry\.npmjs\.org/(.*)$ __NEXUS_HOST__/repository/npmjs/$1
