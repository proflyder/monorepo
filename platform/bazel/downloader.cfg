# Bazel downloader rewrites for CI.
#
# `__NEXUS_HOST__` is replaced by `.github/actions/nexus-cache/action.yml` with
# the public cache hostname from the repository variable NEXUS_HOST. The file
# is never used locally: the action writes the rendered copy under
# $RUNNER_TEMP and points `~/.bazelrc` at it. A `rewrite` line replaces the
# original URL, so the action probes Nexus first and skips this file when the
# cache is unreachable; CI then stays on the direct upstreams.
#
# GitHub is not rewritten: the raw proxy answered 504 through the tunnel for
# release assets (redirect to objects.githubusercontent.com), and a rewrite
# has no fallback. Re-enable once the proxy is verified end to end.

# Node.js distributions used by the mise node backend.
rewrite ^https://nodejs\.org/dist/(.*)$ https://__NEXUS_HOST__/repository/nodejs-dist/$1

# Maven Central (both historical names) and Google Maven through the group.
rewrite ^https://repo1\.maven\.org/maven2/(.*)$ https://__NEXUS_HOST__/repository/maven-public/$1
rewrite ^https://repo\.maven\.apache\.org/maven2/(.*)$ https://__NEXUS_HOST__/repository/maven-public/$1
rewrite ^https://maven\.google\.com/(.*)$ https://__NEXUS_HOST__/repository/maven-public/$1

# PyPI artifacts fetched directly by Bazel rules.
rewrite ^https://files\.pythonhosted\.org/(.*)$ https://__NEXUS_HOST__/repository/pypi/$1

# npm tarballs fetched directly by Bazel rules.
rewrite ^https://registry\.npmjs\.org/(.*)$ https://__NEXUS_HOST__/repository/npmjs/$1
