# One-shot cutover preflight, run inside the cluster.
#
# The CI runner reaches the K3s API but neither Home Assistant nor the
# scheduler NodePort, so the read-only preflight runs next to the scheduler
# instead of on the deploy host. deploy.sh applies this Job, waits for
# completion and prints the pod log.
#
# TEMPLATE: rendered by deploy.sh with the private HA URL and the digest-pinned
# home-deploy image (the same Go binary the deploy scripts use; distroless, no
# shell, no Python). Both tokens are mounted, never passed on a command line.
apiVersion: batch/v1
kind: Job
metadata:
  name: scheduler-preflight
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: scheduler-preflight
    app.kubernetes.io/part-of: home
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-preflight
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: ${PREFLIGHT_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/home-deploy
            - preflight
            - --ha-url
            - ${HA_URL}
            - --ha-token-file
            - /run/secrets/ha/token
            - --scheduler-url
            - http://scheduler.home-assistant.svc.cluster.local:8098
            - --scheduler-token-file
            - /run/secrets/scheduler/token
            - --expected-endpoint
            - ${SCHEDULER_PUBLIC_URL}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scheduler-token
              mountPath: /run/secrets/scheduler
              readOnly: true
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
      volumes:
        - name: scheduler-token
          secret:
            secretName: scheduler-auth
            defaultMode: 0440
        - name: ha-token
          secret:
            secretName: ha-bridge-ha
            defaultMode: 0440
