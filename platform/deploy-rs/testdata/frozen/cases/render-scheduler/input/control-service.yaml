apiVersion: v1
kind: Service
metadata:
  name: ha-control
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-control
    app.kubernetes.io/part-of: ricardo-home
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ha-control
  ports:
    - name: catalog
      port: 8099
      targetPort: catalog
      nodePort: ${CONTROL_NODE_PORT}
      protocol: TCP
