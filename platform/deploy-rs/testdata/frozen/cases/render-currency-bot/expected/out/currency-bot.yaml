# Currency bot: one static Go binary, one SQLite writer, one persistent volume.
#
# TEMPLATE. deploy.sh renders it with private values from an ignored env file
# (or from the CI job's OpenBao-backed env); rendered manifests must never be
# committed.
#
#   CURRENCY_BOT_IMAGE    digest-pinned image built by Bazel
#   CURRENCY_WEBHOOK_URL  public Cloudflare Tunnel host, e.g.
#                         https://<public webhook host>/telegram/webhook
#   BUILD_ID              Deployment annotation (traceability, never rolls pods)
#   ROLLOUT_ID            content-addressed pod-template annotation
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: currency-bot-data
  namespace: currency-bot
  labels:
    app.kubernetes.io/name: currency-bot
    app.kubernetes.io/part-of: home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-bot
  namespace: currency-bot
  labels:
    app.kubernetes.io/name: currency-bot
    app.kubernetes.io/part-of: home
  annotations:
    # Traceability only: a Deployment metadata change never rolls pods.
    ricardo.dev/build: 0123456789ab
spec:
  replicas: 1
  # SQLite is single-writer: never two pods against the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: currency-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: currency-bot
      annotations:
        # Content-addressed: identical rendered content keeps the pod template.
        ricardo.dev/rollout: 96d0770138dc
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: currency-bot
          image: ghcr.io/proflyder/currency-bot@sha256:4444444444444444444444444444444444444444444444444444444444444444
          imagePullPolicy: IfNotPresent
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: currency-bot
                  key: BOT_TOKEN
            - name: CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: currency-bot
                  key: CHAT_ID
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: currency-bot
                  key: WEBHOOK_SECRET
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: currency-bot
                  key: API_TOKEN
            - name: WEBHOOK_URL
              value: https://bot.example.test/telegram/webhook
            - name: DB_PATH
              value: /data/currency-bot.db
            - name: TZ
              value: UTC
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: webhook
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: currency-bot-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: currency-bot
  namespace: currency-bot
  labels:
    app.kubernetes.io/name: currency-bot
    app.kubernetes.io/part-of: home
spec:
  # NodePort is the LAN path for HA Assist (`GET /api/latest`). The port is a
  # private deploy value; the K3s node nftables filter
  # (projects/home/kubernetes/currency-bot/nft) admits only the home LAN and
  # pod CIDR, like the scheduler NodePort. The same Service still backs the
  # Traefik IngressRoute and in-cluster clients as a normal ClusterIP.
  type: NodePort
  selector:
    app.kubernetes.io/name: currency-bot
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      nodePort: 30100
---
# Separate Service for the Telegram webhook: the Cloudflare Tunnel ingress
# targets http://currency-bot-webhook.currency-bot.svc.cluster.local:8081 and
# the NetworkPolicy only opens 8081 to cloudflared pods.
apiVersion: v1
kind: Service
metadata:
  name: currency-bot-webhook
  namespace: currency-bot
  labels:
    app.kubernetes.io/name: currency-bot
    app.kubernetes.io/part-of: home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: currency-bot
  ports:
    - name: webhook
      port: 8081
      targetPort: webhook
      protocol: TCP
