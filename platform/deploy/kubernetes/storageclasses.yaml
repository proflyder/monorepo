apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# Legacy name kept on purpose: existing PVs/PVCs (OpenBao, HA runtime) reference
# it and a StorageClass cannot be renamed in place. Renaming needs a separate
# migration that recreates the PVCs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ricardo-existing
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
