alloy:
  storagePath: /var/lib/alloy
  mounts:
    varlog: true
    extra:
      - name: positions
        mountPath: /var/lib/alloy
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  configMap:
    content: |
      logging { level = "warn" }
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME_NODE")
        }
      }
      discovery.relabel "safe_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex = "kube-system|monitoring|currency-bot"
          action = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex = "alloy"
          action = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator = "/"
          target_label = "__path__"
          replacement = "/var/log/pods/*$1/*.log"
        }
      }
      local.file_match "pods" {
        path_targets = discovery.relabel.safe_logs.output
        sync_period = "10s"
      }
      loki.source.file "pods" {
        targets = local.file_match.pods.targets
        forward_to = [loki.process.privacy.receiver]
      }
      // stage.replace rewrites only the capture groups of each expression;
      // every secret value must therefore sit inside a group.
      loki.process "privacy" {
        stage.cri {}
        stage.replace {
          expression = "(?i)(?:bearer[ \t]+|(?:token|password|api_key|secret)[\"']?[ \t]*[:=][ \t]*[\"']?)([A-Za-z0-9._~+/=-]+)"
          replace = "[REDACTED]"
        }
        stage.replace {
          expression = "[0-9]+:([A-Za-z0-9_-]{35})"
          replace = "[REDACTED]"
        }
        forward_to = [loki.write.local.receiver]
      }
      loki.write "local" {
        endpoint { url = "http://loki:3100/loki/api/v1/push" }
      }
  extraEnv:
    - name: HOSTNAME_NODE
      valueFrom:
        fieldRef: {fieldPath: spec.nodeName}
controller:
  type: daemonset
  volumes:
    extra:
      - name: positions
        hostPath:
          path: /srv/k3s/alloy-positions
          type: DirectoryOrCreate
