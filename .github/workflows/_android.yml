name: _android

# Reusable Android platform workflow: one matrix entry per affected application
# (or shared Kotlin library) unit, plus the dedicated Android Lint unit. The unit
# is selected by the Bazel reverse dependency graph in ci.yml; the `plan` job
# runs target-determinator once for the whole Android universe and each entry
# only intersects its declared targets with that result (an empty result or a
# failed plan keeps every declared target). Build runs before test, so a test
# failure cannot hide a build error and a lint finding only fails the lint entry.
#
# `android-app` is the one entry that owns the distributable APK: it reads the
# `Android` Environment secrets (signing key, google-services.json) through
# OpenBao, builds the app once with the release versionCode/versionName, runs
# the tests against that same APK, signs it with `platform/android/sign-release.sh`
# and uploads `android-release-apk`. The other entries (lint, kotlin-shared,
# detekt) never declare the Environment, never read a secret and build exactly
# as before. `android-distribute` in ci.yml only downloads that artifact and
# uploads it to Firebase, so the APK is built once per pull request.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      test_targets:
        description: Space separated Bazel test targets owned by the unit
        required: false
        default: ""
        type: string
      build_targets:
        description: Space separated Bazel build targets owned by the unit
        required: false
        default: ""
        type: string
      sdk_packages:
        description: Extra Android SDK packages (space separated) this unit needs
        required: false
        default: ""
        type: string
      affected_targets:
        description: >-
          Space separated affected targets from the `plan` job (empty disables
          narrowing and runs every declared target)
        required: false
        default: ""
        type: string
      artifact:
        description: Path of the build artifact to upload (empty to skip)
        required: false
        default: ""
        type: string
      artifact_name:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  android:
    name: android / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only the `android-app` entry may read the Environment that holds the VPN
    # credentials, the OpenBao address and the release key. A fork PR or a
    # manual dispatch evaluates to an empty name: no Environment, no secrets,
    # and the signing steps below skip with an explicit notice. Everything else
    # (lint, kotlin-shared, detekt) has no Environment at all.
    environment: >-
      ${{ inputs.unit == 'android-app' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          'Android' || '' }}
    permissions:
      contents: read
      # The OIDC token OpenBao's `android-app-release` role verifies. The
      # permission is granted to the whole entry because job permissions cannot
      # depend on the matrix value; only the guarded steps actually log in.
      id-token: write
    # Build/test use the same mise tasks as a workstation; the selected target
    # list is passed through BAZEL_TARGETS. Tools come from install_args.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Pinned Bazelisk on PATH, plus its Bzlmod/repository caches.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # `mise run build|test <unit>` resolves the unit's targets; Bazel itself
      # comes from setup-bazel above.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: "node"
          cache: true

      # Restore-only in pull requests. GitHub scopes a cache to the ref that
      # wrote it, so a PR-written cache is invisible to every other PR: it only
      # burns the repository's 10 GB budget and the minutes spent uploading it.
      # Only a develop push writes this entry (deploy-home `warm-caches`), under
      # the exact key restored first here. The key is ordered platform → unit →
      # content so `restore-keys` form a real hierarchy: the exact key, then the
      # same unit with other lockfiles, then any Android unit's cache (a small
      # `kotlin-shared` entry reuses the app's compiled libraries and a new
      # `maven_install.json` is never a cold start).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-android-${{ runner.os }}-${{ inputs.unit }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}
          restore-keys: |
            bazel-android-${{ runner.os }}-${{ inputs.unit }}-
            bazel-android-${{ runner.os }}-

      # setup-android accepts the SDK licenses by default; install exactly the
      # platform/build-tools pinned in MODULE.bazel plus the extra SDK packages
      # the unit declares (for example the cmdline-tools release that provides
      # the standalone Android Lint CLI, or the NDK that provides the C++
      # toolchain for //platform/android:android_arm64). Keep the lint version
      # in sync with platform/android/tools/lint_runner.
      - name: Install Android SDK packages
        env:
          SDK_PACKAGES: ${{ inputs.sdk_packages }}
        run: |
          packages=("platforms;android-36" "build-tools;36.0.0")
          if [ -n "$SDK_PACKAGES" ]; then
            read -r -a extra <<< "$SDK_PACKAGES"
            packages+=("${extra[@]}")
          fi
          sdkmanager --install "${packages[@]}"
          # rules_android_ndk resolves the NDK from ANDROID_NDK_HOME; export it
          # only for units that declared an `ndk;<version>` package.
          for package in "${packages[@]}"; do
            if [[ "$package" == ndk\;* ]]; then
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${package#ndk;}" >> "$GITHUB_ENV"
            fi
          done

      - name: Release signing self-test
        if: inputs.unit == 'android-app'
        run: platform/android/sign-release_test.sh

      # A fork PR and `workflow_dispatch` get no `Android` Environment (see the
      # job-level `environment`), so they cannot mint the OpenBao token. They
      # still build and test the app; only signing and the release artifact are
      # skipped, with a visible notice instead of an obscure secret failure.
      - name: Decide release signing
        id: release
        if: inputs.unit == 'android-app'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing enabled (same-repository pull request)"
          else
            {
              echo "enabled=false"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### android / android-app"
              echo
              echo "Release signing, the \`android-release-apk\` artifact and Firebase"
              echo "distribution are skipped: only same-repository pull requests can read"
              echo "the \`Android\` Environment secrets and mint the OpenBao OIDC token."
              echo "The APK is still built and tested (unsigned)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Release signing skipped::Fork PR or manual dispatch: no Environment secrets/OIDC. The APK is built and tested unsigned."
          fi

      # App Distribution needs a fresh, increasing versionCode; its versionName
      # embeds the commit. Both are `--define` values (defaults live in
      # platform/android/android.bazelrc) and are passed to build and test, so
      # the tested APK is byte-for-byte the APK that gets signed.
      - name: Release version
        id: version
        if: inputs.unit == 'android-app'
        run: |
          set -euo pipefail
          version_code="$(date -u +%s)"
          version_name="0.1.0-$(git rev-parse --short HEAD)"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "define_args=--define home_version_code=$version_code --define home_version_name=$version_name"
          } >> "$GITHUB_OUTPUT"
          echo "Release versionCode $version_code, versionName $version_name"

      # No official action exists for openconnect; the runner image has none.
      # The VPN steps mirror deploy-home's minimal connect/health-check
      # sequence; they are duplicated rather than extracted so a change here
      # cannot alter the working home deployment job.
      - name: Install VPN client
        if: steps.release.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        if: steps.release.outputs.enabled == 'true'
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        if: steps.release.outputs.enabled == 'true'
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR). The
      # role `android-app-release` is bound to this reusable workflow
      # (`_android.yml@refs/pull/*/merge`), the `Android` Environment and the
      # PR merge ref, so a token minted here is usable nowhere else. The action
      # masks every line of every value and exposes them as step outputs only
      # (`exportEnv: false`). The JSON files are read as single-line base64:
      # vault-action masks every line of a multi-line value, and GitHub strips a
      # masked line that is just "{" from all logs.
      - name: Read Android signing secrets from OpenBao
        if: steps.release.outputs.enabled == 'true'
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: android-app-release
          jwtGithubAudience: ${{ secrets.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/android-distribute signing_keystore_b64 | SIGNING_KEYSTORE_B64 ;
            secret/data/ci/android-distribute signing_store_password | SIGNING_STORE_PASSWORD ;
            secret/data/ci/android-distribute signing_key_password | SIGNING_KEY_PASSWORD ;
            secret/data/ci/android-distribute signing_key_alias | SIGNING_KEY_ALIAS ;
            secret/data/ci/android-distribute signing_cert_sha256 | SIGNING_CERT_SHA256 ;
            secret/data/ci/android-distribute google_services_json_b64 | GOOGLE_SERVICES_JSON_B64

      # Materialise the private files into the checkout and $RUNNER_TEMP.
      # Bazel needs google-services.json under platform/android/keys/ exactly
      # like the local symlink. The release key is deliberately NOT there:
      # Bazel output stays debug-signed and only `sign-release.sh` applies the
      # release key, to the final APK. Passwords land in files with mode 600 and
      # are never written to the environment or to a log.
      - name: Materialise Android signing files
        if: steps.release.outputs.enabled == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ steps.openbao.outputs.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ steps.openbao.outputs.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ steps.openbao.outputs.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ steps.openbao.outputs.SIGNING_KEY_ALIAS }}
          SIGNING_CERT_SHA256: ${{ steps.openbao.outputs.SIGNING_CERT_SHA256 }}
          GOOGLE_SERVICES_JSON_B64: ${{ steps.openbao.outputs.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          KEYS_DIR="platform/android/keys"
          CI_DIR="$RUNNER_TEMP/ci"
          SIGNING_DIR="$CI_DIR/signing"
          for value in SIGNING_KEYSTORE_B64 SIGNING_STORE_PASSWORD \
                       SIGNING_KEY_PASSWORD SIGNING_KEY_ALIAS SIGNING_CERT_SHA256 \
                       GOOGLE_SERVICES_JSON_B64; do
            if [[ -z "${!value:-}" ]]; then
              echo "OpenBao returned an empty $value" >&2
              exit 1
            fi
          done
          mkdir -p "$KEYS_DIR" "$SIGNING_DIR"
          chmod 700 "$CI_DIR" "$SIGNING_DIR"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$KEYS_DIR/google-services.json"
          chmod 600 "$KEYS_DIR/google-services.json"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/home-release.keystore"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$SIGNING_DIR/store.password"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$SIGNING_DIR/key.password"
          printf '%s' "$SIGNING_KEY_ALIAS" > "$SIGNING_DIR/alias"
          printf '%s' "$SIGNING_CERT_SHA256" > "$SIGNING_DIR/cert.sha256"
          chmod 600 "$SIGNING_DIR"/*
          # Only paths go to later steps' environment; the values stay in files.
          {
            echo "SIGNING_KEYSTORE=$SIGNING_DIR/home-release.keystore"
            echo "SIGNING_STORE_PASSWORD_FILE=$SIGNING_DIR/store.password"
            echo "SIGNING_KEY_PASSWORD_FILE=$SIGNING_DIR/key.password"
            echo "SIGNING_KEY_ALIAS_FILE=$SIGNING_DIR/alias"
            echo "SIGNING_CERT_SHA256_FILE=$SIGNING_DIR/cert.sha256"
          } >> "$GITHUB_ENV"
          echo "Android signing files prepared"

      # The OpenBao token is short-lived and Maven/Firebase use the public
      # internet, so the private network is no longer needed.
      - name: Disconnect VPN
        if: steps.release.outputs.enabled == 'true'
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/ci/ci.p12" "$RUNNER_TEMP/ci/ci.pass"
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "VPN disconnected"

      # target-determinator runs once for the whole Android universe in the
      # `plan` job; here only the unit's own candidates are intersected with
      # that answer. An empty affected set (plan skipped, failed or degraded)
      # keeps every declared target: narrowing may run fewer targets, never
      # none.
      - name: Select affected targets
        id: targets
        env:
          AFFECTED: ${{ inputs.affected_targets }}
          TEST_CANDIDATES: ${{ inputs.test_targets }}
          BUILD_CANDIDATES: ${{ inputs.build_targets }}
        run: |
          node platform/ci/plan-targets.mjs narrow \
            --affected "$AFFECTED" \
            --tests "$TEST_CANDIDATES" \
            --builds "$BUILD_CANDIDATES" >> "$GITHUB_OUTPUT"

      # The app is always built from its declared target: this entry owns the
      # distributable APK, so a narrowed (possibly empty) build list must not
      # leave the artifact missing. BAZEL_EXTRA_ARGS carries the release
      # versionCode/versionName.
      - name: bazel build android-app (release APK)
        if: inputs.unit == 'android-app'
        env:
          BAZEL_EXTRA_ARGS: ${{ steps.version.outputs.define_args }}
        run: mise run build android-app

      - name: bazel build ${{ inputs.unit }}
        if: inputs.unit != 'android-app' && steps.targets.outputs.build_targets != ''
        env:
          BAZEL_TARGETS: ${{ steps.targets.outputs.build_targets }}
        run: mise run build ${{ inputs.unit }}

      # The apk_abi_test log is only printed on failure (--test_output=errors),
      # so repeat the ABI check on the built APK to show the packaged ABIs in
      # the job log ("APK ABIs: arm64-v8a").
      - name: Show APK ABIs
        if: inputs.unit == 'android-app'
        run: platform/android/apk_abi_test.sh bazel-bin/projects/mobile/android/app/app.apk

      # Same `--config=android` and the same version defines as the build step,
      # so `apk_runtime_closure_test` (and any APK-level test) inspects exactly
      # the APK that gets signed below instead of building a second variant.
      - name: bazel test android-app (on the distributable APK)
        if: inputs.unit == 'android-app' && steps.targets.outputs.test_targets != ''
        env:
          BAZEL_TARGETS: ${{ steps.targets.outputs.test_targets }}
          BAZEL_EXTRA_ARGS: ${{ steps.version.outputs.define_args }}
        run: mise run test android-app

      - name: bazel test ${{ inputs.unit }}
        if: inputs.unit != 'android-app' && steps.targets.outputs.test_targets != ''
        env:
          BAZEL_TARGETS: ${{ steps.targets.outputs.test_targets }}
        run: mise run test ${{ inputs.unit }}

      # The release key is applied only to the final, already-tested APK.
      # release-info.json carries the Firebase app id, version and digest to the
      # upload job, so that job needs only the Firebase service account and
      # never sees the signing key or google-services.json.
      - name: Sign the distributable APK
        if: inputs.unit == 'android-app' && steps.release.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          out="bazel-bin/projects/mobile/android/app/app-release.apk"
          platform/android/sign-release.sh \
            bazel-bin/projects/mobile/android/app/app.apk "$out"
          python3 projects/mobile/android/release_info.py write \
            --apk "$out" \
            --google-services platform/android/keys/google-services.json \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output bazel-bin/projects/mobile/android/app/release-info.json
          echo "signed release APK: $out"

      # The exact bytes installed by the testers, so a reviewer can sideload
      # what was published without repeating the build. Only a signed artifact
      # is publishable; a fork PR uploads nothing here and says so above.
      - name: Upload the signed release APK
        if: inputs.unit == 'android-app' && steps.release.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: |
            bazel-bin/projects/mobile/android/app/app-release.apk
            bazel-bin/projects/mobile/android/app/release-info.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.unit != 'android-app' && inputs.artifact != '' && steps.targets.outputs.build_targets != ''
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      # Develop-only writer for the cache restored above. A key can be written
      # once, so the save key carries the run id; the restore prefix is what PRs
      # (and the next develop run) actually resolve to.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        with:
          path: ~/.cache/bazel-disk
          key: bazel-android-${{ runner.os }}-${{ inputs.unit }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Signing keys, passwords and google-services.json must not survive the
      # job, even after a failed build or test. The VPN is disconnected here too
      # in case an earlier step failed before its own disconnect step.
      - name: Remove key files and disconnect VPN
        if: always() && inputs.unit == 'android-app'
        run: |
          set +e
          rm -f platform/android/keys/google-services.json
          rmdir platform/android/keys 2>/dev/null
          rm -rf "$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary signing files removed"
