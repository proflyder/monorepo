name: _android

# Reusable Android platform workflow: one matrix entry per affected application
# (or shared Kotlin library) unit, plus the dedicated Android Lint unit. The unit
# is selected by the Bazel reverse dependency graph in ci.yml; the `plan` job
# runs target-determinator once for the whole Android universe and each entry
# only intersects its declared targets with that result (an empty result or a
# failed plan keeps every declared target). Build runs before test, so a test
# failure cannot hide a build error and a lint finding only fails the lint entry.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      test_targets:
        description: Space separated Bazel test targets owned by the unit
        required: false
        default: ""
        type: string
      build_targets:
        description: Space separated Bazel build targets owned by the unit
        required: false
        default: ""
        type: string
      sdk_packages:
        description: Extra Android SDK packages (space separated) this unit needs
        required: false
        default: ""
        type: string
      affected_targets:
        description: >-
          Space separated affected targets from the `plan` job (empty disables
          narrowing and runs every declared target)
        required: false
        default: ""
        type: string
      artifact:
        description: Path of the build artifact to upload (empty to skip)
        required: false
        default: ""
        type: string
      artifact_name:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  android:
    name: android / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Build/test use the same mise tasks as a workstation; the selected target
    # list is passed through BAZEL_TARGETS. Tools come from install_args.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Pinned Bazelisk on PATH, plus its Bzlmod/repository caches.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # `mise run build|test <unit>` resolves the unit's targets; Bazel itself
      # comes from setup-bazel above.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: "node"
          cache: true

      # Restore-only in pull requests. GitHub scopes a cache to the ref that
      # wrote it, so a PR-written cache is invisible to every other PR: it only
      # burns the repository's 10 GB budget and the minutes spent uploading it.
      # Only a develop push writes this entry (deploy-home `warm-caches`), under
      # the exact key restored first here. The key is ordered platform → unit →
      # content so `restore-keys` form a real hierarchy: the exact key, then the
      # same unit with other lockfiles, then any Android unit's cache (a small
      # `kotlin-shared` entry reuses the app's compiled libraries and a new
      # `maven_install.json` is never a cold start).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-android-${{ runner.os }}-${{ inputs.unit }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}
          restore-keys: |
            bazel-android-${{ runner.os }}-${{ inputs.unit }}-
            bazel-android-${{ runner.os }}-

      # setup-android accepts the SDK licenses by default; install exactly the
      # platform/build-tools pinned in MODULE.bazel plus the extra SDK packages
      # the unit declares (for example the cmdline-tools release that provides
      # the standalone Android Lint CLI). Keep the lint version in sync with
      # platform/android/tools/lint_runner.
      - name: Install Android SDK packages
        env:
          SDK_PACKAGES: ${{ inputs.sdk_packages }}
        run: |
          packages=("platforms;android-36" "build-tools;36.0.0")
          if [ -n "$SDK_PACKAGES" ]; then
            read -r -a extra <<< "$SDK_PACKAGES"
            packages+=("${extra[@]}")
          fi
          sdkmanager --install "${packages[@]}"

      - name: Release signing self-test
        if: inputs.unit == 'android-app'
        run: platform/android/sign-release_test.sh

      # target-determinator runs once for the whole Android universe in the
      # `plan` job; here only the unit's own candidates are intersected with
      # that answer. An empty affected set (plan skipped, failed or degraded)
      # keeps every declared target: narrowing may run fewer targets, never
      # none.
      - name: Select affected targets
        id: targets
        env:
          AFFECTED: ${{ inputs.affected_targets }}
          TEST_CANDIDATES: ${{ inputs.test_targets }}
          BUILD_CANDIDATES: ${{ inputs.build_targets }}
        run: |
          node platform/ci/plan-targets.mjs narrow \
            --affected "$AFFECTED" \
            --tests "$TEST_CANDIDATES" \
            --builds "$BUILD_CANDIDATES" >> "$GITHUB_OUTPUT"

      - name: bazel build ${{ inputs.unit }}
        if: steps.targets.outputs.build_targets != ''
        env:
          BAZEL_TARGETS: ${{ steps.targets.outputs.build_targets }}
        run: mise run build ${{ inputs.unit }}

      - name: bazel test ${{ inputs.unit }}
        if: steps.targets.outputs.test_targets != ''
        env:
          BAZEL_TARGETS: ${{ steps.targets.outputs.test_targets }}
        run: mise run test ${{ inputs.unit }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.artifact != '' && steps.targets.outputs.build_targets != ''
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      # Develop-only writer for the cache restored above. A key can be written
      # once, so the save key carries the run id; the restore prefix is what PRs
      # (and the next develop run) actually resolve to.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        with:
          path: ~/.cache/bazel-disk
          key: bazel-android-${{ runner.os }}-${{ inputs.unit }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
