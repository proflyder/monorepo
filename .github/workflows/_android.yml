name: _android

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      test_targets:
        description: Space separated Bazel test targets owned by the unit
        required: false
        default: ""
        type: string
      build_targets:
        description: Space separated Bazel build targets owned by the unit
        required: false
        default: ""
        type: string
      sdk_packages:
        description: Extra Android SDK packages (space separated) this unit needs
        required: false
        default: ""
        type: string
      artifact:
        description: Path of the build artifact to upload (empty to skip)
        required: false
        default: ""
        type: string
      artifact_name:
        required: false
        default: ""
        type: string
      release_version:
        description: >-
          Stamp android-app with a unique timestamp versionCode and upload the
          release APK for distribution. Off for plain CI, where the default
          versionCode keeps the APK and its tests cacheable.
        required: false
        default: false
        type: boolean
      save_cache:
        description: >-
          Write the Bazel caches after the run. The caller states it (not a PR
          and allowed to warm the shared entries); a pull request never writes.
        required: false
        default: false
        type: boolean

    secrets:
      NEXUS_CI_PASSWORD:
        required: false
permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  android:
    name: android / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        id: java
        background: true
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        id: android-sdk
        background: true
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Set up mise
        id: mise
        background: true
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
          install_args: "node"
          cache: true

      - name: Restore the Bazel disk cache
        id: disk-cache
        background: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/bazel-disk
          key: bazel-android-${{ runner.os }}-shared-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}
          restore-keys: |
            bazel-android-${{ runner.os }}-shared-

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: false
          cache-save: ${{ inputs.save_cache }}

      - name: Restore the Bazel repository cache
        id: bazel-repo
        background: true
        uses: ./.github/actions/bazel-repository-cache
        with:
          key: bazel-repo-android-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}
          restore-prefix: bazel-repo-android-${{ runner.os }}-

      - name: Configure the Nexus cache
        id: nexus
        background: true
        uses: ./.github/actions/nexus-cache
        with:
          host: ${{ vars.NEXUS_HOST }}
          password: ${{ secrets.NEXUS_CI_PASSWORD }}

      - name: Release version
        id: version
        if: inputs.unit == 'android-app' && inputs.release_version
        run: |
          set -euo pipefail
          version_code="$(date -u +%s)"
          version_name="0.1.0-$(git rev-parse --short HEAD)"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "define_args=--define home_version_code=$version_code --define home_version_name=$version_name"
          } >> "$GITHUB_OUTPUT"
          echo "Release versionCode $version_code, versionName $version_name"

      - name: Materialise google-services.json
        id: firebase
        if: inputs.unit == 'android-app'
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ vars.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release artifact::GOOGLE_SERVICES_JSON_B64 is not available; the APK is built and tested with Firebase disabled."
            exit 0
          fi
          mkdir -p platform/android/keys
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > platform/android/keys/google-services.json
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "google-services.json prepared"

      - name: Wait for the toolchains and caches
        wait-all:

      - name: Install Android SDK packages
        env:
          SDK_PACKAGES: ${{ inputs.sdk_packages }}
        run: |
          packages=("platforms;android-36" "build-tools;36.0.0")
          if [ -n "$SDK_PACKAGES" ]; then
            read -r -a extra <<< "$SDK_PACKAGES"
            packages+=("${extra[@]}")
          fi
          sdkmanager --install "${packages[@]}"
          for package in "${packages[@]}"; do
            if [[ "$package" == ndk\;* ]]; then
              echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${package#ndk;}" >> "$GITHUB_ENV"
            fi
          done

      - name: Release signing self-test
        id: signing
        if: inputs.unit == 'android-app'
        background: true
        continue-on-error: true
        run: platform/android/sign-release_test.sh

      - name: bazel ${{ inputs.test_targets != '' && 'test' || 'build' }} ${{ inputs.unit }} (keep going, every target)
        id: bazel
        if: inputs.test_targets != '' || inputs.build_targets != ''
        continue-on-error: true
        env:
          BAZEL_TARGETS: ${{ inputs.build_targets }} ${{ inputs.test_targets }}
          BAZEL_EXTRA_ARGS: >-
            ${{ steps.version.outputs.define_args }}
            --keep_going
            --local_test_jobs=4
            --build_event_json_file=${{ runner.temp }}/bazel-events.json
          COMMAND: ${{ inputs.test_targets != '' && 'test' || 'build' }}
          UNIT: ${{ inputs.unit }}
        run: mise run "$COMMAND" "$UNIT"

      - name: Wait for the release signing self-test
        wait-all:

      - name: Report every failing build, test, lint and detekt target
        if: steps.bazel.outcome != 'skipped'
        env:
          STEPS: ${{ toJSON(steps) }}
          UNIT: ${{ inputs.unit }}
          BAZEL_EVENTS: ${{ runner.temp }}/bazel-events.json
        run: |
          set -uo pipefail
          status=0
          node platform/ci/bazel_report.mjs --events "$BAZEL_EVENTS" --title "android / $UNIT" || status=1
          node platform/ci/step_report.mjs --title "android / $UNIT" \
            --check 'bazel=Bazel build, tests, Android Lint and detekt' \
            --check 'signing=Release signing self-test' || status=1
          exit "$status"

      - name: Stash the release APK
        if: inputs.unit == 'android-app'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-release"
          cp -L bazel-bin/projects/mobile/android/app/app.apk "$RUNNER_TEMP/android-release/app.apk"

      - name: Show APK ABIs
        if: inputs.unit == 'android-app'
        run: platform/android/apk_abi_test.sh "$RUNNER_TEMP/android-release/app.apk"

      - name: Describe the release APK
        if: inputs.unit == 'android-app' && inputs.release_version && steps.firebase.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 projects/mobile/android/release_info.py write \
            --apk "$RUNNER_TEMP/android-release/app.apk" \
            --google-services platform/android/keys/google-services.json \
            --version-code "${{ steps.version.outputs.version_code }}" \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/android-release/release-info.json"

      - name: Upload the release APK (unsigned)
        if: inputs.unit == 'android-app' && inputs.release_version && steps.firebase.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-app-apk
          path: |
            ${{ runner.temp }}/android-release/app.apk
            ${{ runner.temp }}/android-release/release-info.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.unit != 'android-app' && inputs.artifact != '' && inputs.build_targets != ''
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: >-
          inputs.save_cache &&
          github.ref == 'refs/heads/develop' &&
          steps.bazel-repo.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/bazel-repo/content_addressable
          key: bazel-repo-android-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}

      - name: Remove google-services.json
        if: always() && inputs.unit == 'android-app'
        run: rm -f platform/android/keys/google-services.json
