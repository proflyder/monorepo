name: _attest

# Build provenance for the container images an image-owning unit pushed during
# CI. Called from `_unit.yml` after the build job; deploy-home refuses a
# promoted digest whose provenance does not verify against this repository and
# the workflows that produce it.
#
# A matrix job because `actions/attest-build-provenance` attests exactly one
# OCI subject per invocation (`push-to-registry` requires a single
# fully-qualified image reference).

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs (for the job name)
        required: true
        type: string
      pushed:
        description: JSON list of {"image":…, "digest":…} pushed by the unit job
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    name: attest / ${{ inputs.unit }}
    if: inputs.pushed != '' && inputs.pushed != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pushed) }}
    steps:
      # attest-build-provenance v4 reads registry credentials from the Docker
      # config; it has no username/password inputs of its own.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest ${{ matrix.image }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/proflyder/${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
