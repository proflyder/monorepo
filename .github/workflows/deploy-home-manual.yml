name: deploy-home (вручную)

on:
  workflow_dispatch:
    inputs:
      units:
        description: >-
          `all` (every deployable unit, including the station release) or a
          comma separated list of unit ids from platform/ci/units.mjs
        required: false
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-home-plan
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: ./.github/workflows/_deploy-home.yml
    with:
      mode: manual
      units: ${{ inputs.units }}
    secrets: inherit
