name: deploy-home

# Home K3s deploy (scheduler + ha-bridge + ha-control) from `develop`.
#
# A push to `develop` is a squash-merge of a PR, so it runs in the base
# repository context with Environment secrets. The `plan` job routes the change
# range (`before..sha`) through the same unit map as CI and deploys exactly the
# affected deployable units; documentation-only pushes deploy nothing.
#
# Push runs only the conservative preserve mode. Mode changes (execute, shadow,
# control-execute, control-catalog) are manual workflow_dispatch runs for the
# ha-bridge unit and always go through deploy.sh's own fail-closed preflight.
# There is no second executor path: CI never bypasses preflight and never
# force-enables a writer.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      units:
        description: Deployable units to roll (comma list) or `all`
        type: string
        default: all
      mode:
        description: Deploy mode (push always uses preserve)
        type: choice
        default: preserve
        options:
          - preserve
          - execute
          - shadow
          - control-execute
          - control-catalog

permissions:
  contents: read

concurrency:
  group: deploy-home-plan
  cancel-in-progress: false

env:
  BAZELISK_VERSION: "1.30.0"
  BAZELISK_SHA256: "a248ae2b2b62b5baebb748f6fba7203bff1a27e5d01b55399a8406744cb539e8"
  KUBECTL_VERSION: "v1.35.0"
  KUBECTL_SHA256: "a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989"
  DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'preserve' }}
  # Public DNS name of the VPN and the home LAN address of the K3s node are
  # private values: they live in the `home` Environment, not in this file.
  VPN_SERVER: ${{ secrets.VPN_SERVER }}
  K3S_NODE: ${{ secrets.K3S_NODE }}

jobs:
  # Route the change onto deployable units. Unknown/zero `before`, or any
  # routing failure, falls back to "deploy everything" rather than skipping a
  # deploy silently.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      units: ${{ steps.route.outputs.units }}
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install routing dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt
          platform/ci/install-bazelisk.sh "$RUNNER_TEMP/bazelisk"

      - name: Ensure base branch history
        if: github.event_name == 'push'
        run: git fetch --no-tags origin "+refs/heads/develop:refs/remotes/origin/develop"

      - name: Route affected deployable units
        id: route
        env:
          DISPATCH_UNITS: ${{ github.event_name == 'workflow_dispatch' && inputs.units || '' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/route.out"
          : > "$out"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python3 platform/ci/affected.py --all --bazel "$RUNNER_TEMP/bazelisk" \
              --format github --out "$out" >/dev/null
          else
            if ! python3 platform/ci/affected.py --base "$BEFORE_SHA" --head "$GITHUB_SHA" \
                 --bazel "$RUNNER_TEMP/bazelisk" --format github --out "$out" >/dev/null; then
              echo "routing failed; falling back to every deployable unit" >&2
              : > "$out"
              python3 platform/ci/affected.py --all --bazel "$RUNNER_TEMP/bazelisk" \
                --format github --out "$out" >/dev/null
            fi
          fi
          units=$(sed -n 's/^deploy_units=//p' "$out" | tail -1)
          # A dispatch may narrow the list explicitly (comma separated ids).
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$DISPATCH_UNITS" && "$DISPATCH_UNITS" != "all" ]]; then
            units=$(UNITS="$units" WANTED="$DISPATCH_UNITS" python3 -c '
          import json, os
          units = json.loads(os.environ["UNITS"] or "[]")
          wanted = {item.strip() for item in os.environ["WANTED"].split(",") if item.strip()}
          unknown = wanted - {entry["id"] for entry in units}
          if unknown:
              raise SystemExit(f"unknown deployable unit(s): {sorted(unknown)}")
          print(json.dumps([entry for entry in units if entry["id"] in wanted]))
          ')
          fi
          echo "units=$units" >> "$GITHUB_OUTPUT"
          { echo "### deploy-home plan"; echo; echo '```json'; echo "$units"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve pull request link
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].html_url' 2>/dev/null || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  # One matrix entry per affected deployable unit. Jobs run one at a time and a
  # unit never runs two deploys concurrently; neither is ever cancelled.
  deploy:
    # One job per affected unit; without a name GitHub lists every matrix value.
    name: deploy ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.units != '[]' && needs.plan.outputs.units != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: home
    permissions:
      contents: read
      packages: write
    strategy:
      # Units are independent; per-unit concurrency still serialises a unit.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.units) }}
    concurrency:
      group: deploy-home-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mode guard
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            preserve|execute|shadow|control-execute|control-catalog) ;;
            *) echo "unknown mode: $DEPLOY_MODE" >&2; exit 2 ;;
          esac
          if [[ "$DEPLOY_MODE" != "preserve" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "mode '$DEPLOY_MODE' is only allowed from workflow_dispatch" >&2
              exit 1
            fi
            if [[ "${{ matrix.id }}" != "ha-bridge" ]]; then
              echo "mode '$DEPLOY_MODE' only applies to the ha-bridge unit (executor state)" >&2
              exit 1
            fi
          fi
          echo "selected mode: $DEPLOY_MODE for ${{ matrix.id }}"

      - name: Install pinned tools
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          echo "${BAZELISK_SHA256}  /tmp/bazelisk" | sha256sum -c -
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk
          curl -sSfL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          rm -f /tmp/bazelisk /tmp/kubectl
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl python3-yaml

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazel-disk
            ~/.cache/bazelisk
          key: deploy-home-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'go.sum') }}
          restore-keys: |
            deploy-home-${{ runner.os }}-

      - name: Materialise secrets as files
        # Image-only units never reach home: no VPN, cluster or secrets.
        if: matrix.builder != 'docker'
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
          IN_KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          IN_SCHEDULER_ENV_B64: ${{ secrets.SCHEDULER_ENV_B64 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          printf '%s' "$IN_KUBECONFIG_B64" | base64 -d > "$CI_DIR/kubeconfig"
          printf '%s' "$IN_SCHEDULER_ENV_B64" | base64 -d > "$CI_DIR/scheduler.env"
          chmod 600 "$CI_DIR"/*
          echo "secret files prepared: $(find "$CI_DIR" -maxdepth 1 -type f | wc -l)"

      - name: Connect VPN (group ci)
        if: matrix.builder != 'docker'
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$K3S_NODE/6443" 2>/dev/null; then
              echo "K3s API reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "K3s API is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      - name: Check CI identity
        if: matrix.builder != 'docker'
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          export KUBECONFIG="$CI_DIR/kubeconfig"
          kubectl -n home-assistant get pods

      - name: Build, push and deploy ${{ matrix.id }}
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ "${{ matrix.builder }}" == "docker" ]]; then
            # Hermes/voice-proxy: build+push only. Promoting the digest into the
            # runtime chart is a reviewed manual step (private values), because
            # CI must not restart the voice circuit without a health check.
            IMAGE_TAG="$GITHUB_SHA" \
              projects/home-assistant/deploy/images/build-and-push.sh ${{ matrix.images }}
            exit 0
          fi
          case "$DEPLOY_MODE" in
            preserve) MODE_ARGS=() ;;
            shadow) MODE_ARGS=(--shadow) ;;
            execute) MODE_ARGS=(--execute) ;;
            control-execute) MODE_ARGS=(--control-execute) ;;
            control-catalog) MODE_ARGS=(--control-catalog) ;;
            *) echo "unknown mode: $DEPLOY_MODE" >&2; exit 2 ;;
          esac
          ONLY="${{ matrix.workloads }}"
          KUBECONFIG="$CI_DIR/kubeconfig" \
          PRIVATE_ENV="$CI_DIR/scheduler.env" \
          DEPLOY_STATE_DIR="$CI_DIR/deploy-state" \
          PUSH_IMAGES=1 \
          IMAGE_TAG="$GITHUB_SHA" \
          ONLY="${ONLY// /,}" \
          PREFLIGHT_IN_CLUSTER=1 \
          BAZELISK=bazelisk \
            projects/home/kubernetes/scheduler/deploy.sh "${MODE_ARGS[@]}"

      - name: Post-deploy smoke
        if: matrix.builder != 'docker'
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          export KUBECONFIG="$CI_DIR/kubeconfig"
          for workload in ${{ matrix.workloads }}; do
            kubectl -n home-assistant rollout status "deployment/$workload" --timeout=180s
            case "$workload" in
              scheduler)
                kubectl -n home-assistant exec deployment/scheduler -- /usr/local/bin/scheduler -healthcheck
                kubectl -n home-assistant exec deployment/scheduler -- /usr/local/bin/scheduler -status \
                  | tee "$CI_DIR/status.json"
                python3 - "$CI_DIR/status.json" <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          assert status.get("ready") is True, "scheduler reports ready=false"
          print("GetStatus ready:", status.get("ready"))
          PY
                ;;
              ha-bridge)
                kubectl -n home-assistant exec deployment/ha-bridge -- /usr/local/bin/ha-bridge -healthcheck
                ;;
              ha-control)
                if [[ "$(kubectl -n home-assistant get deployment ha-control -o jsonpath='{.spec.replicas}')" != "0" ]]; then
                  kubectl -n home-assistant exec deployment/ha-control -- /usr/local/bin/ha-control -healthcheck
                fi
                ;;
            esac
          done
          # The ci VPN group reaches only the K3s API, so NodePorts are checked
          # from the cluster side: each Service must have a ready endpoint.
          for workload in ${{ matrix.workloads }}; do
            if ! kubectl -n home-assistant get service "$workload" >/dev/null 2>&1; then
              echo "service $workload: none (worker without a Service)"
              continue
            fi
            ready=$(kubectl -n home-assistant get endpointslices \
              -l "kubernetes.io/service-name=$workload" \
              -o jsonpath='{range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}' \
              | grep -c '^true$' || true)
            if [[ "$ready" -lt 1 ]]; then
              echo "service $workload has no ready endpoint" >&2
              exit 1
            fi
            echo "service $workload ready endpoints: $ready"
          done

      - name: Roll back on failure
        if: failure() && matrix.builder != 'docker'
        run: |
          set +e
          CI_DIR="$RUNNER_TEMP/ci"
          export KUBECONFIG="$CI_DIR/kubeconfig"
          # Restore only what this job actually applied, to the exact recorded
          # spec. A failure during build/push/render leaves no `.applied`
          # marker and must not touch the running Deployments.
          python3 projects/home/kubernetes/scheduler/rollback.py \
            --state-dir "$CI_DIR/deploy-state" \
            --namespace home-assistant \
            --kubectl kubectl | tee "$RUNNER_TEMP/rollback.log"

      - name: Summary
        if: always()
        run: |
          set +e
          CI_DIR="$RUNNER_TEMP/ci"
          export KUBECONFIG="$CI_DIR/kubeconfig"
          {
            echo "### deploy-home / ${{ matrix.id }}"
            echo
            echo "- mode: \`$DEPLOY_MODE\`"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- workloads: \`${{ matrix.workloads }}\`"
            echo "- images: \`${{ matrix.images }}\`"
            echo "- pull request: ${{ needs.plan.outputs.pr_url }}"
            if kubectl -n home-assistant get deployment scheduler >/dev/null 2>&1; then
              STATUS=$(kubectl -n home-assistant exec deployment/scheduler -- \
                /usr/local/bin/scheduler -status 2>/dev/null)
              echo "- GetStatus: \`${STATUS:-unavailable}\`"
            else
              echo "- GetStatus: unavailable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disconnect VPN and remove temporary files
        if: always()
        run: |
          set +e
          CI_DIR="$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -rf "$CI_DIR" "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary deploy files removed"
