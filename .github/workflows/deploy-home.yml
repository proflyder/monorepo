name: deploy-home

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-home-plan
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: ./.github/workflows/_deploy-home.yml
    with:
      mode: push
    secrets: inherit
