name: "CI: полный прогон вручную"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-manual
  cancel-in-progress: false

jobs:
  pipeline:
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_ci.yml
    with:
      mode: all
      same_repository: false
      distribution: false
    secrets: inherit
