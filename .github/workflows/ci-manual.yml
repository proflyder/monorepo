name: "CI: полный прогон вручную"

# Manual twin of `ci.yml`: the same reusable pipeline (`_ci.yml`), run on
# demand over every unit instead of the diff of a pull request.
#
# This is the "run all checks now" button: useful before a risky merge, after a
# CI configuration change, or to warm every cache. It publishes no Android
# build (distribution is a PR side effect; use `android-release.yml` for that)
# and no `tree-<hash>` artifact (nothing here may be deployed: this run is not
# a pull request and its token is not part of the build-once contract).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-manual
  cancel-in-progress: false

jobs:
  pipeline:
    # Same union as `ci.yml`; the pipeline's own jobs narrow their tokens.
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_ci.yml
    with:
      mode: all
      same_repository: false
      distribution: false
    secrets: inherit
