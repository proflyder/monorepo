name: _python

# Reusable Python platform workflow: one matrix entry per project suite. Runs a
# syntax compile of every file in the unit plus hermetic unittest discovery.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      suites:
        description: Space separated directories with hermetic unittest suites
        required: false
        default: ""
        type: string
      compile:
        description: Space separated directories that only need a syntax compile
        required: false
        default: ""
        type: string
      deploy_tool:
        description: Build platform/deploy/cmd/home-deploy and export HOME_DEPLOY
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python:
    name: python / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tool versions and checksums: mise.toml + mise.lock (one source with the
      # workstation). Only the tools this job needs are installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: ${{ inputs.deploy_tool && 'python go' || 'python' }}
          cache: true

      # Go module/build cache (setup-go used to provide it). Same key in every
      # Go job and in deploy-home's warm-up, so a develop run seeds PR jobs.
      - if: inputs.deploy_tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'projects/station/ble-gateway/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Units whose suites drive a deploy script need the Go deploy binary the
      # script execs (deploy.sh sources platform/deploy/resolve.sh). Built once
      # per job; `go build` is enough here and keeps the job small.
      - name: Build deploy tooling
        if: inputs.deploy_tool
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/home-deploy" ./platform/deploy/cmd/home-deploy
          echo "HOME_DEPLOY=$RUNNER_TEMP/home-deploy" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Compile ${{ inputs.unit }}
        if: inputs.compile != ''
        run: |
          read -r -a directories <<< "${{ inputs.compile }}"
          for directory in "${directories[@]}"; do
            echo "== compile: ${directory} =="
            python3 -m compileall -q "$directory"
          done

      - name: Test ${{ inputs.unit }}
        if: inputs.suites != ''
        run: |
          read -r -a suites <<< "${{ inputs.suites }}"
          for suite in "${suites[@]}"; do
            echo "== compile: ${suite} =="
            python3 -m compileall -q "$suite"
            echo "== unittest: ${suite} =="
            python3 -m unittest discover -s "$suite" -p 'test_*.py' -v
          done
