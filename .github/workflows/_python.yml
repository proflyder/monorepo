name: _python

# Reusable Python platform workflow: one matrix entry per project suite. Runs a
# syntax compile of every file in the unit plus hermetic unittest discovery.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      suites:
        description: Space separated directories with hermetic unittest suites
        required: false
        default: ""
        type: string
      compile:
        description: Space separated directories that only need a syntax compile
        required: false
        default: ""
        type: string
      deploy_tool:
        description: Build platform/deploy-rs:home-deploy and export HOME_DEPLOY
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python:
    name: python / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tool versions and checksums: mise.toml + mise.lock (one source with the
      # workstation). Only the tools this job needs are installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: ${{ inputs.deploy_tool && 'python bazelisk' || 'python' }}
          cache: true

      # Units whose suites drive a deploy script need the Rust deploy binary the
      # script execs (deploy.sh sources platform/deploy/resolve.sh). Bazelisk is
      # installed by mise above; the target is the same one the image builds.
      - name: Build deploy tooling
        if: inputs.deploy_tool
        run: |
          set -euo pipefail
          bazel build //platform/deploy-rs:home-deploy
          echo "HOME_DEPLOY=$PWD/bazel-bin/platform/deploy-rs/home-deploy" >> "$GITHUB_ENV"

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Compile ${{ inputs.unit }}
        if: inputs.compile != ''
        run: |
          read -r -a directories <<< "${{ inputs.compile }}"
          for directory in "${directories[@]}"; do
            echo "== compile: ${directory} =="
            python3 -m compileall -q "$directory"
          done

      - name: Test ${{ inputs.unit }}
        if: inputs.suites != ''
        run: |
          read -r -a suites <<< "${{ inputs.suites }}"
          for suite in "${suites[@]}"; do
            echo "== compile: ${suite} =="
            python3 -m compileall -q "$suite"
            echo "== unittest: ${suite} =="
            python3 -m unittest discover -s "$suite" -p 'test_*.py' -v
          done
