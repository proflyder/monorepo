name: _python

on:
  workflow_call:
    inputs:
      units:
        description: JSON array of matrix entries (id, suites, compile, deploy_tool)
        required: true
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.3
          install_args: "python bazelisk node kubectl"
          cache: true

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Test affected Python units
        env:
          UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(jq -r '.[].id' <<< "$UNITS")
          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "no affected Python units"
            exit 0
          fi
          failed=()
          for id in "${ids[@]}"; do
            echo "::group::python / ${id}"
            if mise run test "$id"; then
              echo "python / ${id}: PASSED"
            else
              failed+=("$id")
              echo "python / ${id}: FAILED"
            fi
            echo "::endgroup::"
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::python units failed: ${failed[*]}"
            exit 1
          fi
