name: _python

# One job for every affected Python unit. A CI-global PR used to fan out one
# `python / <unit>` job per unit (~22 jobs, most finishing in 12-20 s of pure
# runner/setup overhead). The units share the same checkout, Python, pip and
# (when needed) Bazel/mise setup, so this job runs their `mise run test <id>`
# commands sequentially, one `::group::` per unit, and fails at the end with
# the list of failing units.
#
# Units whose suites drive the Rust deploy CLI (`deploy_tool`) build
# `//platform/deploy-rs:home-deploy` through the same Bazel server/cache, so
# the heavy deploy units stay in this job instead of a second one.

on:
  workflow_call:
    inputs:
      units:
        description: JSON array of matrix entries (id, suites, compile, deploy_tool)
        required: true
        type: string

permissions:
  contents: read

env:
  # Silence Git's default-branch hint from actions/checkout's `git init`
  # (it runs under a throwaway HOME, so only an env-provided config reaches it).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The test commands come from the unit map via `mise run test <unit>`;
    # tools come from mise-action's install_args, never from `mise run` itself.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One setup for all units. `bazelisk` is included because a
      # `deploy_tool` unit builds the Rust deploy binary; the extra install is
      # much cheaper than a second job.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: "python bazelisk node"
          cache: true

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Test affected Python units
        env:
          UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          mapfile -t ids < <(jq -r '.[].id' <<< "$UNITS")
          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "no affected Python units"
            exit 0
          fi
          failed=()
          for id in "${ids[@]}"; do
            echo "::group::python / ${id}"
            if mise run test "$id"; then
              echo "python / ${id}: PASSED"
            else
              failed+=("$id")
              echo "python / ${id}: FAILED"
            fi
            echo "::endgroup::"
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::python units failed: ${failed[*]}"
            exit 1
          fi
