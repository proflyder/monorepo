name: _python

# Reusable Python platform workflow: one matrix entry per project suite. Runs a
# syntax compile of every file in the unit plus hermetic unittest discovery.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      suites:
        description: Space separated directories with hermetic unittest suites
        required: false
        default: ""
        type: string
      compile:
        description: Space separated directories that only need a syntax compile
        required: false
        default: ""
        type: string
      deploy_tool:
        description: Build platform/deploy-rs:home-deploy and export HOME_DEPLOY
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python:
    name: python / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The test commands come from the unit map via `mise run test <unit>`;
    # tools come from mise-action's install_args, never from `mise run` itself.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tool versions and checksums: mise.toml + mise.lock (one source with the
      # workstation). Only the tools this job needs are installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: ${{ inputs.deploy_tool && 'python bazelisk node' || 'python node' }}
          cache: true

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # Units whose suites drive a deploy script get the Rust deploy binary (Bazel) from
      # the task itself (HOME_DEPLOY), exactly like a local `mise run test`.
      - name: Test ${{ inputs.unit }}
        run: mise run test ${{ inputs.unit }}
