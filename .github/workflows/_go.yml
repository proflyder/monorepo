name: _go

# Reusable Go platform workflow. Called once per affected Go unit (service,
# module or shared package) from ci.yml; the unit provides its packages,
# working directory and the binaries it owns.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      workdir:
        description: Go module directory (".", or e.g. ./projects/station/ble-gateway)
        required: false
        default: "."
        type: string
      packages:
        description: Space separated package patterns for vet/test
        required: false
        default: ""
        type: string
      race:
        description: Run the test binary with -race
        required: false
        default: false
        type: boolean
      build_packages:
        description: Space separated packages that must compile into binaries
        required: false
        default: ""
        type: string
      deploy_control:
        description: Run the scheduler deploy-control regression
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  go:
    name: go / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Go commands and the deploy-control regression run through the same mise
    # tasks as a workstation; tools come from mise-action's install_args.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tool versions and checksums: mise.toml + mise.lock (one source with the
      # workstation). Only the tools this job needs are installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: "go node"
          cache: true

      # Go module/build cache (setup-go used to provide it). Same key in every
      # Go job and in deploy-home's warm-up, so a develop run seeds PR jobs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'projects/station/ble-gateway/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Mirrors `go mod download`, `go vet` and `go test [-race]` from the unit.
      - name: go test
        if: inputs.packages != ''
        run: mise run test ${{ inputs.unit }}

      - name: go build
        if: inputs.build_packages != ''
        env:
          GO_BUILD_DIR: ${{ runner.temp }}/gobuild
        run: mise run build ${{ inputs.unit }}

      # Pinned Bazelisk on PATH (as `bazel`) for the deploy-control regression.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        if: inputs.deploy_control
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.deploy_control
        with:
          # Action-output cache; the repository/build caches come from
          # setup-bazel above.
          path: ~/.cache/bazel-disk
          key: bazel-deploy-control-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'go.sum') }}
          restore-keys: |
            bazel-deploy-control-${{ runner.os }}-

      - name: scheduler deploy control regression
        if: inputs.deploy_control
        # Tools come from mise-action install_args; never install the rest.
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run test:deploy-control
