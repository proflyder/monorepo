name: _station-deploy

# Install one published Pulsar release on the station through Home Assistant.
#
# The only CI path that touches the column. It builds and publishes nothing: the
# version tag already points at the digest the promotion verified, and the
# station updater checks the layer digests, `SHA256SUMS` and `--version` before
# accepting the release.
#
# The `Station` Environment approval is the only gate; there is no ref claim in
# the OpenBao role, the Environment restricts which refs may deploy. Called by
# `_deploy-home.yml` (after a merge promotes the release, or a manual re-deploy
# of the currently published `latest`) and by `deploy-services.yml` (after an
# honest rebuild).

on:
  workflow_call:
    inputs:
      version:
        description: The published release version to install (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      label:
        description: Short context for the job name and summary
        required: false
        default: ""
        type: string
    secrets:
      VPN_SERVER:
        required: true
      VPN_CERT_P12_B64:
        required: true
      VPN_CERT_PASSWORD:
        required: true
      OPENBAO_ADDR:
        required: true
      OPENBAO_ROLE:
        required: false

permissions:
  contents: read
  id-token: write # OpenBao auth/github OIDC (audience = OPENBAO_ADDR)

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # The release job. `_deploy-home.yml` calls it after a merge promoted the
  # release (push mode), after an explicit `units=pulsar` re-deploy of the
  # currently published `latest` (manual mode), or `deploy-services.yml` after an
  # honest rebuild. The Environment approval is the only gate before the column
  # is touched; the promo job and the home pins are independent, so home units
  # neither wait for it nor fail with it.
  #
  # The version tag points at the promoted digest: the promotion only succeeds
  # with verified provenance and never publishes a fresh build here. This job
  # only installs that tag through Home Assistant; it builds nothing. The
  # station updater verifies the layer digests, SHA256SUMS and --version.
  # Promotion keeps an existing version tag when its content is identical
  # (manifest annotations only), so `latest` is moved to that tag's digest and
  # the version installed here always matches the digest that was kept/created.
  station:
    name: deploy station ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # OIDC `environment` claim keeps this exact casing; OpenBao binds "Station".
    environment: Station
    concurrency:
      group: deploy-home-station
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
      IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
      IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      OPENBAO_ROLE: ${{ secrets.OPENBAO_ROLE || 'deploy-station' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install openconnect
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR).
      - name: Read deploy secrets from OpenBao
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: ${{ env.OPENBAO_ROLE }}
          jwtGithubAudience: ${{ env.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/deploy-station ha_url | HA_URL ;
            secret/data/ci/deploy-station ha_token | HA_TOKEN ;
            secret/data/ci/deploy-station entity_id | ENTITY_ID

      - name: Install ${{ inputs.version }} through Home Assistant
        env:
          HA_URL: ${{ steps.openbao.outputs.HA_URL }}
          HA_TOKEN: ${{ steps.openbao.outputs.HA_TOKEN }}
          ENTITY_ID: ${{ steps.openbao.outputs.ENTITY_ID }}
          DEPLOY_LOG: ${{ runner.temp }}/ci/deploy.log
        run: |
          set +e
          set -o pipefail
          if [[ -z "${HA_URL:-}" || -z "${HA_TOKEN:-}" || -z "${ENTITY_ID:-}" ]]; then
            echo "OpenBao returned an empty deploy value" >&2
            exit 1
          fi
          python3 projects/station/pulsar/tools/ha_firmware_deploy.py --tag "$VERSION" 2>&1 | tee "$DEPLOY_LOG"
          status=$?
          {
            echo "### Station deploy"
            echo
            echo "- version: \`$VERSION\`"
            echo "- context: \`${{ inputs.label }}\`"
            if grep -q 'already installed' "$DEPLOY_LOG"; then
              echo "- result: already installed"
            else
              grep -E 'done: before=|^error:' "$DEPLOY_LOG" | sed 's/^/- /' || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Disconnect VPN and remove temporary files
        if: always()
        run: |
          set +e
          CI_DIR="$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -rf "$CI_DIR" "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary deploy files removed"
