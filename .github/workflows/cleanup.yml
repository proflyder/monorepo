name: cleanup

# Scheduled housekeeping. Two independent jobs share one daily schedule and one
# manual entry point; a failure in either job leaves the other (and `ci-ok`)
# untouched. A manual run defaults to a dry run: both jobs report what they
# would delete and delete nothing.
#
# ghcr — delete stale images from GHCR (DECISIONS 36).
#
# A pull request publishes every built deploy image as
# `ghcr.io/proflyder/<image>:tree-<git tree hash>`. Once the PR is merged (the
# digest is promoted to `develop` and the commit sha) or abandoned, that tag is
# dead weight. This job keeps the account from growing without bound.
#
# Only the deploy images and native publish repositories listed in
# `platform/ci/units.mjs` are considered (`pulsar-firmware`,
# `windows-logon-provider` included); other GHCR packages of the account are
# never touched.
#
# Per package, never deleted: the newest version, `develop`/`latest`, semver and
# native `sha-<commit>` tags, digests in PROTECTED_DIGESTS, and anything younger
# than 7 days. Deploy versions (40-hex commit-sha tags) keep the five newest;
# older ones are deleted. Stale `tree-*`/untagged versions are deleted.
# Cosign-style referrers (`sha256-<hex>` tags) follow the digest they point at:
# removed only when that digest is deleted in the same run or is already gone.
#
# A scheduled run deletes; a manual run defaults to a dry run and only reports.
# The token is GITHUB_TOKEN when it may delete these user-owned package
# versions. If it cannot, provision a `GHCR_CLEANUP_TOKEN` secret (a token with
# package delete permission, granted access to this repository) — the job fails
# with an explicit message in that case instead of silently deleting nothing.
#
# fad — delete old Firebase App Distribution builds.
#
# `android-distribute` (ci.yml) uploads a build for every Android PR and nothing
# removed the old ones. This job keeps a rolling 24-hour window per Firebase
# app: every release older than 24 hours is deleted, the newest release is
# always kept (that is the build testers install), and anything younger stays.
# It lists releases with `projects.apps.releases.list` and removes them with
# `releases:batchDelete`, authenticated by the same service account that
# uploads (`secret/ci/android-distribute`), through the `Android` Environment
# and the OpenBao role `android-cleanup`. The app and project ids come from the
# same repository variable (`GOOGLE_SERVICES_JSON_B64`) and the same
# `release_info.py` layout the upload uses, so the two can never disagree.
# Deletion needs the Firebase App Distribution Admin role on the service
# account; a missing role is reported with that hint.

on:
  schedule:
    # Daily, off the deploy hours.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would be deleted without deleting anything
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

env:
  # Set Git's default branch for actions/checkout's `git init` (it warns when unset;
  # it runs under a throwaway HOME, so only an env-provided config reaches it).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  ghcr:
    name: ghcr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Delete package versions; also required when the default token is used.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the unit map and this cleanup module are needed.
          sparse-checkout: platform/ci

      - name: Select and delete stale image versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # A scheduled run is always real; a manual run defaults to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          TOKEN_SOURCE: ${{ secrets.GHCR_CLEANUP_TOKEN != '' && 'GHCR_CLEANUP_TOKEN' || 'github.token' }}
        with:
          # A failure to delete fails the job with a provisioning hint, so a
          # green run means the policy actually ran.
          github-token: ${{ secrets.GHCR_CLEANUP_TOKEN || github.token }}
          script: |
            const cleanup = await import(`${process.env.GITHUB_WORKSPACE}/platform/ci/ghcr_cleanup.mjs`);
            await cleanup.runGithubScript({ core, github, context, env: process.env });

  fad:
    name: fad
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same Environment and OpenBao record as `android-distribute` in ci.yml:
    # the app ids are public, only the service account is a secret. The OpenBao
    # role `android-cleanup` binds this workflow on `refs/heads/develop` for
    # `schedule` and `workflow_dispatch`, so PR CI still uses its own role.
    environment: Android
    permissions:
      contents: read
      # Request the OIDC token that OpenBao's auth/github role trusts.
      id-token: write
    env:
      # A scheduled run is always real; a manual run defaults to a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the cleanup module is needed.
          sparse-checkout: platform/ci

      # No official action exists for openconnect; the runner image has none.
      # OpenBao is only reachable over the VPN, so the connect/health-check
      # sequence mirrors `android-distribute` in ci.yml.
      - name: Install VPN client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
          OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # Only the Firebase service account: the cleanup never signs or uploads.
      - name: Read the Firebase service account from OpenBao
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: android-cleanup
          jwtGithubAudience: ${{ secrets.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/android-distribute firebase_service_account_json_b64 | FIREBASE_SERVICE_ACCOUNT_JSON_B64

      # Credentials land in files with mode 600; later steps see only paths.
      # `google-services.json` is the same non-secret repository variable the
      # APK build uses, so the app id is the one `android-distribute` uploads to.
      - name: Materialise the Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ steps.openbao.outputs.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ vars.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}" ]]; then
            echo "OpenBao returned an empty FIREBASE_SERVICE_ACCOUNT_JSON_B64" >&2
            exit 1
          fi
          if [[ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            echo "Repository variable GOOGLE_SERVICES_JSON_B64 is not set; cannot resolve the Firebase app id" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > "$CI_DIR/firebase-sa.json"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$CI_DIR/google-services.json"
          chmod 600 "$CI_DIR/firebase-sa.json" "$CI_DIR/google-services.json"
          {
            echo "FIREBASE_SERVICE_ACCOUNT=$CI_DIR/firebase-sa.json"
            echo "GOOGLE_SERVICES_JSON=$CI_DIR/google-services.json"
          } >> "$GITHUB_ENV"
          echo "Firebase credentials and app identifiers prepared"

      - name: Disconnect VPN
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/ci/ci.p12" "$RUNNER_TEMP/ci/ci.pass"
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "VPN disconnected"

      # The selection logic lives in platform/ci/fad_cleanup.mjs and is covered
      # by fad_cleanup.test.mjs; this step only applies it.
      - name: Delete releases older than 24 hours
        run: |
          set -euo pipefail
          args=(
            --credentials "$FIREBASE_SERVICE_ACCOUNT"
            --google-services "$GOOGLE_SERVICES_JSON"
          )
          if [[ "${DRY_RUN}" != "true" ]]; then
            args+=(--apply)
          fi
          node platform/ci/fad_cleanup.mjs "${args[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Firebase App Distribution cleanup"
            echo
            echo "- mode: \`${DRY_RUN}\`"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove credentials
        if: always()
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/ci"
          echo "temporary credentials removed"
