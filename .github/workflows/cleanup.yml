name: cleanup

# Daily housekeeping entry point. One trigger only: the jobs live in
# `_cleanup.yml` (workflow_call), and `cleanup-manual.yml` is the
# `workflow_dispatch` twin. A scheduled run is always real.
on:
  schedule:
    # Daily, off the deploy hours.
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_cleanup.yml
    with:
      dry_run: false
    secrets: inherit
