name: cleanup

on:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_cleanup.yml
    with:
      dry_run: false
    secrets: inherit
