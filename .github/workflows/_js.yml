name: _js

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      tests:
        description: Space separated directories containing *.test.js
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  js:
    name: js / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
          install_args: "node"
          cache: true

      - name: Test ${{ inputs.unit }}
        if: inputs.tests != ''
        run: mise run test ${{ inputs.unit }}
