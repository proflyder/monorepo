name: _js

# Reusable JavaScript platform workflow: one matrix entry per unit. Edge
# Workers in this repository have no package manager and no build step, so the
# job only needs an official Node distribution and the built-in test runner.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      tests:
        description: Space separated directories containing *.test.js
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # Silence Git's default-branch hint from actions/checkout's `git init`
  # (it runs under a throwaway HOME, so only an env-provided config reaches it).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  js:
    name: js / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tool versions and checksums: mise.toml + mise.lock (one source with the
      # workstation). Only the tools this job needs are installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: "node"
          cache: true

      - name: Test ${{ inputs.unit }}
        if: inputs.tests != ''
        run: mise run test ${{ inputs.unit }}
