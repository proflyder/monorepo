name: openbao-smoke

# Manual end-to-end check of the GitHub OIDC -> OpenBao path.
#
# The runner joins the restricted `ci` VPN group (route only to the K3s node,
# nft allows tcp/443 and tcp/6443), requests a GitHub Actions OIDC token with a
# dedicated audience, logs in with auth/github role `deploy-home` and reads
# secret/ci/test. Only key names are printed; no value or token is echoed.
#
# Required Environment `Home` secrets (set by the primary, never in Git):
#   VPN_CERT_P12_B64, VPN_CERT_PASSWORD, VPN_SERVER
#   OPENBAO_ADDR  e.g. https://vault.example.home
#   OPENBAO_ROLE  optional, defaults to deploy-home
#
# The role binds the repository, environment Home and
# ref refs/heads/develop with audience https://<OPENBAO_ADDR host>.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openbao-smoke
  cancel-in-progress: false

jobs:
  oidc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Home
    env:
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      OPENBAO_ROLE: ${{ secrets.OPENBAO_ROLE || 'deploy-home' }}
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install openconnect
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          test -n "$OPENBAO_ADDR"
          HOST="${OPENBAO_ADDR#*://}"
          HOST="${HOST%%/*}"
          # shellcheck disable=SC2024 # only openconnect runs as root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN ($HOST, HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      - name: Login with GitHub OIDC
        run: |
          set -euo pipefail
          AUDIENCE="$OPENBAO_ADDR"
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          oidc=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$oidc"
          python3 - "$oidc" "$OPENBAO_ROLE" "$CI_DIR/login.json" <<'PY'
          import json, sys
          oidc, role, path = sys.argv[1:4]
          open(path, "w").write(json.dumps({"role": role, "jwt": oidc}))
          PY
          chmod 600 "$CI_DIR/login.json"
          code=$(curl -sS -o "$CI_DIR/login-response.json" -w '%{http_code}' \
            -X POST --data-binary "@$CI_DIR/login.json" \
            "$OPENBAO_ADDR/v1/auth/github/login")
          if [[ "$code" != "200" ]]; then
            echo "OpenBao GitHub login failed with HTTP $code" >&2
            exit 1
          fi
          token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["auth"]["client_token"])' \
            "$CI_DIR/login-response.json")
          echo "::add-mask::$token"
          echo "OPENBAO_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GitHub OIDC login: ok"

      - name: Read secret/ci/test
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          code=$(curl -sS -o "$CI_DIR/ci.json" -w '%{http_code}' \
            -H "X-Vault-Token: $OPENBAO_TOKEN" \
            "$OPENBAO_ADDR/v1/secret/data/ci/test")
          test "$code" = "200" || { echo "read secret/ci/test failed with HTTP $code" >&2; exit 1; }
          python3 - "$CI_DIR/ci.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]["data"]
          assert data.get("probe") == "ok-ci", "unexpected probe value"
          print("read secret/ci/test: ok; keys:", sorted(data))
          PY

      - name: Read secret/ci/deploy-home (key names only)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          code=$(curl -sS -o "$CI_DIR/deploy-home.json" -w '%{http_code}' \
            -H "X-Vault-Token: $OPENBAO_TOKEN" \
            "$OPENBAO_ADDR/v1/secret/data/ci/deploy-home")
          test "$code" = "200" || { echo "read secret/ci/deploy-home failed with HTTP $code" >&2; exit 1; }
          python3 - "$CI_DIR/deploy-home.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["data"]["data"]
          required = {"kubeconfig", "scheduler_env", "runtime_values"}
          missing = required - set(data)
          assert not missing, f"secret/ci/deploy-home is missing: {sorted(missing)}"
          assert all(isinstance(data[key], str) and data[key] for key in required)
          print("read secret/ci/deploy-home: ok; keys:", sorted(data))
          PY
          rm -f "$CI_DIR/deploy-home.json"

      - name: Policy boundary (must be denied)
        run: |
          set -euo pipefail
          deny() {
            local label=$1; shift
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$@")
            if [[ "$code" == "200" ]]; then
              echo "ci-deploy unexpectedly allowed: $label" >&2
              exit 1
            fi
            echo "denied as expected: $label (HTTP $code)"
          }
          deny "write secret/ci/test" -X POST -d '{"data":{"probe":"x"}}' \
            -H "X-Vault-Token: $OPENBAO_TOKEN" "$OPENBAO_ADDR/v1/secret/data/ci/test"
          deny "read secret/k8s/test" \
            -H "X-Vault-Token: $OPENBAO_TOKEN" "$OPENBAO_ADDR/v1/secret/data/k8s/test"

      - name: Revoke token
        if: always()
        run: |
          set +e
          if [[ -n "${OPENBAO_TOKEN:-}" ]]; then
            curl -sS -o /dev/null -X POST -H "X-Vault-Token: $OPENBAO_TOKEN" \
              "$OPENBAO_ADDR/v1/auth/token/revoke-self"
          fi

      - name: Disconnect VPN and remove temporary files
        if: always()
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -rf "$RUNNER_TEMP/openbao-smoke" "$RUNNER_TEMP/openconnect.log" \
            "$RUNNER_TEMP/openconnect.pid"
          echo "temporary files removed"
