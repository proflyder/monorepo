name: openbao-smoke

# Manual end-to-end check of the GitHub OIDC -> OpenBao path.
#
# The runner joins the restricted `ci` VPN group (route only to the K3s node,
# nft allows tcp/443 and tcp/6443), then `hashicorp/vault-action` requests a
# GitHub Actions OIDC token with a dedicated audience, logs in with auth/github
# role `deploy-home` and reads secret/ci/test and secret/ci/deploy-home. Every
# value is masked by the action; the probe is only compared, never printed, and
# nothing else is echoed. The expected-denial policy check keeps a raw request
# because the action is read-only and cannot express "must be refused".
#
# Required Environment `Home` secrets (set by the primary, never in Git):
#   VPN_CERT_P12_B64, VPN_CERT_PASSWORD, VPN_SERVER
#   OPENBAO_ADDR  e.g. https://vault.example.home
#   OPENBAO_ROLE  optional, defaults to deploy-home
#
# The role binds the repository, environment Home and
# ref refs/heads/develop with audience https://<OPENBAO_ADDR host>.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openbao-smoke
  cancel-in-progress: false

jobs:
  oidc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Home
    env:
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      OPENBAO_ROLE: ${{ secrets.OPENBAO_ROLE || 'deploy-home' }}
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install openconnect
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/openbao-smoke"
          test -n "$OPENBAO_ADDR"
          HOST="${OPENBAO_ADDR#*://}"
          HOST="${HOST%%/*}"
          # shellcheck disable=SC2024 # only openconnect runs as root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN ($HOST, HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR). The
      # action masks every line of every value and publishes them as outputs;
      # `exportEnv: false` keeps the values out of later steps' environment.
      - name: Read OpenBao secrets
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: ${{ env.OPENBAO_ROLE }}
          jwtGithubAudience: ${{ env.OPENBAO_ADDR }}
          exportEnv: false
          # Later steps need raw requests for the expected-denial checks.
          outputToken: true
          secrets: |
            secret/data/ci/test probe | PROBE ;
            secret/data/ci/deploy-home kubeconfig | DEPLOY_HOME_KUBECONFIG ;
            secret/data/ci/deploy-home scheduler_env | DEPLOY_HOME_SCHEDULER_ENV ;
            secret/data/ci/deploy-home runtime_values | DEPLOY_HOME_RUNTIME_VALUES

      - name: Verify secret/ci/test and secret/ci/deploy-home
        env:
          PROBE: ${{ steps.openbao.outputs.PROBE }}
          DEPLOY_HOME_KUBECONFIG: ${{ steps.openbao.outputs.DEPLOY_HOME_KUBECONFIG }}
          DEPLOY_HOME_SCHEDULER_ENV: ${{ steps.openbao.outputs.DEPLOY_HOME_SCHEDULER_ENV }}
          DEPLOY_HOME_RUNTIME_VALUES: ${{ steps.openbao.outputs.DEPLOY_HOME_RUNTIME_VALUES }}
        run: |
          set -euo pipefail
          [[ "$PROBE" == "ok-ci" ]] || { echo "unexpected probe value" >&2; exit 1; }
          for name in DEPLOY_HOME_KUBECONFIG DEPLOY_HOME_SCHEDULER_ENV \
            DEPLOY_HOME_RUNTIME_VALUES; do
            [[ -n "${!name:-}" ]] || {
              echo "secret/ci/deploy-home has an empty required value ($name)" >&2
              exit 1
            }
          done
          echo "read secret/ci/test and secret/ci/deploy-home: ok (values masked)"

      - name: Policy boundary (must be denied)
        env:
          OPENBAO_TOKEN: ${{ steps.openbao.outputs.vault_token }}
        run: |
          set -euo pipefail
          deny() {
            local label=$1; shift
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$@")
            if [[ "$code" == "200" ]]; then
              echo "ci-deploy unexpectedly allowed: $label" >&2
              exit 1
            fi
            echo "denied as expected: $label (HTTP $code)"
          }
          deny "write secret/ci/test" -X POST -d '{"data":{"probe":"x"}}' \
            -H "X-Vault-Token: $OPENBAO_TOKEN" "$OPENBAO_ADDR/v1/secret/data/ci/test"
          deny "read secret/k8s/test" \
            -H "X-Vault-Token: $OPENBAO_TOKEN" "$OPENBAO_ADDR/v1/secret/data/k8s/test"

      - name: Disconnect VPN and remove temporary files
        if: always()
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -rf "$RUNNER_TEMP/openbao-smoke" "$RUNNER_TEMP/openconnect.log" \
            "$RUNNER_TEMP/openconnect.pid"
          echo "temporary files removed"
