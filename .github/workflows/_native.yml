name: _native

# Reusable native platform workflow. Two kinds of non-Bazel build share it:
#
#   * `script` (default) — one repository-script C/C++ build with a pinned
#     cross toolchain (the Windows logon provider). The unit supplies its
#     working directory, host-test and cross-build commands, the artifacts it
#     owns and the pinned toolchain archive. The archive is cached by version +
#     sha256, and its digest is verified before extraction. A push to `develop`
#     reuses this workflow in deploy-home and publishes the resulting artifact
#     as an OCI artifact; this reusable workflow itself stays read-only.
#
#   * `pulsar` — the Rust station daemon in `projects/station/pulsar`. Its host
#     fmt/clippy/tests are the `pulsar-bazel` unit (`_bazel.yml`); this workflow
#     cross-builds both station ABIs with Bazel and builds the Go installer, the
#     Zigbee radio and dropbear. Zig 0.14.1, Rust 1.99.1 and the sendspin C/C++
#     are pinned by MODULE.bazel. With `release_version` set (the deploy-home
#     push path) the same jobs build the versioned binaries, verify `--version`
#     under qemu and add `pulsar-release`, the single OCI-ready artifact
#     `publish-native` consumes.

on:
  workflow_call:
    inputs:
      kind:
        description: Unit kind from platform/ci/units.mjs (script or pulsar)
        required: false
        default: script
        type: string
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      workdir:
        description: Directory (relative to the repository root) that owns the scripts
        required: true
        type: string
      build:
        description: Build command, run from workdir (script kind)
        required: false
        default: ""
        type: string
      test:
        description: Optional host-test command, run from workdir (script kind)
        required: false
        default: ""
        type: string
      artifacts:
        description: Space separated artifact paths, relative to workdir (script kind)
        required: false
        default: ""
        type: string
      checksums:
        description: Checksums file to generate over artifacts, relative to workdir (script kind)
        required: false
        default: ""
        type: string
      toolchain_name:
        description: Toolchain name (cache key and artifact metadata)
        required: false
        default: ""
        type: string
      toolchain_version:
        required: false
        default: ""
        type: string
      toolchain_url:
        description: HTTPS archive URL; empty when no toolchain download is needed
        required: false
        default: ""
        type: string
      toolchain_sha256:
        description: Expected sha256 (lowercase hex) of the archive
        required: false
        default: ""
        type: string
      toolchain_root:
        description: Directory created by extracting the archive
        required: false
        default: ""
        type: string
      retention_days:
        required: false
        default: 30
        type: number
      release_version:
        description: >-
          Release version for the `pulsar` kind. When set, the station binaries
          are built with VERSION=<release_version>, verified under qemu and
          assembled into the single `pulsar` OCI release artifact. Empty keeps
          the PR CI behaviour (no version override, no release artifact).
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- script ----
  native:
    name: native / ${{ inputs.unit }}
    if: inputs.kind == 'script'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The portable tests build with the host compiler (clang++ by default).
      # GitHub's Ubuntu image ships clang, but install it if the image changes.
      - name: Host C++ compiler
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends clang
          fi
          clang++ --version | head -n 1

      - name: Cache ${{ inputs.toolchain_name }} ${{ inputs.toolchain_version }}
        id: toolchain-cache
        if: inputs.toolchain_url != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchains/${{ inputs.toolchain_name }}-${{ inputs.toolchain_version }}
          key: ${{ runner.os }}-${{ inputs.toolchain_name }}-${{ inputs.toolchain_version }}-${{ inputs.toolchain_sha256 }}

      - name: Download and verify ${{ inputs.toolchain_name }}
        if: inputs.toolchain_url != '' && steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
          TOOLCHAIN_SHA256: ${{ inputs.toolchain_sha256 }}
          TOOLCHAIN_NAME: ${{ inputs.toolchain_name }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/toolchains/${TOOLCHAIN_NAME}-${TOOLCHAIN_VERSION}"
          archive="$RUNNER_TEMP/${TOOLCHAIN_NAME}-${TOOLCHAIN_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" "$TOOLCHAIN_URL"
          echo "${TOOLCHAIN_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$destination"
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          rm -f "$archive"

      - name: Expose ${{ inputs.toolchain_name }} root
        if: inputs.toolchain_url != ''
        run: |
          echo "LLVM_MINGW=$RUNNER_TEMP/toolchains/${{ inputs.toolchain_name }}-${{ inputs.toolchain_version }}/${{ inputs.toolchain_root }}" >> "$GITHUB_ENV"

      - name: Test ${{ inputs.unit }}
        if: inputs.test != ''
        env:
          TEST_COMMAND: ${{ inputs.test }}
        run: bash -eu -o pipefail -c "$TEST_COMMAND"

      - name: Build ${{ inputs.unit }}
        env:
          BUILD_COMMAND: ${{ inputs.build }}
        run: bash -eu -o pipefail -c "$BUILD_COMMAND"

      - name: Checksums ${{ inputs.unit }}
        if: inputs.checksums != ''
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$ARTIFACTS"
          # `upload-artifact` preserves paths relative to the least common
          # ancestor of the uploaded files (and flattens a single directory),
          # so record names relative to that same directory. A consumer can
          # then run `sha256sum -c SHA256SUMS` inside the unpacked artifact.
          common="$(dirname "${files[0]}")"
          for file in "${files[@]}"; do
            while [[ "$file" != "$common"/* && "$common" != "." ]]; do
              common="$(dirname "$common")"
            done
          done
          checksums_abs="$PWD/$CHECKSUMS"
          (
            cd "$common"
            sha256sum "${files[@]#"$common"/}" > "$checksums_abs"
          )
          cat "$CHECKSUMS"

      - name: Collect artifact paths
        id: artifact-paths
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHECKSUMS: ${{ inputs.checksums }}
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          {
            echo "paths<<EOF"
            read -r -a files <<< "$ARTIFACTS"
            for file in "${files[@]}"; do
              echo "${GITHUB_WORKSPACE}/${WORKDIR}/${file}"
            done
            if [ -n "$CHECKSUMS" ]; then
              echo "${GITHUB_WORKSPACE}/${WORKDIR}/${CHECKSUMS}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.unit }}
          path: ${{ steps.artifact-paths.outputs.paths }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # ---------------------------------------------------------------- pulsar ----
  # Host fmt/clippy/tests are the `pulsar-bazel` unit (`_bazel.yml`); this unit
  # only cross-builds the deployable station binaries with Bazel. The zig cc
  # toolchain, Rust toolchain and sendspin C/C++ all come from MODULE.bazel, so
  # no rustup/zig/cargo-zigbuild/CMake/ninja setup happens here.
  #
  # Both station ABIs: the daemon at -c opt (line tables kept for pulsar.debug,
  # VERSION/BUILD_TIME passed as --define) for aarch64 and armhf.
  pulsar-build:
    name: native / pulsar-build (${{ matrix.arch }})
    if: inputs.kind == 'pulsar'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armhf]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned Bazelisk plus the Bzlmod/repository caches, identical to the
      # `_bazel.yml` unit the host checks use.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Action-output disk cache (.bazelrc only); keyed like the pulsar-bazel
          # unit so both restore the same Rust/C++ objects.
          path: ~/.cache/bazel-disk
          key: bazel-pulsar-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/station/pulsar/satellite/Cargo.lock', 'projects/station/pulsar/satellite/crate-universe.lock') }}
          restore-keys: |
            bazel-pulsar-${{ runner.os }}-
            bazel-${{ runner.os }}-

      # The release path verifies the cross-built binary under qemu exactly as
      # the station updater does before accepting a release.
      - name: Release verification prerequisites
        if: inputs.release_version != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user libc6-arm64-cross libc6-armhf-cross

      # VERSION is the release trigger and the value `pulsar --version` prints.
      # BUILD_TIME is HEAD's commit date (the Makefile's reproducible value):
      # a rebuild of the same commit does not change option_env! and relink.
      - name: Release identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < projects/station/pulsar/VERSION)
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="$RELEASE_VERSION"
          fi
          build_time=$(TZ=UTC0 LC_ALL=C git log -1 --format=%cd --date=format-local:'%b %e %Y, %H:%M:%S')
          {
            echo "PULSAR_VERSION=$version"
            echo "PULSAR_BUILD_TIME=$build_time"
          } >> "$GITHUB_ENV"

      - name: Build station daemon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bazel build -c opt \
            --platforms="//platform/bazel/zig:${ARCH}_linux" \
            --define="pulsar_version=$PULSAR_VERSION" \
            --define="pulsar_build_time=$PULSAR_BUILD_TIME" \
            //projects/station/pulsar/satellite:station_binary
          out="$GITHUB_WORKSPACE/projects/station/pulsar/satellite/build/$ARCH"
          mkdir -p "$out"
          cp bazel-bin/projects/station/pulsar/satellite/pulsar "$out/pulsar"
          cp bazel-bin/projects/station/pulsar/satellite/pulsar.debug "$out/pulsar.debug"

      # Glibc binaries run under qemu with the cross libc; the updater compares
      # exactly this `--version` output against the OCI tag.
      - name: Verify pulsar --version
        if: inputs.release_version != ''
        env:
          VERSION: ${{ inputs.release_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            aarch64) emulator=qemu-aarch64; sysroot=/usr/aarch64-linux-gnu ;;
            armhf) emulator=qemu-arm; sysroot=/usr/arm-linux-gnueabihf ;;
            *) echo "unknown arch $ARCH" >&2; exit 1 ;;
          esac
          binary="projects/station/pulsar/satellite/build/$ARCH/pulsar"
          output=$("$emulator" -L "$sysroot" "$binary" --version)
          printf '%s\n' "$output"
          if [[ "$output" != "pulsar $VERSION" ]]; then
            echo "::error::--version printed '$output', expected 'pulsar $VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-${{ matrix.arch }}
          path: |
            ${{ inputs.workdir }}/satellite/build/${{ matrix.arch }}/pulsar
            ${{ inputs.workdir }}/satellite/build/${{ matrix.arch }}/pulsar.debug
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # The Go installer is a nested module with its own go.mod. The root go.work
  # does not list it, so every command runs with GOWORK=off.
  pulsar-installer:
    name: native / pulsar-installer
    if: inputs.kind == 'pulsar'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: ${{ inputs.workdir }}/installer/go.sum

      - name: vet + test
        working-directory: ${{ inputs.workdir }}/installer
        env:
          GOWORK: "off"
        run: |
          go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
          go test ./...

      - name: cross-build
        working-directory: ${{ inputs.workdir }}/installer
        env:
          GOWORK: "off"
        run: |
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$os-$arch/pulsar-install$ext" .
          done

  # Zigbee firmware for the Midi radio (Telink B91).
  pulsar-radio:
    name: native / pulsar-radio
    if: inputs.kind == 'pulsar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - name: i386 C library (the Telink toolchain is 32-bit x86)
        run: sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq libc6:i386

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.workdir }}/radio/src
            ${{ inputs.workdir }}/radio/toolchain
          key: pulsar-radio-${{ hashFiles(format('{0}/radio/build.sh', inputs.workdir), format('{0}/radio/sdk.patch', inputs.workdir)) }}

      - name: Build radio firmware
        working-directory: ${{ inputs.workdir }}
        run: radio/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-radio
          path: |
            ${{ inputs.workdir }}/radio/out/zigbee-router.ybl
            ${{ inputs.workdir }}/radio/out/zigbee-coordinator.ybl
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # The single release artifact deploy-home's `publish-native` uploads with
  # `projects/station/pulsar/publish-oci.sh`. Only the push path sets
  # `release_version`, so PR CI produces no release artifact.
  pulsar-release:
    name: native / pulsar-release (${{ inputs.release_version }})
    if: inputs.kind == 'pulsar' && inputs.release_version != ''
    needs: [pulsar-build, pulsar-radio]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      # Layer titles are the station updater's contract; SHA256SUMS covers the
      # binaries and both radio images.
      - name: Stage the OCI release files
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          STAGE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          for arch in aarch64 armhf; do
            cp "$ARTIFACTS/pulsar-$arch/pulsar" "$STAGE/pulsar-$arch.bin"
          done
          cp "$ARTIFACTS"/pulsar-radio/zigbee-*.ybl "$STAGE"/
          (
            cd "$STAGE"
            sha256sum pulsar-aarch64.bin pulsar-armhf.bin zigbee-*.ybl > SHA256SUMS
          )
          cat "$STAGE/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.unit }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # dropbear + sftp-server for `pulsar-install --ssh`.
  pulsar-ssh:
    name: native / pulsar-ssh
    if: inputs.kind == 'pulsar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.workdir }}/ssh/out/src
          key: pulsar-ssh-${{ hashFiles(format('{0}/ssh/build.sh', inputs.workdir)) }}

      - name: Build dropbear and sftp-server
        working-directory: ${{ inputs.workdir }}
        run: ssh/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-ssh
          path: |
            ${{ inputs.workdir }}/ssh/out/aarch64/
            ${{ inputs.workdir }}/ssh/out/armhf/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
