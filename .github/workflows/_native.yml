name: _native

on:
  workflow_call:
    inputs:
      kind:
        description: Unit kind from platform/ci/units.mjs (script or pulsar)
        required: false
        default: script
        type: string
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      workdir:
        description: Directory (relative to the repository root) that owns the scripts
        required: true
        type: string
      build:
        description: Build command, run from workdir (script kind)
        required: false
        default: ""
        type: string
      test:
        description: Optional host-test command, run from workdir (script kind)
        required: false
        default: ""
        type: string
      artifacts:
        description: Space separated artifact paths, relative to workdir (script kind)
        required: false
        default: ""
        type: string
      checksums:
        description: Checksums file to generate over artifacts, relative to workdir (script kind)
        required: false
        default: ""
        type: string
      retention_days:
        required: false
        default: 30
        type: number
      release_version:
        description: >-
          Deprecated no-op. Kept for callers from before the computed version;
          the version now comes from `platform/ci/version.mjs` and the artifact
          annotation.
        required: false
        default: ""
        type: string
      publish_repository:
        description: Full GHCR reference of the unit's OCI artifact (empty = no publication)
        required: false
        default: ""
        type: string
      publish_tags:
        description: >-
          Space separated release tag templates deploy-home attaches when it
          promotes `tree-<hash>`; `{version}` and `{commit12}` expand.
        required: false
        default: ""
        type: string
      publish_script:
        description: Unit publish entrypoint (relative to the repository root)
        required: false
        default: ""
        type: string
      publish_attest_glob:
        description: Artifact file or glob whose provenance is attested next to the manifest
        required: false
        default: ""
        type: string
      promote:
        description: >-
          Deploy-home path: promote the verified `tree-<hash>` digest to the
          release tags. The artifact must already exist; the run fails instead
          of building.
        required: false
        default: false
        type: boolean
      push_tree_tag:
        description: Publish the built artifact under tree-<hash> (same-repo PR)
        required: false
        default: false
        type: boolean
      replace_artifact:
        description: >-
          Explicit rebuild: publish rebuilt bytes under an already existing
          tree tag instead of keeping the first published artifact
          (deploy-services.yml only).
        required: false
        default: false
        type: boolean
      save_cache:
        description: >-
          Write the Bazel caches after the run. The caller states it (not a PR
          and allowed to warm the shared entries); a pull request never writes.
        required: false
        default: false
        type: boolean

    secrets:
      NEXUS_CI_PASSWORD:
        required: false
    outputs:
      version:
        description: >-
          The release version: computed from VERSION + the unit's commits on the
          build path, read from the artifact annotation when promoting.
        value: ${{ jobs.promote.outputs.version }}
      digest:
        description: The promoted (or built) artifact digest
        value: ${{ jobs.promote.outputs.digest }}
permissions:
  contents: read

env:
  CRANE_VERSION: "v0.22.1"
  CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  promote:
    name: promote / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      attestations: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      digest: ${{ steps.promote.outputs.digest }}
      version: ${{ steps.promote.outputs.version || steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute the release version
        id: version
        run: node platform/ci/version.mjs --unit "${{ inputs.unit }}" --github-output

      - name: Install pinned crane
        if: inputs.promote && inputs.publish_repository != ''
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/crane_${CRANE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        if: inputs.promote && inputs.publish_repository != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote the PR-built artifact by tree hash
        id: promote
        if: inputs.promote && inputs.publish_repository != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ inputs.workdir }}
          TAGS: ${{ inputs.publish_tags }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve HEAD^{tree}: '$tree'" >&2
            exit 1
          fi
          retag_args=()
          if [[ "${{ inputs.replace_artifact }}" == "true" ]]; then
            retag_args=(--retag)
          fi
          node platform/ci/promote.mjs --native \
            --repository "${{ inputs.publish_repository }}" \
            --github-repository "${{ github.repository }}" \
            --tree "$tree" \
            --commit "$GITHUB_SHA" \
            --tags "$TAGS" \
            --allow-pr-head \
            "${retag_args[@]}" \
            --unit "${{ inputs.unit }}"

      - name: Select build or promoted path
        id: select
        run: |
          set -euo pipefail
          mode="build"
          if [[ "${{ steps.promote.outputs.mode }}" == "promoted" ]]; then
            mode="promoted"
          fi
          if [[ "${{ inputs.promote }}" == "true" && "$mode" != "promoted" ]]; then
            echo "::error::tree-<hash> was not published and verified; deploy-home does not build (DECISIONS 36)" >&2
            exit 1
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

  native:
    name: native / ${{ inputs.unit }}
    needs: promote
    if: inputs.kind == 'script' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: false
          cache-save: ${{ inputs.save_cache }}

      - uses: ./.github/actions/bazel-repository-cache
        with:
          key: bazel-repo-rust-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml') }}
          restore-prefix: bazel-repo-rust-${{ runner.os }}-

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/bazel-disk
          key: bazel-logon-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml', 'platform/bazel/windows/**', 'platform/bazel/zig/**') }}
          restore-keys: |
            bazel-logon-${{ runner.os }}-

      - name: Test ${{ inputs.unit }}
        if: inputs.test != ''
        env:
          TEST_COMMAND: ${{ inputs.test }}
        run: bash -eu -o pipefail -c "$TEST_COMMAND"

      - name: Build ${{ inputs.unit }}
        env:
          BUILD_COMMAND: ${{ inputs.build }}
        run: bash -eu -o pipefail -c "$BUILD_COMMAND"

      - name: Checksums ${{ inputs.unit }}
        if: inputs.checksums != ''
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$ARTIFACTS"
          # `upload-artifact` preserves paths relative to the least common
          # ancestor of the uploaded files (and flattens a single directory),
          # so record names relative to that same directory. A consumer can
          # then run `sha256sum -c SHA256SUMS` inside the unpacked artifact.
          common="$(dirname "${files[0]}")"
          for file in "${files[@]}"; do
            while [[ "$file" != "$common"/* && "$common" != "." ]]; do
              common="$(dirname "$common")"
            done
          done
          checksums_abs="$PWD/$CHECKSUMS"
          (
            cd "$common"
            sha256sum "${files[@]#"$common"/}" > "$checksums_abs"
          )
          cat "$CHECKSUMS"

      - name: Collect artifact paths
        id: artifact-paths
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHECKSUMS: ${{ inputs.checksums }}
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          {
            echo "paths<<EOF"
            read -r -a files <<< "$ARTIFACTS"
            for file in "${files[@]}"; do
              echo "${GITHUB_WORKSPACE}/${WORKDIR}/${file}"
            done
            if [ -n "$CHECKSUMS" ]; then
              echo "${GITHUB_WORKSPACE}/${WORKDIR}/${CHECKSUMS}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.unit }}
          path: ${{ steps.artifact-paths.outputs.paths }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  pulsar-build:
    name: native / pulsar-build (${{ matrix.arch }})
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armhf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: false
          cache-save: ${{ inputs.save_cache }}

      - uses: ./.github/actions/bazel-repository-cache
        with:
          key: bazel-repo-rust-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml') }}
          restore-prefix: bazel-repo-rust-${{ runner.os }}-

      - uses: ./.github/actions/nexus-cache
        with:
          host: ${{ vars.NEXUS_HOST }}
          password: ${{ secrets.NEXUS_CI_PASSWORD }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/bazel-disk
          key: bazel-pulsar-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            bazel-pulsar-${{ runner.os }}-

      - name: Release verification prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user libc6-arm64-cross libc6-armhf-cross

      - name: Release identity
        env:
          RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            echo "::error::no release version from the promote job" >&2
            exit 1
          fi
          build_time=$(TZ=UTC0 LC_ALL=C git log -1 --format=%cd --date=format-local:'%b %e %Y, %H:%M:%S')
          {
            echo "PULSAR_VERSION=$version"
            echo "PULSAR_BUILD_TIME=$build_time"
          } >> "$GITHUB_ENV"

      - name: Build station daemon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bazel build -c opt \
            --platforms="//platform/bazel/zig:${ARCH}_linux" \
            --define="pulsar_version=$PULSAR_VERSION" \
            --define="pulsar_build_time=$PULSAR_BUILD_TIME" \
            //projects/station/pulsar/satellite:station_binary
          out="$GITHUB_WORKSPACE/projects/station/pulsar/satellite/build/$ARCH"
          mkdir -p "$out"
          cp bazel-bin/projects/station/pulsar/satellite/pulsar "$out/pulsar"
          cp bazel-bin/projects/station/pulsar/satellite/pulsar.debug "$out/pulsar.debug"

      - name: Verify pulsar --version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            aarch64) emulator=qemu-aarch64; sysroot=/usr/aarch64-linux-gnu ;;
            armhf) emulator=qemu-arm; sysroot=/usr/arm-linux-gnueabihf ;;
            *) echo "unknown arch $ARCH" >&2; exit 1 ;;
          esac
          binary="projects/station/pulsar/satellite/build/$ARCH/pulsar"
          output=$("$emulator" -L "$sysroot" "$binary" --version)
          printf '%s\n' "$output"
          if [[ "$output" != "pulsar $PULSAR_VERSION" ]]; then
            echo "::error::--version printed '$output', expected 'pulsar $PULSAR_VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pulsar-${{ matrix.arch }}
          path: |
            ${{ inputs.workdir }}/satellite/build/${{ matrix.arch }}/pulsar
            ${{ inputs.workdir }}/satellite/build/${{ matrix.arch }}/pulsar.debug
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  pulsar-installer:
    name: native / pulsar-installer
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: false
          cache-save: ${{ inputs.save_cache }}

      - uses: ./.github/actions/bazel-repository-cache
        with:
          key: bazel-repo-rust-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml') }}
          restore-prefix: bazel-repo-rust-${{ runner.os }}-

      - uses: ./.github/actions/nexus-cache
        with:
          host: ${{ vars.NEXUS_HOST }}
          password: ${{ secrets.NEXUS_CI_PASSWORD }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/bazel-disk
          key: bazel-installer-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml', 'platform/bazel/windows/**', 'platform/bazel/zig/**') }}
          restore-keys: |
            bazel-installer-${{ runner.os }}-

      - name: Test installer
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          bazel test \
            //projects/station/pulsar/installer:unit_tests \
            //projects/station/pulsar/installer:clippy \
            //projects/station/pulsar/installer:rustfmt

      - name: Cross-build installer
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          target=//projects/station/pulsar/installer:pulsar-install
          build() {
            local name=$1 ext=$2
            shift 2
            bazel build -c opt "$@" "$target"
            mkdir -p "installer/dist/$name"
            cp "$GITHUB_WORKSPACE/bazel-bin/projects/station/pulsar/installer/pulsar-install$ext" \
              "installer/dist/$name/pulsar-install$ext"
            ls -l "installer/dist/$name/pulsar-install$ext"
          }
          build linux-amd64 "" --platforms=//platform/bazel/zig:x86_64_musl_linux
          build linux-arm64 "" --platforms=//platform/bazel/zig:aarch64_linux
          build windows-amd64 .exe --platforms=//platform/bazel/windows:x86_64_windows

  pulsar-radio:
    name: native / pulsar-radio
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - name: i386 C library (the Telink toolchain is 32-bit x86)
        run: sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq libc6:i386

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ inputs.workdir }}/radio/src
            ${{ inputs.workdir }}/radio/toolchain
          key: pulsar-radio-${{ hashFiles(format('{0}/radio/build.sh', inputs.workdir), format('{0}/radio/sdk.patch', inputs.workdir)) }}

      - name: Build radio firmware
        working-directory: ${{ inputs.workdir }}
        run: radio/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pulsar-radio
          path: |
            ${{ inputs.workdir }}/radio/out/zigbee-router.ybl
            ${{ inputs.workdir }}/radio/out/zigbee-coordinator.ybl
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  pulsar-release:
    name: native / pulsar-release (${{ needs.promote.outputs.version }})
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    needs: [promote, pulsar-build, pulsar-radio]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Stage the OCI release files
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          STAGE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          for arch in aarch64 armhf; do
            cp "$ARTIFACTS/pulsar-$arch/pulsar" "$STAGE/pulsar-$arch.bin"
          done
          cp "$ARTIFACTS"/pulsar-radio/zigbee-*.ybl "$STAGE"/
          (
            cd "$STAGE"
            sha256sum pulsar-aarch64.bin pulsar-armhf.bin zigbee-*.ybl > SHA256SUMS
          )
          cat "$STAGE/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.unit }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  pulsar-ssh:
    name: native / pulsar-ssh
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ inputs.workdir }}/ssh/out/src
          key: pulsar-ssh-${{ hashFiles(format('{0}/ssh/build.sh', inputs.workdir)) }}

      - name: Build dropbear and sftp-server
        working-directory: ${{ inputs.workdir }}
        run: ssh/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pulsar-ssh
          path: |
            ${{ inputs.workdir }}/ssh/out/aarch64/
            ${{ inputs.workdir }}/ssh/out/armhf/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  publish:
    name: publish / ${{ inputs.unit }}
    needs: [promote, native, pulsar-release]
    if: >-
      !cancelled() &&
      needs.promote.result == 'success' &&
      needs.promote.outputs.mode != 'promoted' &&
      (needs.native.result == 'success' || needs.pulsar-release.result == 'success') &&
      inputs.push_tree_tag &&
      inputs.publish_repository != '' &&
      inputs.publish_script != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.unit }}
          path: ${{ runner.temp }}/artifact

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.4
          install_args: "oras"
          cache: true

      - name: Compute the tree tag
        id: tree
        if: inputs.push_tree_tag
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve HEAD^{tree}: '$tree'" >&2
            exit 1
          fi
          echo "tag=tree-${tree}" >> "$GITHUB_OUTPUT"
          echo "- artifact identity: \`tree-${tree}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish OCI artifact
        id: publish
        env:
          PUBLISH_SCRIPT: ${{ inputs.publish_script }}
          TREE_TAG: ${{ steps.tree.outputs.tag }}
          PUSH_TREE_TAG: ${{ inputs.push_tree_tag }}
          VERSION: ${{ needs.promote.outputs.version }}
          REPLACE: ${{ inputs.replace_artifact }}
        run: |
          set -euo pipefail
          [[ -n "$PUBLISH_SCRIPT" ]] || {
            echo "unit ${{ inputs.unit }} has no publish_script" >&2
            exit 1
          }
          args=(--source-dir "$RUNNER_TEMP/artifact" --version "$VERSION")
          if [[ "$PUSH_TREE_TAG" == "true" ]]; then
            args+=(--tag "$TREE_TAG")
          fi
          if [[ "$REPLACE" == "true" ]]; then
            args+=(--replace)
          fi
          "$PUBLISH_SCRIPT" "${args[@]}"

      - name: Attest pushed artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}

      - name: Attest unit files
        if: inputs.publish_attest_glob != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/artifact/${{ inputs.publish_attest_glob }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### _native publish / ${{ inputs.unit }}"
