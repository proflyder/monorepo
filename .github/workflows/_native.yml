name: _native

# Reusable native platform workflow. Two kinds of non-Bazel build share it:
#
#   * `script` (default) — one repository-script C/C++ build with a pinned
#     cross toolchain (the Windows logon provider). The unit supplies its
#     working directory, host-test and cross-build commands, the artifacts it
#     owns and the pinned toolchain archive. The archive is cached by version +
#     sha256, and its digest is verified before extraction.
#
#   * `pulsar` — the Rust station daemon in `projects/station/pulsar`. Its host
#     fmt/clippy/tests are the `pulsar-bazel` unit (`_bazel.yml`); this workflow
#     cross-builds both station ABIs with Bazel and builds the Go installer, the
#     Zigbee radio and dropbear. Zig 0.14.1, Rust 1.99.1 and the sendspin C/C++
#     are pinned by MODULE.bazel. Every run builds the release-shaped binaries:
#     VERSION from `projects/station/pulsar/VERSION` (or `release_version`),
#     radio `.ybl`, `SHA256SUMS`, and the `pulsar-release` OCI-ready artifact.
#
# Build once (DECISIONS 36): a pull request from this repository (never a fork)
# publishes the release-shaped artifact as
# `ghcr.io/proflyder/<repository>:tree-<git tree hash>` with build provenance.
# On push to `develop`, deploy-home asks this workflow to `promote` that digest
# instead of rebuilding; only a missing or unverified tree tag falls back to the
# normal build plus release-tag publication. Fork PRs and manual dispatch runs
# never reach the registry: their token is read-only.

on:
  workflow_call:
    inputs:
      kind:
        description: Unit kind from platform/ci/units.mjs (script or pulsar)
        required: false
        default: script
        type: string
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      workdir:
        description: Directory (relative to the repository root) that owns the scripts
        required: true
        type: string
      build:
        description: Build command, run from workdir (script kind)
        required: false
        default: ""
        type: string
      test:
        description: Optional host-test command, run from workdir (script kind)
        required: false
        default: ""
        type: string
      artifacts:
        description: Space separated artifact paths, relative to workdir (script kind)
        required: false
        default: ""
        type: string
      checksums:
        description: Checksums file to generate over artifacts, relative to workdir (script kind)
        required: false
        default: ""
        type: string
      toolchain_name:
        description: Toolchain name (cache key and artifact metadata)
        required: false
        default: ""
        type: string
      toolchain_version:
        required: false
        default: ""
        type: string
      toolchain_url:
        description: HTTPS archive URL; empty when no toolchain download is needed
        required: false
        default: ""
        type: string
      toolchain_sha256:
        description: Expected sha256 (lowercase hex) of the archive
        required: false
        default: ""
        type: string
      toolchain_root:
        description: Directory created by extracting the archive
        required: false
        default: ""
        type: string
      retention_days:
        required: false
        default: 30
        type: number
      release_version:
        description: >-
          Optional release version override for the `pulsar` kind. Empty uses
          `projects/station/pulsar/VERSION`; every run is release-shaped.
        required: false
        default: ""
        type: string
      publish_repository:
        description: Full GHCR reference of the unit's OCI artifact (empty = no publication)
        required: false
        default: ""
        type: string
      publish_tags:
        description: >-
          Space separated release tag templates deploy-home attaches when it
          promotes `tree-<hash>`; `{version}` and `{commit12}` expand.
        required: false
        default: ""
        type: string
      publish_script:
        description: Unit publish entrypoint (relative to the repository root)
        required: false
        default: ""
        type: string
      publish_attest_glob:
        description: Artifact file or glob whose provenance is attested next to the manifest
        required: false
        default: ""
        type: string
      promote:
        description: >-
          Deploy-home path: promote the verified `tree-<hash>` digest to the
          release tags instead of building, when it exists.
        required: false
        default: false
        type: boolean
      push_tree_tag:
        description: Publish the built artifact under tree-<hash> (same-repo PR)
        required: false
        default: false
        type: boolean
      publish_versions:
        description: Publish the release tags after a fallback build (deploy-home)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Official ORAS release used to publish a unit's OCI artifact. sha256 is the
  # GitHub release asset digest for linux_amd64.
  ORAS_VERSION: "1.3.6"
  ORAS_SHA256: "66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0"
  # Official crane (google/go-containerregistry): resolves and re-tags a digest
  # without pulling it. Same pins as deploy-home.
  CRANE_VERSION: "v0.22.1"
  CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"

jobs:
  # Build once, deploy the same bytes: on the deploy-home path, promote the
  # artifact the merged PR already built and attested under `tree-<hash>` to the
  # unit's release tags. A missing or unverified tree tag selects `build`;
  # release tags are immutable by content: identical layers under an existing
  # tag (different manifest annotations) is a no-op, different content fails.
  #
  # The job always runs so the build jobs can depend on `mode`; when `promote`
  # is false (PR CI) it only publishes `mode=build`.
  promote:
    name: promote / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Re-tag the promoted digest and read its attestation.
      packages: write
      attestations: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: inputs.promote && inputs.publish_repository != ''

      - name: Install pinned crane
        if: inputs.promote && inputs.publish_repository != ''
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/crane_${CRANE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Re-tagging writes a manifest to GHCR. The package is publicly readable,
      # so reads succeed anonymously and only the PUT fails with UNAUTHORIZED.
      # The Docker config written here is what `crane tag` reads.
      - name: Log in to GHCR
        if: inputs.promote && inputs.publish_repository != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote the PR-built artifact by tree hash
        id: promote
        if: inputs.promote && inputs.publish_repository != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_OVERRIDE: ${{ inputs.release_version }}
          WORKDIR: ${{ inputs.workdir }}
          TAGS: ${{ inputs.publish_tags }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve HEAD^{tree}: '$tree'" >&2
            exit 1
          fi
          version="$VERSION_OVERRIDE"
          if [[ -z "$version" ]]; then
            version=$(tr -d '[:space:]' < "$WORKDIR/VERSION")
          fi
          node platform/ci/promote.mjs --native \
            --repository "${{ inputs.publish_repository }}" \
            --tree "$tree" \
            --commit "$GITHUB_SHA" \
            --version "$version" \
            --tags "$TAGS"

      - name: Select build or promoted path
        id: select
        run: |
          set -euo pipefail
          mode="build"
          if [[ "${{ steps.promote.outputs.mode }}" == "promoted" ]]; then
            mode="promoted"
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- script ----
  native:
    name: native / ${{ inputs.unit }}
    needs: promote
    if: inputs.kind == 'script' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The portable tests build with the host compiler (clang++ by default).
      # GitHub's Ubuntu image ships clang, but install it if the image changes.
      - name: Host C++ compiler
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends clang
          fi
          clang++ --version | head -n 1

      - name: Cache ${{ inputs.toolchain_name }} ${{ inputs.toolchain_version }}
        id: toolchain-cache
        if: inputs.toolchain_url != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchains/${{ inputs.toolchain_name }}-${{ inputs.toolchain_version }}
          key: ${{ runner.os }}-${{ inputs.toolchain_name }}-${{ inputs.toolchain_version }}-${{ inputs.toolchain_sha256 }}

      - name: Download and verify ${{ inputs.toolchain_name }}
        if: inputs.toolchain_url != '' && steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          TOOLCHAIN_URL: ${{ inputs.toolchain_url }}
          TOOLCHAIN_SHA256: ${{ inputs.toolchain_sha256 }}
          TOOLCHAIN_NAME: ${{ inputs.toolchain_name }}
          TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/toolchains/${TOOLCHAIN_NAME}-${TOOLCHAIN_VERSION}"
          archive="$RUNNER_TEMP/${TOOLCHAIN_NAME}-${TOOLCHAIN_VERSION}.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" "$TOOLCHAIN_URL"
          echo "${TOOLCHAIN_SHA256}  ${archive}" | sha256sum -c -
          rm -rf "$destination"
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          rm -f "$archive"

      - name: Expose ${{ inputs.toolchain_name }} root
        if: inputs.toolchain_url != ''
        run: |
          echo "LLVM_MINGW=$RUNNER_TEMP/toolchains/${{ inputs.toolchain_name }}-${{ inputs.toolchain_version }}/${{ inputs.toolchain_root }}" >> "$GITHUB_ENV"

      - name: Test ${{ inputs.unit }}
        if: inputs.test != ''
        env:
          TEST_COMMAND: ${{ inputs.test }}
        run: bash -eu -o pipefail -c "$TEST_COMMAND"

      - name: Build ${{ inputs.unit }}
        env:
          BUILD_COMMAND: ${{ inputs.build }}
        run: bash -eu -o pipefail -c "$BUILD_COMMAND"

      - name: Checksums ${{ inputs.unit }}
        if: inputs.checksums != ''
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHECKSUMS: ${{ inputs.checksums }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$ARTIFACTS"
          # `upload-artifact` preserves paths relative to the least common
          # ancestor of the uploaded files (and flattens a single directory),
          # so record names relative to that same directory. A consumer can
          # then run `sha256sum -c SHA256SUMS` inside the unpacked artifact.
          common="$(dirname "${files[0]}")"
          for file in "${files[@]}"; do
            while [[ "$file" != "$common"/* && "$common" != "." ]]; do
              common="$(dirname "$common")"
            done
          done
          checksums_abs="$PWD/$CHECKSUMS"
          (
            cd "$common"
            sha256sum "${files[@]#"$common"/}" > "$checksums_abs"
          )
          cat "$CHECKSUMS"

      - name: Collect artifact paths
        id: artifact-paths
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHECKSUMS: ${{ inputs.checksums }}
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          {
            echo "paths<<EOF"
            read -r -a files <<< "$ARTIFACTS"
            for file in "${files[@]}"; do
              echo "${GITHUB_WORKSPACE}/${WORKDIR}/${file}"
            done
            if [ -n "$CHECKSUMS" ]; then
              echo "${GITHUB_WORKSPACE}/${WORKDIR}/${CHECKSUMS}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.unit }}
          path: ${{ steps.artifact-paths.outputs.paths }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # ---------------------------------------------------------------- pulsar ----
  # Host fmt/clippy/tests are the `pulsar-bazel` unit (`_bazel.yml`); this unit
  # only cross-builds the deployable station binaries with Bazel. The zig cc
  # toolchain, Rust toolchain and sendspin C/C++ all come from MODULE.bazel, so
  # no rustup/zig/cargo-zigbuild/CMake/ninja setup happens here.
  #
  # Both station ABIs: the daemon at -c opt (line tables kept for pulsar.debug,
  # VERSION/BUILD_TIME passed as --define) for aarch64 and armhf.
  pulsar-build:
    name: native / pulsar-build (${{ matrix.arch }})
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armhf]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pinned Bazelisk plus the Bzlmod/repository caches, identical to the
      # `_bazel.yml` unit the host checks use.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Action-output disk cache (.bazelrc only); keyed like the pulsar-bazel
          # unit so both restore the same Rust/C++ objects.
          path: ~/.cache/bazel-disk
          key: bazel-pulsar-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/station/pulsar/satellite/Cargo.lock', 'projects/station/pulsar/satellite/crate-universe.lock') }}
          restore-keys: |
            bazel-pulsar-${{ runner.os }}-
            bazel-${{ runner.os }}-

      # Every run is release-shaped, so the cross-built binary is verified under
      # qemu exactly as the station updater does before accepting a release.
      - name: Release verification prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-user libc6-arm64-cross libc6-armhf-cross

      # VERSION is the release trigger and the value `pulsar --version` prints.
      # BUILD_TIME is HEAD's commit date (the Makefile's reproducible value):
      # a rebuild of the same commit does not change option_env! and relink.
      - name: Release identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < projects/station/pulsar/VERSION)
          if [[ -n "$RELEASE_VERSION" ]]; then
            version="$RELEASE_VERSION"
          fi
          build_time=$(TZ=UTC0 LC_ALL=C git log -1 --format=%cd --date=format-local:'%b %e %Y, %H:%M:%S')
          {
            echo "PULSAR_VERSION=$version"
            echo "PULSAR_BUILD_TIME=$build_time"
          } >> "$GITHUB_ENV"

      - name: Build station daemon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bazel build -c opt \
            --platforms="//platform/bazel/zig:${ARCH}_linux" \
            --define="pulsar_version=$PULSAR_VERSION" \
            --define="pulsar_build_time=$PULSAR_BUILD_TIME" \
            //projects/station/pulsar/satellite:station_binary
          out="$GITHUB_WORKSPACE/projects/station/pulsar/satellite/build/$ARCH"
          mkdir -p "$out"
          cp bazel-bin/projects/station/pulsar/satellite/pulsar "$out/pulsar"
          cp bazel-bin/projects/station/pulsar/satellite/pulsar.debug "$out/pulsar.debug"

      # Glibc binaries run under qemu with the cross libc; the updater compares
      # exactly this `--version` output against the OCI tag.
      - name: Verify pulsar --version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            aarch64) emulator=qemu-aarch64; sysroot=/usr/aarch64-linux-gnu ;;
            armhf) emulator=qemu-arm; sysroot=/usr/arm-linux-gnueabihf ;;
            *) echo "unknown arch $ARCH" >&2; exit 1 ;;
          esac
          binary="projects/station/pulsar/satellite/build/$ARCH/pulsar"
          output=$("$emulator" -L "$sysroot" "$binary" --version)
          printf '%s\n' "$output"
          if [[ "$output" != "pulsar $PULSAR_VERSION" ]]; then
            echo "::error::--version printed '$output', expected 'pulsar $PULSAR_VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-${{ matrix.arch }}
          path: |
            ${{ inputs.workdir }}/satellite/build/${{ matrix.arch }}/pulsar
            ${{ inputs.workdir }}/satellite/build/${{ matrix.arch }}/pulsar.debug
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # The Go installer is a nested module with its own go.mod. The root go.work
  # does not list it, so every command runs with GOWORK=off.
  pulsar-installer:
    name: native / pulsar-installer
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: ${{ inputs.workdir }}/installer/go.sum

      - name: vet + test
        working-directory: ${{ inputs.workdir }}/installer
        env:
          GOWORK: "off"
        run: |
          go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
          go test ./...

      - name: cross-build
        working-directory: ${{ inputs.workdir }}/installer
        env:
          GOWORK: "off"
        run: |
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "dist/$os-$arch/pulsar-install$ext" .
          done

  # Zigbee firmware for the Midi radio (Telink B91).
  pulsar-radio:
    name: native / pulsar-radio
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - name: i386 C library (the Telink toolchain is 32-bit x86)
        run: sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq libc6:i386

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.workdir }}/radio/src
            ${{ inputs.workdir }}/radio/toolchain
          key: pulsar-radio-${{ hashFiles(format('{0}/radio/build.sh', inputs.workdir), format('{0}/radio/sdk.patch', inputs.workdir)) }}

      - name: Build radio firmware
        working-directory: ${{ inputs.workdir }}
        run: radio/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-radio
          path: |
            ${{ inputs.workdir }}/radio/out/zigbee-router.ybl
            ${{ inputs.workdir }}/radio/out/zigbee-coordinator.ybl
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # The single release-shaped artifact `publish` uploads with
  # `projects/station/pulsar/publish-oci.sh` (PR `tree-<hash>` or deploy-home
  # fallback release tags).
  pulsar-release:
    name: native / pulsar-release (${{ inputs.release_version || 'VERSION' }})
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    needs: [promote, pulsar-build, pulsar-radio]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      # Layer titles are the station updater's contract; SHA256SUMS covers the
      # binaries and both radio images.
      - name: Stage the OCI release files
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
          STAGE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          for arch in aarch64 armhf; do
            cp "$ARTIFACTS/pulsar-$arch/pulsar" "$STAGE/pulsar-$arch.bin"
          done
          cp "$ARTIFACTS"/pulsar-radio/zigbee-*.ybl "$STAGE"/
          (
            cd "$STAGE"
            sha256sum pulsar-aarch64.bin pulsar-armhf.bin zigbee-*.ybl > SHA256SUMS
          )
          cat "$STAGE/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.unit }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # dropbear + sftp-server for `pulsar-install --ssh`.
  pulsar-ssh:
    name: native / pulsar-ssh
    needs: promote
    if: inputs.kind == 'pulsar' && needs.promote.outputs.mode != 'promoted'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.workdir }}/ssh/out/src
          key: pulsar-ssh-${{ hashFiles(format('{0}/ssh/build.sh', inputs.workdir)) }}

      - name: Build dropbear and sftp-server
        working-directory: ${{ inputs.workdir }}
        run: ssh/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-ssh
          path: |
            ${{ inputs.workdir }}/ssh/out/aarch64/
            ${{ inputs.workdir }}/ssh/out/armhf/
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  # Publish the artifact of the build that just ran:
  #   * same-repo PR  -> `<repository>:tree-<git tree hash>` (build once);
  #   * deploy-home fallback -> the unit's usual release tags, exactly as before.
  # A promoted deploy path publishes nothing: the digest already exists.
  # Only this job needs registry/OIDC/attestation permissions; the caller grants
  # them for this job alone.
  publish:
    name: publish / ${{ inputs.unit }}
    needs: [promote, native, pulsar-release]
    if: >-
      !cancelled() &&
      needs.promote.result == 'success' &&
      needs.promote.outputs.mode != 'promoted' &&
      (needs.native.result == 'success' || needs.pulsar-release.result == 'success') &&
      (inputs.push_tree_tag || inputs.publish_versions) &&
      inputs.publish_repository != '' &&
      inputs.publish_script != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.unit }}
          path: ${{ runner.temp }}/artifact

      - name: Install pinned oras
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oras
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The build-once identity is the git tree: a PR builds its merge ref, whose
      # tree equals the squash commit's tree while `develop` did not move.
      - name: Compute the tree tag
        id: tree
        if: inputs.push_tree_tag
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve HEAD^{tree}: '$tree'" >&2
            exit 1
          fi
          echo "tag=tree-${tree}" >> "$GITHUB_OUTPUT"
          echo "- artifact identity: \`tree-${tree}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish OCI artifact
        id: publish
        env:
          PUBLISH_SCRIPT: ${{ inputs.publish_script }}
          TREE_TAG: ${{ steps.tree.outputs.tag }}
          PUSH_TREE_TAG: ${{ inputs.push_tree_tag }}
        run: |
          set -euo pipefail
          [[ -n "$PUBLISH_SCRIPT" ]] || {
            echo "unit ${{ inputs.unit }} has no publish_script" >&2
            exit 1
          }
          args=(--source-dir "$RUNNER_TEMP/artifact")
          if [[ "$PUSH_TREE_TAG" == "true" ]]; then
            args+=(--tag "$TREE_TAG")
          fi
          "$PUBLISH_SCRIPT" "${args[@]}"

      # Provenance for the pushed OCI manifest digest, stored in the registry
      # next to the artifact. deploy-home verifies it before promoting.
      - name: Attest pushed artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}

      # Also attest the files an operator consumes, not just the manifest.
      - name: Attest unit files
        if: inputs.publish_attest_glob != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/artifact/${{ inputs.publish_attest_glob }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### _native publish / ${{ inputs.unit }}"
            echo
            echo "- repository: \`${{ inputs.publish_repository }}\`"
            if [[ "${{ inputs.push_tree_tag }}" == "true" ]]; then
              echo "- tag: \`${{ steps.tree.outputs.tag }}\` (PR build once)"
            else
              echo "- version: \`${{ steps.publish.outputs.version }}\` (fallback release build)"
            fi
            echo "- digest: \`${{ steps.publish.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
