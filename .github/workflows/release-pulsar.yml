name: release-pulsar

# Pulsar release for the station. The version is the content of
# `projects/station/pulsar/VERSION`; a change to that file on `develop` builds
# both station ABIs, the radio firmware and SHA256SUMS, then publishes the OCI
# artifact the station updater reads:
#
#   ghcr.io/proflyder/pulsar-firmware:<version>  (and :latest)
#
# There is no GitHub release and no tag: monorepo tags are forbidden and the
# updater no longer reads GitHub Releases. The same OCI layout as the former
# `build.yml` is kept (layer titles `pulsar-<arch>.bin`, `SHA256SUMS`,
# `zigbee-*.ybl`, annotation `org.opencontainers.image.version`), so the
# station code does not change.
#
# `deploy` ports the former `deploy-station.yml`: Environment `Station` gives a
# human approval gate, then the job joins the VPN (`ci` group), reads the HA
# credentials from OpenBao over GitHub OIDC (role `deploy-station`) and drives
# the station's "Firmware" entity through `tools/ha_firmware_deploy.py`.
on:
  push:
    branches: [develop]
    paths:
      - projects/station/pulsar/VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pulsar
  cancel-in-progress: false

env:
  PULSAR_DIR: projects/station/pulsar
  PULSAR_IMAGE: ghcr.io/proflyder/pulsar-firmware

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Require the develop ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        run: |
          echo "::error::release-pulsar must run from develop, got $GITHUB_REF"
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read and validate VERSION
        id: read
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < "$PULSAR_DIR/VERSION")
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be vMAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing pulsar $version"

  build:
    name: build (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armhf]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - name: Build and verification prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build qemu-user libc6-arm64-cross libc6-armhf-cross

      - name: Rust toolchain (rust-toolchain.toml)
        working-directory: ${{ env.PULSAR_DIR }}/satellite
        run: rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.PULSAR_DIR }}/satellite/target
          key: pulsar-release-${{ matrix.arch }}-${{ hashFiles('projects/station/pulsar/satellite/Cargo.lock', 'projects/station/pulsar/satellite/rust-toolchain.toml') }}
          restore-keys: pulsar-release-${{ matrix.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-0.24.0-${{ runner.os }}-${{ matrix.arch }}

      - name: Install cargo-zigbuild 0.24.0
        run: |
          cargo-zigbuild --version 2>/dev/null | grep -qx 'cargo-zigbuild 0.24.0' ||
            cargo install cargo-zigbuild --locked --force --version 0.24.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PULSAR_DIR }}/satellite/third_party/src
          key: pulsar-third-party-${{ hashFiles('projects/station/pulsar/satellite/third_party/fetch.sh') }}

      # The Makefile's VERSION defaults to `git describe`; monorepo tags do not
      # exist, so the release version is passed explicitly. A command-line make
      # variable overrides the Makefile assignment.
      - name: Build pulsar ${{ matrix.arch }}
        working-directory: ${{ env.PULSAR_DIR }}
        run: make -C satellite ARCH=${{ matrix.arch }} VERSION=${{ needs.version.outputs.version }} -j"$(nproc)" binary

      # Glibc 2.36/2.23 binaries run under qemu with the cross libc; this is the
      # same `--version` contract the updater compares against the release.
      - name: Verify pulsar --version
        working-directory: ${{ env.PULSAR_DIR }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            aarch64) emulator=qemu-aarch64; sysroot=/usr/aarch64-linux-gnu ;;
            armhf) emulator=qemu-arm; sysroot=/usr/arm-linux-gnueabihf ;;
            *) echo "unknown arch $ARCH" >&2; exit 1 ;;
          esac
          output=$("$emulator" -L "$sysroot" "satellite/build/$ARCH/pulsar" --version)
          printf '%s\n' "$output"
          if [[ "$output" != "pulsar $VERSION" ]]; then
            echo "::error::--version printed '$output', expected 'pulsar $VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-${{ matrix.arch }}
          path: |
            ${{ env.PULSAR_DIR }}/satellite/build/${{ matrix.arch }}/pulsar
            ${{ env.PULSAR_DIR }}/satellite/build/${{ matrix.arch }}/pulsar.debug
          if-no-files-found: error

  radio:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        timeout-minutes: 5
        with:
          version: "0.14.1"

      - name: i386 C library (the Telink toolchain is 32-bit x86)
        run: sudo dpkg --add-architecture i386 && sudo apt-get update -q && sudo apt-get install -yq libc6:i386

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PULSAR_DIR }}/radio/src
            ${{ env.PULSAR_DIR }}/radio/toolchain
          key: pulsar-radio-${{ hashFiles('projects/station/pulsar/radio/build.sh', 'projects/station/pulsar/radio/sdk.patch') }}

      - name: Build radio firmware
        working-directory: ${{ env.PULSAR_DIR }}
        run: radio/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulsar-radio
          path: |
            ${{ env.PULSAR_DIR }}/radio/out/zigbee-router.ybl
            ${{ env.PULSAR_DIR }}/radio/out/zigbee-coordinator.ybl
          if-no-files-found: error

  publish:
    needs: [version, build, radio]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      - name: Stage the OCI release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
          STAGE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          # The updater finds layers by title, so the file names are a contract.
          for arch in aarch64 armhf; do
            cp "$ARTIFACTS/pulsar-$arch/pulsar" "$STAGE/pulsar-$arch.bin"
          done
          cp "$ARTIFACTS"/pulsar-radio/zigbee-*.ybl "$STAGE"/
          (
            cd "$STAGE"
            sha256sum pulsar-aarch64.bin pulsar-armhf.bin zigbee-*.ybl > SHA256SUMS
          )
          cat "$STAGE/SHA256SUMS"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The version tag is immutable: an existing tag means a re-run of an old
      # version, which must produce the next VERSION instead of overwriting the
      # bytes a station may already trust.
      - name: Refuse to overwrite an existing version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if oras manifest fetch "$PULSAR_IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$PULSAR_IMAGE:$VERSION already exists; bump $PULSAR_DIR/VERSION"
            exit 1
          fi

      - name: Push the OCI release artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
          STAGE: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          cd "$STAGE"
          files=(pulsar-aarch64.bin pulsar-armhf.bin SHA256SUMS)
          for file in zigbee-*.ybl; do
            if [ -e "$file" ]; then files+=("$file"); fi
          done
          oras push "$PULSAR_IMAGE:$VERSION" \
            --artifact-type application/vnd.proflyder.pulsar.release.v1 \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.source=https://github.com/proflyder/monorepo" \
            "${files[@]}"
          # The station updater reads :latest.
          oras tag "$PULSAR_IMAGE:$VERSION" latest

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "### release-pulsar"
            echo
            echo "- version: \`$VERSION\`"
            echo "- image: \`$PULSAR_IMAGE:$VERSION\` (and \`:latest\`)"
            echo "- layers: \`pulsar-aarch64.bin\`, \`pulsar-armhf.bin\`, \`SHA256SUMS\`, \`zigbee-*.ybl\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Ported from the former deploy-station.yml. The Environment approval is the
  # only gate before the station is touched.
  deploy:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Station
    permissions:
      contents: read
      id-token: write # OpenBao auth/github OIDC (audience = OPENBAO_ADDR)
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
      IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
      IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      OPENBAO_ROLE: ${{ secrets.OPENBAO_ROLE || 'deploy-station' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install openconnect
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends openconnect vpnc-scripts

      - name: Materialise VPN credentials
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR).
      - name: Read deploy secrets from OpenBao
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: ${{ env.OPENBAO_ROLE }}
          jwtGithubAudience: ${{ env.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/deploy-station ha_url | HA_URL ;
            secret/data/ci/deploy-station ha_token | HA_TOKEN ;
            secret/data/ci/deploy-station entity_id | ENTITY_ID

      - name: Install ${{ needs.version.outputs.version }} through Home Assistant
        env:
          HA_URL: ${{ steps.openbao.outputs.HA_URL }}
          HA_TOKEN: ${{ steps.openbao.outputs.HA_TOKEN }}
          ENTITY_ID: ${{ steps.openbao.outputs.ENTITY_ID }}
          DEPLOY_LOG: ${{ runner.temp }}/ci/deploy.log
        run: |
          set +e
          set -o pipefail
          if [[ -z "${HA_URL:-}" || -z "${HA_TOKEN:-}" || -z "${ENTITY_ID:-}" ]]; then
            echo "OpenBao returned an empty deploy value" >&2
            exit 1
          fi
          python3 "$PULSAR_DIR/tools/ha_firmware_deploy.py" --tag "$VERSION" 2>&1 | tee "$DEPLOY_LOG"
          status=$?
          {
            echo "### Station deploy"
            echo
            echo "- version: \`$VERSION\`"
            if grep -q 'already installed' "$DEPLOY_LOG"; then
              echo "- result: already installed"
            else
              grep -E 'done: before=|^error:' "$DEPLOY_LOG" | sed 's/^/- /' || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Disconnect VPN and remove temporary files
        if: always()
        run: |
          set +e
          CI_DIR="$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -rf "$CI_DIR" "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary deploy files removed"
