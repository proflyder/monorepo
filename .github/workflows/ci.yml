name: ci

# Pull-request entry point of the CI pipeline. One trigger only: the whole
# pipeline lives in `_ci.yml` (workflow_call), and `ci-manual.yml` is the
# `workflow_dispatch` twin that calls the same reusable. Never add a second
# event here — see AGENTS.md ("CI: один триггер на воркфлоу").
#
# `ci-ok` is the single required check of the branch ruleset and of
# `platform/ci/safe-merge.mjs`. It stays in this file (a called workflow's jobs
# are reported as `<caller> / <job>`, which would rename the check): it needs the
# pipeline call and reads the per-job results `_ci.yml` exports.
#
# `develop` changes only through a PR with a green `ci-ok`, so there is no push
# trigger: re-running the same checks on the squash merge would be redundant.
# The caches that PRs restore (the Rust repository archive and the per-family
# Bazel disk caches) are warmed after merge by `deploy-home`'s `warm-android` /
# `warm-rust` jobs, which run on `push` to `develop` without secrets or an
# Environment. Pull requests never write caches: GitHub scopes them to the
# writing ref, so a PR-written entry is invisible to other PRs and only spends
# the repository's 10 GB budget.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One call for the whole pipeline. `_ci.yml` declares its jobs; this workflow
  # only states the event (`mode`, `same_repository`, `distribution`) and gates
  # the result.
  pipeline:
    # The union of what the pipeline's jobs request; each job inside `_ci.yml`
    # still narrows its own token, and a called workflow can only downgrade.
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_ci.yml
    with:
      mode: pull_request
      same_repository: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      # A fork PR has a read-only token and no Environment secrets.
      distribution: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
    secrets: inherit

  # Single required check for the branch ruleset. Green only when every
  # dispatched job succeeded or was legitimately skipped. `_ci.yml` computes
  # that answer (it is the only place that sees every job's `needs`) and exports
  # `ok`/`failing`; this job only publishes it under the unchanged check name.
  ci-ok:
    needs: pipeline
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All pipeline jobs succeeded or were skipped
        if: needs.pipeline.outputs.ok == 'true'
        run: echo "ci-ok is green"
      - name: Report the failing pipeline jobs
        if: needs.pipeline.outputs.ok != 'true'
        env:
          FAILING: ${{ needs.pipeline.outputs.failing }}
        run: |
          echo "::error::ci pipeline failed or was cancelled: ${FAILING:-no job results (the pipeline did not finish)}"
          exit 1
