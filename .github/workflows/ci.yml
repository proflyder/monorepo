name: ci

# Smart CI: only the platforms and units a change actually touches.
#
# `changes` routes the diff onto units from platform/ci/units.yml (Go: `go list`
# dependency closure, Android: Bazel reverse dependencies, Python: path rules)
# and each platform then fans out a matrix of reusable workflows. `ci-ok` is the
# single required check: green when every job succeeded or was legitimately
# skipped.
#
# No deploy steps and no repository secrets: deploy workflows are separate and
# only run from `develop` with Environments.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  # Computes the affected units. Cheap: no toolchains, only a Bazel loading
  # query for the Android graph and `go list` for Go dependencies.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go_units: ${{ steps.route.outputs.go_units }}
      android_units: ${{ steps.route.outputs.android_units }}
      python_units: ${{ steps.route.outputs.python_units }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      deploy_control: ${{ steps.route.outputs.deploy_control }}
      deploy_units: ${{ steps.route.outputs.deploy_units }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The base revision of a PR/previous push must be in history.
          fetch-depth: 0

      - name: Ensure base branch history
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install routing dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      - name: Install pinned Bazelisk
        run: |
          platform/ci/install-bazelisk.sh "$RUNNER_TEMP/bazelisk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-plan-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'go.sum') }}
          restore-keys: |
            bazel-plan-${{ runner.os }}-

      # `workflow_dispatch` intentionally runs every unit.
      - name: Route affected units
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA}}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 platform/ci/affected.py --all --bazel "$RUNNER_TEMP/bazelisk" --format github \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 platform/ci/affected.py --base "$base" --bazel "$RUNNER_TEMP/bazelisk" \
              --format github | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Repository-wide gates: audit, static checks, unit-map invariants, Gitleaks.
  # Cheap and always worth running, even for documentation-only changes.
  quality:
    needs: changes
    if: always()
    uses: ./.github/workflows/_quality.yml

  # One matrix entry per affected Go unit: scheduler, ha-bridge, alarm,
  # ble-gateway or the shared packages.
  go:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.go_units != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.go_units) }}
    uses: ./.github/workflows/_go.yml
    with:
      unit: ${{ matrix.id }}
      workdir: ${{ matrix.workdir }}
      packages: ${{ matrix.packages }}
      race: ${{ matrix.race }}
      build_packages: ${{ matrix.build_packages }}
      deploy_control: false

  # One matrix entry per affected application or shared Kotlin library unit.
  android:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.android_units != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.android_units) }}
    uses: ./.github/workflows/_android.yml
    with:
      unit: ${{ matrix.id }}
      test_targets: ${{ matrix.test_targets }}
      build_targets: ${{ matrix.build_targets }}
      universe: ${{ matrix.universe }}
      artifact: ${{ matrix.artifact }}
      artifact_name: ${{ matrix.artifact_name }}
      base_sha: ${{ needs.changes.outputs.base_sha }}
      precise_targets: true

  # One matrix entry per affected Python project suite.
  python:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.python_units != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.python_units) }}
    uses: ./.github/workflows/_python.yml
    with:
      unit: ${{ matrix.id }}
      suites: ${{ matrix.suites }}
      compile: ${{ matrix.compile }}

  # Container-image build for the affected deployable units. Build only: no
  # registry credentials and no push on pull requests. `deploy-home` performs
  # the actual build+push+roll on develop.
  images:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.deploy_units != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_units) }}
    uses: ./.github/workflows/_images.yml
    with:
      unit: ${{ matrix.id }}
      images: ${{ matrix.images }}
      builder: ${{ matrix.builder }}

  # Expensive regression with real linux/amd64 release binaries. Only when the
  # scheduler, ha-bridge (ha-control) or the Kubernetes deployment changed.
  deploy-control:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.deploy_control == 'true'
    uses: ./.github/workflows/_go.yml
    with:
      unit: deploy-control
      packages: ""
      deploy_control: true

  # Single required check for the branch ruleset. Green only when every
  # dispatched job succeeded or was legitimately skipped.
  ci-ok:
    if: always()
    needs: [changes, quality, go, android, python, images, deploy-control]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: platform/ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify every required job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 platform/ci/ci_gate.py
