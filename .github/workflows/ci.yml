name: ci

# Smart CI: only the platforms and units a change actually touches.
#
# `changes` routes the diff onto units from platform/ci/units.mjs (Android:
# Bazel reverse dependencies, Rust: the Bazel loading graph, Python/JS/native:
# path rules) and each platform then fans out a matrix of reusable workflows.
# `plan` runs target-determinator once for the whole Android universe in
# parallel with `changes`, so the Android entries do not each analyse the base
# revision. `ci-ok` is the single required check: green when every job
# succeeded or was legitimately skipped.
#
# No deploy steps and no repository secrets: deploy workflows are separate and
# only run from `develop` with Environments. The single exception is
# `android-distribute`, a PR-only delivery side effect that uses the `Android`
# Environment (never `ci-ok`) to sign and upload the APK to Firebase.
#
# `develop` changes only through a PR with a green `ci-ok`, so there is no push
# trigger: re-running the same checks on the squash merge would be redundant.
# The shared caches that PRs restore (setup-bazel, the Android disk cache and
# the target-determinator binary) are warmed after merge by `deploy-home`'s
# `warm-caches` job, which runs on `push` to `develop` without secrets or an
# Environment. Pull requests never write caches: GitHub scopes them to the
# writing ref, so a PR-written entry is invisible to other PRs and only spends
# the repository's 10 GB budget.
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Computes the affected units. Cheap: no toolchains, only a Bazel loading
  # query for the Android and Rust graphs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android_units: ${{ steps.route.outputs.android_units }}
      bazel_units: ${{ steps.route.outputs.bazel_units }}
      python_units: ${{ steps.route.outputs.python_units }}
      js_units: ${{ steps.route.outputs.js_units }}
      native_units: ${{ steps.route.outputs.native_units }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      deploy_control: ${{ steps.route.outputs.deploy_control }}
      deploy_units: ${{ steps.route.outputs.deploy_units }}
      android_distribute: ${{ steps.route.outputs.android_distribute }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The base revision of a PR/previous push must be in history.
          fetch-depth: 0

      - name: Ensure base branch history
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # Pinned Bazelisk on PATH plus its own Bzlmod/repository caches: the
      # routing query only needs the external repositories, not action outputs.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # `workflow_dispatch` intentionally runs every unit.
      - name: Route affected units
        id: route
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        with:
          script: |
            const affected = await import(`${process.env.GITHUB_WORKSPACE}/platform/ci/affected.mjs`);
            const argv = process.env.EVENT_NAME === 'workflow_dispatch'
              ? ['--all', '--format', 'github']
              : ['--base', process.env.PR_BASE_SHA || process.env.PUSH_BEFORE_SHA || '', '--format', 'github'];
            await affected.runGithubScript({ core, argv });

  # One target-determinator run for the whole Android universe, so the three
  # Android matrix entries do not each pay the ~2 minutes of analysing the base
  # revision. It runs in parallel with `changes` (the universe and the candidate
  # targets come from the unit map, not from the routed unit list) and only
  # publishes the set of affected targets; each entry intersects its own
  # declared targets with it (`platform/ci/plan-targets.mjs narrow`).
  #
  # Not part of `ci-ok` and never fatal: an empty output (skipped on
  # `workflow_dispatch`, failed install/analysis) means "no narrowing", so the
  # matrix runs every declared target. The target-determinator binary is cached
  # by the pinned installer script's hash; the develop-side save happens in
  # `deploy-home`'s `warm-caches`.
  plan:
    # Only a PR has a base revision to narrow against; `workflow_dispatch`
    # intentionally runs every declared target.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      affected_targets: ${{ steps.narrow.outputs.affected_targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # target-determinator analyses a worktree of the base revision.
          fetch-depth: 0

      - name: Ensure base revision history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A shallow or advanced base branch may not contain the PR base commit.
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA" || true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # target-determinator drives `bazel` for both revisions; the Bzlmod and
      # repository caches keep that analysis off the network. Read-only here:
      # the develop writer is `deploy-home`'s `warm-caches`.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # Node for `plan-targets.mjs` (same pinned version as every other job).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: "node"
          cache: true

      # Same SDK the Android units install, including the standalone Lint CLI
      # package: analysing the lint target needs it configured.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;23.0"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The pinned binary (version and per-platform checksums live in the
          # installer script, so its hash is the version).
          path: ~/.cache/ci-tools
          key: target-determinator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/ci/install-target-determinator.sh') }}

      - name: Install target-determinator
        run: |
          set -euo pipefail
          dest="$HOME/.cache/ci-tools/target-determinator"
          if [[ -x "$dest" ]]; then
            echo "reusing cached target-determinator"
          else
            mkdir -p "$(dirname "$dest")"
            platform/ci/install-target-determinator.sh "$dest" >/dev/null
          fi

      # bazel-targets.sh degrades to "every candidate" on any failure, so a
      # broken plan widens the matrix instead of hiding checks. target-determinator
      # runs `bazel cquery`, so it must use the same `--config=android` as the
      # real build (platform/android/android.bazelrc).
      - name: Narrow the Android target set
        id: narrow
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          plan="$(node platform/ci/plan-targets.mjs metadata)"
          candidates="$(sed -n 's/^candidates=//p' <<< "$plan")"
          universe="$(sed -n 's/^universe=//p' <<< "$plan")"
          if [[ -z "$BASE_SHA" || -z "$candidates" ]]; then
            echo "no base revision to narrow against; the matrix runs every declared target"
            echo "affected_targets=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          affected="$(platform/ci/bazel-targets.sh \
            --base "$BASE_SHA" \
            --candidates "$candidates" \
            --universe "$universe" \
            --bazel-opts=--config=android \
            --td "$HOME/.cache/ci-tools/target-determinator")"
          echo "affected_targets=${affected}" >> "$GITHUB_OUTPUT"

  # Repository-wide gates: audit, static checks, unit-map invariants, Gitleaks.
  # Cheap and always worth running, even for documentation-only changes.
  quality:
    needs: changes
    if: always()
    uses: ./.github/workflows/_quality.yml

  # One matrix entry per affected application or shared Kotlin library unit,
  # plus the dedicated `android-lint` unit. Android Lint runs as its own job so
  # a finding fails only that matrix entry instead of aborting the app's
  # `bazel test` and hiding the other tests' results.
  #
  # The matrix uses the targets `plan` narrowed; a missing plan output (skipped
  # or failed) falls back to the declared targets inside `_android.yml`.
  android:
    needs: [changes, plan]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.android_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.android_units) }}
    uses: ./.github/workflows/_android.yml
    with:
      unit: ${{ matrix.id }}
      test_targets: ${{ matrix.test_targets }}
      build_targets: ${{ matrix.build_targets }}
      sdk_packages: ${{ matrix.sdk_packages }}
      affected_targets: ${{ needs.plan.outputs.affected_targets }}
      artifact: ${{ matrix.artifact }}
      artifact_name: ${{ matrix.artifact_name }}

  # One matrix entry per affected generic Bazel unit on a Linux runner (today:
  # the Pulsar Rust workspace: host build, tests, rustfmt and clippy). Separate
  # from `android` because it needs no JDK or Android SDK.
  bazel:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.bazel_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.bazel_units) }}
    uses: ./.github/workflows/_bazel.yml
    with:
      unit: ${{ matrix.id }}
      test_targets: ${{ matrix.test_targets }}
      build_targets: ${{ matrix.build_targets }}

  # Firebase App Distribution of the Home Android app on every PR that changes
  # it: one APK per push, after that PR's `android` build passed.
  #
  # `android_distribute` is true only for a real Android input (the app, the
  # shared Kotlin libraries it builds, or `platform/android/**`). A global
  # invalidation such as `MODULE.bazel` still runs the `android` checks but does
  # not change the app, so it must not publish a build.
  #
  # The whole `android` matrix must be green, so an `android-lint` finding also
  # skips distribution. Lint gates the APK deliberately: a finding means the
  # application code is not acceptable, and the PR still shows the exact
  # `android / android-lint` failure.
  #
  # Deliberately NOT a dependency of `ci-ok`: distribution is a delivery
  # side effect, not a code gate. A failed upload stays visible on the PR (and
  # in the run) without blocking the merge.
  #
  # Only same-repository PR branches run it: a fork's `pull_request` run gets a
  # read-only token and no Environment secrets, so it could never log in to
  # OpenBao, and `pull_request_target` is not used anywhere. `environment:
  # Android` plus the OIDC claims bound in the OpenBao role (`repository`,
  # `environment`, `ref=refs/pull/*/merge`, `job_workflow_ref=<repo>/.github/
  # workflows/ci.yml@refs/pull/*/merge`, `event_name=pull_request`) are the
  # trust boundary; the Environment itself must allow PR head branches.
  #
  # The checkout is the default pull_request merge ref, so the APK is built
  # from the merge of the PR into `develop`.
  android-distribute:
    needs: [changes, android]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.android.result == 'success' &&
      needs.changes.outputs.android_distribute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # OIDC `environment` claim keeps this exact casing; OpenBao binds "Android".
    environment: Android
    permissions:
      contents: read
      # Request the OIDC token that OpenBao's auth/github role trusts.
      id-token: write
    # A newer push to the same PR supersedes the upload in flight; the previous
    # run's APK is stale by definition.
    concurrency:
      group: android-distribute-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BAZELISK_VERSION: "1.30.0"
      # Public DNS name of the VPN and the OpenBao address are private values:
      # they live in the `Android` Environment, not in this file.
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      # Release-note inputs for `distribute.sh --ci`. Passed as environment
      # data, never interpolated into the script body, so a PR title cannot
      # inject shell.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Pinned Bazelisk on PATH, plus its Bzlmod/repository caches (same as
      # `_android.yml`).
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Restore-only: reuse the warm disk cache `deploy-home`'s `warm-caches`
      # maintains on develop, so this build only redoes the actions that the
      # private google-services config and the versionCode/versionName define
      # (resources, manifest, dex, packaging) instead of compiling from
      # scratch. The release key is applied after Bazel, so it does not
      # invalidate any Bazel action.
      #
      # The APK is built here and nowhere else: the matrix entry builds the same
      # `:app` target for `apk_runtime_closure_test`, but it has no Firebase
      # config (PR CI never sees the Environment secrets) and PR CI must not
      # publish secret-bearing artifacts. Distribution therefore owns the one
      # distributable APK; the develop cache keeps it cheap.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-android-${{ runner.os }}-android-app-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}
          restore-keys: |
            bazel-android-${{ runner.os }}-android-app-
            bazel-android-${{ runner.os }}-

      # setup-android accepts the SDK licenses by default; install exactly the
      # platform/build-tools pinned in MODULE.bazel.
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # No official action exists for openconnect; the runner image has none.
      # The VPN steps below mirror deploy-home's minimal connect/health-check
      # sequence; they are duplicated rather than extracted so a change here
      # cannot alter the working home deployment job.
      - name: Install VPN client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR). The
      # action masks every line of every value and exposes them as step outputs
      # only (`exportEnv: false`), so they do not leak into later steps' env.
      # The JSON files are read as single-line base64: vault-action masks every
      # line of a multi-line value, and GitHub strips a masked line that is just
      # "{" from all logs, which mangled the Kotlin stack traces.
      - name: Read Android signing secrets from OpenBao
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: android-distribute
          jwtGithubAudience: ${{ env.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/android-distribute signing_keystore_b64 | SIGNING_KEYSTORE_B64 ;
            secret/data/ci/android-distribute signing_store_password | SIGNING_STORE_PASSWORD ;
            secret/data/ci/android-distribute signing_key_password | SIGNING_KEY_PASSWORD ;
            secret/data/ci/android-distribute signing_key_alias | SIGNING_KEY_ALIAS ;
            secret/data/ci/android-distribute signing_cert_sha256 | SIGNING_CERT_SHA256 ;
            secret/data/ci/android-distribute google_services_json_b64 | GOOGLE_SERVICES_JSON_B64 ;
            secret/data/ci/android-distribute firebase_service_account_json_b64 | FIREBASE_SERVICE_ACCOUNT_JSON_B64

      # Materialise the private files into the checkout and $RUNNER_TEMP.
      # Bazel needs google-services.json under platform/android/keys/ exactly
      # like the local symlink. The release key is deliberately NOT there:
      # Bazel output stays debug-signed and only `sign-release.sh` applies the
      # release key, to the final APK. Passwords land in files with mode 600 and
      # are never written to the environment or to a log.
      - name: Materialise Android signing files
        env:
          SIGNING_KEYSTORE_B64: ${{ steps.openbao.outputs.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ steps.openbao.outputs.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ steps.openbao.outputs.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ steps.openbao.outputs.SIGNING_KEY_ALIAS }}
          SIGNING_CERT_SHA256: ${{ steps.openbao.outputs.SIGNING_CERT_SHA256 }}
          GOOGLE_SERVICES_JSON_B64: ${{ steps.openbao.outputs.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ steps.openbao.outputs.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          KEYS_DIR="platform/android/keys"
          CI_DIR="$RUNNER_TEMP/ci"
          SIGNING_DIR="$CI_DIR/signing"
          for value in SIGNING_KEYSTORE_B64 SIGNING_STORE_PASSWORD \
                       SIGNING_KEY_PASSWORD SIGNING_KEY_ALIAS SIGNING_CERT_SHA256 \
                       GOOGLE_SERVICES_JSON_B64 FIREBASE_SERVICE_ACCOUNT_JSON_B64; do
            if [[ -z "${!value:-}" ]]; then
              echo "OpenBao returned an empty $value" >&2
              exit 1
            fi
          done
          mkdir -p "$KEYS_DIR" "$SIGNING_DIR"
          chmod 700 "$CI_DIR" "$SIGNING_DIR"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > "$KEYS_DIR/google-services.json"
          chmod 600 "$KEYS_DIR/google-services.json"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/home-release.keystore"
          printf '%s' "$SIGNING_STORE_PASSWORD" > "$SIGNING_DIR/store.password"
          printf '%s' "$SIGNING_KEY_PASSWORD" > "$SIGNING_DIR/key.password"
          printf '%s' "$SIGNING_KEY_ALIAS" > "$SIGNING_DIR/alias"
          printf '%s' "$SIGNING_CERT_SHA256" > "$SIGNING_DIR/cert.sha256"
          chmod 600 "$SIGNING_DIR"/*
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_B64" | base64 -d > "$CI_DIR/firebase-sa.json"
          chmod 600 "$CI_DIR/firebase-sa.json"
          # Only paths go to later steps' environment; the values stay in files.
          {
            echo "SIGNING_KEYSTORE=$SIGNING_DIR/home-release.keystore"
            echo "SIGNING_STORE_PASSWORD_FILE=$SIGNING_DIR/store.password"
            echo "SIGNING_KEY_PASSWORD_FILE=$SIGNING_DIR/key.password"
            echo "SIGNING_KEY_ALIAS_FILE=$SIGNING_DIR/alias"
            echo "SIGNING_CERT_SHA256_FILE=$SIGNING_DIR/cert.sha256"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$CI_DIR/firebase-sa.json"
          } >> "$GITHUB_ENV"
          echo "Android signing files prepared"

      # The OpenBao token is short-lived and Maven/Firebase use the public
      # internet, so the private network is no longer needed.
      - name: Disconnect VPN
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/ci/ci.p12" "$RUNNER_TEMP/ci/ci.pass"
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "VPN disconnected"

      - name: Build, verify and distribute
        run: |
          set -euo pipefail
          projects/mobile/android/distribute.sh --ci

      # The exact bytes installed by the testers, so a reviewer can sideload
      # what was published without repeating the build.
      - name: Upload the distributed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: bazel-bin/projects/mobile/android/app/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### android-distribute"
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key files and disconnect VPN
        if: always()
        run: |
          set +e
          rm -f platform/android/keys/google-services.json
          rmdir platform/android/keys 2>/dev/null
          rm -rf "$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary signing files removed"

  # One matrix entry per affected Python project suite.
  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.python_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.python_units) }}
    uses: ./.github/workflows/_python.yml
    with:
      unit: ${{ matrix.id }}
      suites: ${{ matrix.suites }}
      compile: ${{ matrix.compile }}
      deploy_tool: ${{ matrix.deploy_tool }}

  # One matrix entry per affected JavaScript edge Worker unit.
  js:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.js_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.js_units) }}
    uses: ./.github/workflows/_js.yml
    with:
      unit: ${{ matrix.id }}
      tests: ${{ matrix.tests }}

  # One matrix entry per affected native build: the Windows logon provider
  # (Bazel + rules_rust, hermetic zig toolchain for x86_64-pc-windows-gnu) and
  # the Rust Pulsar tree (Bazel for both arches, installer, radio, ssh; host
  # fmt/clippy/tests are the pulsar-bazel unit). Build, checksums and artifact
  # upload; on a PR from this repository (never a fork) `_native.yml` also
  # publishes the
  # release-shaped artifact as `tree-<hash>` with build provenance, so the merge
  # deploys the bytes this PR tested (DECISIONS 36). Fork PRs only build.
  #
  # Registry/OIDC/attestation permissions are granted to this job alone; every
  # other job stays `contents: read`.
  native:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native_units != '[]' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # `_native.yml` promote reads the merged PR (PR-head fallback); a called
      # workflow cannot request more than its caller grants.
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native_units) }}
    uses: ./.github/workflows/_native.yml
    with:
      unit: ${{ matrix.id }}
      kind: ${{ matrix.kind }}
      workdir: ${{ matrix.workdir }}
      build: ${{ matrix.build }}
      test: ${{ matrix.test }}
      artifacts: ${{ matrix.artifacts }}
      checksums: ${{ matrix.checksums }}
      publish_repository: ${{ matrix.publish_repository }}
      publish_tags: ${{ matrix.publish_tags }}
      publish_script: ${{ matrix.publish_script }}
      publish_attest_glob: ${{ matrix.publish_attest_glob }}
      promote: false
      push_tree_tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

  # Container-image build for the affected deployable units. On a pull request
  # from this repository, `_images.yml` also publishes the built images as
  # `ghcr.io/proflyder/<image>:tree-<hash>` and attests their provenance, so the
  # squash merge deploys the same bytes instead of rebuilding them (DECISIONS
  # 36). Fork PRs get a read-only token and only build.
  #
  # Registry/OIDC/attestation permissions are granted to this job alone; every
  # other job stays `contents: read`.
  images:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy_units != '[]' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_units) }}
    uses: ./.github/workflows/_images.yml
    with:
      unit: ${{ matrix.id }}
      images: ${{ matrix.images }}
      builder: ${{ matrix.builder }}
      target_root: ${{ matrix.target_root }}
      bazel_images: ${{ matrix.bazel_images }}
      push_tree_tag: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}

  # Expensive regression with real linux/amd64 release binaries. Only when the
  # scheduler, ha-bridge (ha-control) or the Kubernetes deployment changed.
  deploy-control:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy_control == 'true' }}
    uses: ./.github/workflows/_deploy-control.yml

  # Single required check for the branch ruleset. Green only when every
  # dispatched job succeeded or was legitimately skipped.
  ci-ok:
    if: always()
    needs: [changes, quality, android, bazel, python, js, native, images, deploy-control]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: platform/ci
      - name: Verify every required job succeeded or was skipped
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const gate = await import(`${process.env.GITHUB_WORKSPACE}/platform/ci/ci_gate.mjs`);
            gate.runGithubScript({ core, needs: JSON.parse(process.env.NEEDS) });
