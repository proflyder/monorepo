name: ci

# Smart CI: only the platforms and units a change actually touches.
#
# `changes` routes the diff onto units from platform/ci/units.yml (Go: `go list`
# dependency closure, Android: Bazel reverse dependencies, Python: path rules)
# and each platform then fans out a matrix of reusable workflows. `ci-ok` is the
# single required check: green when every job succeeded or was legitimately
# skipped.
#
# No deploy steps and no repository secrets: deploy workflows are separate and
# only run from `develop` with Environments. The single exception is
# `android-distribute`, a PR-only delivery side effect that uses the `Android`
# Environment (never `ci-ok`) to upload the built APK to Firebase.
#
# `develop` changes only through a PR with a green `ci-ok`, so there is no push
# trigger: re-running the same checks on the squash merge would be redundant.
# The shared caches that PRs restore (setup-go, setup-bazel and actions/cache
# scopes) are warmed after merge by `deploy-home`'s `warm-caches` job, which
# runs on `push` to `develop` without secrets or an Environment.
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # Computes the affected units. Cheap: no toolchains, only a Bazel loading
  # query for the Android graph and `go list` for Go dependencies.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go_units: ${{ steps.route.outputs.go_units }}
      android_units: ${{ steps.route.outputs.android_units }}
      python_units: ${{ steps.route.outputs.python_units }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      deploy_control: ${{ steps.route.outputs.deploy_control }}
      deploy_units: ${{ steps.route.outputs.deploy_units }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The base revision of a PR/previous push must be in history.
          fetch-depth: 0

      - name: Ensure base branch history
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install routing dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-test.txt

      # Pinned Bazelisk on PATH plus its own Bzlmod/repository caches: the
      # routing query only needs the external repositories, not action outputs.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # `workflow_dispatch` intentionally runs every unit.
      - name: Route affected units
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA}}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 platform/ci/affected.py --all --format github \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 platform/ci/affected.py --base "$base" \
              --format github | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # Repository-wide gates: audit, static checks, unit-map invariants, Gitleaks.
  # Cheap and always worth running, even for documentation-only changes.
  quality:
    needs: changes
    if: always()
    uses: ./.github/workflows/_quality.yml

  # One matrix entry per affected Go unit: scheduler, currency-bot, ha-bridge,
  # alarm, ble-gateway or the shared packages.
  go:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.go_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.go_units) }}
    uses: ./.github/workflows/_go.yml
    with:
      unit: ${{ matrix.id }}
      workdir: ${{ matrix.workdir }}
      packages: ${{ matrix.packages }}
      race: ${{ matrix.race }}
      build_packages: ${{ matrix.build_packages }}
      deploy_control: false

  # One matrix entry per affected application or shared Kotlin library unit.
  android:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.android_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.android_units) }}
    uses: ./.github/workflows/_android.yml
    with:
      unit: ${{ matrix.id }}
      test_targets: ${{ matrix.test_targets }}
      build_targets: ${{ matrix.build_targets }}
      universe: ${{ matrix.universe }}
      artifact: ${{ matrix.artifact }}
      artifact_name: ${{ matrix.artifact_name }}
      base_sha: ${{ needs.changes.outputs.base_sha }}
      precise_targets: true

  # Firebase App Distribution of the Home Android app on every PR that changes
  # it: one APK per push, after that PR's `android` build passed.
  #
  # Deliberately NOT a dependency of `ci-ok`: distribution is a delivery
  # side effect, not a code gate. A failed upload stays visible on the PR (and
  # in the run) without blocking the merge.
  #
  # Only same-repository PR branches run it: a fork's `pull_request` run gets a
  # read-only token and no Environment secrets, so it could never log in to
  # OpenBao, and `pull_request_target` is not used anywhere. `environment:
  # Android` plus the OIDC claims bound in the OpenBao role (`repository`,
  # `environment`, `ref=refs/pull/*/merge`, `job_workflow_ref=<repo>/.github/
  # workflows/ci.yml@refs/pull/*/merge`, `event_name=pull_request`) are the
  # trust boundary; the Environment itself must allow PR head branches.
  #
  # The checkout is the default pull_request merge ref, so the APK is built
  # from the merge of the PR into `develop`.
  android-distribute:
    needs: [changes, android]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.android.result == 'success' &&
      contains(fromJSON(needs.changes.outputs.android_units).*.id, 'android-app')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # OIDC `environment` claim keeps this exact casing; OpenBao binds "Android".
    environment: Android
    permissions:
      contents: read
      # Request the OIDC token that OpenBao's auth/github role trusts.
      id-token: write
    # A newer push to the same PR supersedes the upload in flight; the previous
    # run's APK is stale by definition.
    concurrency:
      group: android-distribute-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BAZELISK_VERSION: "1.30.0"
      # Public DNS name of the VPN and the OpenBao address are private values:
      # they live in the `Android` Environment, not in this file.
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}
      # Release-note inputs for `distribute.sh --ci`. Passed as environment
      # data, never interpolated into the script body, so a PR title cannot
      # inject shell.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Pinned Bazelisk on PATH, plus its Bzlmod/repository caches (same as
      # `_android.yml`).
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: ${{ env.BAZELISK_VERSION }}
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Restore-only: reuse the warm disk cache the `android` job (_android.yml)
      # maintains on develop, so this rebuild only redoes the actions the
      # personal key, google-services and versionCode change (resources,
      # manifest, packaging, signing) instead of compiling from scratch.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/target-determinator
          key: bazel-android-android-app-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion', 'projects/mobile/android/maven_install.json') }}
          restore-keys: |
            bazel-android-android-app-${{ runner.os }}-

      # setup-android accepts the SDK licenses by default; install exactly the
      # platform/build-tools pinned in MODULE.bazel.
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # No official action exists for openconnect; the runner image has none.
      # The VPN steps below mirror deploy-home's minimal connect/health-check
      # sequence; they are duplicated rather than extracted so a change here
      # cannot alter the working home deployment job.
      - name: Install VPN client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openconnect vpnc-scripts curl

      - name: Materialise VPN credentials
        env:
          IN_VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
          IN_VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          CI_DIR="$RUNNER_TEMP/ci"
          rm -rf "$CI_DIR"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$IN_VPN_CERT_P12_B64" | base64 -d > "$CI_DIR/ci.p12"
          printf '%s' "$IN_VPN_CERT_PASSWORD" > "$CI_DIR/ci.pass"
          chmod 600 "$CI_DIR"/*
          echo "VPN credentials prepared"

      - name: Connect VPN (group ci)
        run: |
          set -euo pipefail
          CI_DIR="$RUNNER_TEMP/ci"
          test -n "$OPENBAO_ADDR"
          # shellcheck disable=SC2024 # the log is user-writable; only openconnect is root
          sudo openconnect \
            --no-dtls \
            --certificate "$CI_DIR/ci.p12" \
            --passwd-on-stdin \
            --authgroup ci \
            --pid-file "$RUNNER_TEMP/openconnect.pid" \
            "${VPN_SERVER%/}" \
            < "$CI_DIR/ci.pass" > "$RUNNER_TEMP/openconnect.log" 2>&1 &
          for _ in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              "$OPENBAO_ADDR/v1/sys/health" || true)
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "OpenBao reachable over the VPN"
              exit 0
            fi
            sleep 2
          done
          echo "OpenBao is not reachable over the VPN" >&2
          tail -n 40 "$RUNNER_TEMP/openconnect.log" >&2 || true
          exit 1

      # GitHub OIDC -> OpenBao (auth/github, JWT audience = OPENBAO_ADDR). The
      # action masks every line of every value and exposes them as step outputs
      # only (`exportEnv: false`), so they do not leak into later steps' env.
      - name: Read Android signing secrets from OpenBao
        id: openbao
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.OPENBAO_ADDR }}
          method: jwt
          path: github
          role: android-distribute
          jwtGithubAudience: ${{ env.OPENBAO_ADDR }}
          exportEnv: false
          secrets: |
            secret/data/ci/android-distribute keystore_b64 | KEYSTORE_B64 ;
            secret/data/ci/android-distribute keystore_password | KEYSTORE_PASSWORD ;
            secret/data/ci/android-distribute google_services_json | GOOGLE_SERVICES_JSON ;
            secret/data/ci/android-distribute firebase_service_account_json | FIREBASE_SERVICE_ACCOUNT_JSON

      # Materialise the private files into the checkout and $RUNNER_TEMP. The
      # Bazel genrules pick up platform/android/keys/* exactly like the local
      # symlinks do. Nothing here prints a value.
      - name: Materialise Android signing files
        env:
          KEYSTORE_B64: ${{ steps.openbao.outputs.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ steps.openbao.outputs.KEYSTORE_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ steps.openbao.outputs.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ steps.openbao.outputs.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          KEYS_DIR="platform/android/keys"
          CI_DIR="$RUNNER_TEMP/ci"
          for value in KEYSTORE_B64 KEYSTORE_PASSWORD GOOGLE_SERVICES_JSON \
                       FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!value:-}" ]]; then
              echo "OpenBao returned an empty $value" >&2
              exit 1
            fi
          done
          # rules_android signs debug APKs with `--ks-pass pass:android`.
          # Fail before building if the stored password drifted from that
          # contract, without printing either value.
          if [[ "$KEYSTORE_PASSWORD" != "android" ]]; then
            echo "keystore_password must be 'android' for the Bazel signing flow" >&2
            exit 1
          fi
          mkdir -p "$KEYS_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYS_DIR/home-debug.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$KEYS_DIR/google-services.json"
          chmod 600 "$KEYS_DIR/home-debug.keystore" "$KEYS_DIR/google-services.json"
          mkdir -p "$CI_DIR"
          chmod 700 "$CI_DIR"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CI_DIR/firebase-sa.json"
          chmod 600 "$CI_DIR/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CI_DIR/firebase-sa.json" >> "$GITHUB_ENV"
          echo "Android signing files prepared"

      # The OpenBao token is short-lived and Maven/Firebase use the public
      # internet, so the private network is no longer needed.
      - name: Disconnect VPN
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/ci/ci.p12" "$RUNNER_TEMP/ci/ci.pass"
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "VPN disconnected"

      - name: Build, verify and distribute
        run: |
          set -euo pipefail
          projects/mobile/android/distribute.sh --ci

      - name: Summary
        if: always()
        run: |
          {
            echo "### android-distribute"
            echo
            echo "- PR: #$PR_NUMBER"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key files and disconnect VPN
        if: always()
        run: |
          set +e
          rm -f platform/android/keys/home-debug.keystore \
                platform/android/keys/google-services.json
          rmdir platform/android/keys 2>/dev/null
          rm -rf "$RUNNER_TEMP/ci"
          if [[ -f "$RUNNER_TEMP/openconnect.pid" ]]; then
            sudo kill "$(sudo cat "$RUNNER_TEMP/openconnect.pid")" 2>/dev/null
          fi
          sudo pkill -f 'openconnect --no-dtls' 2>/dev/null
          rm -f "$RUNNER_TEMP/openconnect.log" "$RUNNER_TEMP/openconnect.pid"
          echo "temporary signing files removed"

  # One matrix entry per affected Python project suite.
  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.python_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.python_units) }}
    uses: ./.github/workflows/_python.yml
    with:
      unit: ${{ matrix.id }}
      suites: ${{ matrix.suites }}
      compile: ${{ matrix.compile }}

  # Container-image build for the affected deployable units. Build only: no
  # registry credentials and no push on pull requests. `deploy-home` performs
  # the actual build+push+roll on develop.
  images:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.deploy_units) }}
    uses: ./.github/workflows/_images.yml
    with:
      unit: ${{ matrix.id }}
      images: ${{ matrix.images }}
      builder: ${{ matrix.builder }}
      target_root: ${{ matrix.target_root }}

  # Expensive regression with real linux/amd64 release binaries. Only when the
  # scheduler, ha-bridge (ha-control) or the Kubernetes deployment changed.
  deploy-control:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy_control == 'true' }}
    uses: ./.github/workflows/_go.yml
    with:
      unit: deploy-control
      packages: ""
      deploy_control: true

  # Single required check for the branch ruleset. Green only when every
  # dispatched job succeeded or was legitimately skipped.
  ci-ok:
    if: always()
    needs: [changes, quality, go, android, python, images, deploy-control]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: platform/ci
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify every required job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 platform/ci/ci_gate.py
