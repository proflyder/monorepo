name: _images

# Reusable container-image build for one deployable CI unit. Called once per
# affected deployable unit from ci.yml.
#
#   bazel  - hermetic distroless images assembled by rules_oci from Rust
#            binaries (//projects/home/kubernetes/scheduler:<image>_image)
#   docker - Dockerfile-based images (the Hermes gateway), built reproducibly
#            through `projects/home-assistant/deploy/images/hermes/build.sh`
#   mixed  - one deploy unit with both kinds (the Hermes unit: `hermes` from a
#            Dockerfile plus several Bazel images listed in `bazel_images`)
#
# Build once, deploy the same bytes (DECISIONS 36): for a pull request from this
# repository (never a fork) the built images are also pushed to
# `ghcr.io/proflyder/<image>:tree-<git tree hash>` and their digests are attested
# with build provenance. The squash merge of that PR keeps the tree, so
# `deploy-home` deploys exactly these images instead of rebuilding them.
#
# Every deploy job also publishes (or reuses) the deploy CLI image
# `ghcr.io/proflyder/home-deploy` under the same tree tag. `deploy-home` extracts
# the binary from that image, so the deployment runner never compiles
# `home-deploy` itself.
#
# Fork pull requests and manual `workflow_dispatch` runs build only: their token
# is read-only, so they never receive registry credentials and never push.
#
# The Hermes Dockerfile build additionally uses a shared Buildx layer cache in
# `ghcr.io/proflyder/hermes:buildcache`. Every run reads it (the package is
# public, so even a fork PR without credentials can); only a job that already
# logs in with the write token exports it (`mode=max`). The cache only reuses a
# layer whose inputs hash identically, so it speeds up apt and `uv` without
# changing the reproducible manifest digest.
#
# Only the `images`/`attest` jobs of this file need registry, OIDC and
# attestation permissions; the caller grants them to this job alone.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id from platform/ci/units.mjs
        required: true
        type: string
      images:
        description: Space separated image names owned by the unit
        required: true
        type: string
      builder:
        description: Image builder (bazel, docker or mixed)
        required: false
        default: bazel
        type: string
      target_root:
        description: Bazel package owning the <image>_image targets (bazel)
        required: false
        default: ""
        type: string
      bazel_images:
        description: JSON map image -> Bazel package for a mixed unit
        required: false
        default: ""
        type: string
      push_tree_tag:
        description: Publish the built images under tree-<hash> and attest them
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  images:
    name: images / ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Push the tree-tagged images (`_push` targets / `docker push`).
      packages: write
    outputs:
      pushed: ${{ steps.collect.outputs.pushed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pushing a manifest needs credentials even for a public package (blobs
      # are readable anonymously, so a missing login only fails at the PUT).
      - name: Log in to GHCR
        if: inputs.push_tree_tag
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image identity is the git *tree*, not the commit: a pull request
      # builds its merge ref, whose tree equals the squash commit's tree as long
      # as `develop` did not move in between. `deploy-home` recomputes the same
      # tag from the deployed commit.
      - name: Compute the tree tag
        id: tree
        if: inputs.push_tree_tag
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve HEAD^{tree}: '$tree'" >&2
            exit 1
          fi
          echo "tag=tree-${tree}" >> "$GITHUB_OUTPUT"
          echo "- image identity: \`tree-${tree}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        if: inputs.builder == 'bazel' || inputs.builder == 'mixed'
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Build the deploy CLI once per job: the digest step below calls it instead
      # of spawning Python. It is the Rust crate (rules_rust writes the binary at
      # the target path).
      - name: Build deploy tooling
        if: inputs.builder == 'bazel' || inputs.builder == 'mixed'
        run: |
          set -euo pipefail
          bazel build //platform/deploy-rs:home-deploy
          binary="bazel-bin/platform/deploy-rs/home-deploy"
          test -x "$binary" || { echo "missing $binary" >&2; exit 1; }
          echo "HOME_DEPLOY=$PWD/$binary" >> "$GITHUB_ENV"

      # Buildx is what makes the Dockerfile image reproducible: with
      # `rewrite-timestamp=true` and a fixed SOURCE_DATE_EPOCH it normalises the
      # layer mtimes and the config `created`/`history` entries. Pinned like the
      # other actions.
      - name: Set up Buildx
        if: inputs.builder == 'docker' || inputs.builder == 'mixed'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build distroless images with Bazel
        if: inputs.builder == 'bazel'
        env:
          PUSH: ${{ inputs.push_tree_tag }}
          TREE_TAG: ${{ steps.tree.outputs.tag }}
        run: |
          set -euo pipefail
          read -r -a images <<< "${{ inputs.images }}"
          target_root="${{ inputs.target_root }}"
          if [[ "$target_root" != //* ]]; then
            echo "bazel unit without a //target_root: '$target_root'" >&2
            exit 2
          fi
          package="${target_root#//}"
          targets=()
          for image in "${images[@]}"; do
            targets+=("${target_root}:${image}_image")
          done
          bazel build "${targets[@]}" \
            --platforms=//platform/bazel:linux_amd64
          for image in "${images[@]}"; do
            layout="bazel-bin/${package}/${image}_image"
            digest=$("$HOME_DEPLOY" oci digest "$layout")
            repo="ghcr.io/proflyder/${image}"
            if [[ "$PUSH" == "true" ]]; then
              # The existing oci_push target stores the manifest byte-for-byte;
              # the helper fails unless the registry kept the built digest.
              platform/ci/push-image.sh bazel \
                --repository "$repo" \
                --target "${target_root}:${image}_push" \
                --digest "$digest" \
                --tag "$TREE_TAG"
              printf '%s=%s\n' "$image" "$digest" >> "$RUNNER_TEMP/pushed.txt"
              echo "- \`${image}\`: \`${repo}@${digest}\` (\`${TREE_TAG}\`)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`${image}\`: \`${repo}@${digest}\`" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Build Dockerfile images
        if: inputs.builder == 'docker'
        env:
          PUSH: ${{ inputs.push_tree_tag }}
          TREE_TAG: ${{ steps.tree.outputs.tag }}
          # Shared Buildx layer cache. It is read on every build — the package is
          # public, so the read works without credentials too — and written back
          # only when this job has the same GHCR login as the image push above.
          HERMES_CACHE_REF: ghcr.io/proflyder/hermes:buildcache
        run: |
          set -euo pipefail
          cache_args=(--cache-from "type=registry,ref=${HERMES_CACHE_REF}")
          if [[ "$PUSH" == "true" ]]; then
            cache_args+=(--cache-to "type=registry,ref=${HERMES_CACHE_REF},mode=max")
          fi
          read -r -a images <<< "${{ inputs.images }}"
          revision=$(tr -d '[:space:]' < projects/home-assistant/deploy/images/hermes/revision)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid hermes revision in projects/home-assistant/deploy/images/hermes/revision: '$revision'" >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            case "$image" in
              hermes)
                git clone --quiet --filter=blob:none \
                  https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-src"
                mkdir -p "$RUNNER_TEMP/hermes"
                git -C "$RUNNER_TEMP/hermes-src" archive "$revision" \
                  | tar -x -C "$RUNNER_TEMP/hermes"
                # One build command for PR CI and deploy-home (hermes/build.sh):
                # pinned base digests, the Debian snapshot and SOURCE_DATE_EPOCH
                # plus `rewrite-timestamp` keep the digest identical, so an
                # unchanged revision does not move the image or the rollout.
                if [[ "$PUSH" == "true" ]]; then
                  digest=$(projects/home-assistant/deploy/images/hermes/build.sh \
                    --context "$RUNNER_TEMP/hermes" \
                    --source-repo "$RUNNER_TEMP/hermes-src" \
                    --revision "$revision" \
                    --metadata-file "$RUNNER_TEMP/hermes-metadata.json" \
                    "${cache_args[@]}" \
                    --push --tag "ghcr.io/proflyder/hermes:${TREE_TAG}")
                  printf '%s=%s\n' "$image" "$digest" >> "$RUNNER_TEMP/pushed.txt"
                  echo "- \`${image}\`: \`ghcr.io/proflyder/${image}@${digest}\` (\`${TREE_TAG}\`)" \
                    | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  projects/home-assistant/deploy/images/hermes/build.sh \
                    --context "$RUNNER_TEMP/hermes" \
                    --source-repo "$RUNNER_TEMP/hermes-src" \
                    --revision "$revision" \
                    "${cache_args[@]}" \
                    --oci-dir "$RUNNER_TEMP/hermes-oci"
                  echo "- \`${image}\`: built, not published" | tee -a "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              *)
                echo "unknown docker image: $image" >&2
                exit 2
                ;;
            esac
          done

      # One deploy unit can own both image kinds. Every image listed in
      # `bazel_images` is built from that Bazel package; the rest are Dockerfile
      # builds. Today that is the Hermes unit: `voice-proxy`,
      # `health-exporter` and `home-deploy` from Bazel, `hermes` from the
      # upstream revision.
      - name: Build mixed images (Bazel + Dockerfile)
        if: inputs.builder == 'mixed'
        env:
          PUSH: ${{ inputs.push_tree_tag }}
          TREE_TAG: ${{ steps.tree.outputs.tag }}
          # Same shared Buildx cache as the docker-only job: read always, write
          # only with the write token that also pushes the tree-tagged image.
          HERMES_CACHE_REF: ghcr.io/proflyder/hermes:buildcache
        run: |
          set -euo pipefail
          cache_args=(--cache-from "type=registry,ref=${HERMES_CACHE_REF}")
          if [[ "$PUSH" == "true" ]]; then
            cache_args+=(--cache-to "type=registry,ref=${HERMES_CACHE_REF},mode=max")
          fi
          read -r -a images <<< "${{ inputs.images }}"
          bazel_images='${{ inputs.bazel_images }}'
          if [[ -z "$bazel_images" || "$bazel_images" == "{}" ]]; then
            echo "mixed unit without deploy.bazel_images" >&2
            exit 2
          fi
          revision=$(tr -d '[:space:]' < projects/home-assistant/deploy/images/hermes/revision)
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid hermes revision in projects/home-assistant/deploy/images/hermes/revision: '$revision'" >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            target_root=$(printf '%s' "$bazel_images" \
              | jq -r --arg image "$image" '.[$image] // ""')
            if [[ -n "$target_root" ]]; then
              if [[ "$target_root" != //* ]]; then
                echo "deploy.bazel_images.${image} is not a Bazel package: '$target_root'" >&2
                exit 2
              fi
              package="${target_root#//}"
              bazel build "${target_root}:${image}_image" \
                --platforms=//platform/bazel:linux_amd64
              layout="bazel-bin/${package}/${image}_image"
              digest=$("$HOME_DEPLOY" oci digest "$layout")
              repo="ghcr.io/proflyder/${image}"
              if [[ "$PUSH" == "true" ]]; then
                platform/ci/push-image.sh bazel \
                  --repository "$repo" \
                  --target "${target_root}:${image}_push" \
                  --digest "$digest" \
                  --tag "$TREE_TAG"
                printf '%s=%s\n' "$image" "$digest" >> "$RUNNER_TEMP/pushed.txt"
                echo "- \`${image}\`: \`${repo}@${digest}\` (\`${TREE_TAG}\`)" \
                  | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "- \`${image}\`: \`${repo}@${digest}\`" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              continue
            fi
            case "$image" in
              hermes)
                git clone --quiet --filter=blob:none \
                  https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-src"
                mkdir -p "$RUNNER_TEMP/hermes"
                git -C "$RUNNER_TEMP/hermes-src" archive "$revision" \
                  | tar -x -C "$RUNNER_TEMP/hermes"
                # One build command for PR CI and deploy-home (hermes/build.sh):
                # pinned base digests, the Debian snapshot and SOURCE_DATE_EPOCH
                # plus `rewrite-timestamp` keep the digest identical, so an
                # unchanged revision does not move the image or the rollout.
                if [[ "$PUSH" == "true" ]]; then
                  digest=$(projects/home-assistant/deploy/images/hermes/build.sh \
                    --context "$RUNNER_TEMP/hermes" \
                    --source-repo "$RUNNER_TEMP/hermes-src" \
                    --revision "$revision" \
                    --metadata-file "$RUNNER_TEMP/hermes-metadata.json" \
                    "${cache_args[@]}" \
                    --push --tag "ghcr.io/proflyder/hermes:${TREE_TAG}")
                  printf '%s=%s\n' "$image" "$digest" >> "$RUNNER_TEMP/pushed.txt"
                  echo "- \`${image}\`: \`ghcr.io/proflyder/${image}@${digest}\` (\`${TREE_TAG}\`)" \
                    | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  projects/home-assistant/deploy/images/hermes/build.sh \
                    --context "$RUNNER_TEMP/hermes" \
                    --source-repo "$RUNNER_TEMP/hermes-src" \
                    --revision "$revision" \
                    "${cache_args[@]}" \
                    --oci-dir "$RUNNER_TEMP/hermes-oci"
                  echo "- \`${image}\`: built, not published" | tee -a "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              *)
                echo "unknown mixed image: $image" >&2
                exit 2
                ;;
            esac
          done

      # The deploy CLI image is a language-independent artifact: `deploy-home`
      # extracts its binary from this image and never compiles the tool on a
      # deployment runner. It is published for every affected deployable unit
      # under the same tree tag, so every deploy has a verified, attested
      # `home-deploy` digest regardless of which unit triggered it (DECISIONS
      # 36). A unit whose own image list already contains `home-deploy`
      # (scheduler, hermes) built and pushed it in the loop above.
      - name: Publish the deploy CLI image
        if: >-
          inputs.push_tree_tag &&
          (inputs.builder == 'bazel' || inputs.builder == 'mixed')
        env:
          TREE_TAG: ${{ steps.tree.outputs.tag }}
          UNIT_IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          read -r -a images <<< "$UNIT_IMAGES"
          for image in "${images[@]}"; do
            if [[ "$image" == "home-deploy" ]]; then
              echo "- \`home-deploy\`: already built with the unit"
              exit 0
            fi
          done
          target_root="//projects/home/kubernetes/scheduler"
          package="${target_root#//}"
          bazel build "${target_root}:home-deploy_image" \
            --platforms=//platform/bazel:linux_amd64
          layout="bazel-bin/${package}/home-deploy_image"
          digest=$("$HOME_DEPLOY" oci digest "$layout")
          repo="ghcr.io/proflyder/home-deploy"
          platform/ci/push-image.sh bazel \
            --repository "$repo" \
            --target "${target_root}:home-deploy_push" \
            --digest "$digest" \
            --tag "$TREE_TAG"
          printf '%s=%s\n' home-deploy "$digest" >> "$RUNNER_TEMP/pushed.txt"
          echo "- \`home-deploy\`: \`${repo}@${digest}\` (\`${TREE_TAG}\`)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # JSON list for the attestation matrix: [{"image":…, "digest":…}].
      - name: Collect pushed image digests
        id: collect
        if: inputs.push_tree_tag
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/pushed.txt"
          if [[ ! -s "$file" ]]; then
            echo "pushed=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          json=$(jq -Rsc 'split("\n") | map(select(length > 0) | capture("^(?<image>[^=]+)=(?<digest>.+)$"))' "$file")
          echo "pushed=${json}" >> "$GITHUB_OUTPUT"

  # Build provenance for every pushed digest, stored in the registry next to the
  # image (push-to-registry). `deploy-home` refuses a promoted digest whose
  # provenance does not verify against this repository and these workflows.
  #
  # A matrix job because the action attests exactly one subject per invocation.
  attest:
    name: attest / ${{ inputs.unit }}
    needs: images
    if: >-
      inputs.push_tree_tag &&
      needs.images.result == 'success' &&
      needs.images.outputs.pushed != '' &&
      needs.images.outputs.pushed != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.pushed) }}
    steps:
      # attest-build-provenance v4 reads registry credentials from the Docker
      # config; it has no username/password inputs of its own.
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest ${{ matrix.image }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/proflyder/${{ matrix.image }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
