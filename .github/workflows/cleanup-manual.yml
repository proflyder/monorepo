name: cleanup (вручную)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только показать, что будет удалено, ничего не удаляя
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_cleanup.yml
    with:
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
