name: _ci

# Smart CI: only the platforms and units a change actually touches.
#
# `changes` routes the diff onto units from platform/ci/units.mjs (Android:
# Bazel reverse dependencies, Rust: the Bazel loading graph, Python/JS/native:
# path rules) and each platform then fans out a matrix of reusable workflows.
# The `gate` job reduces every job's result (green when each succeeded or was
# legitimately skipped) and exports it as `ok`/`failing`; the caller's `ci-ok`
# job is the single required check that publishes it.
#
# No deploy steps and no repository secrets: deploy workflows are separate and
# only run from `develop` with Environments. The single exception is the
# `android-app` entry of `_android.yml`, which builds the distributable APK
# once without secrets, and the `android-distribute` call of
# `_android-release.yml`, which signs and uploads that artifact to Firebase.
#
# Reusable pipeline (`workflow_call`), called by exactly two thin wrappers with
# one trigger each: `ci.yml` (`pull_request`, the required `ci-ok` check) and
# `ci-manual.yml` (`workflow_dispatch`, every unit). The caller states its event
# through inputs (`mode`, `same_repository`, `distribution`) — never through
# `github.event_name`, which would describe the caller's workflow file instead
# of this one.
#
# `develop` changes only through a PR with a green `ci-ok`, so there is no push
# trigger: re-running the same checks on the squash merge would be redundant.
# The caches that PRs restore (the Rust repository archive and the per-family
# Bazel disk caches) are warmed after merge by `deploy-home`'s
# `warm-android` / `warm-rust` jobs, which run on `push` to `develop` without
# secrets or an Environment. Pull requests never write caches: GitHub scopes
# them to the writing ref, so a PR-written entry is invisible to other PRs and
# only spends the repository's 10 GB budget.
on:
  workflow_call:
    inputs:
      mode:
        description: >-
          `pull_request` routes the diff of the PR base; `all` runs every unit
          (the manual entry point).
        required: false
        default: pull_request
        type: string
      same_repository:
        description: >-
          The calling event is a PR from this repository, so publishing a
          `tree-<hash>` image/artifact is allowed (forks and manual runs build
          only).
        required: false
        default: false
        type: boolean
      distribution:
        description: >-
          Distribute the built APK to Firebase App Distribution (PR CI only;
          the manual release workflow does this through its own call).
        required: false
        default: false
        type: boolean
      pr_number:
        description: Pull request number for the distribution release notes
        required: false
        default: ""
        type: string
      pr_title:
        description: Pull request title for the distribution release notes
        required: false
        default: ""
        type: string
    # Declared for documentation; the caller passes `secrets: inherit`.
    secrets:
      NEXUS_CI_PASSWORD:
        required: false
      VPN_SERVER:
        required: false
      VPN_CERT_P12_B64:
        required: false
      VPN_CERT_PASSWORD:
        required: false
      OPENBAO_ADDR:
        required: false
    # The gate computes the aggregate answer here (it is the only place that
    # sees every job's `needs`); the caller's `ci-ok` job publishes it as the
    # required check, because a called workflow's check names would otherwise
    # be prefixed with the caller job and branch protection would break.
    outputs:
      ok:
        value: ${{ jobs.gate.outputs.ok }}
      failing:
        value: ${{ jobs.gate.outputs.failing }}

permissions:
  contents: read

env:
  # Set Git's default branch for actions/checkout's `git init` (it warns when unset;
  # it runs under a throwaway HOME, so only an env-provided config reaches it).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Computes the affected units. Cheap: no toolchains, only a Bazel loading
  # query for the Android and Rust graphs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android_units: ${{ steps.route.outputs.android_units }}
      unit_units: ${{ steps.route.outputs.unit_units }}
      python_units: ${{ steps.route.outputs.python_units }}
      js_units: ${{ steps.route.outputs.js_units }}
      native_units: ${{ steps.route.outputs.native_units }}
      base_sha: ${{ steps.route.outputs.base_sha }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      deploy_control: ${{ steps.route.outputs.deploy_control }}
      android_distribute: ${{ steps.route.outputs.android_distribute }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base revision of a PR/previous push must be in history.
          fetch-depth: 0

      - name: Ensure base branch history
        if: inputs.mode == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref || 'develop' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # Pinned Bazelisk on PATH plus its own Bzlmod/repository caches: the
      # routing query needs the Rust repositories; the Android graph only loads
      # BUILD files, so its downloads (direct, Nexus only as a fallback) need no
      # develop cache.
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # v0.19.1
        with:
          bazelisk-version: "1.30.0"
          bazelisk-cache: true
          repository-cache: false
          cache-save: ${{ inputs.mode != 'pull_request' }}

      - uses: ./.github/actions/bazel-repository-cache
        with:
          key: bazel-repo-rust-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion', 'Cargo.lock', 'crate-universe.lock', 'rust-toolchain.toml') }}
          restore-prefix: bazel-repo-rust-${{ runner.os }}-

      # `pull_request.base.sha` is the base at event creation, not necessarily
      # the develop tip the checked-out `refs/pull/N/merge` commit was built
      # on. Using it directly pulls files from other PRs merged in between into
      # the base..merge diff and routes unrelated units. The first parent of the
      # merge commit is the actual base tip; fall back to the event value if the
      # ref is not a merge commit.
      - name: Resolve pull request base
        id: pr-base
        if: inputs.mode == 'pull_request'
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            base=$(git rev-parse HEAD^1)
          else
            base=$EVENT_BASE_SHA
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # `mode: all` (the manual entry point) intentionally runs every unit.
      - name: Route affected units
        id: route
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ${{ inputs.mode }}
          PR_BASE_SHA: ${{ steps.pr-base.outputs.sha }}
        with:
          script: |
            const affected = await import(`${process.env.GITHUB_WORKSPACE}/platform/ci/affected.mjs`);
            const argv = process.env.MODE === 'all'
              ? ['--all', '--format', 'github']
              : ['--base', process.env.PR_BASE_SHA || '', '--format', 'github'];
            await affected.runGithubScript({ core, argv });

  # Repository-wide gates: audit, static checks, unit-map invariants, Gitleaks.
  # Cheap and always worth running, even for documentation-only changes.
  quality:
    needs: changes
    if: always()
    uses: ./.github/workflows/_quality.yml

  # One matrix entry per affected application or shared Kotlin library unit,
  # plus the dedicated `android-lint` and `android-detekt` units. Both checks
  # run as their own job so a finding fails only that matrix entry instead of
  # aborting the app's `bazel test` and hiding the other tests' results.
  #
  # Every entry runs its declared targets: Bazel's action/test cache skips
  # tests the change does not affect, so no separate narrowing job is needed.
  #
  # `_android.yml` builds and tests the distributable APK inside the
  # `android-app` entry without any secret or Environment; signing happens in
  # `android-distribute`.
  android:
    name: android / ${{ matrix.id }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.android_units != '[]' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.android_units) }}
    uses: ./.github/workflows/_android.yml
    with:
      unit: ${{ matrix.id }}
      test_targets: ${{ matrix.test_targets }}
      build_targets: ${{ matrix.build_targets }}
      sdk_packages: ${{ matrix.sdk_packages }}
      artifact: ${{ matrix.artifact }}
      artifact_name: ${{ matrix.artifact_name }}
      save_cache: ${{ inputs.mode != 'pull_request' }}
    secrets:
      NEXUS_CI_PASSWORD: ${{ secrets.NEXUS_CI_PASSWORD }}

  # One matrix entry per affected Linux unit. The same job runs the unit's
  # checks and, for a deploy unit, its container images in one Bazel server
  # (`_unit.yml`), then pushes tree-tagged images and attests them in place.
  # `kind` is `bazel` for the Rust/Bazel units and `python` for a Python unit
  # that owns images (Hermes, whose mixed Buildx path stays in this job).
  unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.unit_units != '[]' }}
    permissions:
      contents: read
      # Push the tree-tagged images and sign their provenance. The same
      # conditions as the former `images` job: only a same-repository PR (or
      # the caller's `push_tree_tag`) reaches the registry; forks and a manual
      # dispatch only build.
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.unit_units) }}
    uses: ./.github/workflows/_unit.yml
    with:
      unit: ${{ matrix.id }}
      kind: ${{ matrix.kind }}
      test_targets: ${{ matrix.test_targets }}
      build_targets: ${{ matrix.build_targets }}
      artifact: ${{ matrix.artifact }}
      artifact_name: ${{ matrix.artifact_name }}
      suites: ${{ matrix.suites }}
      compile: ${{ matrix.compile }}
      deploy_tool: ${{ matrix.deploy_tool }}
      images: ${{ matrix.images }}
      image_list: ${{ matrix.image_list }}
      image_count: ${{ matrix.image_count }}
      builder: ${{ matrix.builder }}
      target_root: ${{ matrix.target_root }}
      bazel_images: ${{ matrix.bazel_images }}
      push_tree_tag: ${{ inputs.same_repository }}
      save_cache: ${{ inputs.mode != 'pull_request' }}
    secrets:
      NEXUS_CI_PASSWORD: ${{ secrets.NEXUS_CI_PASSWORD }}

  # Firebase App Distribution of the Home Android app on every PR that changes
  # it: the `android-app` matrix entry builds and tests exactly one APK
  # (`android-app-apk`, no secrets involved); this job signs those bytes with the
  # release key and uploads them. There is no second build, so a tester
  # installs what CI tested. Sign + upload live in `_android-release.yml`, the
  # one place both this pipeline and the manual `android-release.yml` use.
  #
  # `android_distribute` is true only for a real Android input (the app, the
  # shared Kotlin libraries it builds, or `platform/android/**`). A global
  # invalidation such as `MODULE.bazel` still runs the `android` checks but does
  # not change the app, so it must not publish a build.
  #
  # The whole `android` matrix must be green, so an `android-lint` or
  # `android-detekt` finding also skips distribution. Lint and detekt gate the
  # APK deliberately: a finding means the application code is not acceptable,
  # and the PR still shows the exact `android / android-lint` or
  # `android / android-detekt` failure.
  #
  # Deliberately NOT a dependency of `ci-ok`: distribution is a delivery
  # side effect, not a code gate. A failed upload stays visible on the PR (and
  # in the run) without blocking the merge.
  #
  # Only a same-repository PR with `distribution: true` reaches it: a fork's
  # `pull_request` run gets a read-only token and no Environment secrets, so it
  # could never log in to OpenBao, and `pull_request_target` is not used
  # anywhere. `environment: Android` (inside the reusable workflow) plus the
  # OIDC claims bound in the OpenBao role (`repository`, `environment`,
  # `ref=refs/pull/*/merge`, `job_workflow_ref=<repo>/.github/workflows/
  # _android-release.yml@refs/pull/*/merge`, `event_name=pull_request`) are the
  # trust boundary; the Environment itself must allow PR head branches.
  android-distribute:
    needs: [changes, android]
    if: >-
      !cancelled() &&
      inputs.distribution &&
      needs.changes.result == 'success' &&
      needs.android.result == 'success' &&
      needs.changes.outputs.android_distribute == 'true'
    permissions:
      contents: read
      # Request the OIDC token that OpenBao's auth/github role trusts.
      id-token: write
    # A newer push to the same PR supersedes the upload in flight; the previous
    # run's APK is stale by definition.
    concurrency:
      group: android-distribute-${{ inputs.pr_number }}
      cancel-in-progress: true
    uses: ./.github/workflows/_android-release.yml
    with:
      openbao_role: android-distribute
      pr_number: ${{ inputs.pr_number }}
      pr_title: ${{ inputs.pr_title }}
      label: "PR #${{ inputs.pr_number }}"
    secrets:
      VPN_SERVER: ${{ secrets.VPN_SERVER }}
      VPN_CERT_P12_B64: ${{ secrets.VPN_CERT_P12_B64 }}
      VPN_CERT_PASSWORD: ${{ secrets.VPN_CERT_PASSWORD }}
      OPENBAO_ADDR: ${{ secrets.OPENBAO_ADDR }}

  # One job for all affected Python units. It runs their `mise run test <id>`
  # commands sequentially after one checkout/setup; the old per-unit matrix
  # spent most of its time on runner and mise setup. A failure still names the
  # failing units and turns the job red.
  python:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.python_units != '[]' }}
    uses: ./.github/workflows/_python.yml
    with:
      units: ${{ needs.changes.outputs.python_units }}

  # One matrix entry per affected JavaScript edge Worker unit.
  js:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.js_units != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.js_units) }}
    uses: ./.github/workflows/_js.yml
    with:
      unit: ${{ matrix.id }}
      tests: ${{ matrix.tests }}

  # One matrix entry per affected native build: the Windows logon provider
  # (Bazel + rules_rust, hermetic zig toolchain for x86_64-pc-windows-gnu) and
  # the Rust Pulsar tree (Bazel for both arches, installer, radio, ssh; host
  # fmt/clippy/tests are the pulsar-bazel unit). Build, checksums and artifact
  # upload; on a PR from this repository (never a fork) `_native.yml` also
  # publishes the
  # release-shaped artifact as `tree-<hash>` with build provenance, so the merge
  # deploys the bytes this PR tested (DECISIONS 36). Fork PRs only build.
  #
  # Registry/OIDC/attestation permissions are granted to this job alone; every
  # other job stays `contents: read`.
  native:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native_units != '[]' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      # `_native.yml` promote reads the merged PR (PR-head fallback); a called
      # workflow cannot request more than its caller grants.
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.native_units) }}
    uses: ./.github/workflows/_native.yml
    with:
      unit: ${{ matrix.id }}
      kind: ${{ matrix.kind }}
      workdir: ${{ matrix.workdir }}
      build: ${{ matrix.build }}
      test: ${{ matrix.test }}
      artifacts: ${{ matrix.artifacts }}
      checksums: ${{ matrix.checksums }}
      publish_repository: ${{ matrix.publish_repository }}
      publish_tags: ${{ matrix.publish_tags }}
      publish_script: ${{ matrix.publish_script }}
      publish_attest_glob: ${{ matrix.publish_attest_glob }}
      promote: false
      push_tree_tag: ${{ inputs.same_repository }}
      save_cache: ${{ inputs.mode != 'pull_request' }}
    secrets:
      NEXUS_CI_PASSWORD: ${{ secrets.NEXUS_CI_PASSWORD }}

  # Expensive regression with real linux/amd64 release binaries. Only when the
  # scheduler, ha-bridge (ha-control) or the Kubernetes deployment changed.
  deploy-control:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.deploy_control == 'true' }}
    uses: ./.github/workflows/_deploy-control.yml
    with:
      save_cache: ${{ inputs.mode != 'pull_request' }}


  # Aggregate result of the pipeline. Green only when every dispatched job
  # succeeded or was legitimately skipped; the wrapper's `ci-ok` check turns
  # this into the required status, so the run still shows exactly which job
  # failed.
  gate:
    needs: [changes, quality, android, unit, python, js, native, deploy-control]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
      failing: ${{ steps.gate.outputs.failing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: platform/ci
      - name: Evaluate the pipeline jobs
        id: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node platform/ci/ci_gate.mjs --github-output
