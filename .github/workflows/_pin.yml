name: _pin

on:
  workflow_call:
    inputs:
      unit:
        description: Deployable unit id from platform/ci/units.mjs
        required: true
        type: string
      images:
        description: Space separated image names the unit pins
        required: true
        type: string
      optional_images:
        description: Space separated sibling images that may come from history
        required: false
        default: ""
        type: string
      allow_history:
        description: Walk the first-parent lineage for the newest verified tree (manual dispatch)
        required: false
        default: false
        type: boolean
      allow_pr_head:
        description: Accept the merged PR head tree when develop moved (push)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CRANE_VERSION: "v0.22.1"
  CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  pins:
    name: pins ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      attestations: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pinned crane
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/crane_${CRANE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote PR-built images by tree hash
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ inputs.images }}
          OPTIONAL_IMAGES: ${{ inputs.optional_images }}
          ALLOW_HISTORY: ${{ inputs.allow_history && '1' || '0' }}
          ALLOW_PR_HEAD: ${{ inputs.allow_pr_head && '1' || '0' }}
          UNIT: ${{ inputs.unit }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse "${DEPLOY_COMMIT}^{tree}") || {
            echo "::error::cannot resolve the tree of ${DEPLOY_COMMIT}" >&2
            exit 1
          }
          history_args=()
          if [[ "$ALLOW_HISTORY" == "1" || -n "$OPTIONAL_IMAGES" ]]; then
            history_args=(--history-limit 200)
          fi
          if [[ "$ALLOW_HISTORY" == "1" ]]; then
            history_args+=(--allow-history)
          fi
          pr_head_args=()
          if [[ "$ALLOW_PR_HEAD" == "1" ]]; then
            pr_head_args=(--allow-pr-head --unit "$UNIT")
          fi
          if ! node platform/ci/promote.mjs \
            --images "$IMAGES" \
            --optional-images "$OPTIONAL_IMAGES" \
            "${history_args[@]}" \
            "${pr_head_args[@]}" \
            --tree "$tree" \
            --commit "$DEPLOY_COMMIT" \
            --repository "${GITHUB_REPOSITORY}"; then
            echo "::error::image promotion failed for the pins job; see the job summary" >&2
            exit 1
          fi
          if ! grep -qx 'mode=prebuilt' "$GITHUB_OUTPUT"; then
            echo "::error::no verified image set to pin (commit ${DEPLOY_COMMIT}, tree ${tree})" >&2
            exit 1
          fi

      - name: Commit ${{ inputs.unit }} digests to deploy/home-apps
        env:
          UNIT: ${{ inputs.unit }}
          IMAGES: ${{ inputs.images }}
          DIGESTS: ${{ steps.promote.outputs.prebuilt_digests }}
          DEPLOY_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse "${DEPLOY_COMMIT}^{tree}")
          node platform/ci/pins.mjs \
            --unit "$UNIT" \
            --images "$IMAGES" \
            --digests "$DIGESTS" \
            --commit "$DEPLOY_COMMIT" \
            --tree "$tree" \
            --run "$RUN_URL" \
            --branch deploy/home-apps

      - name: Summary
        if: always()
        run: |
          set +e
          {
            echo "### pin / ${{ inputs.unit }}"
            echo
            echo "- applies: \`flux\` (Flux reads \`deploy/home-apps\`)"
            echo "- event: \`$GITHUB_EVENT_NAME\`"
            echo "- images: \`${{ inputs.images }}\`"
            echo "- digests: \`${{ steps.promote.outputs.prebuilt_digests }}\`"
            echo "- pins commit: \`${GITHUB_SHA:0:12}\` re-tagged to this unit's images"
          } >> "$GITHUB_STEP_SUMMARY"

