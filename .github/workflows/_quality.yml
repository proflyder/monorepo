name: _quality

# Reusable repository gate: audit, static gates, unit-map invariants, workflow
# linting and secret scanning. Cheap enough to run on every change, including
# documentation-only ones, which is why it is never routed away.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every gate runs through the same mise task a workstation uses; tools come
    # from mise-action's install_args, never from `mise run` itself.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tool versions and checksums: mise.toml + mise.lock (one source with the
      # workstation). Only the tools this job needs are installed.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install_args: "python node shellcheck gitleaks actionlint"
          cache: true

      # Python is kept only for the static gate that parses first-party Python
      # product scripts (platform/quality/test_static.py); all CI/repo-quality
      # glue is dependency-free Node ESM.
      - name: Repository audit (private data, links, gitlinks)
        run: mise run audit

      # Python remains only for first-party Python product checks (the static
      # gate). Deploy tooling is Go and is covered by the platform-deploy unit.
      - name: Python product gates (syntax, shellcheck, secret patterns)
        run: mise run test:static

      - name: CI unit map is valid and every source/test file is routed
        run: mise run ci:units

      - name: CI routing and gate tests
        run: mise run test:ci

      - name: Shellcheck (harness, CI scripts and deployment scripts)
        run: mise run lint:shell

      - name: actionlint (all workflows)
        run: mise run lint:actions

      - name: Gitleaks (working tree; version and checksum from mise.lock)
        run: mise run scan:secrets
