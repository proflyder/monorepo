[package]
name = "intercom"
description = "WebRTC signaling service for phone <-> station calls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "intercom"
path = "src/lib.rs"

[[bin]]
name = "intercom"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
connectrpc = { workspace = true }
futures-util = { workspace = true }
home-config = { path = "../../../../packages/rust/home-config" }
home-http = { path = "../../../../packages/rust/home-http" }
home-proto = { path = "../../../../packages/rust/home-proto" }
home-runtime = { path = "../../../../packages/rust/home-runtime" }
home-secret = { path = "../../../../packages/rust/home-secret" }
home-telemetry = { path = "../../../../packages/rust/home-telemetry" }
http = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
