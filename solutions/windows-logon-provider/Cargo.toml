[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

# Dependencies are pinned exactly; Cargo.lock and crate-universe.lock are the
# sources of truth for cargo and Bazel respectively.
[workspace.dependencies]
hmac = "=0.13.0"
sha2 = "=0.11.1"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["derive"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
] }

# The credential provider is loaded into LogonUI, so the release profile stays
# close to the former C++ build (-O2/-O3) but keeps unwinding: panics cross the
# COM boundary through catch_unwind and must not abort the logon UI.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
strip = "none"
