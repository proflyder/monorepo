[package]
name = "cp_selftest"
description = "cp-selftest.exe: loads the Home Komp Logon credential provider outside LogonUI"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cp-selftest"
path = "src/main.rs"

# The self-test is a Windows executable; the host build compiles only the stub
# in `src/main.rs` so `cargo clippy --all-targets` still works on macOS/Linux.
[target.'cfg(windows)'.dependencies]
windows-core = { workspace = true }
windows-link = { workspace = true }

[lints]
workspace = true
