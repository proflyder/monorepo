[package]
name = "logon_provider"
description = "Windows Credential Provider (COM in-proc server) for Ricardo Komp Logon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
logon_protocol = { path = "../protocol" }

# Windows-only modules use the generated `src/bindings.rs`; on other hosts
# only the portable core is compiled.
[target.'cfg(windows)'.dependencies]
windows-core = { workspace = true }
windows-link = { workspace = true }

[lints]
workspace = true
