[package]
name = "ha-config-sync"
description = "Delivers managed Home Assistant YAML through a forced-command SSH agent and self-heals drift"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ha_config_sync"
path = "src/lib.rs"

[[bin]]
name = "ha-config-sync"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
forced-ssh = { path = "../../../../packages/rust/forced-ssh" }
futures = { workspace = true }
hex = { workspace = true }
home-ha = { path = "../../../../packages/rust/home-ha" }
home-secret = { path = "../../../../packages/rust/home-secret" }
regex = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
