[package]
name = "phone-push"
description = "FCM HTTP v1 delivery for the owner's phone: find-phone and notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "phone_push"
path = "src/lib.rs"

[[bin]]
name = "phone-push"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
home-config = { path = "../../../../packages/rust/home-config" }
home-http = { path = "../../../../packages/rust/home-http" }
home-runtime = { path = "../../../../packages/rust/home-runtime" }
home-secret = { path = "../../../../packages/rust/home-secret" }
home-telemetry = { path = "../../../../packages/rust/home-telemetry" }
home-tls = { path = "../../../../packages/rust/home-tls" }
http = { workspace = true }
jiff = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
