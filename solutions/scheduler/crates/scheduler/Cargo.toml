version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "scheduler"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
connectrpc = { workspace = true }
home-proto = { path = "../../../../packages/rust/home-proto" }
