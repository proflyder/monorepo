[package]
name = "ha-bridge"
description = "Home Assistant executor for the durable scheduler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ha_bridge"
path = "src/lib.rs"

[[bin]]
name = "ha-bridge"
path = "src/main.rs"

[[bin]]
name = "ha-control"
path = "src/ha_control.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
home-config = { path = "../../../../packages/rust/home-config" }
home-ha = { path = "../../../../packages/rust/home-ha" }
home-http = { path = "../../../../packages/rust/home-http" }
home-proto = { path = "../../../../packages/rust/home-proto" }
home-runtime = { path = "../../../../packages/rust/home-runtime" }
home-secret = { path = "../../../../packages/rust/home-secret" }
home-telemetry = { path = "../../../../packages/rust/home-telemetry" }
home-worker = { path = "../../../../packages/rust/home-worker" }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
home-contracttest = { path = "../../../../packages/rust/home-contracttest" }
tempfile = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
