# Workstation and CI toolchain — the single source of tool versions.
#
#   mise trust && mise run setup     # new machine: tools, OpenBao login, SSH, checks
#   mise run doctor                  # what is missing
#
# CI installs the subset each job needs with jdx/mise-action (install_args).
# Checksums are pinned in mise.lock (linux-x64, macos-arm64): `mise lock` after
# a version bump. Bazel itself stays hermetic (.bazelversion, MODULE.bazel).
min_version = "2026.6.0"

# File tasks: build/test/coverage/check and the CI unit dispatcher. They live in
# their own scripts so the entry points stay executable and testable.
[task_config]
includes = ["platform/mise-tasks"]

[settings]
lockfile = true

[tools]
python = "3.13.18"
node = "22.23.4"
go = "1.27.3"
bazelisk = "1.30.0"
gitleaks = "8.30.1"
actionlint = "1.7.12"
kubectl = "1.35.0"
helm = "4.1.4"
oras = "1.3.6"
# aqua registry expects bao_* assets; OpenBao publishes openbao_* archives.
"github:openbao/openbao" = { version = "2.7.2", bin = "bao" }
gh = "2.103.3"
shellcheck = "0.11.0"
restic = "0.19.1"
# packages/rust/home-proto/generate.sh (checked-in output matches 33.4)
protoc = "33.4"
"npm:@bitwarden/cli" = "2026.10.1"

[env]
# `bazel` shim → bazelisk, so scripts that call `bazel` work everywhere.
_.path = ["{{config_root}}/platform/workstation/bin"]
# Non-secret OpenBao address for the `bao` CLI (written by secrets:login).
_.source = { path = "{{config_root}}/platform/workstation/env.sh", tools = false }

[tasks.setup]
description = "New machine: install tools, log in to OpenBao, pull SSH keys and notes, check"
run = [
  "mise install",
  "mise run secrets:login",
  "mise run secrets:pull",
  "mise run doctor",
]

[tasks.doctor]
description = "Check tools, OpenBao token, SSH to pve/k3s/haos and gh login"
run = "platform/workstation/run.sh platform/workstation/workstation.py doctor"

[tasks."secrets:login"]
description = "Human OpenBao login (password + TOTP) → operator token for this machine"
run = "platform/workstation/run.sh platform/workstation/workstation.py login"

[tasks."secrets:pull"]
description = "SSH keys and config into ~/.ssh/home-lab, private notes into secrets/"
run = "platform/workstation/run.sh platform/workstation/workstation.py pull"

[tasks."secrets:file"]
description = "Restore legacy secrets/<file> from OpenBao (0600), e.g. home/ingress.env"
run = "platform/workstation/run.sh platform/workstation/workstation.py file"

[tasks."secrets:clean"]
description = "Remove files restored by secrets:file"
run = "platform/workstation/run.sh platform/workstation/workstation.py clean"

[tasks."secrets:check"]
description = "Compare platform/workstation/catalog.json with OpenBao"
run = "platform/workstation/run.sh platform/workstation/workstation.py check"

[tasks."vault:sync"]
description = "Copy every OpenBao secret into Vaultwarden (needs BW_SESSION from `bw unlock`)"
run = "platform/workstation/run.sh projects/home/kubernetes/vaultwarden/sync_openbao.py"
