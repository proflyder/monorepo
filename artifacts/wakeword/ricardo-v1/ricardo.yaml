model_name: ru_ricardo
wake_word: Рикардо
author: station-lab
trained_languages: [ru]
version: 1
train_with_recordings: false
target_phrases:
  - Рикардо
  - Рикардо!
  - Рикардо?
training:
  n_samples: 50000
  n_samples_val: 10000
voices:
  primary:
    base_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU
    models:
      ru_RU-dmitri-medium: dmitri/medium
      ru_RU-denis-medium: denis/medium
      ru_RU-irina-medium: irina/medium
      ru_RU-ruslan-medium: ruslan/medium
negative_phrases:
  - Рик
  - Рика
  - Рико
  - Рикки
  - Рикар
  - Кардо
  - Ардо
  - Рикарда
  - Рекорд
  - Рекорды
  - Карта
  - Кардинал
  - Рикошет
  - Баррикада
  - Алиса
  - Яндекс
  - Джарвис
  - Привет
  - Окей
  - Стоп
  - Хватит
  - Включи
  - Выключи
  - Громче
  - Тише
  - Пауза
  - Продолжи
  - Хорошо
  - Спасибо
microwakeword:
  architecture: mixednet
  pointwise_filters: '64,64,64,64'
  repeat_in_block: '1,1,1,1'
  mixconv_kernel_sizes: '[5], [7,11], [9,15], [23]'
  first_conv_filters: 32
  first_conv_kernel_size: 5
  stride: 3
  spectrogram_length: 204
  training_steps: 10000
  batch_size: 128
  learning_rate: 0.001
  positive_class_weight: 1.5
  negative_class_weight: 1.0
  probability_cutoff: 0.9
  sliding_window_size: 10
augmentation:
  enabled: true
  rir_dir: training/augmentation/rirs
  background_dir: training/augmentation/background
  rir_probability: 0.7
  background_probability: 0.8
  background_snr_db: [5, 25]
