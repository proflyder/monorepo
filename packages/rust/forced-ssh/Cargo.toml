[package]
name = "forced-ssh"
description = "Bounded one-exec SSH client for forced commands with pinned known_hosts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "forced_ssh"
path = "src/lib.rs"

[dependencies]
hmac = { workspace = true }
russh = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
