# Station software manifest — what actually runs on the Yandex Station Midi
# besides the OTA-managed Pulsar binary.
#
# This file is the source of truth for `projects/station/tools/station-audit`
# and for docs/STATION-SOFTWARE.md. It describes the *installed* state, so a
# difference between the repository copy and the device is real drift, not a
# bug in the manifest. The audit is read-only: it never writes to the station.
#
# compare modes:
#   sha256  - exact bytes; `normalize: ipv4` ignores environment-specific IPv4
#             addresses (repo copies use TEST-NET placeholders, the device uses
#             the real LAN) and hashes everything else.
#   version - the file is a build artifact; compare `version_command` output
#             with the value derived from `expected` in the repository.
#             Adding `deployed_sha256` pins the artifact that is actually
#             installed: the audit then compares the device hash with that
#             value (OK/DRIFT) and prints the version only as information.
#             Use it when the installed build predates a version fix or comes
#             from outside the repository (e.g. a prebuilt rootfs binary).
#   presence - only existence is checked (firmware binaries and scripts whose
#             content is owned by the firmware or written by an installer).
#
# update:
#   ota           - Pulsar updater through Home Assistant.
#   manual-rootfs - pushed/copied by hand over ADB/SSH to /data or the read-only
#                   rootfs (the latter is remounted rw for the copy).
#   firmware      - shipped by Yandex firmware; we do not replace it.
#
# recovery marks components needed to get back into the device after a failure
# (SSH/BLE/ADB/root). Losing them does not stop audio but removes the repair
# path.

version: 1

audit:
  ssh_user: root
  ssh_key: ~/.ssh/home-lab/station_ed25519
  connect_timeout_s: 10
  address:
    env: STATION_IP
    # Private network map; not in Git. Fallback: `--ip` on the command line.
    file: secrets/NETWORK.md
    line_hint: Станция
  # Directories scanned for stale siblings next to managed files.
  extra_dirs:
    - /data/pulsar
    - /data/quasar
    - /data/quasar/ble-gateway
    - /system/vendor/quasar
  extra_patterns:
    - "*.bak"
    - "*.bak-*"
    - "*.bak.*"
    - "*.prev"
    - "*.prev.*"
    - "*.new"
    - "*.old"
    - "*~"
  # Standard rollback slots kept on purpose (pulsar and gateway updaters leave
  # them). Exact paths only; anything else matching extra_patterns is EXTRA.
  extra_allow:
    - /data/pulsar/pulsar.prev
    - /data/quasar/ble-gateway/ble-gateway.prev

components:
  - id: pulsar
    title: Pulsar
    purpose: >
      Голосовой ассистент станции: ESPHome satellite, локальная wake-word,
      Sendspin-плеер, канал команд в Home Assistant. Управляется Home Assistant
      как устройство и обновляется только через updater.
    source:
      path: projects/station/pulsar
      bazel: //projects/station/pulsar/satellite:station_binary
    device_root: /data/pulsar
    startup: >
      /etc/init.d/S99zpulsar → /data/pulsar/boot.sh →
      /data/pulsar/supervise.sh; сам бинарник поднимает supervise.sh.
    update: ota
    owner: >
      Бинарник — HA updater; процессы и перезапуск — supervise.sh/ctl.sh;
      /data/pulsar/state.conf и wakewords/ — состояние Pulsar.
    recovery: true
    criticality: critical
    files:
      - device: /data/pulsar/pulsar
        compare: version
        version_command: /data/pulsar/pulsar --version
        expected:
          repo: projects/station/pulsar/VERSION
          prefix: "pulsar "
        note: build artifact, compare version string
      - device: /data/pulsar/boot.sh
        repo: projects/station/pulsar/satellite/deploy/boot.sh
        compare: sha256
      - device: /data/pulsar/supervise.sh
        repo: projects/station/pulsar/satellite/deploy/supervise.sh
        compare: sha256
      - device: /data/pulsar/ctl.sh
        repo: projects/station/pulsar/satellite/deploy/ctl.sh
        compare: sha256
      - device: /etc/init.d/S99zpulsar
        compare: presence
        update: manual-rootfs
        note: writes pulsar-install; content is generated by the installer

  - id: ble-gateway
    title: BLE gateway
    purpose: >
      Аварийный локальный provisioning Wi-Fi по BLE (GATT SSID/PSK/token),
      работающий без облака и без Wi-Fi. Запускается при потере Wi-Fi и по
      кнопкам станции.
    source:
      path: projects/station/ble-gateway
      bazel: //projects/station/ble-gateway:ble-gateway
    device_root: /data/quasar/ble-gateway
    startup: >
      /data/quasar/rootkeeper.sh каждые 60 с проверяет процесс и запускает
      start.sh; вручную — start.sh/stop.sh/status.sh.
    update: manual-rootfs
    owner: >
      /data/quasar/ble-gateway (бинарник и скрипты), token/control-token/status —
      состояние gateway.
    recovery: true
    criticality: critical
    files:
      - device: /data/quasar/ble-gateway/ble-gateway
        compare: version
        # The installed build predates the CARGO_PKG_VERSION fix in Bazel and
        # still prints `0.0.0`; pin the artifact that is actually deployed.
        # `version` stays informational until the gateway is rebuilt and
        # redeployed (see docs/STATION-SOFTWARE.md).
        deployed_sha256: cdadac02b864b26fc6979965ebf5d2be3bc68c34e775aab1d6deff26e8a9377f
        version_command: /data/quasar/ble-gateway/ble-gateway --version
        expected:
          repo: projects/station/ble-gateway/crates/ble-gateway/Cargo.toml
          regex: '^version = "([^"]+)"'
          prefix: "ble-gateway "
        note: >
          build artifact (armhf, 2026-11-05); sha256 is authoritative, version
          is informational until the next rebuild
      - device: /data/quasar/ble-gateway/start.sh
        repo: projects/station/ble-gateway/station/start.sh
        compare: sha256
      - device: /data/quasar/ble-gateway/stop.sh
        repo: projects/station/ble-gateway/station/stop.sh
        compare: sha256
      - device: /data/quasar/ble-gateway/status.sh
        repo: projects/station/ble-gateway/station/status.sh
        compare: sha256

  - id: dropbear
    title: Dropbear SSH
    purpose: >
      SSH-доступ к станции для обслуживания (ключ Mac в authorized_keys,
      пароль — осознанный аварийный fallback). ADB/SSH только в LAN.
    source:
      path: projects/station/configs/station-applied
      note: >
        S99dropbear — точная копия init-скрипта с устройства. Сам бинарник
        origin: prebuilt dropbear 2026.94, rootfs (/usr/sbin/dropbear): его
        собрала прошивка, в репозитории исходников нет. Репозиторный
        projects/station/pulsar/ssh/ — legacy-путь установщика Pulsar
        (2025.88 → /data/dropbear), на этой станции не используется.
    device_root: /
    startup: /etc/init.d/S99dropbear start (firmware rcS)
    update: manual-rootfs
    owner: >
      /etc/dropbear/* host keys и /root/.ssh/authorized_keys — состояние;
      /etc/init.d/S99dropbear — init-скрипт (копия в
      projects/station/configs/station-applied/).
    recovery: true
    criticality: critical
    files:
      - device: /usr/sbin/dropbear
        compare: version
        # Prebuilt rootfs binary; the hash is the source of truth.
        # origin: prebuilt dropbear 2026.94, rootfs.
        deployed_sha256: 374be9f85dabfab4d1f649d553f45e6238973e272b447fd2d81c2ab24a654db2
        version_command: /usr/sbin/dropbear -V
        note: >
          origin: prebuilt dropbear 2026.94, rootfs; sha256 is authoritative,
          version is informational
      - device: /etc/init.d/S99dropbear
        repo: projects/station/configs/station-applied/S99dropbear
        compare: sha256

  - id: rootkeeper
    title: Rootkeeper (ADB/BLE supervisor)
    purpose: >
      Второй супервизор: каждые 60 с поднимает adbd, ble-gateway, egress guard и
      yandex-block, а также маркеры ADB. Без него после перезагрузки ADB и
      gateway могут не подняться.
    source:
      path: projects/station/configs/station-applied/rootkeeper.sh
    device_root: /data/quasar
    startup: /system/vendor/quasar/onboot.sh запускает в фоне
    update: manual-rootfs
    owner: /data/quasar/rootkeeper.sh
    recovery: true
    criticality: critical
    files:
      - device: /data/quasar/rootkeeper.sh
        repo: projects/station/configs/station-applied/rootkeeper.sh
        compare: sha256

  - id: adbd
    title: adbd + ADB markers
    purpose: >
      Отладочный мост ADB (root) как второй путь восстановления. Бинарник —
      прошивки; rootkeeper и wrapper activate_adb.sh держат его включённым.
    source:
      path: projects/station/configs/station-applied/activate_adb.sh
      note: /usr/bin/adbd is firmware; only the activation wrapper is first-party
    device_root: /
    startup: >
      rootkeeper.sh каждые 60 с проверяет :5555 и запускает adbd;
      /system/vendor/quasar/activate_adb.sh (wrapper) включает network ADB.
    update: firmware
    owner: >
      /data/quasar/activate_adb_quasmodrom и activate_network_adb — маркеры
      состояния; wrapper — projects/station/configs/station-applied/.
    recovery: true
    criticality: critical
    files:
      - device: /usr/bin/adbd
        compare: presence
        note: firmware binary
      - device: /data/quasar/activate_adb_quasmodrom
        compare: presence
        note: marker file (state)
      - device: /data/quasar/activate_network_adb
        compare: presence
        note: marker file (state)

  - id: egress-guard
    title: Egress guard
    purpose: >
      nftables/iptables-карантин: разрешает LAN, loopback, DHCP, multicast и NTP
      (плюс HTTPS к GitHub для updater), всё остальное блокирует. Часть
      голосового контура: без него станция получает публичный WAN.
    source:
      path: projects/station/scripts
      note: station-egress-guard*.sh → /data/quasar/egress-guard*.sh
    device_root: /data/quasar
    startup: onboot.sh при загрузке и rootkeeper.sh каждые 60 с
    update: manual-rootfs
    owner: >
      iptables-цепочки EGRESS_GUARD/EGRESS_GUARD6 и маркер
      /data/quasar/egress-guard.confirmed — состояние.
    recovery: false
    criticality: high
    files:
      - device: /data/quasar/egress-guard.sh
        repo: projects/station/scripts/station-egress-guard.sh
        compare: sha256
      - device: /data/quasar/egress-guard-off.sh
        repo: projects/station/scripts/station-egress-guard-off.sh
        compare: sha256
      - device: /data/quasar/egress-guard-watchdog.sh
        repo: projects/station/scripts/station-egress-guard-watchdog.sh
        compare: sha256

  - id: yandex-block
    title: Yandex block + /etc/hosts
    purpose: >
      Блокировка Яндекс-сетей и подмена DNS/hosts на локальный резолвер, чтобы
      прошивка не тянулась в облако. Применяется при загрузке и каждые 60 с.
    source:
      path: projects/station/configs/station-applied
      note: yandex-block.sh + hosts
    device_root: /data/quasar
    startup: onboot.sh при загрузке и rootkeeper.sh каждые 60 с
    update: manual-rootfs
    owner: >
      /etc/hosts (блок YANDEX-BLOCK), /etc/unbound/unbound.conf,
      /data/quasar/yandex-block.log — состояние; маркеров нет.
    recovery: false
    criticality: medium
    files:
      - device: /data/quasar/yandex-block.sh
        repo: projects/station/configs/station-applied/yandex-block.sh
        compare: sha256
        normalize: ipv4
        note: repo copy uses TEST-NET address; the device uses the LAN address
      - device: /etc/hosts
        repo: projects/station/configs/station-applied/hosts
        compare: sha256
        normalize: ipv4
        note: address in the YANDEX-BLOCK line is environment-specific

  - id: unbound
    title: unbound (DNS)
    purpose: >
      Локальный резолвер станции, форвардит только на домашний DNS; часть
      yandex-block. Init-скрипт S70unbound — прошивки.
    source:
      path: projects/station/configs/station-applied/unbound.conf
    device_root: /etc/unbound
    startup: firmware /etc/init.d/S70unbound
    update: manual-rootfs
    owner: /etc/unbound/unbound.conf
    recovery: false
    criticality: medium
    files:
      - device: /etc/unbound/unbound.conf
        repo: projects/station/configs/station-applied/unbound.conf
        compare: sha256
        normalize: ipv4
        note: forward-addr is the LAN resolver, not the TEST-NET placeholder

  - id: chrony
    title: chrony (NTP)
    purpose: >
      Синхронизация времени по публичным NTP вместо Яндекс-серверов; init-скрипт
      S49chrony — прошивки и запускается только при /data/chrony_is_enabled.
    source:
      path: projects/station/configs/station-applied/chrony.conf
    device_root: /etc
    startup: firmware /etc/init.d/S49chrony (flag /data/chrony_is_enabled)
    update: manual-rootfs
    owner: /etc/chrony.conf, /data/chrony_is_enabled
    recovery: false
    criticality: low
    files:
      - device: /etc/chrony.conf
        repo: projects/station/configs/station-applied/chrony.conf
        compare: sha256

  - id: ota-fortress
    title: OTA/rootfs fortress
    purpose: >
      Блокировка OTA и отключения ADB: no-op applier, dummy OTA key, wrapper
      activate_adb.sh, launch.json без updatesd и onboot.sh с autostart
      rootkeeper. Правки лежат в /system/vendor/quasar (ro-rootfs).
    source:
      path: projects/station/configs/station-applied
      note: onboot.sh, launch.json, device_ota_update.sh, ota_script.pub, activate_adb.sh
    device_root: /system/vendor/quasar
    startup: >
      onboot.sh вызывается прошивкой; applier/wrapper подменяют штатные пути.
      Оригиналы — *.orig и /data/opt/backup/.
    update: manual-rootfs
    owner: >
      /system/vendor/quasar/*.orig и /data/opt/backup/* — оригиналы для отката;
      /data/quasar — marshrut/состояние autostart.
    recovery: true
    criticality: high
    files:
      - device: /system/vendor/quasar/onboot.sh
        repo: projects/station/configs/station-applied/onboot.sh
        compare: sha256
      - device: /system/vendor/quasar/launch.json
        repo: projects/station/configs/station-applied/launch.json
        compare: sha256
      - device: /system/vendor/quasar/device_ota_update.sh
        repo: projects/station/configs/station-applied/device_ota_update.sh
        compare: sha256
      - device: /system/vendor/quasar/ota_script.pub
        repo: projects/station/configs/station-applied/ota_script.pub
        compare: sha256
      - device: /system/vendor/quasar/activate_adb.sh
        repo: projects/station/configs/station-applied/activate_adb.sh
        compare: sha256
