[package]
name = "ble-gateway"
version = "0.2.0"
default-run = "ble-gateway"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ble_gateway"
path = "src/lib.rs"

[[bin]]
name = "ble-gateway"
path = "src/main.rs"

[[bin]]
name = "bletest"
path = "src/bin/bletest.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
home-http = { path = "../../../../../packages/rust/home-http" }
home-runtime = { path = "../../../../../packages/rust/home-runtime" }
home-secret = { path = "../../../../../packages/rust/home-secret" }
home-telemetry = { path = "../../../../../packages/rust/home-telemetry" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
