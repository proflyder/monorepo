syntax = "proto3";

import "api_options.proto";

service APIConnection {
  rpc hello (HelloRequest) returns (HelloResponse) {
    option (needs_setup_connection) = false;
    option (needs_authentication) = false;
  }
  rpc disconnect (DisconnectRequest) returns (DisconnectResponse) {
    option (needs_setup_connection) = false;
    option (needs_authentication) = false;
  }
  rpc ping (PingRequest) returns (PingResponse) {
    option (needs_setup_connection) = false;
    option (needs_authentication) = false;
  }
  rpc device_info (DeviceInfoRequest) returns (DeviceInfoResponse) {
    option (needs_authentication) = false;
  }
  rpc device_capabilities (DeviceCapabilitiesRequest) returns (DeviceCapabilitiesResponse) {}
  rpc device_wizard (DeviceWizardRequest) returns (DeviceWizardResponse) {}
  rpc wizard_input_set (WizardInputSetRequest) returns (void) {}
  rpc crash_report (CrashReportRequest) returns (CrashReportResponse) {}
  rpc list_entities (ListEntitiesRequest) returns (void) {}
  rpc subscribe_states (SubscribeStatesRequest) returns (void) {}
  rpc subscribe_logs (SubscribeLogsRequest) returns (void) {}
  rpc subscribe_homeassistant_services (SubscribeHomeassistantServicesRequest) returns (void) {}
  rpc subscribe_home_assistant_states (SubscribeHomeAssistantStatesRequest) returns (void) {}
  rpc execute_service (ExecuteServiceRequest) returns (void) {}
  rpc noise_encryption_set_key (NoiseEncryptionSetKeyRequest) returns (NoiseEncryptionSetKeyResponse) {}

  rpc button_command (ButtonCommandRequest) returns (void) {}
  rpc camera_image (CameraImageRequest) returns (void) {}
  rpc climate_command (ClimateCommandRequest) returns (void) {}
  rpc cover_command (CoverCommandRequest) returns (void) {}
  rpc date_command (DateCommandRequest) returns (void) {}
  rpc datetime_command (DateTimeCommandRequest) returns (void) {}
  rpc fan_command (FanCommandRequest) returns (void) {}
  rpc light_command (LightCommandRequest) returns (void) {}
  rpc lock_command (LockCommandRequest) returns (void) {}
  rpc media_player_command (MediaPlayerCommandRequest) returns (void) {}
  rpc number_command (NumberCommandRequest) returns (void) {}
  rpc select_command (SelectCommandRequest) returns (void) {}
  rpc siren_command (SirenCommandRequest) returns (void) {}
  rpc switch_command (SwitchCommandRequest) returns (void) {}
  rpc text_command (TextCommandRequest) returns (void) {}
  rpc time_command (TimeCommandRequest) returns (void) {}
  rpc update_command (UpdateCommandRequest) returns (void) {}
  rpc valve_command (ValveCommandRequest) returns (void) {}
  rpc water_heater_command (WaterHeaterCommandRequest) returns (void) {}

  rpc subscribe_bluetooth_le_advertisements(SubscribeBluetoothLEAdvertisementsRequest) returns (void) {}
  rpc bluetooth_device_request(BluetoothDeviceRequest) returns (void) {}
  rpc bluetooth_gatt_get_services(BluetoothGATTGetServicesRequest) returns (void) {}
  rpc bluetooth_gatt_read(BluetoothGATTReadRequest) returns (void) {}
  rpc bluetooth_gatt_write(BluetoothGATTWriteRequest) returns (void) {}
  rpc bluetooth_gatt_read_descriptor(BluetoothGATTReadDescriptorRequest) returns (void) {}
  rpc bluetooth_gatt_write_descriptor(BluetoothGATTWriteDescriptorRequest) returns (void) {}
  rpc bluetooth_gatt_notify(BluetoothGATTNotifyRequest) returns (void) {}
  rpc subscribe_bluetooth_connections_free(SubscribeBluetoothConnectionsFreeRequest) returns (BluetoothConnectionsFreeResponse) {}
  rpc unsubscribe_bluetooth_le_advertisements(UnsubscribeBluetoothLEAdvertisementsRequest) returns (void) {}
  rpc bluetooth_scanner_set_mode(BluetoothScannerSetModeRequest) returns (void) {}
  rpc bluetooth_set_connection_params(BluetoothSetConnectionParamsRequest) returns (BluetoothSetConnectionParamsResponse) {}

  rpc subscribe_voice_assistant(SubscribeVoiceAssistantRequest) returns (void) {}
  rpc voice_assistant_get_configuration(VoiceAssistantConfigurationRequest) returns (VoiceAssistantConfigurationResponse) {}
  rpc voice_assistant_set_configuration(VoiceAssistantSetConfiguration) returns (void) {}

  rpc alarm_control_panel_command (AlarmControlPanelCommandRequest) returns (void) {}

  rpc zwave_proxy_frame(ZWaveProxyFrame) returns (void) {}
  rpc zwave_proxy_request(ZWaveProxyRequest) returns (void) {}

  rpc infrared_rf_transmit_raw_timings(InfraredRFTransmitRawTimingsRequest) returns (void) {}

  rpc serial_proxy_configure(SerialProxyConfigureRequest) returns (void) {}
  rpc serial_proxy_write(SerialProxyWriteRequest) returns (void) {}
  rpc serial_proxy_set_modem_pins(SerialProxySetModemPinsRequest) returns (void) {}
  rpc serial_proxy_get_modem_pins(SerialProxyGetModemPinsRequest) returns (void) {}
  rpc subscribe_serial_proxy_identity(SubscribeSerialProxyIdentityRequest) returns (void) {}
  rpc serial_proxy_request(SerialProxyRequest) returns (void) {}
  rpc serial_proxy_set_mode(SerialProxySetModeRequest) returns (void) {}

  rpc sendspin_pairing_token(SendspinPairingTokenRequest) returns (SendspinPairingTokenResponse) {}
  rpc get_yaml(GetYamlRequest) returns (void) {}
}


message HelloRequest {
  option (id) = 1;
  option (source) = SOURCE_CLIENT;
  option (no_delay) = true;

  string client_info = 1;
  uint32 api_version_major = 2;
  uint32 api_version_minor = 3;

  bool outgoing_connection_target = 4 [(field_ifdef) = "USE_API_OUTGOING_CONNECTION"];
}

message HelloResponse {
  option (id) = 2;
  option (source) = SOURCE_SERVER;
  option (no_delay) = true;

  uint32 api_version_major = 1;
  uint32 api_version_minor = 2;

  string server_info = 3 [(max_data_length) = 32, (force) = true, (progmem) = true];

  string name = 4 [(max_data_length) = 31, (force) = true];
}

message AuthenticationRequest {
  option (id) = 3;
  option (source) = SOURCE_CLIENT;
  option (no_delay) = true;
  option deprecated = true;

  string password = 1;
}

message AuthenticationResponse {
  option (id) = 4;
  option (source) = SOURCE_SERVER;
  option (no_delay) = true;
  option deprecated = true;

  bool invalid_password = 1;
}

enum DisconnectReason {
  DISCONNECT_REASON_UNSPECIFIED = 0;
  DISCONNECT_REASON_PROVISIONING_CLOSED = 1;
}

message DisconnectRequest {
  option (id) = 5;
  option (source) = SOURCE_BOTH;
  option (no_delay) = true;

  DisconnectReason reason = 1;
}

message DisconnectResponse {
  option (id) = 6;
  option (source) = SOURCE_BOTH;
  option (no_delay) = true;
}

message PingRequest {
  option (id) = 7;
  option (source) = SOURCE_BOTH;
}

message PingResponse {
  option (id) = 8;
  option (source) = SOURCE_BOTH;
}

message DeviceInfoRequest {
  option (id) = 9;
  option (source) = SOURCE_CLIENT;
}

message AreaInfo {
  uint32 area_id = 1;
  string name = 2 [(max_data_length) = 120, (force) = true];
}

enum DeviceRelation {
  DEVICE_RELATION_VIA = 0;
  DEVICE_RELATION_CHILD = 1;
}

message DeviceInfo {
  uint32 device_id = 1;
  string name = 2 [(max_data_length) = 120, (force) = true];
  uint32 area_id = 3;
  DeviceRelation relation = 4;
}

enum SerialProxyPortType {
  SERIAL_PROXY_PORT_TYPE_TTL = 0;
  SERIAL_PROXY_PORT_TYPE_RS232 = 1;
  SERIAL_PROXY_PORT_TYPE_RS485 = 2;
  SERIAL_PROXY_PORT_TYPE_USB_SERIAL = 3;
}

message SerialProxyInfo {
  string name = 1;
  SerialProxyPortType port_type = 2;
  uint32 configured_line_states = 3;
}

message DeviceInfoResponse {
  option (id) = 10;
  option (source) = SOURCE_SERVER;

  bool uses_password = 1 [deprecated = true];

  string name = 2 [(max_data_length) = 31, (force) = true];

  string mac_address = 3 [(max_data_length) = 17, (force) = true];

  string esphome_version = 4 [(max_data_length) = 32, (force) = true, (progmem) = true];

  string compilation_time = 5 [(max_data_length) = 25, (force) = true];

  string model = 6 [(max_data_length) = 127, (force) = true, (progmem) = true];

  bool has_deep_sleep = 7 [(field_ifdef) = "USE_DEEP_SLEEP"];

  string project_name = 8 [(max_data_length) = 127, (force) = true, (field_ifdef) = "ESPHOME_PROJECT_NAME", (progmem) = true];
  string project_version = 9 [(max_data_length) = 127, (force) = true, (field_ifdef) = "ESPHOME_PROJECT_NAME", (progmem) = true];

  uint32 webserver_port = 10 [(field_ifdef) = "USE_WEBSERVER"];

  uint32 legacy_bluetooth_proxy_version = 11 [deprecated=true, (field_ifdef) = "USE_BLUETOOTH_PROXY"];

  uint32 bluetooth_proxy_feature_flags = 15 [(field_ifdef) = "USE_BLUETOOTH_PROXY"];

  string manufacturer = 12 [(max_data_length) = 20, (force) = true, (progmem) = true];

  string friendly_name = 13 [(max_data_length) = 120, (force) = true];

  uint32 legacy_voice_assistant_version = 14 [deprecated=true, (field_ifdef) = "USE_VOICE_ASSISTANT"];

  uint32 voice_assistant_feature_flags = 17 [(field_ifdef) = "USE_VOICE_ASSISTANT"];

  string suggested_area = 16 [(max_data_length) = 120, (force) = true, (field_ifdef) = "USE_AREAS"];

  string bluetooth_mac_address = 18 [(max_data_length) = 17, (force) = true, (field_ifdef) = "USE_BLUETOOTH_PROXY"];

  bool api_encryption_supported = 19 [(field_ifdef) = "USE_API_NOISE"];

  repeated DeviceInfo devices = 20 [(field_ifdef) = "USE_DEVICES", (fixed_array_size_define) = "ESPHOME_DEVICE_COUNT"];
  repeated AreaInfo areas = 21 [(field_ifdef) = "USE_AREAS", (fixed_array_size_define) = "ESPHOME_AREA_COUNT"];

  AreaInfo area = 22 [(field_ifdef) = "USE_AREAS"];

  uint32 zwave_proxy_feature_flags = 23 [(field_ifdef) = "USE_ZWAVE_PROXY"];
  uint32 zwave_home_id = 24 [(field_ifdef) = "USE_ZWAVE_PROXY"];

  repeated SerialProxyInfo serial_proxies = 25 [(field_ifdef) = "USE_SERIAL_PROXY", (fixed_array_size_define) = "SERIAL_PROXY_COUNT"];

  bool api_encryption_provisionable = 26 [(field_ifdef) = "USE_API_NOISE"];

  bool api_outgoing_connection_supported = 27 [(field_ifdef) = "USE_API_OUTGOING_CONNECTION"];
}

message DeviceCapabilitiesRequest {
  option (id) = 149;
  option (source) = SOURCE_CLIENT;
}

message BluetoothProxyCapabilities {
  uint32 feature_flags = 1;
  string mac_address = 2 [(max_data_length) = 17, (force) = true];
}

message VoiceAssistantCapabilities {
  uint32 feature_flags = 1;
}

message ZWaveProxyCapabilities {
  uint32 feature_flags = 1;
  uint32 home_id = 2;
}

message StoreYamlCapabilities {
  bool supported = 1;
}

message WizardCapabilities {
  bool configured = 1;
}

message SendspinCapabilities {
  uint32 feature_flags = 1;
  string client_id = 2 [(max_data_length) = 43];
}

message CrashReportCapabilities {
  uint32 flags = 1;
}

message DeviceCapabilitiesResponse {
  option (id) = 150;
  option (source) = SOURCE_SERVER;

  BluetoothProxyCapabilities bluetooth_proxy = 1 [(field_ifdef) = "USE_BLUETOOTH_PROXY"];
  VoiceAssistantCapabilities voice_assistant = 2 [(field_ifdef) = "USE_VOICE_ASSISTANT"];
  ZWaveProxyCapabilities zwave_proxy = 3 [(field_ifdef) = "USE_ZWAVE_PROXY"];
  repeated SerialProxyInfo serial_proxies = 4
      [(field_ifdef) = "USE_SERIAL_PROXY", (fixed_array_size_define) = "SERIAL_PROXY_COUNT"];
  WizardCapabilities wizard = 5 [(field_ifdef) = "USE_API_WIZARD"];
  SendspinCapabilities sendspin = 6 [(field_ifdef) = "USE_SENDSPIN"];
  StoreYamlCapabilities store_yaml = 7 [(field_ifdef) = "USE_STORE_YAML"];
  CrashReportCapabilities crash_report = 8 [(field_ifdef) = "USE_CRASH_REPORT"];
}

message DeviceWizardRequest {
  option (id) = 156;
  option (source) = SOURCE_CLIENT;
  option (ifdef) = "USE_API_WIZARD";
}

message DeviceWizardResponse {
  option (id) = 157;
  option (source) = SOURCE_SERVER;
  option (ifdef) = "USE_API_WIZARD";

  bytes data = 1 [(pointer_to_buffer) = true, (progmem) = true];
}

message WizardInputSetRequest {
  option (id) = 158;
  option (source) = SOURCE_CLIENT;
  option (ifdef) = "USE_API_WIZARD_INPUTS";

  fixed32 key = 1;
  string entity_id = 2 [(max_data_length) = 4095];
}

message ListEntitiesRequest {
  option (id) = 11;
  option (source) = SOURCE_CLIENT;
}
message ListEntitiesDoneResponse {
  option (id) = 19;
  option (source) = SOURCE_SERVER;
  option (no_delay) = true;
}
message SubscribeStatesRequest {
  option (id) = 20;
  option (source) = SOURCE_CLIENT;
}

message CrashReportRequest {
  option (id) = 163;
  option (source) = SOURCE_CLIENT;
  option (ifdef) = "USE_CRASH_REPORT";
}

message CrashReportCore {
  uint32 core = 1;
  repeated uint32 backtrace = 2 [(fixed_array_with_length_define) = "CRASH_REPORT_MAX_BACKTRACE"];
}

message CrashReportResponse {
  option (id) = 164;
  option (source) = SOURCE_SERVER;
  option (ifdef) = "USE_CRASH_REPORT";

  uint32 flags = 1;
  uint32 reason = 2;
  uint32 pc = 3;
  uint32 cause = 4;
  uint32 fault_address = 5;
  uint32 build_time = 6;
  uint32 crashed_core = 7;
  repeated CrashReportCore cores = 8 [(fixed_array_with_length_define) = "CRASH_REPORT_MAX_CORES"];
}

enum EntityCategory {
  ENTITY_CATEGORY_NONE = 0;
  ENTITY_CATEGORY_CONFIG = 1;
  ENTITY_CATEGORY_DIAGNOSTIC = 2;
}

message ListEntitiesBinarySensorResponse {
  option (id) = 12;
  option (base_class) = "InfoResponseProtoMessage";
  option (source) = SOURCE_SERVER;
  option (ifdef) = "USE_BINARY_SENSOR";

  string object_id = 1 [(max_data_length) = 120, (force) = true];
  fixed32 key = 2 [(force) = true];
  string name = 3 [(max_data_length) = 120, (force) = true, (progmem) = true];
  reserved 4;

  string device_class = 5 [(max_data_length) = 47, (progmem) = true];
  bool is_status_binary_sensor = 6;
  bool disabled_by_default = 7;
  string icon = 8 [(field_ifdef) = "USE_ENTITY_ICON", (max_data_length) = 63, (progmem) = true];
  EntityCategory entity_category = 9;
  uint32 device_id = 10 [(field_ifdef) = "USE_DEVICES"];
}
message BinarySensorStateResponse {
  option (id) = 21;
