<confdir:alsa.conf>

pcm.minidmix {
    type dmix
    ipc_key 2277
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
    }
}

pcm.mini {
    type plug
    slave.pcm "minidmix"
}
