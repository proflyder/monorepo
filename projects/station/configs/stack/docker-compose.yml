name: v3rt3p

services:
  https-proxy:
    build: ./repos/https-proxy
    restart: unless-stopped
    environment:
      YANDEX_UPSTREAM_URL: http://quasar-server:31115
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - quasar-server

  quasar-server:
    build: ./repos/quasar-server
    restart: unless-stopped
    ports:
      - "31116:31116"
    environment:
      ALLOW_UPDATES: "false"
      PORT: "31115"
      API_PORT: "31116"
      TTS_OPENAI_BASE_URL: http://supertonic-tts:9150
      TTS_OPENAI_VOICE: "${TTS_VOICE:-F1}"
      PROCESSOR_BASIC_URL: http://processor:8080/process
      STT_GIGAAM_URL: ws://quasistreaming-gigam:8080
      POSTGRES_URL: postgres://quasar:quasar@postgres:5432/quasar
    depends_on:
      - postgres
      - processor
      - supertonic-tts
      - quasistreaming-gigam

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quasar
      POSTGRES_PASSWORD: quasar
      POSTGRES_DB: quasar
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  quasistreaming-gigam:
    build:
      context: ./repos/quasistreaming-gigam
      dockerfile: Dockerfile.cpu
    restart: unless-stopped
    environment:
      RECOGNIZER_MODEL_PATH: /models/gigaam_v3_e2e_ctc.onnx
      RECOGNIZER_TOKENS_PATH: /models/gigaam_v3_e2e_ctc_tokens.txt
      VAD_MODEL_PATH: /models/silero_vad.onnx
      VAD_MIN_SILENCE_DURATION: "1.25"
      VAD_THRESHOLD: "0.48"
      INPUT_GAIN: "100"
    volumes:
      - ./quasistreaming-models:/models:ro

  supertonic-tts:
    build: ./repos/supertonic-tts
    restart: unless-stopped
    environment:
      ASSETS_PATH: /assets
    volumes:
      - ./supertonic-tts/assets:/assets:ro

  processor:
    build: ./repos/processor
    restart: unless-stopped
    environment:
      OPENAI_BASE_URL: "${LLM_BASE_URL}"
      OPENAI_API_KEY: "${LLM_API_KEY}"
      OPENAI_MODEL: "${LLM_MODEL}"
      PROCESSOR_FUNCTION_SERVER_URLS: ""
      PROCESSOR_STATE_SERVER_URLS: ""
      PROCESSOR_PROMPT_TEMPLATE_PATH: /prompt.handlebars
      PROCESSOR_STATE_PROMPT_TEMPLATE_PATH: /prompt-state.handlebars
      TZ: Europe/Moscow
      CACHE_SIZE: "1000"
    volumes:
      - ./prompt.handlebars:/prompt.handlebars:ro
      - ./prompt-state.handlebars:/prompt-state.handlebars:ro
