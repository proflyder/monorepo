# Cloudflare Tunnel for the Telegram webhook.
#
# The tunnel lives in the currency-bot namespace (not a shared `cloudflared`
# namespace) so the webhook NetworkPolicy can select its pods with a plain
# same-namespace podSelector, the TUNNEL_TOKEN Secret is materialised by the
# same ExternalSecret set, and the CI Role is the only cross-namespace grant.
#
# TEMPLATE: deploy.sh substitutes ${CLOUDFLARED_IMAGE} from versions.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: currency-bot
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: ricardo-home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: ${CLOUDFLARED_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: TUNNEL_TOKEN
            # Expose the metrics/readiness listener on the pod network so it is
            # reachable for probes and monitoring.
            - name: TUNNEL_METRICS
              value: 0.0.0.0:2000
            - name: TZ
              value: UTC
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
