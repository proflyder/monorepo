apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - currency-bot.yaml
  - cloudflared.yaml
  - network-policies.yaml
  - servicemonitor.yaml
  - external-secrets.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: currency-bot-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: Deployment
      name: currency-bot
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${CURRENCY_BOT_IMAGE}
  - target:
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
