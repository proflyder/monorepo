# Currency bot secrets, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/currency-bot  -> Secret currency-bot
#       BOT_TOKEN, CHAT_ID, WEBHOOK_SECRET, API_TOKEN
#   secret/k8s/cloudflared   -> Secret cloudflared-tunnel
#       TUNNEL_TOKEN
#
# Same policy contract as the other home Secrets: the ExternalSecret owns the
# Secret in place (creationPolicy Owner) and a mistaken delete of the
# ExternalSecret does not delete the live Secret (deletionPolicy Retain).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: currency-bot
  namespace: currency-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: currency-bot
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/currency-bot
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  namespace: currency-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/cloudflared
