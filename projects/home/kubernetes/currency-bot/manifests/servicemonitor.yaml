apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: currency-bot
  namespace: currency-bot
  labels:
    app.kubernetes.io/name: currency-bot
    app.kubernetes.io/part-of: home
spec:
  namespaceSelector:
    matchNames:
      - currency-bot
  selector:
    matchLabels:
      app.kubernetes.io/name: currency-bot
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
