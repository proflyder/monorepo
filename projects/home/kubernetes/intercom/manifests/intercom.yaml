apiVersion: apps/v1
kind: Deployment
metadata:
  name: intercom
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: intercom
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intercom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intercom
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intercom
          image: ${INTERCOM_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: INTERCOM_LISTEN
              value: 0.0.0.0:8099
            - name: INTERCOM_ACCESS_URL
              value: http://scheduler.home-assistant.svc.cluster.local:8098/v1/access/snapshot
            - name: INTERCOM_SERVICE_TOKEN_FILE
              value: /run/secrets/intercom/service_token
            - name: INTERCOM_STATION_TOKEN_FILE
              value: /run/secrets/intercom/station_token
            - name: INTERCOM_PHONE_ENDPOINT_ID
              value: phone
            - name: INTERCOM_STATION_ENDPOINT_ID
              value: station
            - name: INTERCOM_RING_TIMEOUT_SECONDS
              value: "30"
            - name: INTERCOM_CONNECT_TIMEOUT_SECONDS
              value: "20"
            - name: INTERCOM_ENDED_RETENTION_SECONDS
              value: "60"
            - name: INTERCOM_MAX_CALL_SECONDS
              value: "3600"
          ports:
            - name: http
              containerPort: 8099
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/usr/local/bin/intercom", "-healthcheck"]
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/intercom", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/intercom
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: intercom
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: intercom
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: intercom
    app.kubernetes.io/part-of: home
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: intercom
  ports:
    - name: http
      port: 8099
      targetPort: http
      nodePort: ${INTERCOM_NODE_PORT}
      protocol: TCP
