apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercom
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: intercom
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: intercom
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: service_token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: service_token
    - secretKey: station_token
      remoteRef:
        key: k8s/home-assistant/intercom
        property: station_token
