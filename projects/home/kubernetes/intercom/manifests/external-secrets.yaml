# Intercom credentials, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/home-assistant/intercom ->
#       phone_token    bearer the Android app sends
#       station_token  device token for the station (pulsar-call later)
#
# The path is created by the owner (mise run secrets / OpenBao UI); this
# manifest only declares the hand-off. A deploy script never writes values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercom
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: intercom
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: intercom
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/intercom
