# Intercom credentials, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/home-assistant/scheduler-auth -> token
#       the one app bearer token: scheduler, control and intercom all use it
#   secret/k8s/home-assistant/intercom -> station_token
#       device token for the station (pulsar-call later)
#
# Both paths are maintained by the owner (mise run secrets / OpenBao UI); this
# manifest only declares the hand-off. A deploy script never writes values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercom
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: intercom
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: intercom
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The phone authenticates with the same token as the scheduler API.
    - secretKey: phone_token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: token
    - secretKey: station_token
      remoteRef:
        key: k8s/home-assistant/intercom
        property: station_token
