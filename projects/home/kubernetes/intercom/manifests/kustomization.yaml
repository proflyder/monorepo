apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - intercom.yaml
  - external-secrets.yaml
patches:
  - target:
      kind: Deployment
      name: intercom
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${INTERCOM_IMAGE}
