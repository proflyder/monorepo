apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scheduler-data
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: ${SCHEDULER_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/scheduler"]
          env:
            - name: SCHEDULER_DB_PATH
              value: /data/scheduler.db
            - name: SCHEDULER_LISTEN
              value: 0.0.0.0:8098
            - name: SCHEDULER_TOKEN_FILE
              value: /run/secrets/scheduler/token
            - name: SCHEDULER_CONSUMERS
              value: ha-bridge-home,ha-control-home,ha-scenario-home,voice-proxy-home
            - name: SCHEDULER_RING_WINDOW_SECONDS
              value: "900"
            - name: SCHEDULER_MISSED_GRACE_SECONDS
              value: "600"
            - name: SCENARIO_EXECUTION
              value: "true"
          ports:
            - name: api
              containerPort: 8098
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/usr/local/bin/scheduler", "-healthcheck"]
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 7
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/scheduler", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 7
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /run/secrets/scheduler
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: scheduler-data
        - name: token
          secret:
            secretName: scheduler-auth
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: home
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: scheduler
  ports:
    - name: api
      port: 8098
      targetPort: api
      nodePort: ${SCHEDULER_NODE_PORT}
      protocol: TCP
