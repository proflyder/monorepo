apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-control
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-control
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-control
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ha-control
          image: ${HA_CONTROL_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/ha-control"]
          env:
            - name: HA_URL
              value: ${HA_URL}
            - name: HA_TOKEN_FILE
              value: /run/secrets/ha/token
            - name: SCHEDULER_ENDPOINT
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: SCHEDULER_TOKEN_FILE
              value: /run/secrets/scheduler/service_token
            - name: CONTROL_TOKEN_FILE
              value: /run/secrets/scheduler/token
            - name: CONTROL_CONSUMER_ID
              value: ha-control-home
            - name: CONTROL_QUEUE
              value: control
            - name: CONTROL_SCENARIO_LABEL
              value: scenario
            - name: CONTROL_TOGGLES
              value: '[{"id":"toggle.komp_lock","title":"Блокировка","icon":"lock","state":"binary_sensor.komp_razblokirovan","on":"button.komp_lock","off":"button.komp_unlock","visibleWhen":{"entry":"switch.komp","state":"on"}}]'
            - name: CONTROL_LISTEN
              value: 0.0.0.0:8099
            - name: CONTROL_EXECUTE
              value: "false"
            - name: CONTROL_CACHE_TTL
              value: 3s
          ports:
            - name: catalog
              containerPort: 8099
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/usr/local/bin/ha-control", "-healthcheck"]
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 7
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/ha-control", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 7
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scheduler-token
              mountPath: /run/secrets/scheduler
              readOnly: true
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scheduler-token
          secret:
            secretName: scheduler-auth
            defaultMode: 0440
        - name: ha-token
          secret:
            secretName: ha-bridge-ha
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
