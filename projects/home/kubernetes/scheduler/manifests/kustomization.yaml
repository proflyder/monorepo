apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - scheduler.yaml
  - bridge.yaml
  - control.yaml
  - control-service.yaml
  - scenario.yaml
  - external-secrets.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: scheduler-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: PersistentVolumeClaim
      name: ha-bridge-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: PersistentVolumeClaim
      name: ha-scenario-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: Deployment
      name: scheduler
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${SCHEDULER_IMAGE}
  - target:
      kind: Deployment
      name: ha-bridge
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${HA_BRIDGE_IMAGE}
  - target:
      kind: Deployment
      name: ha-control
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${HA_CONTROL_IMAGE}
  - target:
      kind: Deployment
      name: ha-scenario
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${HA_SCENARIO_IMAGE}
  - target:
      kind: Deployment
      name: ha-bridge
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ha-bridge
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: ha-bridge
                env:
                  - name: BRIDGE_EXECUTE
                    value: "true"
  - target:
      kind: Deployment
      name: ha-control
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ha-control
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: ha-control
                env:
                  - name: CONTROL_EXECUTE
                    value: "true"
