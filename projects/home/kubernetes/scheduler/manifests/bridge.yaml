apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-bridge-data
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-bridge
    app.kubernetes.io/part-of: home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-bridge
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-bridge
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-bridge
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ha-bridge
          image: ${HA_BRIDGE_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/ha-bridge"]
          env:
            - name: HA_URL
              value: ${HA_URL}
            - name: HA_TOKEN_FILE
              value: /run/secrets/ha/token
            - name: SCHEDULER_ENDPOINT
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: SCHEDULER_SERVICE_TOKEN_FILE
              value: /run/secrets/scheduler/service_token
            - name: BRIDGE_CONSUMER_ID
              value: ha-bridge-home
            - name: BRIDGE_QUEUE
              value: home
            - name: BRIDGE_EXECUTE
              value: "false"
            - name: BRIDGE_LEDGER_PATH
              value: /data/ledger.json
            - name: BRIDGE_BATCH_SIZE
              value: "10"
            - name: BRIDGE_LEASE_SECONDS
              value: "300"
            - name: BRIDGE_POLL_INTERVAL
              value: 1s
            - name: BRIDGE_MAX_BACKOFF
              value: 5s
          readinessProbe:
            exec:
              command: ["/usr/local/bin/ha-bridge", "-healthcheck"]
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/ha-bridge", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 8
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scheduler-token
              mountPath: /run/secrets/scheduler
              readOnly: true
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ha-bridge-data
        - name: scheduler-token
          secret:
            secretName: scheduler-auth
            defaultMode: 0440
        - name: ha-token
          secret:
            secretName: ha-bridge-ha
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
