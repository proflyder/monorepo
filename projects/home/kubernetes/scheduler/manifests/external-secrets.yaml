---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduler-auth
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: scheduler-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: token
    - secretKey: service_token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: service_token
    - secretKey: service_token_previous
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: service_token_previous
    - secretKey: app_tokens
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: app_tokens
    - secretKey: vpn_sync_token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: vpn_sync_token
    - secretKey: vpn.json
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: vpn.json
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-bridge-ha
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ha-bridge-ha
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/ha-bridge-ha
