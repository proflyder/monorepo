# Scheduler / HA executor credentials, materialised from OpenBao.
#
# Source of truth: secret/k8s/home-assistant/scheduler-auth and
# secret/k8s/home-assistant/ha-bridge-ha (KV v2). The Secret objects keep their
# original names so the Deployments and the preflight Job need no change.
#
# creationPolicy: Owner adopts the existing Secret in place (same UID, no pod
# restart). deletionPolicy: Retain keeps the Secret if this object is removed
# by mistake.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduler-auth
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: scheduler-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/scheduler-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-bridge-ha
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ha-bridge-ha
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/ha-bridge-ha
