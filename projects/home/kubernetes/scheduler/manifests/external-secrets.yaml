---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduler-auth
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: scheduler-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/scheduler-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-bridge-ha
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ha-bridge-ha
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/ha-bridge-ha
