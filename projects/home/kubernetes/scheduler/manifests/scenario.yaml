# ha-scenario: the durable `scenario` queue executor.
#
# Separate from ha-bridge (alarm `home` queue) and ha-control (phone catalog and
# `control` queue): it leases only `scenario`, owns its own consumer id and
# ledger, and never listens on a port. Definitions stay in the scheduler; this
# process evaluates conditions and runs steps.
#
# TEMPLATE: deploy.sh renders the digest-pinned image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-scenario-data
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-scenario
    app.kubernetes.io/part-of: home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-scenario
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-scenario
    app.kubernetes.io/part-of: home
  annotations:
    # Traceability only: a Deployment metadata change never rolls pods.
    ricardo.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  # One executor per queue. A second replica would run the same scenario twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-scenario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-scenario
      annotations:
        # Content-addressed: identical rendered content keeps the pod template.
        ricardo.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ha-scenario
          image: ${HA_SCENARIO_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/ha-scenario"]
          env:
            - name: HA_URL
              value: ${HA_URL}
            - name: HA_TOKEN_FILE
              value: /run/secrets/ha/token
            - name: SCHEDULER_ENDPOINT
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: SCHEDULER_TOKEN_FILE
              value: /run/secrets/scheduler/token
            - name: SCENARIO_CONSUMER_ID
              value: ha-scenario-home
            - name: SCENARIO_QUEUE
              value: scenario
            # Scenarios are user-created; there are none at roll-out time, so
            # the executor starts enabled with an idle queue.
            - name: SCENARIO_EXECUTE
              value: "true"
            - name: SCENARIO_LEDGER_PATH
              value: /data/scenario-ledger.json
            # Fallback for conditions when a scenario has no time trigger.
            - name: SCENARIO_TIMEZONE
              value: Asia/Almaty
            # A run must finish inside one lease to be acknowledged; a single
            # delay step is capped at 3600 s by the proto contract.
            - name: SCENARIO_LEASE_SECONDS
              value: "3600"
            - name: SCENARIO_BATCH_SIZE
              value: "10"
            - name: SCENARIO_POLL_INTERVAL
              value: 1s
            - name: SCENARIO_MAX_BACKOFF
              value: 5s
            - name: SCENARIO_CATALOG_TTL
              value: 3s
          readinessProbe:
            exec:
              # Authenticated scheduler readiness; the token comes from the
              # mounted file, never from probe arguments.
              command: ["/usr/local/bin/ha-scenario", "-healthcheck"]
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/ha-scenario", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 8
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scheduler-token
              mountPath: /run/secrets/scheduler
              readOnly: true
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ha-scenario-data
        - name: scheduler-token
          secret:
            secretName: scheduler-auth
            defaultMode: 0440
        - name: ha-token
          secret:
            secretName: ha-bridge-ha
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
