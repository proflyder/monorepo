# External Secrets Operator for the home K3s node.
#
# One replica: the cluster is a single node and the operator is not on the
# request path. CRDs are installed by the chart because ESO owns them (unlike
# application resources, they are cluster-scoped and upgraded with the chart).
#
# The image is pinned by tag + digest. The literal must stay equal to
# `${EXTERNAL_SECRETS_IMAGE_VERSION}@${EXTERNAL_SECRETS_IMAGE_DIGEST}` in
# `../versions.sh`; `projects/home/kubernetes/flux/test_flux.py` enforces it.
installCRDs: true

replicaCount: 1

# A single replica cannot campaign for leadership; leaving it off keeps the
# logs free of election noise and avoids an extra Lease.
leaderElect: false

image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  replicaCount: 1
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  replicaCount: 1
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# OpenBao's Kubernetes auth role is bound to exactly this ServiceAccount.
serviceAccount:
  create: true
  name: external-secrets
  automount: true

# Metrics are not scraped yet; leave the service off until needed.
metrics:
  service:
    enabled: false
