# Cluster-wide bridge from External Secrets Operator to OpenBao.
#
# The store talks to the in-cluster Service over plain HTTP: TLS is terminated
# by Traefik for humans/CI, and the pod listener is reachable only inside the
# cluster. Authentication uses the Kubernetes auth method: ESO obtains a
# projected ServiceAccount token for `external-secrets/external-secrets`, and
# OpenBao's role `external-secrets` (configure.py) grants the read-only policy
# `k8s-read` on `secret/data/k8s/*`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
