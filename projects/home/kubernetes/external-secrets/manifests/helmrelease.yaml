# External Secrets Operator, adopted from the live `external-secrets` release.
#
# Same release name and namespace as `helm list -A`; values are the chart
# values used by the former deploy script (digest-pinned image, one replica).
# The CRDs are rendered by the chart (`installCRDs: true`), so they follow the
# normal Helm upgrade path exactly as before.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: external-secrets-values
      valuesKey: external-secrets.yaml
