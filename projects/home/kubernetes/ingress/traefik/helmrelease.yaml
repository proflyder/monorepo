# Traefik, adopted from the live `traefik` release.
#
# Same release name/namespace as `helm list -A`; the values file is the live
# configuration (hostNetwork, Recreate, allow-list provider settings).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: 42.2.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml
