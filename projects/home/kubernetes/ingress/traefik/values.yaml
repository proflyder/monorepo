deployment:
  replicas: 1
  dnsPolicy: ClusterFirstWithHostNet

updateStrategy:
  type: Recreate

hostNetwork: true

service:
  spec:
    type: ClusterIP

ports:
  traefik:
    port: 8080
    expose:
      default: false
  web:
    port: 80
    hostPort: 80
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    hostPort: 443
    exposedPort: 443
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 1800s
  metrics:
    port: 19100
    exposedPort: 19100

api:
  dashboard: false

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

metrics:
  prometheus: null

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: false

accessLog:
  enabled: true

log:
  level: INFO
