# Cloudflare API token used by cert-manager ClusterIssuers (ACME DNS-01).
#
# Source of truth: secret/k8s/cert-manager/cloudflare-api-token (KV v2).
# The ClusterIssuer resolves this Secret in the cert-manager namespace, so the
# ExternalSecret lives there too. Replacements are picked up by cert-manager on
# the next issuance; no controller restart is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/cert-manager/cloudflare-api-token
