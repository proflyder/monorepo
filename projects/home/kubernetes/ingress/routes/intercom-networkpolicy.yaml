apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intercom-ingress
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: intercom
    app.kubernetes.io/part-of: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: intercom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: ${LAN_CIDR}
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8099
