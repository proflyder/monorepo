---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ha.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: home-assistant-external
          namespace: monitoring
          port: 8123
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: monitoring-grafana
          namespace: monitoring
          port: 80
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scheduler
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alarms.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: scheduler
          namespace: home-assistant
          port: 8098
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: currency-bot
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`currency.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: currency-bot
          namespace: currency-bot
          port: 8080
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ha-control
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`control.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: ha-control
          namespace: home-assistant
          port: 8099
    - match: Host(`control.${HOME_DOMAIN}`) && PathPrefix(`/v1/system/`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: mcp-gateway
          namespace: home-assistant
          port: 8080
  tls:
    secretName: home-wildcard-tls

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: intercom
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`intercom.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: intercom
          namespace: home-assistant
          port: 8099
          responseForwarding:
            flushInterval: 100ms
  tls:
    secretName: home-wildcard-tls
