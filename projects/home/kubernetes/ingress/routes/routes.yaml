# Public template. `deploy.sh` substitutes ${HOME_DOMAIN}.
#
# All routes share the `traefik` namespace with the wildcard TLS Secret and the
# IP allow-list Middleware; Services live in their application namespaces and
# are reached through `allowCrossNamespace`.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ha.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: home-assistant-external
          namespace: monitoring
          port: 8123
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: monitoring-grafana
          namespace: monitoring
          port: 80
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scheduler
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alarms.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: scheduler
          namespace: home-assistant
          port: 8098
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: currency-bot
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`currency.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: currency-bot
          namespace: currency-bot
          port: 8080
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ha-control
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`control.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: ha-control
          namespace: home-assistant
          port: 8099
  tls:
    secretName: home-wildcard-tls

---
# Intercom signaling is a long-lived server-streaming response (Connect
# envelope frames over HTTP/1.1): the `Watch` call stays open for the whole
# call. `flushInterval` makes Traefik forward each frame promptly instead of
# buffering it; the entrypoint timeouts in values/traefik.yaml keep a long-lived
# stream from being cut. The NodePort stays as the emergency path.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: intercom
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`intercom.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: intercom
          namespace: home-assistant
          port: 8099
          responseForwarding:
            flushInterval: 100ms
  tls:
    secretName: home-wildcard-tls
