# Public template. `deploy.sh` substitutes ${HAOS_ADDRESS} (private HAOS IPv4).
#
# HAOS is not a Kubernetes workload, so it is wired in as a headless Service
# with a manually managed EndpointSlice. The Traefik ingress route
# `ha.${HOME_DOMAIN}` targets this Service; HA continues to see the node address
# (192.0.2.27 in the public example) as the client and keeps trusting it.
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-external
  namespace: monitoring
spec:
  ports:
    - {name: http, port: 8123, targetPort: 8123}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-external
  namespace: monitoring
  labels:
    kubernetes.io/service-name: home-assistant-external
    endpointslice.kubernetes.io/managed-by: home-lab-manifests
addressType: IPv4
ports:
  - {name: http, protocol: TCP, port: 8123}
endpoints:
  - addresses: ["${HAOS_ADDRESS}"]
    conditions: {ready: true}
