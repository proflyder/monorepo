apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nexus-provision
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/nexus/provision
  prune: true
  force: true
  dependsOn:
    - name: nexus
