# Traefik ingress controller (hostNetwork, 80/443 on the node).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-traefik
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/ingress/traefik
  prune: true
  wait: true
  dependsOn:
    - name: platform-cert-manager
