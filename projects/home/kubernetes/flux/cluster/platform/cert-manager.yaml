# cert-manager and its Helm repository.
#
# Runs after External Secrets Operator so the Cloudflare solver Secret can be
# materialised by the routes Kustomization. The release keeps the live name and
# namespace, so helm-controller adopts it in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/ingress/cert-manager
  prune: true
  wait: true
  dependsOn:
    - name: platform-external-secrets
