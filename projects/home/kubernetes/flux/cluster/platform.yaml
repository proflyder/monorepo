apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/flux/cluster/platform
  prune: true
  wait: true
