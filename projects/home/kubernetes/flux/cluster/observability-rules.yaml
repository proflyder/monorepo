# Backup freshness alerts. Needs the Prometheus Operator CRDs from the
# `observability` Kustomization (the `monitoring` release).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-rules
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/observability/rules
  prune: true
  dependsOn:
    - name: observability
