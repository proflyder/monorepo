---
# Scheduler and the HA executors (решение 54). One Kustomization owns
# scheduler, ha-bridge, ha-control and ha-scenario because they share one
# template set; splitting it would make two `prune: true` Kustomizations fight
# over the same objects. Executor modes/replicas are pinned to the live
# steady state in the manifest patch (решение 54, cut over to Flux).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ha-executors
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/scheduler/manifests
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: scheduler
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: ha-bridge
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: ha-control
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: ha-scenario
      namespace: home-assistant
---
# ha-config-sync delivers projects/home-assistant/ha-voice to HAOS and keeps it
# in sync (PR-3). CI pins HA_CONFIG_SYNC_IMAGE on the `deploy/home-apps`
# branch; the manifests and the file set stay in `develop`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-ha-config-sync
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/ha-config-sync/manifests
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ha-config-sync
      namespace: home-assistant
---
# Hermes runtime Helm release (решение 54). The chart is in-repo, the
# values come from `runtime-values` (ESO), images from the pins branch, and a
# post-upgrade smoke hook plus `remediation.strategy: rollback` replace
# `home-deploy hermes rollout`'s smoke/rollback (решение 54, cut over
# to Flux). PV/PVC stay admin-owned.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-hermes
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home-assistant/deploy/flux
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: runtime
      namespace: flux-system
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: hermes-config-private
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: hermes
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: runtime-health-exporter
      namespace: home-assistant
