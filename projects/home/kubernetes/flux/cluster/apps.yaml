metadata:
  name: app-intercom
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/intercom/manifests
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: intercom
      namespace: home-assistant
---
# Currency bot, its Cloudflare Tunnel and the currency-bot namespace objects
# (решение 54), cut over to Flux. The namespace itself stays
# admin-owned; the tunnel route and host nftables rule remain manual.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-currency-bot
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/currency-bot/manifests
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: currency-bot
      namespace: currency-bot
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudflared
      namespace: currency-bot
---
