---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-pins
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/proflyder/monorepo
  ref:
    branch: deploy/home-apps
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-app-pins
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-pins
  path: ./pins
  prune: true
  wait: true
  dependsOn:
    - name: platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-wakegrant
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/wakegrant/manifests
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: wakegrant
      namespace: home-assistant
---
