  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/pve-exporter/manifests
  prune: true
  wait: false
  dependsOn:
    - name: platform
