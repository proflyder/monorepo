apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-hermes
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home-assistant/deploy/flux
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: home-app-pins
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: home-app-images
      - kind: Secret
        name: flux-app-settings
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: runtime
      namespace: flux-system
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: hermes-config-private
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: hermes
      namespace: home-assistant
    - apiVersion: apps/v1
      kind: Deployment
      name: runtime-health-exporter
      namespace: home-assistant
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
