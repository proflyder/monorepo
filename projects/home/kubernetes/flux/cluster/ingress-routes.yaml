# Shared routes, wildcard certificate, allow-list and backend wiring.
#
# Needs the cert-manager and Traefik CRDs (dependsOn) and the Cloudflare token
# ExternalSecret (external-secrets). `HOME_DOMAIN`, `LAN_CIDR` and
# `HAOS_ADDRESS` are substituted from the `flux-settings` Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-routes
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/ingress/routes
  prune: true
  wait: true
  dependsOn:
    - name: ingress-traefik
    - name: external-secrets
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-settings
