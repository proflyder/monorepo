apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/vaultwarden
  prune: true
  wait: true
  dependsOn:
    - name: platform
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-settings
