# Prometheus, Alertmanager, Grafana, Loki, Alloy and the project dashboards.
#
# Depends on ESO for the Grafana/Alertmanager Secrets. The private Grafana root
# URL and PVE scrape target come from the flux-settings Secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/observability
  prune: true
  wait: true
  dependsOn:
    - name: platform
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-settings
      # Application settings: the station scrape target is `${STATION_IP}`
      # (ESO renders the Secret in the individual app Kustomizations too).
      - kind: Secret
        name: flux-app-settings
