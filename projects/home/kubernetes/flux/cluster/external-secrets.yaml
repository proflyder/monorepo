# External Secrets Operator and the OpenBao ClusterSecretStore.
#
# Everything that materialises an application Secret depends on this
# Kustomization: without the operator its CRDs and the store, the later
# ExternalSecrets cannot be reconciled. OpenBao itself and its Kubernetes auth
# role stay outside Flux (see flux/README.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/external-secrets
  prune: true
  wait: true
