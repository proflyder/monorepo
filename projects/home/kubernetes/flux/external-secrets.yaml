# Flux credentials and deployment settings, materialised from OpenBao KV v2.
#
# Source of truth:
#   secret/k8s/flux-system/git-deploy-key -> Secret flux-system
#       identity      read-only SSH deploy key for github.com/proflyder/monorepo
#       known_hosts   pinned github.com host key
#   secret/k8s/flux-system/settings -> Secret flux-settings
#       NEXUS_HOST         internal Nexus name under the home suffix
#       NEXUS_PUBLIC_HOST  Cloudflare Tunnel name used by CI
#       NODE_LAN_IP        K3s node LAN address (NetworkPolicy + DNS)
#       HOME_DOMAIN        private home suffix (certificate and routes)
#       LAN_CIDR           LAN range for the Traefik allow-list
#       HAOS_ADDRESS       HAOS IPv4 for the home-assistant-external Service
#       PVE_NODE_TARGET    PVE node-exporter target (host:9100)
#   secret/k8s/flux-system/app-settings -> Secret flux-app-settings
#       WAKE_GRANT_NODE_PORT   wakegrant NodePort (30130 on the live cluster)
#       ...                    the remaining `secret/ci/deploy-home` app env
#                              keys move here as each unit migrates
#   secret/k8s/flux-system/runtime-values -> Secret runtime-values
#       values                 private Hermes workload values (YAML, no storage)
#
# `app-settings` is deliberately separate from `settings`: application env
# rotation must not touch infrastructure values. Every app Kustomization
# substitutes from it; see the flux README.
#
# Same contract as every other home Secret: ESO owns the object
# (`creationPolicy: Owner`), deleting the ExternalSecret keeps the live Secret
# (`deletionPolicy: Retain`). No secret value is ever committed to Git.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-git-deploy-key
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-system
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/git-deploy-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-settings
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-settings
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/settings
---
# Private application env, substituted by app Kustomizations through
# `postBuild.substituteFrom`. Values live only in OpenBao; this manifest is the
# contract. `deletionPolicy: Retain` keeps the live Secret if the object is
# removed, so running pods do not lose their configuration during an incident.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-app-settings
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-app-settings
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/app-settings
---
# Private Hermes runtime values, consumed by HelmRelease/runtime through
# `valuesFrom` (helm-controller reads values Secrets only in the HelmRelease
# namespace). The OpenBao record stores the YAML document in the single field
# `values`; the workload values must not contain the `storage` block, because
# PV/PVC are admin-owned (FLUX-APPS-PLAN 6.6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-runtime-values
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: runtime-values
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: values
      remoteRef:
        key: k8s/flux-system/runtime-values
        property: values
