---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-git-deploy-key
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-system
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/git-deploy-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-settings
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-settings
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/settings
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-app-settings
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-app-settings
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/app-settings
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-runtime-values
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: runtime-values
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: values
      remoteRef:
        key: k8s/flux-system/runtime-values
        property: values
