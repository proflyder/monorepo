# Flux credentials and deployment settings, materialised from OpenBao KV v2.
#
# Source of truth:
#   secret/k8s/flux-system/git-deploy-key -> Secret flux-system
#       identity      read-only SSH deploy key for github.com/proflyder/monorepo
#       known_hosts   pinned github.com host key
#   secret/k8s/flux-system/settings -> Secret flux-settings
#       NEXUS_HOST         internal Nexus name under the home suffix
#       NEXUS_PUBLIC_HOST  Cloudflare Tunnel name used by CI
#       NODE_LAN_IP        K3s node LAN address (NetworkPolicy + DNS)
#
# Same contract as every other home Secret: ESO owns the object
# (`creationPolicy: Owner`), deleting the ExternalSecret keeps the live Secret
# (`deletionPolicy: Retain`). No secret value is ever committed to Git.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-git-deploy-key
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-system
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/git-deploy-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-settings
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-settings
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/flux-system/settings
