# Git source and the root Kustomization.
#
# Applied once by `bootstrap.sh` after the toolkit and the deploy-key Secret
# exist. Everything below this point is pull-based: the source-controller
# clones the repository over SSH with the read-only deploy key, and no CI job
# ever needs cluster credentials to deploy infrastructure.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  url: ssh://git@github.com/proflyder/monorepo
  ref:
    branch: develop
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./projects/home/kubernetes/flux/cluster
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-settings
