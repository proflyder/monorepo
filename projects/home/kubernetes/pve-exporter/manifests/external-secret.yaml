apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pve-exporter
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pve-exporter
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        pve.yml: |
          default:
            user: "{{ .user }}"
            token_name: "{{ .token_name }}"
            token_value: "{{ .token_value }}"
            verify_ssl: false
  data:
    - secretKey: user
      remoteRef:
        key: k8s/monitoring/pve-exporter
        property: user
    - secretKey: token_name
      remoteRef:
        key: k8s/monitoring/pve-exporter
        property: token_name
    - secretKey: token_value
      remoteRef:
        key: k8s/monitoring/pve-exporter
        property: token_value
