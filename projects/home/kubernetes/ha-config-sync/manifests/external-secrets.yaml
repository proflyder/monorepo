# Credentials for ha-config-sync, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/home-assistant/ha-config-sync ->
#       ssh_private_key  restricted ed25519 key accepted only by the agent
#       known_hosts      pinned HAOS host key, [<HAOS addr>]:22222
#   secret/k8s/home-assistant/hermes-environment ->
#       HERMES_HA_TOKEN  the same long-lived HA token Hermes uses
#
# The key is created by `mise run admin:ha-config-sync-bootstrap` (owner step);
# the HA token already exists. Same policy contract as the other home Secrets:
# adopt the Secret in place and keep it if this object is removed by mistake.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-config-sync
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-config-sync
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ha-config-sync
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: k8s/home-assistant/ha-config-sync
        property: ssh_private_key
    - secretKey: known_hosts
      remoteRef:
        key: k8s/home-assistant/ha-config-sync
        property: known_hosts
    - secretKey: ha_token
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: HERMES_HA_TOKEN
