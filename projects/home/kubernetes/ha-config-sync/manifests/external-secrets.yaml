apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-config-sync
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-config-sync
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: ha-config-sync
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: k8s/home-assistant/ha-config-sync
        property: ssh_private_key
    - secretKey: known_hosts
      remoteRef:
        key: k8s/home-assistant/ha-config-sync
        property: known_hosts
    - secretKey: ha_token
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: HERMES_HA_TOKEN
