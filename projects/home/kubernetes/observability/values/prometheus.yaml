fullnameOverride: monitoring
alertmanager:
  alertmanagerSpec:
    replicas: 1
    # Rendered by External Secrets Operator (Telegram receiver); see
    # projects/home/kubernetes/observability/manifests/external-secret-alertmanager-telegram.yaml.
    configSecret: alertmanager-telegram
    # Message templates (projects/home/kubernetes/observability/alertmanager).
    configMaps: [alertmanager-templates]
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-retain
    size: 2Gi
    annotations:
      helm.sh/resource-policy: keep
  deploymentStrategy: {type: Recreate}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
  grafana.ini:
    server:
      # Private suffix substituted from the flux-settings Secret.
      root_url: https://grafana.${HOME_DOMAIN}/
      serve_from_sub_path: false
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 12GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 20Gi}
    # PVE node-exporter textfile metrics (vzdump freshness). The private
    # host:port is substituted from flux-settings; the values file is public.
    additionalScrapeConfigs:
      - job_name: pve-node
        scrape_interval: 30s
        static_configs:
          - targets: ["${PVE_NODE_TARGET}"]
            labels:
              instance: pve
              role: proxmox
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
nodeExporter: {enabled: true}
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
prometheus-node-exporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}
  # offsite_backup.py writes home_offsite_backup_* metrics as a textfile here.
  # The directory must exist on the node; projects/home/backup/offsite/install.sh
  # creates it before the next Helm upgrade.
  extraArgs:
    - --collector.textfile.directory=/var/lib/node-exporter-textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node-exporter-textfile
      mountPath: /var/lib/node-exporter-textfile
      readOnly: true
