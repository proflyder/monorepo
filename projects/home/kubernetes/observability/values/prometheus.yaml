fullnameOverride: monitoring
# The default delivery-rate alerts cannot separate the heartbeat webhook from
# real integrations. They are redeclared with an `integration!="webhook"`
# filter in rules/prometheusrule-alertmanager.yaml, together with
# HeartbeatPingFailing for persistent ping failures.
defaultRules:
  disabled:
    AlertmanagerFailedToSendAlerts: true
    AlertmanagerClusterFailedToSendAlerts: true
alertmanager:
  alertmanagerSpec:
    replicas: 1
    # Rendered by External Secrets Operator (Telegram receiver); see
    # projects/home/kubernetes/observability/manifests/external-secret-alertmanager-telegram.yaml.
    configSecret: alertmanager-telegram
    # Message templates (projects/home/kubernetes/observability/alertmanager).
    configMaps: [alertmanager-templates]
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-retain
    size: 2Gi
    annotations:
      helm.sh/resource-policy: keep
  deploymentStrategy: {type: Recreate}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
  grafana.ini:
    server:
      # Private suffix substituted from the flux-settings Secret.
      root_url: https://grafana.${HOME_DOMAIN}/
      serve_from_sub_path: false
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 12GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 20Gi}
    # PVE node-exporter textfile metrics (vzdump freshness). The private
    # host:port is substituted from flux-settings; the values file is public.
    additionalScrapeConfigs:
      - job_name: pve-node
        scrape_interval: 30s
        static_configs:
          - targets: ["${PVE_NODE_TARGET}"]
            labels:
              instance: pve
              role: proxmox
      # The station (Yandex Station Midi running Pulsar) is an external
      # target on the LAN: Pulsar serves Prometheus text on 9101. The address
      # comes from flux-app-settings (`STATION_IP`), never from Git.
      - job_name: station
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: /metrics
        static_configs:
          - targets: ["${STATION_IP}:9101"]
            labels:
              instance: station
              role: speaker
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
nodeExporter: {enabled: true}
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  # Flux 2.x controllers publish no reconcile-status metrics: source-,
  # kustomize- and helm-controller only expose `gotk_reconcile_duration_seconds_*`
  # and `gotk_token_*`. Readiness therefore comes from kube-state-metrics
  # customResourceState, which turns each Flux object into
  # `gotk_resource_info{...}` (recipe: fluxcd/flux2-monitoring-example).
  #
  # `collectors` and `--custom-resource-state-only=true` are deliberately NOT
  # taken from the upstream recipe: the default collectors must keep running,
  # because PinsStale also relies on `kube_configmap_info` for
  # `flux-system/home-app-images`.
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]

          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [status, history, "0", chartName]

          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]

          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]

          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
  # list/watch on exactly the CRDs configured above. kube-state-metrics needs
  # `customresourcedefinitions` too; the chart adds that rule when
  # customResourceState is enabled.
  rbac:
    extraRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        resources: [kustomizations]
        verbs: [list, watch]
      - apiGroups: [helm.toolkit.fluxcd.io]
        resources: [helmreleases]
        verbs: [list, watch]
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [gitrepositories, helmrepositories, ocirepositories]
        verbs: [list, watch]
prometheus-node-exporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}
  # offsite_backup.py writes home_offsite_backup_* metrics as a textfile here.
  # The directory must exist on the node; projects/home/backup/offsite/install.sh
  # creates it before the next Helm upgrade.
  extraArgs:
    - --collector.textfile.directory=/var/lib/node-exporter-textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node-exporter-textfile
      mountPath: /var/lib/node-exporter-textfile
      readOnly: true
