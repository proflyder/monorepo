fullnameOverride: monitoring
defaultRules:
  disabled:
    AlertmanagerFailedToSendAlerts: true
    AlertmanagerClusterFailedToSendAlerts: true
alertmanager:
  alertmanagerSpec:
    replicas: 1
    configSecret: alertmanager-telegram
    configMaps: [alertmanager-templates]
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-retain
    size: 2Gi
    annotations:
      helm.sh/resource-policy: keep
  deploymentStrategy: {type: Recreate}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
  grafana.ini:
    server:
      root_url: https://grafana.${HOME_DOMAIN}/
      serve_from_sub_path: false
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folderAnnotation: grafana_folder
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 12GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 20Gi}
    additionalScrapeConfigs:
      - job_name: pve-node
        scrape_interval: 30s
        static_configs:
          - targets: ["${PVE_NODE_TARGET}"]
            labels:
              instance: pve
              role: proxmox
      - job_name: station
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: /metrics
        static_configs:
          - targets: ["${STATION_IP}:9101"]
            labels:
              instance: station
              role: speaker
      - job_name: pve-guests
        scrape_interval: 30s
        scrape_timeout: 20s
        metrics_path: /pve
        params:
          module: [default]
          cluster: ["1"]
          node: ["1"]
        static_configs:
          - targets: ["${PVE_NODE_TARGET}"]
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.+):\d+'
            target_label: __param_target
          - target_label: __address__
            replacement: pve-exporter.monitoring.svc:9221
          - target_label: instance
            replacement: pve
prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
nodeExporter: {enabled: true}
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]

          - groupVersionKind:
              group: helm.toolkit.fluxcd.io
              version: v2
              kind: HelmRelease
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [status, history, "0", chartName]

          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: GitRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]

          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: HelmRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]

          - groupVersionKind:
              group: source.toolkit.fluxcd.io
              version: v1
              kind: OCIRepository
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
  rbac:
    extraRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        resources: [kustomizations]
        verbs: [list, watch]
      - apiGroups: [helm.toolkit.fluxcd.io]
        resources: [helmreleases]
        verbs: [list, watch]
      - apiGroups: [source.toolkit.fluxcd.io]
        resources: [gitrepositories, helmrepositories, ocirepositories]
        verbs: [list, watch]
prometheus-node-exporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}
  extraArgs:
    - --collector.textfile.directory=/var/lib/node-exporter-textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node-exporter-textfile
      mountPath: /var/lib/node-exporter-textfile
      readOnly: true
