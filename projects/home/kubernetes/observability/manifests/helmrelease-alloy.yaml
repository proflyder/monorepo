# Alloy, adopted from the live `alloy` release (same values file as before).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  targetNamespace: monitoring
  releaseName: alloy
  storageNamespace: monitoring
  chart:
    spec:
      chart: alloy
      version: "1.14.3"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    timeout: 10m
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values
      valuesKey: alloy.yaml
