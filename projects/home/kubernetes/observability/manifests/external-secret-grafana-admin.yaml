# Grafana administrator credentials.
#
# Source of truth: secret/k8s/monitoring/grafana-admin (KV v2). The
# kube-prometheus-stack values reference `existingSecret: grafana-admin`; the
# Secret keeps the same name and keys (`admin-user`, `admin-password`), so
# Grafana only reads the new value on its next start/credential reload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/monitoring/grafana-admin
