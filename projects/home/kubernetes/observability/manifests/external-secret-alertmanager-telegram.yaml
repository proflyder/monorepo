# Alertmanager configuration with the Telegram receiver.
#
# The whole alertmanager.yaml is rendered by External Secrets Operator because
# it carries the bot token and the owner's chat id. Both come from the
# currency bot's entry secret/k8s/currency-bot/currency-bot, so the token has
# one source of truth: BOT_TOKEN, and the second CHAT_ID entry (the owner's
# private chat; the first one is the channel that receives rate alerts).
# kube-prometheus-stack points the Alertmanager at this Secret through
# alertmanagerSpec.configSecret.
#
# Only warning/critical alerts are sent. Watchdog is always firing and
# info alerts are noise; both go to the "null" receiver.
#
# The message layout lives in ../alertmanager/telegram.tmpl (ConfigMap
# alertmanager-templates, mounted via alertmanagerSpec.configMaps). The
# `message` line is a Go raw string so ESO leaves the Alertmanager template
# call untouched.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          templates:
            - /etc/alertmanager/configmaps/alertmanager-templates/*.tmpl
          route:
            receiver: "null"
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: "null"
                matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
              - receiver: telegram
                matchers: ['severity =~ "warning|critical"']
          inhibit_rules:
            - source_matchers: ['severity = critical']
              target_matchers: ['severity =~ warning|info']
              equal: [namespace, alertname]
            - source_matchers: ['severity = warning']
              target_matchers: ['severity = info']
              equal: [namespace, alertname]
            - source_matchers: ['alertname = InfoInhibitor']
              target_matchers: ['severity = info']
              equal: [namespace]
          receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
                - bot_token: '{{ .bot_token | trim }}'
                  chat_id: {{ index (splitList "," .chat_ids) 1 | trim }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ `{{ template "telegram.home.message" . }}` }}'
  data:
    - secretKey: bot_token
      remoteRef:
        key: k8s/currency-bot/currency-bot
        property: BOT_TOKEN
    - secretKey: chat_ids
      remoteRef:
        key: k8s/currency-bot/currency-bot
        property: CHAT_ID
