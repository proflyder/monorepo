apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          templates:
            - /etc/alertmanager/configmaps/alertmanager-templates/*.tmpl
          route:
            receiver: "null"
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - receiver: heartbeat
                matchers: ['alertname = "Watchdog"']
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 5m
              - receiver: "null"
                matchers: ['alertname = "InfoInhibitor"']
              - receiver: telegram
                matchers: ['severity =~ "warning|critical"']
          inhibit_rules:
            - source_matchers: ['severity = critical']
              target_matchers: ['severity =~ warning|info']
              equal: [namespace, alertname]
            - source_matchers: ['severity = warning']
              target_matchers: ['severity = info']
              equal: [namespace, alertname]
            - source_matchers: ['alertname = InfoInhibitor']
              target_matchers: ['severity = info']
              equal: [namespace]
          receivers:
            - name: "null"
            - name: heartbeat
              webhook_configs:
                - url: '{{ .heartbeat_url | trim }}'
                  send_resolved: false
                  # Bound one webhook attempt so Alertmanager can retry inside
                  # the 1m group_interval instead of hitting the group context
                  # deadline. Alertmanager 0.34 http_config has no keep-alive
                  # switch, so an expired NAT mapping is only healed by a fresh
                  # retry, not disabled client-side.
                  timeout: 10s
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: '{{ .heartbeat_token | trim }}'
            - name: telegram
              telegram_configs:
                - bot_token: '{{ .bot_token | trim }}'
                  chat_id: {{ index (splitList "," .chat_ids) 0 | trim }}
                  parse_mode: HTML
                  send_resolved: true
                  message: '{{ `{{ template "telegram.home.message" . }}` }}'
              webhook_configs:
                - url: http://mcp-gateway.home-assistant.svc.cluster.local:8080/v1/chat/alerts
                  send_resolved: true
                  timeout: 10s
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: '{{ .chat_alerts_token | trim }}'
  data:
    - secretKey: bot_token
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: TELEGRAM_BOT_TOKEN
    - secretKey: chat_ids
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: TELEGRAM_ALLOWED_USERS
    - secretKey: chat_alerts_token
      remoteRef:
        key: k8s/home-assistant/chat-alerts
        property: token
    - secretKey: heartbeat_url
      remoteRef:
        key: k8s/monitoring/heartbeat
        property: url
    - secretKey: heartbeat_token
      remoteRef:
        key: k8s/monitoring/heartbeat
        property: token
