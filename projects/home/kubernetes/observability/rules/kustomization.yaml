# Backup freshness, Alertmanager delivery and Flux delivery rules, plus the
# Flux controller PodMonitor. Split out because PrometheusRule/PodMonitor need
# the Prometheus Operator CRDs that the `monitoring` release installs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule-backups.yaml
  - prometheusrule-alertmanager.yaml
  - prometheusrule-flux.yaml
  - podmonitor-flux.yaml
