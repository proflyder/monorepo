# The `nexus-provision` ConfigMap is generated from `provision.sh` by
# kustomize; configMapGenerator puts the content hash in the generated name and
# the volume below mounts that generated name. A changed script changes the Job
# spec, so the Flux Kustomization (`force: true`) recreates the immutable Job
# and provisioning runs again; an unchanged script is a no-op.
# The completed Job is kept (its logs are the provisioning record); Flux
# replaces it only when the script or another immutable field changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-provision
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/part-of: home
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: nexus-provision
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: NEXUS_URL
              value: http://nexus.nexus.svc:8081
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: admin_password
            - name: NEXUS_CI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: ci_reader_password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: nexus-provision
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
