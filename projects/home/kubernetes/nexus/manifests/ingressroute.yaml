---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nexus-public-limits
  namespace: traefik
spec:
  buffering:
    maxRequestBodyBytes: 8388608
    memRequestBodyBytes: 1048576
  rateLimit:
    average: 200
    burst: 400
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nexus-public
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`${NEXUS_HOST}`) || Host(`${NEXUS_PUBLIC_HOST}`)) && PathPrefix(`/repository/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: nexus-public-limits
      services:
        - name: nexus
          namespace: nexus
          port: 8081
  tls:
    secretName: home-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nexus-admin
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${NEXUS_HOST}`)
      kind: Rule
      priority: 10
      middlewares:
        - name: home-allowlist
        - name: nexus-public-limits
      services:
        - name: nexus
          namespace: nexus
          port: 8081
  tls:
    secretName: home-wildcard-tls
