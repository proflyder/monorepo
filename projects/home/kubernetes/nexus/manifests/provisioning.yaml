# TEMPLATE rendered by deploy.sh:
#   NEXUS_PROVISION_IMAGE  curl image pinned by tag and digest (versions.sh)
#
# `deploy.sh` creates the `nexus-provision` ConfigMap from `provision.sh` and
# recreates this Job on every apply, so the API state converges to the script
# even when the StatefulSet did not roll. The Job is safe to delete and re-run
# by hand; `ttlSecondsAfterFinished` cleans up successful runs on its own.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-provision
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/part-of: ricardo-home
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: ${NEXUS_PROVISION_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: NEXUS_URL
              value: http://nexus.nexus.svc:8081
            - name: NEXUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: admin_password
            - name: NEXUS_CI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: ci_reader_password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: nexus-provision
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
