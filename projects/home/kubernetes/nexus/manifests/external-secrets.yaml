# Nexus credentials, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/nexus/nexus-secrets -> Secret nexus-secrets
#       admin_password      initial `admin` password (seeded on a fresh PVC)
#       ci_reader_password  password of the read-only `ci-reader` user
#
# Same contract as the other home Secrets: the ExternalSecret owns the Secret
# (creationPolicy Owner); deleting the ExternalSecret keeps the live Secret
# (deletionPolicy Retain). No secret value is ever rendered into this repo.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-secrets
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nexus-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/nexus/nexus-secrets
