---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexus-secrets
  namespace: nexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nexus-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/nexus/nexus-secrets
