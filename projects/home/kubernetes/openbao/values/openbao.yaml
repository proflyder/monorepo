global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false
csi:
  enabled: false

server:
  image:
    registry: quay.io
    repository: openbao/openbao
    tag: "__OPENBAO_IMAGE_TAG__"
    pullPolicy: IfNotPresent

  logLevel: info
  logFormat: json

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  affinity: ""

  updateStrategyType: OnDelete

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "raft" {
        path    = "/openbao/data"
        node_id = "openbao-0"
      }

      # Auto-unseal: after a node reboot the pod unseals itself without a
      # person. The key is a Kubernetes Secret mounted read-only below.
      seal "static" {
        current_key_id = "static-1"
        current_key    = "file:///openbao/seal/unseal.key"
      }

      # Declarative audit device (OpenBao 2.7 refuses API enablement). The
      # device is (re)created on start and SIGHUP. It writes to stdout: kubelet
      # rotates the container log and Alloy ships it to Loki, so a full audit
      # disk can never block requests. Values in audit entries are HMACed.
      audit "file" "stdout" {
        options {
          file_path = "stdout"
        }
      }

  dataStorage:
    enabled: true
    size: 10Gi
    mountPath: "/openbao/data"
    storageClass: ricardo-existing

  auditStorage:
    enabled: false

  volumes:
    - name: seal
      secret:
        secretName: openbao-seal
        defaultMode: 288
  volumeMounts:
    - name: seal
      mountPath: /openbao/seal
      readOnly: true

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200
    active:
      enabled: false
    standby:
      enabled: false

  authDelegator:
    enabled: true

  networkPolicy:
    enabled: false

  livenessProbe:
    enabled: false
