apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${VAULT_HOST}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: openbao
          namespace: openbao
          port: 8200
  tls:
    secretName: home-wildcard-tls
