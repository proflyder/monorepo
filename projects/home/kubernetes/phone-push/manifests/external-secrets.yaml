# phone-push credentials, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/home-assistant/scheduler-auth -> token
#       the one app bearer token: the MCP gateway presents it to phone-push and
#       phone-push presents it to the scheduler device registry
#   secret/k8s/home-assistant/phone-push -> service_account_json
#       the FCM service account (Firebase Cloud Messaging API Admin role). The
#       owner creates it in the Firebase/GCP console and stores it here; this
#       manifest only declares the hand-off and never contains a value.
#
# The FCM credential lives only in this pod. The MCP gateway, Hermes and the
# phone never see it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phone-push
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: phone-push
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: phone-push
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: token
    - secretKey: service_account_json
      remoteRef:
        key: k8s/home-assistant/phone-push
        property: service_account_json
