apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: phone-push
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: phone-push
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: phone-push
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: service_token
      remoteRef:
        key: k8s/home-assistant/scheduler-auth
        property: service_token
    - secretKey: service_account_json
      remoteRef:
        key: k8s/home-assistant/phone-push
        property: service_account_json
