apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - phone-push.yaml
  - network-policies.yaml
  - external-secrets.yaml
patches:
  - target:
      kind: Deployment
      name: phone-push
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${PHONE_PUSH_IMAGE}
