apiVersion: apps/v1
kind: Deployment
metadata:
  name: phone-push
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: phone-push
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: phone-push
  template:
    metadata:
      labels:
        app.kubernetes.io/name: phone-push
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: phone-push
          image: ${PHONE_PUSH_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUSH_LISTEN
              value: 0.0.0.0:8095
            - name: PUSH_SERVICE_TOKEN_FILE
              value: /run/secrets/phone-push/service_token
            - name: PUSH_SCHEDULER_URL
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: PUSH_SCHEDULER_SERVICE_TOKEN_FILE
              value: /run/secrets/phone-push/service_token
            - name: PUSH_FCM_SERVICE_ACCOUNT_FILE
              value: /run/secrets/phone-push/service_account_json
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8095
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/phone-push", "-healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 7
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/phone-push
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: phone-push
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: phone-push
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: phone-push
    app.kubernetes.io/part-of: home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: phone-push
  ports:
    - name: http
      port: 8095
      targetPort: http
      protocol: TCP
