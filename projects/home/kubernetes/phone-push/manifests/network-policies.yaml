apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phone-push-ingress
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: phone-push
    app.kubernetes.io/part-of: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phone-push
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
        - ipBlock:
            cidr: ${NODE_LAN_IP}/32
      ports:
        - protocol: TCP
          port: 8095
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phone-push-egress
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: phone-push
    app.kubernetes.io/part-of: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phone-push
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
      ports:
        - protocol: TCP
          port: 8098
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
