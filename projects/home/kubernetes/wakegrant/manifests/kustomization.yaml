apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - wakegrant.yaml
  - external-secrets.yaml
patches:
  - target:
      kind: PersistentVolumeClaim
      name: wakegrant-data
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: Deployment
      name: wakegrant
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${WAKEGRANT_IMAGE}
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ${WAKEGRANT_IMAGE}
