apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wakegrant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: wakegrant
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wakegrant
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/wakegrant
