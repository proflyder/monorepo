# wakegrant credentials, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/home-assistant/wakegrant ->
#       issuer_token  bearer token Home Assistant sends as the issuer
#       machines      {"komp":"<base64 32-byte key>"} (or KEY=VALUE lines)
#
# Same policy contract as the other home Secrets: adopt the existing Secret in
# place and keep it if this object is removed by mistake. A deploy script never
# writes these values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wakegrant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: wakegrant
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wakegrant
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/wakegrant
