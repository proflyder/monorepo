  # -------------------------------------------------------------- platform ----
  # Кластерная платформа: Flux, Nexus и системные компоненты K3s. Restart для
  # них запрещён: ими управляют Flux и сам K3s, а не этот шлюз.
  - id: nexus
    title: Nexus
    group: Платформа
    aliases:
      ru: [нексус, репозиторий артефактов]
      en: [nexus, artifacts]
    kind: k8s
    namespace: nexus
    workload:
      kind: StatefulSet
      name: nexus
    containers: [nexus]
    signals:
      - promql: kube_statefulset_status_replicas_ready{namespace="nexus",statefulset="nexus"} < 1
        meaning: Nexus недоступен
        status: true
    logs:
      source: pods
    restart:
      allowed: true
      warning: "CI потеряет доступ к кэшу артефактов, сборки и загрузки зависимостей приостановятся на несколько минут."
    description: Репозиторий артефактов для CI (StatefulSet, PVC, read-only /repository).

