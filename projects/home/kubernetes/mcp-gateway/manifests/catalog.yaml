  # -------------------------------------------------------------- external ----
  - id: home-assistant
    title: Home Assistant
    group: Дом
    host_title: HAOS VM
    aliases:
      ru: [home assistant, ха, дом, хом ассистент]
      en: [home-assistant, ha, home]
    kind: external
    signals:
      - promql: home_endpoint_up{endpoint="ha"} == 0
        meaning: Home Assistant не отвечает
        status: true
    checks:
      - type: http
        label: REST API
        url: "http://${HAOS_IP}:8123/api/"
        expect_status: 200
        auth: ha
      - type: ha_unavailable_summary
        label: недоступные сущности
        # Только голосовой спутник и медиаплееры: диагностические сенсоры и
        # отключённые устройства не должны делать отчёт «проблемным».
        domains: [assist_satellite, media_player]
    logs:
      source: none
    restart:
      allowed: false
    description: HAOS VM (add-ons MA и Matter). Перезапуск — только вручную в Proxmox/HA.

  - id: music-assistant
    title: Music Assistant
    group: Дом
    host_title: HAOS VM
    aliases:
      ru: [музыка, музыкальный ассистент, ма]
      en: [music-assistant, ma, music]
    kind: external
    signals:
      - promql: home_endpoint_up{endpoint="music_assistant"} == 0
        meaning: Music Assistant не отвечает
        status: true
    checks:
      - type: tcp
        label: API
        host: ${HAOS_IP}
        port: 8095
      # Отдельного health-endpoint у MA нет; корень UI отвечает 200.
      - type: http
        label: веб-интерфейс
        url: "http://${HAOS_IP}:8095/"
        expect_status: 200
    logs:
      source: none
    restart:
      allowed: false
    description: Music Assistant — add-on в HAOS. Перезапуск только вручную.

  - id: station
    title: Станция Midi (Pulsar)
    group: Дом
    host_title: Станция
    aliases:
      ru: [станция, колонка, рикардо]
      en: [station, speaker, pulsar]
    kind: external
    checks:
      - type: tcp
        label: ESPHome
        host: ${STATION_IP}
        port: 6053
      - type: tcp
        label: Sendspin
        host: ${STATION_IP}
        port: 8928
      - type: tcp
        label: HTTP control
        host: ${STATION_IP}
        port: 8099
      - type: ha_state
        label: Assist-спутник
        entity_id: assist_satellite.iandeks_stantsiia_midi_assist_satellite
      - type: ha_state
        label: ESPHome media player
        entity_id: media_player.iandeks_stantsiia_midi_media_player
      # Версия прошивки Pulsar из Device Registry: справочно, не влияет на статус.
      - type: ha_template
        label: Версия Pulsar
        template: "{{ device_attr(device_id('assist_satellite.iandeks_stantsiia_midi_assist_satellite'), 'sw_version') }}"
    logs:
      source: none
    restart:
      allowed: false
    description: Колонка Midi с Pulsar/ESPHome. Метрик и логов в кластере нет; доступность — TCP и сущности HA.

  - id: proxmox
    title: Proxmox VE
    group: Платформа
    host_title: Proxmox VE
    aliases:
      ru: [проксмокс, гипервизор]
      en: [proxmox, pve, hypervisor]
    kind: external
    checks:
      # Веб-интерфейс PVE слушает только TLS с самоподписанным сертификатом,
      # а публичный клиент проверок доверяет только публичным CA: проверяем
      # доступность порта, а не HTTPS-ответ.
      - type: tcp
        label: веб-интерфейс 8006
        host: ${PVE_IP}
        port: 8006
    logs:
      source: none
    restart:
      allowed: false
    description: Гипервизор Proxmox VE; HAOS и K3s — его виртуальные машины. Перезапуск только вручную.

  - id: vpn
    title: VPN (ocserv)
    group: Платформа
    host_title: VPN CT 102
    aliases:
      ru: [впн, випиэн, оксерв]
      en: [vpn, ocserv, openconnect]
    kind: external
    checks:
      - type: tcp
        label: ocserv TLS/DTLS
        host: ${VPN_CT_IP}
        port: 443
    logs:
      source: none
    restart:
      allowed: false
    description: Удалённый вход в домашнюю LAN (ocserv, пароль и TOTP). Перезапуск только вручную в Proxmox.

  - id: bb-host
    title: BB Host
    group: Платформа
    host_title: BB CT 103
    aliases:
      ru: [биби хост, сервер агентов]
      en: [bb host, agents host]
    kind: external
    checks:
      - type: tcp
        label: SSH моста
        host: ${BB_CT_IP}
        port: 22
    logs:
      source: none
    restart:
      allowed: false
    description: Хост bb и forced-command моста для bb.read/bb.act. Входящих портов, кроме SSH, не публикует.
