# Gateway secrets, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/home-assistant/mcp-gateway-auth        -> Secret mcp-gateway-auth
#       token            (bearer token shared with Hermes: HERMES_INFRA_TOKEN)
#   secret/k8s/home-assistant/hermes-environment      -> Secret mcp-gateway-telegram
#       TELEGRAM_BOT_TOKEN   -> token
#       TELEGRAM_ALLOWED_USERS -> chat_id
#   secret/k8s/home-assistant/ha-bridge-ha            -> Secret mcp-gateway-ha
#       token                (same long-lived HA token as the scheduler bridge)
#   secret/k8s/home-assistant/mcp-gateway-bb-ssh      -> Secret mcp-gateway-bb-ssh
#       id_ed25519           (restricted key accepted only by the forced command)
#       known_hosts          (pinned host key of the bb host)
#   secret/k8s/home-assistant/mcp-gateway-voice       -> Secret mcp-gateway-voice
#       token                (dedicated voice-proxy token, never the MCP token)
#
# The Telegram keys are owned by the Hermes environment because the same bot is
# the inbound chat channel for Hermes: one dedicated infra bot, one owner
# allow-list. The gateway reads the owner id (the first CSV entry) as the
# fixed report recipient, so the model can never address another chat.
#
# Same policy contract as the other home Secrets: the ExternalSecret owns the
# Secret in place (creationPolicy Owner) and a mistaken delete of the
# ExternalSecret does not delete the live Secret (deletionPolicy Retain).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-auth
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/mcp-gateway-auth
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-telegram
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: TELEGRAM_BOT_TOKEN
    - secretKey: chat_id
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: TELEGRAM_ALLOWED_USERS
---
# Home Assistant REST token for the ha_* catalog checks. The scheduler's
# ha-bridge reads the same OpenBao key, so the token has one source of truth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-ha
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-ha
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/ha-bridge-ha
        property: token
---
# Restricted ed25519 key plus the pinned host key of the bb host. The key is
# accepted only through the forced command on CT 103 (see
# projects/home/proxmox/bb/README.md); it cannot open a shell.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-bb-ssh
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-bb-ssh
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: k8s/home-assistant/mcp-gateway-bb-ssh
        property: id_ed25519
    - secretKey: known_hosts
      remoteRef:
        key: k8s/home-assistant/mcp-gateway-bb-ssh
        property: known_hosts
---
# Dedicated voice-proxy bearer token. It only authorises /v1/voice/* and is
# rejected on /mcp; the Hermes token is rejected on /v1/voice/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-voice
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: ricardo-home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-voice
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/mcp-gateway-voice
        property: token
