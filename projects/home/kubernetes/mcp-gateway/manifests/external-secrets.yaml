---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-auth
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/mcp-gateway-auth
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-telegram
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: TELEGRAM_BOT_TOKEN
    - secretKey: chat_id
      remoteRef:
        key: k8s/home-assistant/hermes-environment
        property: TELEGRAM_ALLOWED_USERS
