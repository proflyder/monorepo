# RBAC for the MCP gateway pod itself. Applied by Flux, never by hand:
#
# Surface:
#   * ONE cluster-wide read ClusterRole: get/list on pods, pods/log, events,
#     services, the three workload kinds and ReplicaSets, plus the Flux
#     Kustomization and HelmRelease CRDs. The report lists every workload in
#     every namespace to prove that nothing runs outside the catalog, so the
#     read grant cannot be namespace-scoped; it never includes write verbs.
#   * patch ONLY on the exact workload names whose catalog entry has
#     `restart.allowed: true`, restricted with resourceNames in a per-namespace
#     Role. No other verb and no other object is reachable, so the catalog is
#     the real allow-list and RBAC enforces the same set.
#
# `kube-system` and `flux-system` are read-only on purpose: their workloads
# belong to K3s and to the Flux bootstrap, so the gateway may look but never
# restart anything. Namespaces without a restart Role cannot be mutated at all.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-gateway-read
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  # Flux: the report requires every Kustomization and HelmRelease to be
  # Ready=True. Read-only, like everything else.
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-gateway-read
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-gateway-read
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway-restart
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - hermes
      - gigaam
      - whisper
      - piper
      - runtime-health-exporter
      - scheduler
      - ha-bridge
      - ha-control
      - ha-scenario
      - intercom
      - wakegrant
      - mcp-gateway
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway-restart
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-gateway-restart
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway-restart
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mcp-gateway
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - monitoring-grafana
      - monitoring-kube-state-metrics
      - monitoring-operator
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames:
      - prometheus-monitoring-prometheus
      - alertmanager-monitoring-alertmanager
      - loki
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames:
      - monitoring-prometheus-node-exporter
      - alloy
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway-restart
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mcp-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-gateway-restart
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: home-assistant
