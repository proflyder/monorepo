---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-gateway-read
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-gateway-read
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-gateway-read
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway-restart
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - hermes
      - gigaam
      - whisper
      - piper
      - runtime-health-exporter
      - scheduler
      - ha-bridge
      - ha-control
      - ha-scenario
      - intercom
      - wakegrant
      - mcp-gateway
      - ha-config-sync
      - phone-push
      - secrets-gateway
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway-restart
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-gateway-restart
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: home-assistant
---
apiVersion: rbac.authorization.k8s.io/v1
