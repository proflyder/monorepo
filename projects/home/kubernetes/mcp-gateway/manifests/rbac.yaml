    resources: ["deployments"]
    resourceNames:
      - monitoring-grafana
      - monitoring-kube-state-metrics
      - monitoring-operator
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames:
      - prometheus-monitoring-prometheus
      - alertmanager-monitoring-alertmanager
      - loki
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames:
      - monitoring-prometheus-node-exporter
      - alloy
    verbs: ["patch"]
