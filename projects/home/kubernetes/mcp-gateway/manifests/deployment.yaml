# MCP infra gateway: one Deployment, one ClusterIP Service.
#
# TEMPLATE. deploy.sh renders it with private values (NODE_LAN_IP is used by the
# NetworkPolicy, the image digest comes from the Bazel build); rendered
# manifests are never committed.
#
#   MCP_GATEWAY_IMAGE   digest-pinned image built by Bazel
#   BUILD_ID            Deployment annotation (traceability, never rolls pods)
#   ROLLOUT_ID          content-addressed pod-template annotation
#
# The pod runs as 65534 with a read-only root filesystem. It has a
# ServiceAccount token on purpose: the only cluster access in the whole voice
# path goes through this pod (Hermes itself has none).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
  annotations:
    # Traceability only: a Deployment metadata change never rolls pods.
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  # A second replica would double the pending-action store and the cooldown
  # bookkeeping is per pod, so the gateway stays single-writer.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
      annotations:
        # Content-addressed: identical rendered content keeps the pod template.
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      serviceAccountName: mcp-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-gateway
          image: ${MCP_GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_GROUPS
              value: infra.read,infra.fix,infra.report,bb.read,bb.act,time
            - name: MCP_HTTP_ADDR
              value: ":8080"
            # Human-facing clock times in report/alert texts. IANA zone; the
            # binary embeds tzdata because the image is distroless.
            - name: MCP_TIMEZONE
              value: Asia/Almaty
            - name: MCP_AUTH_TOKEN_FILE
              value: /run/secrets/mcp-gateway-auth/token
            - name: MCP_INFRA_CATALOG_FILE
              value: /etc/mcp-gateway/catalog.yaml
            - name: MCP_PROMETHEUS_URL
              value: http://monitoring-prometheus.monitoring.svc:9090
            - name: MCP_ALERTMANAGER_URL
              value: http://monitoring-alertmanager.monitoring.svc:9093
            - name: MCP_LOKI_URL
              value: http://loki.monitoring.svc:3100
            # KUBERNETES_API_URL/TOKEN_FILE/CA_FILE are left at their in-cluster
            # defaults: https://kubernetes.default.svc and the projected
            # ServiceAccount volume.
            # Home Assistant REST for ha_* catalog checks. The token is the
            # same long-lived token the scheduler's ha-bridge uses; the URL is
            # rendered from the private deploy env (HAOS_IP).
            - name: MCP_HA_URL
              value: "http://${HAOS_IP}:8123"
            - name: MCP_HA_TOKEN_FILE
              value: /run/secrets/mcp-gateway-ha/token
            - name: TELEGRAM_BOT_TOKEN_FILE
              value: /run/secrets/mcp-gateway-telegram/token
            - name: TELEGRAM_CHAT_ID_FILE
              value: /run/secrets/mcp-gateway-telegram/chat_id
            # bb home-dispatcher: one SSH session per call through the
            # forced-command bridge. The gateway owns only the restricted key
            # and the pinned host key; the plugin token and HMAC secret stay on
            # the bb host.
            - name: MCP_BB_SSH_ADDR
              value: "${BB_CT_IP}:22"
            - name: MCP_BB_SSH_USER
              value: bb
            - name: MCP_BB_SSH_KEY_FILE
              value: /run/secrets/mcp-gateway-bb-ssh/id_ed25519
            - name: MCP_BB_KNOWN_HOSTS_FILE
              value: /run/secrets/mcp-gateway-bb-ssh/known_hosts
            - name: MCP_BB_TARGETS_FILE
              value: /etc/mcp-gateway/bb-targets.yaml
            - name: MCP_BB_DISPATCHER_THREAD_ID
              value: "${BB_DISPATCHER_THREAD_ID}"
            # Voice entry point: a separate bearer token, never the MCP token.
            - name: MCP_VOICE_TOKEN_FILE
              value: /run/secrets/mcp-gateway-voice/token
            # Durable scheduler for the `time` tools (alarms/timers/reminders).
            # The bearer is the scheduler's own OpenBao key; this is the same
            # Connect JSON API Home Assistant and Android use.
            - name: MCP_SCHEDULER_URL
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: MCP_SCHEDULER_TOKEN_FILE
              value: /run/secrets/mcp-gateway-scheduler/token
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The image is distroless: the probe is the binary itself, which loads
          # the configuration (token file, catalog, groups) and then calls
          # /healthz on loopback.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/mcp-gateway", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 7
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: catalog
              mountPath: /etc/mcp-gateway
              readOnly: true
            - name: auth
              mountPath: /run/secrets/mcp-gateway-auth
              readOnly: true
            - name: telegram
              mountPath: /run/secrets/mcp-gateway-telegram
              readOnly: true
            - name: ha
              mountPath: /run/secrets/mcp-gateway-ha
              readOnly: true
            - name: bb-ssh
              mountPath: /run/secrets/mcp-gateway-bb-ssh
              readOnly: true
            - name: voice
              mountPath: /run/secrets/mcp-gateway-voice
              readOnly: true
            - name: scheduler
              mountPath: /run/secrets/mcp-gateway-scheduler
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog
          configMap:
            name: mcp-gateway-catalog
            items:
              - key: catalog.yaml
                path: catalog.yaml
              - key: bb-targets.yaml
                path: bb-targets.yaml
        - name: auth
          secret:
            secretName: mcp-gateway-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: telegram
          secret:
            secretName: mcp-gateway-telegram
            defaultMode: 0440
            items:
              - key: token
                path: token
              - key: chat_id
                path: chat_id
        - name: ha
          secret:
            secretName: mcp-gateway-ha
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: bb-ssh
          secret:
            secretName: mcp-gateway-bb-ssh
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
        - name: voice
          secret:
            secretName: mcp-gateway-voice
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: scheduler
          secret:
            secretName: mcp-gateway-scheduler
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# ClusterIP only: the gateway is reachable from Hermes (hostNetwork, node
# address) and from Prometheus; it is never published through Traefik.
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
