apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-gateway-chat
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-gateway-media
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-gateway
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      enableServiceLinks: false
      serviceAccountName: mcp-gateway
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-gateway
          image: ${MCP_GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_GROUPS
              value: infra.read,infra.fix,infra.report,bb.read,bb.act,time,phone
            - name: MCP_HTTP_ADDR
              value: ":8080"
            - name: MCP_TIMEZONE
              value: Asia/Almaty
            - name: MCP_AUTH_TOKEN_FILE
              value: /run/secrets/mcp-gateway-auth/token
            - name: MCP_INFRA_CATALOG_FILE
              value: /etc/mcp-gateway/catalog.yaml
            - name: MCP_PROMETHEUS_URL
              value: http://monitoring-prometheus.monitoring.svc:9090
            - name: MCP_ALERTMANAGER_URL
              value: http://monitoring-alertmanager.monitoring.svc:9093
            - name: MCP_LOKI_URL
              value: http://loki.monitoring.svc:3100
            - name: MCP_HA_URL
              value: "http://${HAOS_IP}:8123"
            - name: MCP_HA_TOKEN_FILE
              value: /run/secrets/mcp-gateway-ha/token
            - name: TELEGRAM_BOT_TOKEN_FILE
              value: /run/secrets/mcp-gateway-telegram/token
            - name: TELEGRAM_CHAT_ID_FILE
              value: /run/secrets/mcp-gateway-telegram/chat_id
            - name: MCP_BB_SSH_ADDR
              value: "${BB_CT_IP}:22"
            - name: MCP_BB_SSH_USER
              value: bb
            - name: MCP_BB_SSH_KEY_FILE
              value: /run/secrets/mcp-gateway-bb-ssh/id_ed25519
            - name: MCP_BB_KNOWN_HOSTS_FILE
              value: /run/secrets/mcp-gateway-bb-ssh/known_hosts
            - name: MCP_BB_TARGETS_FILE
              value: /etc/mcp-gateway/bb-targets.yaml
            - name: MCP_BB_DISPATCHER_THREAD_ID
              value: "${BB_DISPATCHER_THREAD_ID}"
            - name: MCP_VOICE_TOKEN_FILE
              value: /run/secrets/mcp-gateway-voice/token
            - name: MCP_SCHEDULER_URL
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: MCP_SCHEDULER_TOKEN_FILE
              value: /run/secrets/mcp-gateway-scheduler/token
            - name: MCP_PUSH_URL
              value: http://phone-push.home-assistant.svc.cluster.local:8095
            - name: MCP_PUSH_TOKEN_FILE
              value: /run/secrets/mcp-gateway-scheduler/token
            - name: MCP_APP_TOKEN_FILE
              value: /run/secrets/mcp-gateway-scheduler/token
            - name: MCP_CHAT_HERMES_URL
              value: "http://${NODE_LAN_IP}:8644"
            - name: MCP_CHAT_HERMES_TOKEN_FILE
              value: /run/secrets/mcp-gateway-chat/token
            - name: MCP_CHAT_PROMPT_FILE
              value: /etc/mcp-gateway/chat-prompt.txt
            - name: MCP_CHAT_DB
              value: /var/lib/mcp-gateway/chat.db
            - name: MCP_CHAT_MEDIA_DIR
              value: /var/lib/mcp-gateway-media
            - name: MCP_CHAT_ALERTS_TOKEN_FILE
              value: /run/secrets/mcp-gateway-chat-alerts/token
            - name: MCP_CHAT_STT_ADDRS
              value: "${NODE_LAN_IP}:10305,${NODE_LAN_IP}:10300"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/mcp-gateway", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 7
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: catalog
              mountPath: /etc/mcp-gateway
              readOnly: true
            - name: auth
              mountPath: /run/secrets/mcp-gateway-auth
              readOnly: true
            - name: telegram
              mountPath: /run/secrets/mcp-gateway-telegram
              readOnly: true
            - name: ha
              mountPath: /run/secrets/mcp-gateway-ha
              readOnly: true
            - name: bb-ssh
              mountPath: /run/secrets/mcp-gateway-bb-ssh
              readOnly: true
            - name: voice
              mountPath: /run/secrets/mcp-gateway-voice
              readOnly: true
            - name: scheduler
              mountPath: /run/secrets/mcp-gateway-scheduler
              readOnly: true
            - name: chat
              mountPath: /run/secrets/mcp-gateway-chat
              readOnly: true
            - name: chat-alerts
              mountPath: /run/secrets/mcp-gateway-chat-alerts
              readOnly: true
            - name: chat-data
              mountPath: /var/lib/mcp-gateway
            - name: chat-media
              mountPath: /var/lib/mcp-gateway-media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog
          configMap:
            name: mcp-gateway-catalog
            items:
              - key: catalog.yaml
                path: catalog.yaml
              - key: bb-targets.yaml
                path: bb-targets.yaml
              - key: chat-prompt.txt
                path: chat-prompt.txt
        - name: auth
          secret:
            secretName: mcp-gateway-auth
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: telegram
          secret:
            secretName: mcp-gateway-telegram
            defaultMode: 0440
            items:
              - key: token
                path: token
              - key: chat_id
                path: chat_id
        - name: ha
          secret:
            secretName: mcp-gateway-ha
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: bb-ssh
          secret:
            secretName: mcp-gateway-bb-ssh
            defaultMode: 0400
            items:
              - key: id_ed25519
                path: id_ed25519
              - key: known_hosts
                path: known_hosts
        - name: voice
          secret:
            secretName: mcp-gateway-voice
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: scheduler
          secret:
            secretName: mcp-gateway-scheduler
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: chat
          secret:
            secretName: mcp-gateway-chat
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: chat-alerts
          secret:
            secretName: mcp-gateway-chat-alerts
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: chat-data
          persistentVolumeClaim:
            claimName: mcp-gateway-chat
        - name: chat-media
          persistentVolumeClaim:
            claimName: mcp-gateway-media
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
