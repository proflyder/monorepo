# Flux-rendered manifest set for mcp-gateway (FLUX-APPS-PLAN 6.4).
#
# Deployment, Service, NetworkPolicies, ServiceMonitor, RBAC and the five
# ExternalSecrets are the same objects `deploy.sh` applies. The catalog and
# bb-targets files are deployment data, so they are rendered as a ConfigMap by
# the generator instead of `kubectl create configmap` in CI; the Deployment
# mounts the stable name, hence `disableNameSuffixHash`.
#
# `ci/rbac.yaml` (the `ci-deploy` grants) is deliberately absent: it only
# exists for the retired CI path.
#
# Substituted by Kustomization/app-mcp-gateway:
#   ${MCP_GATEWAY_IMAGE}      from ConfigMap/home-app-images (pins branch)
#   ${BUILD_ID}               from ConfigMap/home-app-images (pins branch)
#   ${LAN_CIDR}, ${NODE_LAN_IP}, ${HAOS_IP}, ${STATION_IP}, ${BB_CT_IP}
#   ${BB_PROJECT_STATION_LAB}, ${BB_PROJECT_ENGLISH_NOTES}
#   ${BB_DISPATCHER_THREAD_ID}
#                             from Secret/flux-app-settings (ESO)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - network-policies.yaml
  - servicemonitor.yaml
  - rbac.yaml
  - external-secrets.yaml
configMapGenerator:
  - name: mcp-gateway-catalog
    # The Deployment mounts this ConfigMap by its stable name.
    namespace: home-assistant
    files:
      - catalog.yaml
      - bb-targets.yaml
    options:
      disableNameSuffixHash: true
patches:
  # The image itself changes the pod template, so the annotation follows the
  # digest instead of the CI-only `ROLLOUT_ID`.
  - target:
      kind: Deployment
      name: mcp-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${MCP_GATEWAY_IMAGE}
