# Flux-rendered manifest set for mcp-gateway (решение 54).
#
# Deployment, Service, NetworkPolicies, ServiceMonitor, RBAC and the six
# ExternalSecrets are the workload. The catalog and bb-targets files are
# deployment data, so they are rendered as a ConfigMap by the generator. The
# generator keeps its content-hash suffix: the gateway reads the catalog once
# at start, so a catalog change must roll the pod. Kustomize rewrites the
# Deployment's volume reference to the hashed name and Flux prunes the old one.
#
# The CI-only `ci-deploy` grants are gone with the old deploy path.
#
# Substituted by Kustomization/app-mcp-gateway:
#   ${MCP_GATEWAY_IMAGE}      from ConfigMap/home-app-images (pins branch)
#   ${BUILD_ID}               from ConfigMap/home-app-images (pins branch)
#   ${LAN_CIDR}, ${NODE_LAN_IP}, ${HAOS_IP}, ${STATION_IP}, ${BB_CT_IP}
#   ${PVE_IP}, ${VPN_CT_IP}
#   ${BB_PROJECT_STATION_LAB}, ${BB_PROJECT_ENGLISH_NOTES}
#   ${BB_DISPATCHER_THREAD_ID}
#                             from Secret/flux-app-settings (ESO)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - network-policies.yaml
  - servicemonitor.yaml
  - rbac.yaml
  - external-secrets.yaml
configMapGenerator:
  - name: mcp-gateway-catalog
    namespace: home-assistant
    files:
      - catalog.yaml
      - bb-targets.yaml
patches:
  # The image itself changes the pod template, so the annotation follows the
  # digest instead of the CI-only `ROLLOUT_ID`.
  - target:
      kind: Deployment
      name: mcp-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${MCP_GATEWAY_IMAGE}
