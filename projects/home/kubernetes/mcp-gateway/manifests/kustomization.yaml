apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - network-policies.yaml
  - servicemonitor.yaml
  - rbac.yaml
  - external-secrets.yaml
configMapGenerator:
  - name: mcp-gateway-catalog
    namespace: home-assistant
    files:
      - catalog.yaml
      - bb-targets.yaml
      - chat-prompt.txt
patches:
  - target:
      kind: PersistentVolumeClaim
      name: mcp-gateway-chat
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: PersistentVolumeClaim
      name: mcp-gateway-media
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: Deployment
      name: mcp-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${MCP_GATEWAY_IMAGE}
