# Vaultwarden secrets, materialised from OpenBao KV v2 by ESO.
#
# Source of truth:
#   secret/k8s/vaultwarden/vaultwarden-admin -> Secret vaultwarden-admin
#       ADMIN_TOKEN  Argon2id PHC hash of the /admin password
#                    (the plain password is in secret/infra/vaultwarden/admin)
#
# Same policy contract as the other home Secrets: the ExternalSecret owns the
# Secret (creationPolicy Owner); deleting the ExternalSecret keeps the live
# Secret (deletionPolicy Retain).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-admin
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: vaultwarden-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/vaultwarden/vaultwarden-admin
