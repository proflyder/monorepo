apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`passwords.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: vaultwarden
          namespace: vaultwarden
          port: 8080
  tls:
    secretName: home-wildcard-tls
