# Host suffix is substituted from the flux-settings Secret (`HOME_DOMAIN`).
#
# Like the other home routes: `traefik` namespace, wildcard TLS Secret and the
# `home-allowlist` Middleware (LAN + VPN only). TLS ends at Traefik; the pod
# speaks plain HTTP on 8080, WebSocket notifications use the same port.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`passwords.${HOME_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: home-allowlist
      services:
        - name: vaultwarden
          namespace: vaultwarden
          port: 8080
  tls:
    secretName: home-wildcard-tls
