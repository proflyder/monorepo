# Temporary HTTPS validation; delete after acceptance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: operator-smoke
  namespace: home-assistant
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [home-k3s-check]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: runtime-health-exporter
                port: {number: 9116}
