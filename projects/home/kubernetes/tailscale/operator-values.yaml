oauthSecretVolume:
  secret:
    secretName: operator-oauth
operatorConfig:
  hostname: home-k3s-operator
  defaultTags: [tag:k8s-operator]
  image:
    repository: ghcr.io/tailscale/k8s-operator
    tag: v1.104.2
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
proxyConfig:
  image:
    repository: ghcr.io/tailscale/tailscale
    tag: v1.104.2
  defaultTags: tag:k8s
apiServerProxyConfig:
  mode: "false"
  allowImpersonation: "false"
