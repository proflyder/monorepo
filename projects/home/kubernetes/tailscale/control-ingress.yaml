# Dedicated tailnet route for the ha-control catalog.
#
# Backs the in-namespace Service `ha-control` (ClusterIP :8099) with its own
# Tailscale Ingress, tailnet-only, operator TLS. The scheduler keeps its own
# ingress and pl-home keeps `/` -> HAOS, `/grafana` -> Grafana.
#
# TEMPLATE: deploy.sh substitutes the private short hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control
  namespace: home-assistant
  labels:
    app.kubernetes.io/part-of: ricardo-home
  annotations:
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts: ["${TAILNET_CONTROL_HOSTNAME}"]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ha-control
                port:
                  number: 8099
