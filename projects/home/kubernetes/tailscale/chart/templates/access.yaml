apiVersion: v1
kind: Service
metadata:
  name: home-assistant-external
spec:
  ports:
    - {name: http, port: 8123, targetPort: 8123}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant-external
  labels:
    kubernetes.io/service-name: home-assistant-external
    endpointslice.kubernetes.io/managed-by: home-lab-helm
addressType: IPv4
ports:
  - {name: http, protocol: TCP, port: 8123}
endpoints:
  - addresses: [{{ required "Set private HAOS IPv4 address" .Values.haosAddress | quote }}]
    conditions: {ready: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  annotations:
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [{{ required "Set tailnet hostname (short name)" .Values.hostname | quote }}]
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port: {number: 80}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant-external
                port: {number: 8123}
