# Dedicated tailnet route for the scheduler Connect API.
#
# Backs the existing in-namespace Service `scheduler` (ClusterIP :8098) with a
# second Tailscale Ingress. Do NOT route a NodePort through a selectorless
# Service/EndpointSlice: on a single K3s node that would require the packet to
# re-enter kube-proxy's NodePort NAT after ClusterIP DNAT, which does not happen.
#
# The existing pl-home ingress keeps `/` -> HAOS and `/grafana` -> Grafana; this
# route is independent and tailnet-only.
#
# This file is a TEMPLATE: deploy.sh substitutes the private short hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scheduler
  namespace: home-assistant
  labels:
    app.kubernetes.io/part-of: ricardo-home
  annotations:
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts: ["${TAILNET_SCHED_HOSTNAME}"]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scheduler
                port:
                  number: 8098
