apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets-gateway.yaml
  - network-policies.yaml
  - external-secrets.yaml
configMapGenerator:
  - name: secrets-gateway-config
    namespace: home-assistant
    files:
      - catalog.json
      - deny.json
patches:
  - target:
      kind: Deployment
      name: secrets-gateway
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/proflyder.dev~1rollout
        value: ${SECRETS_GATEWAY_IMAGE}
  - target:
      kind: PersistentVolumeClaim
      name: secrets-gateway-state
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
