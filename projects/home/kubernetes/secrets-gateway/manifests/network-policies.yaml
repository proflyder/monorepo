apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-gateway-ingress
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: secrets-gateway
    app.kubernetes.io/part-of: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secrets-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - ipBlock:
            cidr: ${NODE_LAN_IP}/32
      ports:
        - protocol: TCP
          port: 8096
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-gateway-egress
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: secrets-gateway
    app.kubernetes.io/part-of: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: secrets-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
      ports:
        - protocol: TCP
          port: 8098
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: phone-push
      ports:
        - protocol: TCP
          port: 8095
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
