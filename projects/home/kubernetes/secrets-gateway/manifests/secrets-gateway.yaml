apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: secrets-gateway
    app.kubernetes.io/part-of: home
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: secrets-gateway
    app.kubernetes.io/part-of: home
  annotations:
    proflyder.dev/build: ${BUILD_ID}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secrets-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secrets-gateway
      annotations:
        proflyder.dev/rollout: ${ROLLOUT_ID}
    spec:
      serviceAccountName: secrets-gateway
      enableServiceLinks: false
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets-gateway
          image: ${SECRETS_GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: SECRETS_GATEWAY_LISTEN
              value: 0.0.0.0:8096
            - name: SECRETS_GATEWAY_SCHEDULER_URL
              value: http://scheduler.home-assistant.svc.cluster.local:8098
            - name: SECRETS_GATEWAY_SERVICE_TOKEN_FILE
              value: /run/secrets/secrets-gateway/service_token
            - name: SECRETS_GATEWAY_OPENBAO_URL
              value: http://openbao.openbao.svc:8200
            - name: SECRETS_GATEWAY_OPENBAO_ROLE
              value: secrets-gateway
            - name: SECRETS_GATEWAY_SA_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: SECRETS_GATEWAY_TOTP_FILE
              value: /run/secrets/secrets-gateway/totp_secret
            - name: SECRETS_GATEWAY_PHONE_PUSH_URL
              value: http://phone-push.home-assistant.svc.cluster.local:8095
            - name: SECRETS_GATEWAY_PHONE_PUSH_TOKEN_FILE
              value: /run/secrets/secrets-gateway/service_token
            - name: SECRETS_GATEWAY_TIMEOUT
              value: 10s
            - name: SECRETS_GATEWAY_MAX_LIST_ENTRIES
              value: "500"
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/secrets-gateway", "-healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 7
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/secrets-gateway
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: secrets-gateway
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: secrets-gateway
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: secrets-gateway
    app.kubernetes.io/part-of: home
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: secrets-gateway
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
