# Read-only operational Grafana UI for the home LAN.
# Grafana remains ClusterIP/Tailscale-managed; this is a separate NodePort
# Service so the monitoring Helm release can be upgraded independently.
apiVersion: v1
kind: Service
metadata:
  name: grafana-lan
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: grafana
      nodePort: 30300
