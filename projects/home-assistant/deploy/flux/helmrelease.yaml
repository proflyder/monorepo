apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runtime
  namespace: flux-system
spec:
  releaseName: runtime
  targetNamespace: home-assistant
  storageNamespace: home-assistant
  interval: 10m
  timeout: 8m
  chart:
    spec:
      chart: ./projects/home-assistant/deploy/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: runtime-values
      valuesKey: values
  values:
    smoke:
      enabled: true
      image: ${HOME_DEPLOY_IMAGE}
    hermesConfigDrift:
      enabled: true
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
      strategy: rollback
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hermes
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hermes
              spec:
                template:
                  spec:
                    initContainers:
                      # Reviewed overlay -> PVC. Any error (placeholder refusal,
                      # unreadable private values) exits non-zero and blocks the
                      # gateway; Helm remediation rolls the release back.
                      - name: render-config
                        image: ${HERMES_CONFIG_IMAGE}
                        args:
                          - hermes
                          - render-config
                          - --home
                          - /opt/data
                          - --source-dir
                          - /opt/hermes-overlay
                          - --private-values
                          - /run/hermes-config/private.yaml
                        volumeMounts:
                          - {name: data, mountPath: /opt/data}
                          - {name: hermes-config-private, mountPath: /run/hermes-config, readOnly: true}
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities: {drop: [ALL]}
                        resources:
                          requests: {cpu: 5m, memory: 16Mi}
                          limits: {memory: 64Mi}
                    containers:
                      - name: gateway
                        image: ${HERMES_IMAGE}
                        # Hermes runs with the home zone so its own timestamps
                        # and "today/tomorrow" context match the owner's clock.
                        env:
                          - name: TZ
                            value: Asia/Almaty
                        lifecycle:
                          preStop:
                            exec:
                              command:
                                - /opt/venv/bin/python
                                - -c
                                - |
                                  import time
                                  try:
                                      from gateway.drain_control import write_drain_request
                                      from gateway.status import parse_active_agents, read_runtime_status
                                      start = time.monotonic()
                                      write_drain_request(principal="kubelet-prestop", suppress_notification=True)
                                      # The gateway watcher polls every second and stops
                                      # accepting new turns; wait for in-flight work.
                                      time.sleep(2)
                                      while time.monotonic() - start < 60:
                                          record = read_runtime_status() or {}
                                          if parse_active_agents(record.get("active_agents")) == 0:
                                              break
                                          time.sleep(1)
                                  except Exception:
                                      pass
                      - name: voice-proxy
                        image: ${VOICE_PROXY_IMAGE}
                        env:
                          - name: HERMES_CHAT_RELAY_LISTEN
                            value: 0.0.0.0:8644
                          - name: HERMES_CHAT_RELAY_SESSION
                            value: home-app
                          - name: HERMES_CHAT_RELAY_TOKEN_FILE
                            value: /run/hermes-chat-relay/token
                          - name: HERMES_API_KEY
                            valueFrom:
                              secretKeyRef:
                                name: hermes-environment
                                key: API_SERVER_KEY
                        volumeMounts:
                          - {name: hermes-chat-relay, mountPath: /run/hermes-chat-relay, readOnly: true}
                      # Read-only drift view of the same plan the init container
                      # applied; never writes to the PVC.
                      - name: config-drift
                        image: ${HERMES_CONFIG_IMAGE}
                        args:
                          - hermes
                          - drift-exporter
                          - --listen
                          - 0.0.0.0:9118
                          - --interval
                          - "300"
                          - --home
                          - /opt/data
                          - --source-dir
                          - /opt/hermes-overlay
                          - --private-values
                          - /run/hermes-config/private.yaml
                        ports:
                          - {name: config-drift, containerPort: 9118}
                        readinessProbe:
                          tcpSocket: {port: 9118}
                        volumeMounts:
                          - {name: data, mountPath: /opt/data, readOnly: true}
                          - {name: hermes-config-private, mountPath: /run/hermes-config, readOnly: true}
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities: {drop: [ALL]}
                        resources:
                          requests: {cpu: 5m, memory: 16Mi}
                          limits: {memory: 64Mi}
                    volumes:
                      - name: hermes-config-private
                        secret:
                          secretName: hermes-config-private
                          defaultMode: 0440
                      - name: hermes-chat-relay
                        secret:
                          secretName: hermes-chat-relay
                          defaultMode: 0440
          - target:
              kind: Deployment
              name: runtime-health-exporter
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/image
                value: ${HEALTH_EXPORTER_IMAGE}
              - op: add
                path: /spec/template/spec/containers/0/command
                value: ["/usr/local/bin/health-exporter"]
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts
                value: []
              - op: add
                path: /spec/template/spec/volumes
                value: []
