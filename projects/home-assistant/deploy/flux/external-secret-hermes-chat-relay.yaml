apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-chat-relay
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hermes-chat-relay
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: k8s/home-assistant/hermes-chat-relay
        property: token
