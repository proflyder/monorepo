# Hermes private render values (real HA/MA endpoints and the Telegram owner
# chat id). The reviewed overlay itself ships in the `hermes-config` image; this
# Secret supplies only the values the renderer deep-merges after the fragment.
#
# Source of truth: secret/k8s/home-assistant/hermes-config (KV v2), property
# `private.yaml`. The owner copies it from the legacy
# `secret/infra/kubernetes/values-private#hermes_private_yaml` before merge.
# The renderer refuses TEST-NET placeholders that would replace live values, so
# a missing or stale Secret fails the init container closed instead of writing a
# broken config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config-private
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hermes-config-private
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: private.yaml
      remoteRef:
        key: k8s/home-assistant/hermes-config
        property: private.yaml
