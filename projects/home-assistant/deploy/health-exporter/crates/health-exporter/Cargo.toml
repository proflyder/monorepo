[package]
name = "health-exporter"
description = "Runtime chart's TCP health exporter: ricardo_endpoint_* metrics and the -query exec probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "health_exporter"
path = "src/lib.rs"

[[bin]]
name = "health-exporter"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
home-runtime = { path = "../../../../../../packages/rust/home-runtime" }
home-telemetry = { path = "../../../../../../packages/rust/home-telemetry" }
home-tls = { path = "../../../../../../packages/rust/home-tls" }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }

[lints]
workspace = true
