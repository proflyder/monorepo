# Hermes environment (API key, HA/MA tokens and runtime flags).
#
# Source of truth: secret/k8s/home-assistant/hermes-environment (KV v2). It is
# not part of the `runtime` Helm release: the chart only references the Secret,
# so CI `helm upgrade` never writes these values.
#
# The voice proxy in the same Pod reuses HERMES_HA_TOKEN from this Secret for
# the profile read and the late announcement, and mounts the gateway-owned
# Secret `mcp-gateway-voice` (ExternalSecret in
# projects/home/kubernetes/mcp-gateway/manifests/external-secrets.yaml) as the
# voice bearer token. No new ExternalSecret is needed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-environment
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hermes-environment
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/hermes-environment
