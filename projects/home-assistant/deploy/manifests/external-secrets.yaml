apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-environment
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hermes-environment
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8s/home-assistant/hermes-environment
