{{- $smoke := .Values.smoke | default dict }}
{{- if $smoke.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-upgrade-smoke
  labels:
    app.kubernetes.io/name: hermes-smoke
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: {{ required "smoke.image is required when the hook is enabled" $smoke.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/home-deploy", "hermes", "assist-smoke", "--timeout", "90s", "--retry-window", "180s"]
          env:
            - name: HA_URL
              value: http://home-assistant-external.monitoring.svc.cluster.local:8123
            - name: HA_AGENT
              value: conversation.hermes_agent
            - name: SMOKE_TEXT
              value: "Представься одним коротким предложением. Ничего не изменяй."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
      volumes:
        - name: ha-token
          secret:
            secretName: ha-bridge-ha
            defaultMode: 0440
{{- end }}
