# Post-upgrade smoke hook (FLUX-APPS-PLAN 6.6).
#
# `home-deploy hermes rollout` runs the Assist smoke after the upgrade and
# rolls back on failure. Under Flux the same check is a Helm post-upgrade hook:
# a failed hook fails the upgrade, and `HelmRelease` remediation
# (`strategy: rollback`) restores the previous revision.
#
# Disabled by default so the CI/admin `helm upgrade` path and the chart
# contracts are unchanged; the Flux HelmRelease enables it and pins the
# `home-deploy` image by digest. The check itself (`hermes assist-smoke`) is
# the same binary and the same endpoint/agent/text defaults as
# `platform/deploy-rs/src/hermes.rs`.
{{- $smoke := .Values.smoke | default dict }}
{{- if $smoke.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-upgrade-smoke
  labels:
    app.kubernetes.io/name: hermes-smoke
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-smoke
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: {{ required "smoke.image is required when the hook is enabled" $smoke.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/home-deploy", "hermes", "assist-smoke"]
          env:
            - name: HA_URL
              value: http://home-assistant-external.monitoring.svc.cluster.local:8123
            - name: HA_AGENT
              value: conversation.hermes_agent
            - name: SMOKE_TEXT
              value: "Представься одним коротким предложением. Ничего не изменяй."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ha-token
              mountPath: /run/secrets/ha
              readOnly: true
      volumes:
        - name: ha-token
          secret:
            secretName: ha-bridge-ha
            defaultMode: 0440
{{- end }}
