StationAlarmStop:
  speech:
    text: >-
      {% set result = action_response if action_response is mapping else {} %}
      {{ result.get('text', 'Останавливаю.') }}
  action:
    - variables:
        was_ringing: "{{ is_state('input_boolean.alarm_ringing', 'on') }}"
        was_music_playing: "{{ is_state('media_player.iandeks_stantsiia_midi', 'playing') }}"
    - service: script.schedule_alarm_stop
      response_variable: stop_result
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not was_ringing and stop_result is mapping and stop_result.status == 'not_found' and was_music_playing }}"
          sequence:
            - service: media_player.media_stop
              target:
                entity_id: media_player.iandeks_stantsiia_midi
    - variables:
        station_stop_result: >-
          {{ ({'status': 'ok', 'text': 'Останавливаю музыку.'}
              if (not was_ringing and stop_result is mapping and stop_result.status == 'not_found' and was_music_playing)
              else (stop_result if stop_result is mapping else {'status': 'error', 'text': 'Планировщик не ответил.'})) }}
    - stop: "station_alarm_stop"
      response_variable: station_stop_result

