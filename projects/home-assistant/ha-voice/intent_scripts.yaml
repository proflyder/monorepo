StationVolumeUp:
  speech:
    text: "Громче"
  action:
    - variables:
        current_pct: "{{ (state_attr('media_player.iandeks_stantsiia_midi', 'volume_level') | float(0.3) * 100) | int }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.music_route') == 'Spotify Connect' or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect') }}"
          sequence:
            - service: script.spotify_connect_set_volume
              data:
                volume_percent: "{{ [current_pct + 10, 100] | min }}"
        - conditions:
            - condition: template
              value_template: "{{ true }}"
          sequence:
            - service: media_player.volume_set
              target:
                entity_id: media_player.iandeks_stantsiia_midi
              data:
                volume_level: "{{ [current_pct + 10, 100] | min / 100 }}"
StationVolumeDown:
  speech:
    text: "Тише"
  action:
    - variables:
        current_pct: "{{ (state_attr('media_player.iandeks_stantsiia_midi', 'volume_level') | float(0.3) * 100) | int }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.music_route') == 'Spotify Connect' or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect') }}"
          sequence:
            - service: script.spotify_connect_set_volume
              data:
                volume_percent: "{{ [current_pct - 10, 0] | max }}"
        - conditions:
            - condition: template
              value_template: "{{ true }}"
          sequence:
            - service: media_player.volume_set
              target:
                entity_id: media_player.iandeks_stantsiia_midi
              data:
                volume_level: "{{ [current_pct - 10, 0] | max / 100 }}"
StationVolumeSet:
  speech:
    text: "Громкость {{ level }}"
  action:
    - variables:
        volume_raw: "{{ level | string | lower }}"
        volume_number: "{{ {'один': 1, 'одна': 1, 'два': 2, 'две': 2, 'три': 3, 'четыре': 4, 'пять': 5, 'шесть': 6, 'семь': 7, 'восемь': 8, 'девять': 9, 'десять': 10}.get(volume_raw, volume_raw | int(1)) | int(1) }}"
        volume_level: "{{ ([([volume_number, 1] | max), 10] | min) / 10 }}"
        spotify_percent: "{{ ([([volume_number, 1] | max), 10] | min) * 10 }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.music_route') == 'Spotify Connect' or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect') }}"
          sequence:
            - service: script.spotify_connect_set_volume
              data:
                volume_percent: "{{ spotify_percent }}"
        - conditions:
            - condition: template
              value_template: "{{ true }}"
          sequence:
            - service: media_player.volume_set
              target:
                entity_id: media_player.iandeks_stantsiia_midi
              data:
                volume_level: "{{ volume_level }}"
StationVolumeThreeAsr:
  speech:
    text: "Громкость 3"
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_select.music_route') == 'Spotify Connect' or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect') }}"
