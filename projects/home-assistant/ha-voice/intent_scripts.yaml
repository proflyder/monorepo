StationMusicPlayQuery:
  speech:
    text: >-
      {% set response = action_response if action_response is mapping else {} %}
      {% set status = response.get('status', 'unknown') %}
      {% set selected = response.get('selected') if response.get('selected') is mapping else {} %}
      {% if status == 'ok' %}
        Включаю {{ selected.get('name', '') }}{% if selected.get('artist') %}, {{ selected.get('artist') }}{% endif %}.
      {% elif status == 'no_results' %}
        Не нашла «{{ response.get('query', query | default('')) }}». Попробуй сказать иначе.
      {% elif status == 'rate_limited' %}
        Spotify временно ограничил поиск. Попробуй через несколько минут.
      {% elif status == 'auth_error' %}
        Spotify не авторизован. Нужно обновить токен.
      {% elif status == 'device_unavailable' %}
        Колонка не видна в Spotify. Выбери её в приложении и попробуй снова.
      {% elif status == 'premium_required' %}
        Для управления Spotify нужен Premium.
      {% elif status == 'search_error' or status == 'play_error' %}
        Не удалось включить музыку. Попробуй позже.
      {% else %}
        Не удалось включить музыку.
      {% endif %}
  action:
    - service: script.music_play_query
      data:
        query: "{{ query }}"
        media_type: "{{ media_type | default('track') }}"
        route: ""
      response_variable: music_result
    - stop: "station_music_play_query"
      response_variable: music_result

StationMusicPlayCandidate:
  speech:
    text: >-
      {% set response = action_response if action_response is mapping else {} %}
      {% set status = response.get('status', 'unknown') %}
      {% set selected = response.get('selected') if response.get('selected') is mapping else {} %}
      {% if status == 'ok' %}
        Включаю {{ selected.get('name', '') }}{% if selected.get('artist') %}, {{ selected.get('artist') }}{% endif %}.
      {% elif status == 'no_candidates' %}
        Сначала найди музыку, потом скажи «второй».
      {% elif status == 'no_candidate' %}
        Такого варианта нет.
      {% elif status == 'candidate_corrupt' %}
        Не удалось прочитать сохранённый вариант. Найди музыку заново.
      {% else %}
        Не удалось включить этот вариант.
      {% endif %}
  action:
    - service: script.music_play_candidate
      data:
        index: "{{ index | default(1) }}"
      response_variable: music_result
    - stop: "station_music_play_candidate"
      response_variable: music_result

StationMusicStatus:
  speech:
    text: >-
      {% set response = action_response if action_response is mapping else {} %}
      {% set state = response.get('state', 'unknown') %}
      {% if state == 'playing' %}
        Играет {{ response.get('title', 'музыка') }}{% if response.get('artist') %}, {{ response.get('artist') }}{% endif %}. Режим {{ response.get('route', '') }}.
      {% elif state == 'paused' %}
        Музыка на паузе{% if response.get('title') %}: {{ response.get('title') }}{% endif %}.
      {% elif state in ['idle', 'off'] %}
        Сейчас музыка не играет.
      {% else %}
        Состояние музыки: {{ state }}.
      {% endif %}
  action:
    - service: script.music_status
      response_variable: music_result
    - stop: "station_music_status"
      response_variable: music_result

