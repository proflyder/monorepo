      {% set response = result.get('response', result) if result is mapping else {} %}
      {% set speech = response.get('speech', {}) if response is mapping else {} %}
      {% set plain = speech.get('plain', {}) if speech is mapping else {} %}
      {{ plain.get('speech') if plain is mapping and plain.get('speech') else 'Не удалось передать запрос агенту.' }}
  action:
    - variables:
        route_text: "{{ command | default('') }} будильник {{ time_phrase | default('') }}"
    - service: conversation.process
      data:
        agent_id: conversation.hermes_agent
        language: ru
        text: "{{ route_text | trim }}"
      response_variable: hermes_time_reply
    - stop: "station_time_route"
      response_variable: hermes_time_reply

