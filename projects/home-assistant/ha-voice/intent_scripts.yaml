  speech:
    text: >-
      {% set result = action_response if action_response is mapping else {} %}
      {{ result.get('text', 'Не удалось включить будильник.') }}
  action:
    - service: script.schedule_alarm_set_enabled
      data:
        query: "{{ alarm_name | default(hour | default('') ~ ':' ~ minute | default('')) }}"
        enabled: true
      response_variable: alarm_result
    - stop: "station_alarm_enable_one"
      response_variable: alarm_result
