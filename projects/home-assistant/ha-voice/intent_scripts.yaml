StationWorkMode:
  speech:
    text: "Включаю всё освещение в спальне."
  action:
    - service: script.work_mode
StationBlackout:
  speech:
    text: "Выключаю всё освещение в спальне."
  action:
    - service: script.blackout
StationLightOn:
  speech:
    text: >-
      {% set labels = {
        'light.yeelink_cn_827036414_bslamp2_s_2_light': 'лампу',
        'light.yeelink_cn_919937191_lamp22_s_2': 'светильник',
        'light.spalnia_lenta': 'ленту'
      } %}
      Включаю {{ labels.get(target_entity, 'свет') }}
  action:
    - variables:
        requested: >-
          {{ (light_target | default(name | default(area | default(''))) | string | lower) }}
        target_entity: >-
          {% if 'лент' in requested or 'лет' in requested or 'полос' in requested %}
            light.spalnia_lenta
          {% elif 'светильник' in requested or 'монитор' in requested %}
            light.yeelink_cn_919937191_lamp22_s_2
          {% elif 'ламп' in requested or 'ночник' in requested or 'кроват' in requested or 'бра' in requested %}
            light.yeelink_cn_827036414_bslamp2_s_2_light
          {% elif requested in ['', 'свет', 'света', 'освещение', 'все'] %}
            light.spalnia_lenta, light.yeelink_cn_827036414_bslamp2_s_2_light, light.yeelink_cn_919937191_lamp22_s_2
          {% else %}
            light.spalnia_lenta
          {% endif %}
    - service: light.turn_on
      target:
        entity_id: "{{ target_entity }}"
StationLightOff:
  speech:
    text: >-
      {% set labels = {
        'light.yeelink_cn_827036414_bslamp2_s_2_light': 'лампу',
        'light.yeelink_cn_919937191_lamp22_s_2': 'светильник',
        'light.spalnia_lenta': 'ленту'
      } %}
      Выключаю {{ labels.get(target_entity, 'свет') }}
  action:
    - variables:
        requested: >-
          {{ (light_target | default(name | default(area | default(''))) | string | lower) }}
        target_entity: >-
          {% if 'лент' in requested or 'лет' in requested or 'полос' in requested %}
            light.spalnia_lenta
          {% elif 'светильник' in requested or 'монитор' in requested %}
            light.yeelink_cn_919937191_lamp22_s_2
          {% elif 'ламп' in requested or 'ночник' in requested or 'кроват' in requested or 'бра' in requested %}
            light.yeelink_cn_827036414_bslamp2_s_2_light
          {% elif requested in ['', 'свет', 'света', 'освещение', 'все'] %}
            light.spalnia_lenta, light.yeelink_cn_827036414_bslamp2_s_2_light, light.yeelink_cn_919937191_lamp22_s_2
          {% else %}
            light.spalnia_lenta
          {% endif %}
    - service: light.turn_off
      target:
        entity_id: "{{ target_entity }}"
