          target:
            entity_id: media_player.iandeks_stantsiia_midi
StationCancel:
  # Local intent: the request is recognized and ends here. No speech means no TTS answer, and
  # prefer_local_intents keeps "отмена" away from Hermes.
  action: []
StationPlayFavorites:
  speech:
    text: >-
      {% set result = action_response.get('result') if action_response is mapping else 'unknown' %}
      {% if result == 'connect_ok' %}Включаю любимые треки
      {% elif result == 'ma_ok' %}Включаю любимые треки
      {% elif result == 'ma_empty' %}Любимый плейлист пока не синхронизирован. Spotify временно ограничил доступ. Попробуй позже.
      {% elif result == 'connect_fail' %}Spotify пока не готов. Выбери колонку в Spotify и попробуй снова.
      {% else %}Не удалось запустить музыку. Попробуй позже.{% endif %}
  action:
    - service: script.music_play_favorites
      response_variable: music_result
    - stop: "station_play_favorites"
      response_variable: music_result
StationMusicPlay:
  speech:
    text: >-
      {% set result = action_response.get('result') if action_response is mapping else 'unknown' %}
      {% if result == 'connect_ok' %}Включаю музыку
      {% elif result == 'ma_ok' %}Включаю музыку
      {% elif result == 'ma_empty' %}Любимый плейлист пока не синхронизирован. Spotify временно ограничил доступ. Попробуй позже.
      {% elif result == 'connect_fail' %}Spotify Connect пока не готов. Выбери колонку в Spotify и попробуй снова.
      {% else %}Не удалось запустить музыку. Попробуй позже.{% endif %}
  action:
