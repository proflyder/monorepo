title: Помощник
views:
  - title: Будильники
    path: alarms
    icon: mdi:alarm
    cards:
      - type: markdown
        content: |
          ## Будильники
          Источник истины — серверный планировщик
          `ricardo.v1.SchedulerService`, а не списки Home Assistant.
          Создавайте, включайте и удаляйте будильники в приложении Android или
          голосом: «Рикардо, поставь будильник на 7:30 по будням».

          Звонок выполняет ha-bridge через прежний звуковой путь
          `alarm_start` / `alarm_stop`; «стоп» и «отложи» управляют
          планировщиком.
      - type: markdown
        content: |
          **Только чтение.** Старые списки будильников и форма здесь больше не
          редактируются: параллельный писатель создал бы второе расписание.
          Список и статус: голосом «какие будильники» или в Android-приложении.

  - title: Таймеры
    path: timers
    icon: mdi:timer-outline
    cards:
      - type: markdown
        content: |
          ## Таймеры
          Таймеры принадлежат серверному планировщику и переживают перезапуск
          Home Assistant. Запуск голосом: «Рикардо, поставь таймер пицца на
          10 минут». Пауза, продолжение и отмена — тоже голосом или в
          Android-приложении.

          Локальные таймеры Home Assistant больше не являются источником истины
          и не редактируются с этой панели.
      - type: markdown
        content: |
          **Только чтение.** Активные таймеры: «какие таймеры».

  - title: Напоминания
    path: reminders
    icon: mdi:bell-outline
    cards:
      - type: markdown
        content: |
          ## Напоминания
          Напоминания хранятся в серверном планировщике.
          «Рикардо, напомни завтра в 9:00 проверить духовку». Озвучивание
          выполняет ha-bridge, уведомление на телефон — отдельный канал
          доставки.
      - type: markdown
        content: |
          **Только чтение.** Список: «какие напоминания» или Android-приложение.

  - title: Заметки
    path: notes
    icon: mdi:note-text-outline
    cards:
      - type: markdown
        content: |
          ## Заметки
          Заметки остаются в Home Assistant (`todo.notes`) без изменений.
          «Рикардо, запомни, что надо купить молоко». Поиск: «что я записал
          про молоко».
      - type: todo-list
        entity: todo.notes
        title: Заметки
        hide_completed: false
        item_tap_action: edit
