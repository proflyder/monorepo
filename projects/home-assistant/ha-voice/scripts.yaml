schedule_alarm_update:
  alias: "Schedules: update alarm time"
  mode: single
  fields:
    query:
      default: ""
    hour:
      required: true
    minute:
      required: true
    period:
      default: ""
    day:
      default: ""
  sequence:
    - service: todo.get_items
      target:
        entity_id:
          - todo.alarms_once
          - todo.alarms_daily
          - todo.alarms_weekdays
          - todo.alarms_weekends
      response_variable: alarm_lists
    - variables:
        rows: >-
          {% set q = query | default('') | string | lower %}
          {% set ns = namespace(rows=[]) %}
          {% for list_id, data in alarm_lists.items() %}
            {% for item in data.get('items', []) %}
              {% if item.status == 'needs_action' and (q == '' or q in item.summary | lower) %}
                {% set ns.rows = ns.rows + [{'uid': item.uid, 'list_id': list_id, 'name': item.summary, 'due': item.due}] %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.rows | sort(attribute='due') }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ rows | length == 0 }}"
          sequence:
            - stop: "no matching alarm"
    - variables:
        target: "{{ rows | first }}"
        hour_num: "{{ hour | int(7) }}"
        minute_num: "{{ minute | int(0) }}"
        period_raw: "{{ period | default('') | string | lower }}"
        day_raw: "{{ day | default('') | string | lower }}"
        adjusted_hour: >-
          {% set h = hour_num | int %}
          {% if period_raw in ['вечера', 'дня'] and h < 12 %}{{ h + 12 }}
          {% elif period_raw in ['ночи', 'утра'] and h == 12 %}{{ 0 }}
          {% else %}{{ h }}{% endif %}
        next_dt: >-
          {% set ns = namespace(dt=now().replace(hour=adjusted_hour | int, minute=minute_num | int, second=0, microsecond=0)) %}
          {% if day_raw == 'завтра' %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% elif ns.dt <= now() %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% endif %}
          {% if target.list_id == 'todo.alarms_weekdays' %}
            {% for i in range(0, 8) %}
              {% if ns.dt.weekday() >= 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
            {% endfor %}
          {% elif target.list_id == 'todo.alarms_weekends' %}
            {% for i in range(0, 8) %}
              {% if ns.dt.weekday() < 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.dt.strftime('%Y-%m-%dT%H:%M:%S') }}{{ now().strftime('%z')[:3] }}:{{ now().strftime('%z')[3:] }}
    - service: todo.update_item
      target:
        entity_id: "{{ target.list_id }}"
      data:
        item: "{{ target.uid }}"
        due_datetime: "{{ next_dt }}"
        status: needs_action
