spotify_connect_play_liked:
  alias: "Spotify Connect: Liked Songs"
  mode: single
  sequence:
    - service: rest_command.spotify_token
      response_variable: spotify_auth
    - variables:
        spotify_access_token: "{{ spotify_auth.content.access_token }}"
    - service: rest_command.spotify_play_liked
      data:
        access_token: "{{ spotify_access_token }}"
      response_variable: spotify_play
      continue_on_error: true
    - variables:
        spotify_result:
          result: "{{ 'connect_ok' if spotify_play is defined and spotify_play.status == 204 else 'connect_fail' }}"
    - stop: "done"
      response_variable: spotify_result

spotify_connect_set_volume:
  alias: "Spotify Connect: set volume percent"
  mode: single
  sequence:
    - variables:
        volume_clamped: "{{ [[volume_percent | int(0), 0] | max, 100] | min }}"
    # Local volume is authoritative. Spotify Web API is an optional mirror:
    # a 429/expired token must never prevent the station from changing volume.
    - service: media_player.volume_set
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      data:
        volume_level: "{{ volume_clamped | int / 100 }}"
    - service: rest_command.spotify_token
      response_variable: spotify_auth
      continue_on_error: true
    - if:
        - condition: template
          value_template: >-
            {{ spotify_auth is defined and spotify_auth.status == 200
               and spotify_auth.content is mapping
               and spotify_auth.content.access_token is defined }}
      then:
        - service: rest_command.spotify_volume
          data:
            access_token: "{{ spotify_auth.content.access_token }}"
            volume_percent: "{{ volume_clamped }}"
          continue_on_error: true

work_mode:
  alias: "Scene: work lighting"
  # icon marks this script as a user-facing scenario for the phone app (ha-control)
  icon: mdi:laptop
  description: >-
    Turn on all bedroom lights for a work session: LED strip, bedside lamp,
    and monitor light bar.
  mode: single
  sequence:
    - service: light.turn_on
      target:
        entity_id:
          - light.spalnia_lenta
          - light.yeelink_cn_827036414_bslamp2_s_2_light
          - light.yeelink_cn_919937191_lamp22_s_2

blackout:
  alias: "Scene: black out bedroom lighting"
  icon: mdi:weather-night
  description: >-
    Turn off all bedroom lights: LED strip, bedside lamp, and monitor light bar.
  mode: single
  sequence:
    - service: light.turn_off
      target:
        entity_id:
          - light.spalnia_lenta
          - light.yeelink_cn_827036414_bslamp2_s_2_light
          - light.yeelink_cn_919937191_lamp22_s_2

music_play_favorites:
  alias: "Music: play favorites by selected route"
  description: >-
    Play the user's Liked Songs using the current music route. Use when the
    user asks for favorites, liked songs, or "любимое"; do not use for a
    specific track query.
  mode: single
  sequence:
    - variables:
        music_route: >-
          {{ 'Spotify Connect' if states('input_select.music_route') == 'Spotify Connect'
             or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect')
             else 'Music Assistant' }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ music_route == 'Spotify Connect' }}"
          sequence:
            - service: script.spotify_connect_play_liked
              response_variable: spotify_result
              continue_on_error: true
            - variables:
                music_result: "{{ spotify_result if spotify_result is defined else {'result': 'connect_fail'} }}"
            - stop: "done"
              response_variable: music_result
        - conditions:
            - condition: template
              value_template: "{{ music_route == 'Music Assistant' }}"
          sequence:
            - service: media_player.browse_media
              target:
                entity_id: media_player.iandeks_stantsiia_midi
              data:
                media_content_id: library://playlist/9
                media_content_type: playlist
              response_variable: favorites
            - variables:
                favorites_item: "{{ favorites.get('media_player.iandeks_stantsiia_midi', favorites) }}"
                favorites_ready: "{{ favorites_item.children | default([], true) | count > 0 }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ favorites_ready }}"
                  sequence:
                    - service: music_assistant.play_media
                      continue_on_error: true
                      target:
                        entity_id: media_player.iandeks_stantsiia_midi
                      data:
                        media_id: library://playlist/9
                        media_type: playlist
                        enqueue: replace
            - variables:
                music_result:
                  result: "{{ 'ma_ok' if favorites_ready else 'ma_empty' }}"
            - stop: "done"
              response_variable: music_result
    - variables:
        music_result:
          result: "unknown"
    - stop: "done"
      response_variable: music_result

music_route_connect:
  alias: "Music route: Spotify Connect"
  mode: single
  sequence:
    - service: input_select.select_option
      target:
        entity_id: input_select.music_route
      data:
        option: "Spotify Connect"

music_route_ma:
  alias: "Music route: Music Assistant"
  mode: single
  sequence:
    - service: input_select.select_option
      target:
        entity_id: input_select.music_route
      data:
        option: "Music Assistant"
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      continue_on_error: true
    - service: media_player.select_source
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      data:
        source: "Music Assistant Queue"
      continue_on_error: true

alarm_set:
  alias: "Alarm: set next occurrence"
  mode: single
  fields:
    hour:
      description: "Hour 0-23"
      example: 7
    minute:
      description: "Minute 0-59"
      example: 30
    period:
      description: "утра, дня, вечера, ночи"
      example: "утра"
    day:
      description: "сегодня, завтра"
      example: "завтра"
    repeat:
      description: "Однократно, Каждый день, По будням, По выходным"
      example: "По будням"
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.alarm_ringing
          state: "on"
      then:
        - service: script.alarm_stop
    - variables:
        hour_num: "{{ hour | int(7) }}"
        minute_num: "{{ minute | int(0) }}"
        period_raw: "{{ period | default('') | string | lower }}"
        day_raw: "{{ day | default('') | string | lower }}"
        repeat_mode: "{{ repeat | default('Однократно') }}"
        adjusted_hour: >-
          {% set h = hour_num | int %}
          {% if period_raw in ['вечера', 'дня'] and h < 12 %}{{ h + 12 }}
          {% elif period_raw == 'ночи' and h == 12 %}{{ 0 }}
          {% elif period_raw == 'утра' and h == 12 %}{{ 0 }}
          {% else %}{{ h }}{% endif %}
        next_iso: >-
          {% set ns = namespace(dt=now().replace(hour=adjusted_hour | int, minute=minute_num | int, second=0, microsecond=0)) %}
          {% if day_raw == 'завтра' %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% elif ns.dt <= now() %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% endif %}
          {% if repeat_mode == 'По будням' %}
            {% for i in range(0, 8) %}
              {% if ns.dt.weekday() >= 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
            {% endfor %}
          {% elif repeat_mode == 'По выходным' %}
            {% for i in range(0, 8) %}
              {% if ns.dt.weekday() < 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.dt.strftime('%Y-%m-%d %H:%M:%S') }}
    - service: input_select.select_option
      target:
        entity_id: input_select.alarm_repeat
      data:
        option: "{{ repeat_mode }}"
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.alarm_next
      data:
        datetime: "{{ next_iso }}"
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.alarm_enabled
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.alarm_ringing
          - input_boolean.alarm_snooze_active
          - input_boolean.alarm_music_was_playing
    - service: input_text.set_value
      target:
        entity_id: input_text.alarm_previous_source
      data:
        value: ""

alarm_schedule_next:
  alias: "Alarm: schedule next repeat"
  mode: single
  sequence:
    - variables:
        repeat_mode: "{{ states('input_select.alarm_repeat') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ repeat_mode != 'Однократно' }}"
          sequence:
            - variables:
                next_iso: >-
                  {% set ns = namespace(dt=now().replace(second=0, microsecond=0) + timedelta(days=1)) %}
                  {% if repeat_mode == 'По будням' %}
                    {% for i in range(0, 8) %}
                      {% if ns.dt.weekday() >= 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
                    {% endfor %}
                  {% elif repeat_mode == 'По выходным' %}
                    {% for i in range(0, 8) %}
                      {% if ns.dt.weekday() < 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.dt.strftime('%Y-%m-%d %H:%M:%S') }}
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.alarm_next
              data:
                datetime: "{{ next_iso }}"

alarm_start:
  alias: "Alarm: start ringing"
  mode: restart
  fields:
    source_id:
      description: "Scheduler schedule id supplied by ha-bridge"
      example: "019a..."
    event_id:
      description: "Scheduler due event id supplied by ha-bridge"
      example: "019a..."
    label:
      description: "Scheduler label supplied by ha-bridge"
      example: "Работа"
    kind:
      description: "Scheduler source kind supplied by ha-bridge"
      example: "alarm"
  sequence:
    - service: input_text.set_value
      target:
        entity_id: input_text.scheduler_active_schedule_id
      data:
        value: "{{ source_id | default('') }}"
      continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: input_text.scheduler_active_event_id
      data:
        value: "{{ event_id | default('') }}"
      continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: input_text.scheduler_active_label
      data:
        value: "{{ label | default('') }}"
      continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: input_text.scheduler_active_kind
      data:
        value: "{{ kind | default('') }}"
      continue_on_error: true
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.alarm_ringing
    - if:
        - condition: template
          value_template: "{{ states('input_text.alarm_previous_source') in ['', 'unknown', 'unavailable'] }}"
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.alarm_previous_source
          data:
            value: "{{ state_attr('media_player.iandeks_stantsiia_midi', 'source') | default('') }}"
        - choose:
            - conditions:
                - condition: state
                  entity_id: media_player.iandeks_stantsiia_midi
                  state: "playing"
              sequence:
                - service: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.alarm_music_was_playing
            - conditions:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - service: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.alarm_music_was_playing
    - service: input_number.set_value
      target:
        entity_id: input_number.alarm_previous_volume
      data:
        value: "{{ state_attr('media_player.iandeks_stantsiia_midi', 'volume_level') | float(0.3) }}"
    - service: media_player.media_pause
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      continue_on_error: true
    - service: media_player.volume_set
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      data:
        volume_level: 0.05
    - service: script.turn_on
      target:
        entity_id: script.alarm_ramp
      data:
        variables:
          target: "{{ states('input_number.alarm_volume') | float(0.45) }}"
    - service: script.turn_on
      target:
        entity_id: script.alarm_loop

alarm_announce:
  alias: "Alarm: chime and speak wake phrase"
  mode: restart
  sequence:
    - service: media_player.play_media
      target:
        entity_id: media_player.iandeks_stantsiia_midi_media_player
      data:
        media_content_id: "http://127.0.0.1:8123/local/alarm_chime.wav"
        media_content_type: music
      continue_on_error: true
    - delay: "00:00:02"
    - service: tts.speak
      target:
        entity_id: tts.piper
      data:
        # Use the ESPHome/Sendspin endpoint, not the universal MA player:
        # TTS on the universal player changes its source to MA Queue and makes
        # alarm_stop unable to resume the previous Spotify Connect session.
        media_player_entity_id: media_player.iandeks_stantsiia_midi_media_player
        message: "Доброе утро. Пора вставать."
        cache: true
        language: ru
        options:
          voice: ru_puriso2-medium
      continue_on_error: true

alarm_loop:
  alias: "Alarm: repeat ringtone"
  mode: restart
  sequence:
    - repeat:
        while:
          - condition: state
            entity_id: input_boolean.alarm_ringing
            state: "on"
        sequence:
          - service: media_player.play_media
            target:
              entity_id: media_player.iandeks_stantsiia_midi_media_player
            data:
              media_content_id: "http://127.0.0.1:8123/local/alarm_ringtone.wav"
              media_content_type: music
            continue_on_error: true
          # Full track is 294.8 s; keep a small gap between loops.
          - delay: "00:04:55"

alarm_ramp:
  alias: "Alarm: ramp volume"
  mode: restart
  fields:
    target:
      description: "Target volume 0-1"
      example: 0.45
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.alarm_ringing
          state: "off"
      then:
        - stop: "alarm already stopped"
    - variables:
        target_volume: "{{ target | float(0.45) }}"
        start_volume: 0.05
    - repeat:
        count: 6
        sequence:
          - if:
              - condition: state
                entity_id: input_boolean.alarm_ringing
                state: "off"
            then:
              - stop: "alarm stopped during ramp"
          - service: media_player.volume_set
            target:
              entity_id: media_player.iandeks_stantsiia_midi
            data:
              volume_level: >-
                {{ (start_volume + (target_volume - start_volume) * repeat.index / 6) | round(2) }}
          - delay: "00:00:03"

alarm_restore:
  alias: "Alarm: restore source and volume"
  mode: single
  sequence:
    - variables:
        previous_source: "{{ states('input_text.alarm_previous_source') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ previous_source not in ['', 'unknown', 'unavailable', 'None'] }}"
          sequence:
            - service: media_player.select_source
              target:
                entity_id: media_player.iandeks_stantsiia_midi
              data:
                source: "{{ previous_source }}"
              continue_on_error: true
            - service: input_select.select_option
              target:
                entity_id: input_select.music_route
              data:
                option: "{{ 'Spotify Connect' if previous_source.startswith('Spotify Connect') else 'Music Assistant' }}"
    - service: media_player.volume_set
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      data:
        volume_level: "{{ states('input_number.alarm_previous_volume') | float(0.3) }}"
      continue_on_error: true
    - service: input_text.set_value
      target:
        entity_id: input_text.alarm_previous_source
      data:
        value: ""

alarm_resume:
  alias: "Alarm: resume music if it was playing"
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.alarm_music_was_playing
          state: "on"
      then:
        - service: media_player.media_play
          target:
            entity_id: media_player.iandeks_stantsiia_midi
          continue_on_error: true
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.alarm_music_was_playing

alarm_snooze:
  alias: "Alarm: snooze 9 minutes"
  mode: single
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.alarm_ringing
    - service: script.turn_off
      target:
        entity_id:
          - script.alarm_ramp
          - script.alarm_loop
          - script.alarm_announce
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.alarm_snooze_active
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.alarm_snooze_until
      data:
        datetime: "{{ (now() + timedelta(minutes=9)).strftime('%Y-%m-%d %H:%M:%S') }}"
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      continue_on_error: true
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi_media_player
      continue_on_error: true

alarm_stop:
  alias: "Alarm: stop ringing"
  mode: restart
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.alarm_ringing
          - input_boolean.alarm_snooze_active
    - service: script.turn_off
      target:
        entity_id:
          - script.alarm_ramp
          - script.alarm_loop
          - script.alarm_announce
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      continue_on_error: true
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi_media_player
      continue_on_error: true
    - service: script.alarm_restore
    - service: script.alarm_resume
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.alarm_repeat
              state: "Однократно"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.alarm_enabled
    - service: input_text.set_value
      target:
        entity_id:
          - input_text.scheduler_active_schedule_id
          - input_text.scheduler_active_event_id
          - input_text.scheduler_active_label
          - input_text.scheduler_active_kind
      data:
        value: ""
      continue_on_error: true

alarm_cancel:
  alias: "Alarm: cancel"
  mode: single
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.alarm_enabled
          - input_boolean.alarm_ringing
          - input_boolean.alarm_snooze_active
    - service: script.turn_off
      target:
        entity_id:
          - script.alarm_ramp
          - script.alarm_loop
          - script.alarm_announce
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi
      continue_on_error: true
    - service: media_player.media_stop
      target:
        entity_id: media_player.iandeks_stantsiia_midi_media_player
      continue_on_error: true
    - service: script.alarm_restore
    - service: script.alarm_resume
    - service: script.schedule_alarm_finalize
      continue_on_error: true

alarm_startup_reconcile:
  alias: "Alarm: reconcile after start"
  mode: single
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.alarm_ringing
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_text.alarm_previous_source') not in ['', 'unknown', 'unavailable', 'None'] }}"
          sequence:
            - service: script.alarm_restore
    - service: script.alarm_resume
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.alarm_enabled
              state: "on"
          sequence:
            - variables:
                repeat_mode: "{{ states('input_select.alarm_repeat') }}"
                next_raw: "{{ states('input_datetime.alarm_next') }}"
                next_past: >-
                  {% if next_raw in ['unknown', 'unavailable', 'None'] %}false
                  {% else %}{{ as_datetime(next_raw) <= now() }}{% endif %}
                snooze_raw: "{{ states('input_datetime.alarm_snooze_until') }}"
                snooze_past: >-
                  {% if snooze_raw in ['unknown', 'unavailable', 'None'] %}true
                  {% else %}{{ as_datetime(snooze_raw) <= now() }}{% endif %}
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ repeat_mode == 'Однократно' and next_past }}"
                  sequence:
                    - service: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.alarm_enabled
                - conditions:
                    - condition: template
                      value_template: "{{ repeat_mode != 'Однократно' and next_past }}"
                  sequence:
                    - service: script.alarm_schedule_next
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ snooze_past }}"
                  sequence:
                    - service: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.alarm_snooze_active

music_status:
  alias: "Music: current status"
  description: >-
    Return the current music route, player state, source, title, artist and
    volume. Read-only; safe for an LLM to call before changing playback.
  mode: single
  sequence:
    - variables:
        route_now: "{{ states('input_select.music_route') }}"
        player_state: "{{ states('media_player.iandeks_stantsiia_midi') }}"
        player_source: "{{ state_attr('media_player.iandeks_stantsiia_midi', 'source') | default('') }}"
        track_title: "{{ state_attr('media_player.iandeks_stantsiia_midi', 'media_title') | default('') }}"
        track_artist: "{{ state_attr('media_player.iandeks_stantsiia_midi', 'media_artist') | default('') }}"
        volume_level: "{{ state_attr('media_player.iandeks_stantsiia_midi', 'volume_level') | default(0) }}"
    - variables:
        result:
          status: ok
          route: "{{ route_now }}"
          state: "{{ player_state }}"
          source: "{{ player_source }}"
          title: "{{ track_title }}"
          artist: "{{ track_artist }}"
          volume: "{{ volume_level }}"
    - stop: "music_status"
      response_variable: result

music_search:
  alias: "Music: search by route"
  description: >-
    Search Spotify Connect or Music Assistant for music by free-text query.
    Returns real candidates with URI, title, artist, album, type and provider.
    Read-only; use music_play_uri to play a candidate. Never invent a URI.
  mode: queued
  max: 3
  fields:
    query:
      description: "What to search for. Artist, track, album, playlist, or a spoken description."
      example: "Белые розы"
      required: true
    media_type:
      description: "One of track, album, playlist, artist. Defaults to track."
      example: "track"
      default: "track"
    route:
      description: "Music Assistant or Spotify Connect. Empty means use the current route."
      example: "Spotify Connect"
      default: ""
    limit:
      description: "Maximum results to return (1-10)."
      example: 5
      default: 5
  sequence:
    - variables:
        route_effective: >-
          {% set requested = route | default('', true) %}
          {% if requested in ['Music Assistant', 'Spotify Connect'] %}
            {{ requested }}
          {% elif states('input_select.music_route') == 'Spotify Connect'
                  or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect') %}
            Spotify Connect
          {% else %}
            Music Assistant
          {% endif %}
        media_type_effective: >-
          {% set requested_type = media_type | default('track', true) | string | lower %}
          {{ requested_type if requested_type in ['track', 'album', 'playlist', 'artist'] else 'track' }}
        limit_effective: "{{ [[limit | default(5) | int(5), 1] | max, 10] | min }}"
        query_clean: >-
          {{ (query | default('', true) | string | trim).split() | join(' ') }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ route_effective == 'Spotify Connect' }}"
          sequence:
            - service: rest_command.spotify_token
              response_variable: spotify_auth
              continue_on_error: true
            - variables:
                spotify_auth_ok: >-
                  {{ spotify_auth is defined and spotify_auth.status == 200
                     and spotify_auth.content is mapping
                     and spotify_auth.content.access_token is defined }}
            - if:
                - condition: template
                  value_template: "{{ not spotify_auth_ok }}"
              then:
                - variables:
                    result:
                      status: auth_error
                      route: "spotify_connect"
                      media_type: "{{ media_type_effective }}"
                      query: "{{ query_clean }}"
                      candidates: []
                - stop: "music_search"
                  response_variable: result
            - service: rest_command.spotify_search
              data:
                access_token: "{{ spotify_auth.content.access_token }}"
                query: "{{ query_clean }}"
                media_type: "{{ media_type_effective }}"
                limit: "{{ limit_effective }}"
              response_variable: spotify_search
              continue_on_error: true
            - variables:
                spotify_status: "{{ spotify_search.status if spotify_search is defined else 0 }}"
                spotify_retry_after: >-
                  {{ spotify_search.headers.get('Retry-After', '') if spotify_search is defined
                     and spotify_search.headers is defined else '' }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ spotify_status == 429 }}"
                  sequence:
                    - variables:
                        result:
                          status: rate_limited
                          route: "spotify_connect"
                          media_type: "{{ media_type_effective }}"
                          query: "{{ query_clean }}"
                          retry_after: "{{ spotify_retry_after }}"
                          candidates: []
                    - stop: "music_search"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ spotify_status == 401 }}"
                  sequence:
                    - variables:
                        result:
                          status: auth_error
                          route: "spotify_connect"
                          media_type: "{{ media_type_effective }}"
                          query: "{{ query_clean }}"
                          candidates: []
                    - stop: "music_search"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ spotify_status != 200 }}"
                  sequence:
                    - variables:
                        result:
                          status: search_error
                          route: "spotify_connect"
                          media_type: "{{ media_type_effective }}"
                          query: "{{ query_clean }}"
                          http_status: "{{ spotify_status }}"
                          candidates: []
                    - stop: "music_search"
                      response_variable: result
            - variables:
                candidates_json: >-
                  {% set content = spotify_search.content if spotify_search.content is mapping else {} %}
                  {% if media_type_effective == 'track' %}
                    {% set items = content.get('tracks', {}).get('items', []) %}
                  {% elif media_type_effective == 'album' %}
                    {% set items = content.get('albums', {}).get('items', []) %}
                  {% elif media_type_effective == 'playlist' %}
                    {% set items = content.get('playlists', {}).get('items', []) %}
                  {% else %}
                    {% set items = content.get('artists', {}).get('items', []) %}
                  {% endif %}
                  {% set ns = namespace(items=[]) %}
                  {% for item in items %}
                    {% if not (item.is_local | default(false)) %}
                      {% set artist = '' %}
                      {% if item.artists is defined %}
                        {% if item.artists is string %}
                          {% set artist = item.artists %}
                        {% else %}
                          {% set artist = item.artists | map(attribute='name') | join(', ') %}
                        {% endif %}
                      {% endif %}
                      {% set album = '' %}
                      {% if item.album is defined %}
                        {% if item.album is mapping %}
                          {% set album = item.album.name | default('') %}
                        {% else %}
                          {% set album = item.album | string %}
                        {% endif %}
                      {% endif %}
                      {% set ns.items = ns.items + [{
                        'uri': item.uri,
                        'name': item.name | default(''),
                        'artist': artist,
                        'album': album,
                        'type': media_type_effective,
                        'provider': 'spotify',
                        'playable': item.is_playable | default(true)
                      }] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.items | selectattr('playable') | list | tojson }}
            - variables:
                result:
                  status: >-
                    {% set parsed = candidates_json if candidates_json is not string else candidates_json | from_json %}
                    {{ 'ok' if parsed | count > 0 else 'no_results' }}
                  route: "spotify_connect"
                  media_type: "{{ media_type_effective }}"
                  query: "{{ query_clean }}"
                  candidates: "{{ candidates_json }}"
            - stop: "music_search"
              response_variable: result
        - conditions:
            - condition: template
              value_template: "{{ route_effective == 'Music Assistant' }}"
          sequence:
            - service: music_assistant.search
              data:
                config_entry_id: "01M5TR8D68V6CVPP45ZN0RZ46Q"
                name: "{{ query_clean }}"
                media_type: "{{ media_type_effective }}"
                limit: "{{ limit_effective }}"
              response_variable: ma_search
              continue_on_error: true
            - if:
                - condition: template
                  value_template: "{{ ma_search is not defined }}"
              then:
                - variables:
                    result:
                      status: search_error
                      route: "music_assistant"
                      media_type: "{{ media_type_effective }}"
                      query: "{{ query_clean }}"
                      candidates: []
                - stop: "music_search"
                  response_variable: result
            - variables:
                candidates_json: >-
                  {% if media_type_effective == 'track' %}
                    {% set items = ma_search.tracks | default([], true) %}
                  {% elif media_type_effective == 'album' %}
                    {% set items = ma_search.albums | default([], true) %}
                  {% elif media_type_effective == 'playlist' %}
                    {% set items = ma_search.playlists | default([], true) %}
                  {% else %}
                    {% set items = ma_search.artists | default([], true) %}
                  {% endif %}
                  {% set ns = namespace(items=[]) %}
                  {% for item in items %}
                    {% if item.uri is defined %}
                      {% set artist = '' %}
                      {% if item.artists is defined %}
                        {% if item.artists is string %}
                          {% set artist = item.artists %}
                        {% else %}
                          {% set artist = item.artists | map(attribute='name') | join(', ') %}
                        {% endif %}
                      {% endif %}
                      {% set album = '' %}
                      {% if item.album is defined %}
                        {% if item.album is mapping %}
                          {% set album = item.album.name | default('') %}
                        {% else %}
                          {% set album = item.album | string %}
                        {% endif %}
                      {% endif %}
                      {% set ns.items = ns.items + [{
                        'uri': item.uri,
                        'name': item.name | default(''),
                        'artist': artist,
                        'album': album,
                        'type': media_type_effective,
                        'provider': 'music_assistant',
                        'playable': true
                      }] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.items | tojson }}
            - variables:
                result:
                  status: >-
                    {% set parsed = candidates_json if candidates_json is not string else candidates_json | from_json %}
                    {{ 'ok' if parsed | count > 0 else 'no_results' }}
                  route: "music_assistant"
                  media_type: "{{ media_type_effective }}"
                  query: "{{ query_clean }}"
                  candidates: "{{ candidates_json }}"
            - stop: "music_search"
              response_variable: result
    - variables:
        result:
          status: search_error
          route: "{{ route_effective }}"
          media_type: "{{ media_type_effective }}"
          query: "{{ query_clean }}"
          candidates: []
    - stop: "music_search"
      response_variable: result

music_play_uri:
  alias: "Music: play exact URI"
  description: >-
    Play an exact URI returned by music_search. For Spotify Connect use a
    spotify: URI; for Music Assistant use a library:// or provider URI. The
    tool never searches and never invents a URI.
  mode: queued
  max: 3
  fields:
    uri:
      description: "Exact URI returned by music_search."
      example: "spotify:track:4iV5W9uYEdYUVa79Axb7Rh"
      required: true
    media_type:
      description: "track, album, playlist, or artist. Defaults to track."
      example: "track"
      default: "track"
    route:
      description: "Music Assistant or Spotify Connect. Empty means use the current route."
      example: "Spotify Connect"
      default: ""
    title:
      description: "Human-readable title for the response."
      example: "Белые розы"
      default: ""
    artist:
      description: "Human-readable artist for the response."
      example: "Ласковый май"
      default: ""
  sequence:
    - variables:
        route_effective: >-
          {% set requested = route | default('', true) %}
          {% if requested in ['Music Assistant', 'Spotify Connect'] %}
            {{ requested }}
          {% elif states('input_select.music_route') == 'Spotify Connect'
                  or (state_attr('media_player.iandeks_stantsiia_midi', 'source') or '').startswith('Spotify Connect') %}
            Spotify Connect
          {% else %}
            Music Assistant
          {% endif %}
        media_type_effective: >-
          {% set requested_type = media_type | default('track', true) | string | lower %}
          {{ requested_type if requested_type in ['track', 'album', 'playlist', 'artist'] else 'track' }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ route_effective == 'Spotify Connect' }}"
          sequence:
            - service: rest_command.spotify_token
              response_variable: spotify_auth
              continue_on_error: true
            - variables:
                spotify_auth_ok: >-
                  {{ spotify_auth is defined and spotify_auth.status == 200
                     and spotify_auth.content is mapping
                     and spotify_auth.content.access_token is defined }}
            - if:
                - condition: template
                  value_template: "{{ not spotify_auth_ok }}"
              then:
                - variables:
                    result:
                      status: auth_error
                      route: "spotify_connect"
                      uri: "{{ uri }}"
                      title: "{{ title }}"
                      artist: "{{ artist }}"
                - stop: "music_play_uri"
                  response_variable: result
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ media_type_effective == 'track' }}"
                  sequence:
                    - service: rest_command.spotify_play_track
                      data:
                        access_token: "{{ spotify_auth.content.access_token }}"
                        uri: "{{ uri }}"
                      response_variable: spotify_play
                      continue_on_error: true
                - conditions:
                    - condition: template
                      value_template: "{{ true }}"
                  sequence:
                    - service: rest_command.spotify_play_context
                      data:
                        access_token: "{{ spotify_auth.content.access_token }}"
                        uri: "{{ uri }}"
                      response_variable: spotify_play
                      continue_on_error: true
            - variables:
                play_status: "{{ spotify_play.status if spotify_play is defined else 0 }}"
                retry_after: >-
                  {{ spotify_play.headers.get('Retry-After', '') if spotify_play is defined
                     and spotify_play.headers is defined else '' }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ play_status == 204 }}"
                  sequence:
                    - variables:
                        result:
                          status: ok
                          route: "spotify_connect"
                          media_type: "{{ media_type_effective }}"
                          uri: "{{ uri }}"
                          title: "{{ title }}"
                          artist: "{{ artist }}"
                    - stop: "music_play_uri"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ play_status == 429 }}"
                  sequence:
                    - variables:
                        result:
                          status: rate_limited
                          route: "spotify_connect"
                          retry_after: "{{ retry_after }}"
                          uri: "{{ uri }}"
                          title: "{{ title }}"
                          artist: "{{ artist }}"
                    - stop: "music_play_uri"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ play_status == 401 }}"
                  sequence:
                    - variables:
                        result:
                          status: auth_error
                          route: "spotify_connect"
                          uri: "{{ uri }}"
                          title: "{{ title }}"
                          artist: "{{ artist }}"
                    - stop: "music_play_uri"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ play_status == 403 }}"
                  sequence:
                    - variables:
                        result:
                          status: premium_required
                          route: "spotify_connect"
                          uri: "{{ uri }}"
                          title: "{{ title }}"
                          artist: "{{ artist }}"
                    - stop: "music_play_uri"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ play_status == 404 }}"
                  sequence:
                    - variables:
                        result:
                          status: device_unavailable
                          route: "spotify_connect"
                          uri: "{{ uri }}"
                          title: "{{ title }}"
                          artist: "{{ artist }}"
                    - stop: "music_play_uri"
                      response_variable: result
                - conditions:
                    - condition: template
                      value_template: "{{ true }}"
                  sequence:
                    - variables:
                        result:
                          status: play_error
                          route: "spotify_connect"
                          http_status: "{{ play_status }}"
                          uri: "{{ uri }}"
                          title: "{{ title }}"
                          artist: "{{ artist }}"
                    - stop: "music_play_uri"
                      response_variable: result
        - conditions:
            - condition: template
              value_template: "{{ route_effective == 'Music Assistant' }}"
          sequence:
            - service: music_assistant.play_media
              target:
                entity_id: media_player.iandeks_stantsiia_midi
              data:
                media_id: "{{ uri }}"
                media_type: "{{ media_type_effective }}"
                enqueue: replace
              continue_on_error: true
            - variables:
                result:
                  status: ok
                  route: "music_assistant"
                  media_type: "{{ media_type_effective }}"
                  uri: "{{ uri }}"
                  title: "{{ title }}"
                  artist: "{{ artist }}"
            - stop: "music_play_uri"
              response_variable: result
    - variables:
        result:
          status: play_error
          route: "{{ route_effective }}"
          uri: "{{ uri }}"
          title: "{{ title }}"
          artist: "{{ artist }}"
    - stop: "music_play_uri"
      response_variable: result

music_play_query:
  alias: "Music: search and play best match"
  description: >-
    Search by text and play the best candidate. This is the fast path used by
    voice. It returns the selected candidate and up to three candidates so the
    caller can offer a correction such as "second one".
  mode: queued
  max: 3
  fields:
    query:
      description: "Free-text music query."
      example: "Белые розы"
      required: true
    media_type:
      description: "track, album, playlist, or artist. Defaults to track."
      example: "track"
      default: "track"
    route:
      description: "Music Assistant or Spotify Connect. Empty means use the current route."
      example: "Spotify Connect"
      default: ""
  sequence:
    - service: script.music_search
      data:
        query: "{{ query }}"
        media_type: "{{ media_type }}"
        route: "{{ route }}"
      response_variable: search
    - variables:
        search_status: "{{ search.status if search is mapping else 'search_error' }}"
        candidates_json: >-
          {% if search is mapping %}
            {% set candidates = search.candidates | default([], true) %}
            {{ candidates if candidates is string else candidates | tojson }}
          {% else %}
            []
          {% endif %}
        candidates_count: >-
          {% set parsed = candidates_json if candidates_json is not string else candidates_json | from_json %}
          {{ parsed | count }}
    - if:
        - condition: template
          value_template: "{{ search_status != 'ok' or candidates_count == 0 }}"
      then:
        - variables:
            result:
              status: "{{ search.status if search is mapping else 'search_error' }}"
              route: "{{ search.route if search is mapping else '' }}"
              media_type: "{{ search.media_type if search is mapping else 'track' }}"
              query: "{{ search.query if search is mapping else query }}"
              candidates: "{{ candidates_json }}"
              retry_after: "{{ search.retry_after | default('') if search is mapping else '' }}"
        - stop: "music_play_query"
          response_variable: result
    - variables:
        first_json: >-
          {% set parsed = candidates_json if candidates_json is not string else candidates_json | from_json %}
          {{ parsed[0] | tojson }}
        first_uri: "{{ (first_json if first_json is not string else first_json | from_json).uri }}"
        first_name: "{{ (first_json if first_json is not string else first_json | from_json).name | default('') }}"
        first_artist: "{{ (first_json if first_json is not string else first_json | from_json).artist | default('') }}"
        first_type: "{{ (first_json if first_json is not string else first_json | from_json).type | default('track') }}"
        route_effective: >-
          {% if search.route == 'spotify_connect' %}Spotify Connect{% else %}Music Assistant{% endif %}
        candidates_text: >-
          {% set ns = namespace(lines=[]) %}
          {% set parsed_candidates = candidates_json if candidates_json is not string else candidates_json | from_json %}
          {% for candidate in parsed_candidates[:2] %}
            {% set route_code = 'C' if search.route == 'spotify_connect' else 'M' %}
            {% set clean_title = candidate.name | default('') | string | replace('|', '/') | truncate(32, true, '') %}
            {% set clean_artist = candidate.artist | default('') | string | replace('|', '/') | truncate(20, true, '') %}
            {% set ns.lines = ns.lines + [loop.index | string ~ '|' ~ route_code ~ '|' ~ (candidate.type | default('track')) ~ '|' ~ clean_title ~ '|' ~ clean_artist ~ '|' ~ candidate.uri] %}
          {% endfor %}
          {{ ns.lines | join('\n') }}
    - service: input_text.set_value
      target:
        entity_id: input_text.music_candidates
      data:
        value: "{{ candidates_text[:255] }}"
      continue_on_error: true
    - service: script.music_play_uri
      data:
        uri: "{{ first_uri }}"
        media_type: "{{ first_type }}"
        route: "{{ route_effective }}"
        title: "{{ first_name }}"
        artist: "{{ first_artist }}"
      response_variable: play
    - variables:
        result:
          status: "{{ play.status | default('play_error') }}"
          route: "{{ route_effective }}"
          media_type: "{{ first_type }}"
          query: "{{ search.query | default(query) }}"
          selected:
            uri: "{{ first_uri }}"
            name: "{{ first_name }}"
            artist: "{{ first_artist }}"
            type: "{{ first_type }}"
          candidates: "{{ candidates_json }}"
          retry_after: "{{ play.retry_after | default('') }}"
          http_status: "{{ play.http_status | default('') }}"
    - stop: "music_play_query"
      response_variable: result


music_play_candidate:
  alias: "Music: play saved candidate"
  description: >-
    Play one of the candidates saved by the last music_play_query call.
    Index 1 is the first result. Use after the user says "second one".
  mode: queued
  max: 3
  fields:
    index:
      description: "1-based candidate index."
      example: 2
      default: 1
  sequence:
    - variables:
        raw_candidates: "{{ states('input_text.music_candidates') | default('', true) }}"
        candidate_lines_json: >-
          {% set ns = namespace(lines=[]) %}
          {% for line in raw_candidates.split('\n') %}
            {% if line | trim %}
              {% set ns.lines = ns.lines + [line | trim] %}
            {% endif %}
          {% endfor %}
          {{ ns.lines | tojson }}
        candidate_count: >-
          {% set parsed_lines = candidate_lines_json if candidate_lines_json is not string else candidate_lines_json | from_json %}
          {{ parsed_lines | count }}
        candidate_index: "{{ index | default(1) | int(1) }}"
    - if:
        - condition: template
          value_template: "{{ candidate_count == 0 }}"
      then:
        - variables:
            result:
              status: no_candidates
              message: "No saved candidates. Search for music first."
              candidates: "{{ candidate_lines_json }}"
        - stop: "music_play_candidate"
          response_variable: result
    - if:
        - condition: template
          value_template: "{{ candidate_index | int < 1 or candidate_index | int > candidate_count }}"
      then:
        - variables:
            result:
              status: no_candidate
              message: "Candidate index is out of range."
              candidates: "{{ candidate_lines_json }}"
        - stop: "music_play_candidate"
          response_variable: result
    - variables:
        selected_line: >-
          {% set parsed_lines = candidate_lines_json if candidate_lines_json is not string else candidate_lines_json | from_json %}
          {{ parsed_lines[(candidate_index | int) - 1] }}
        parts_json: "{{ selected_line.split('|') | tojson }}"
        parts_count: >-
          {% set parsed_parts = parts_json if parts_json is not string else parts_json | from_json %}
          {{ parsed_parts | count }}
    - if:
        - condition: template
          value_template: "{{ parts_count < 6 }}"
      then:
        - variables:
            result:
              status: candidate_corrupt
              message: "Saved candidate is malformed; search again."
              candidates: "{{ candidate_lines_json }}"
        - stop: "music_play_candidate"
          response_variable: result
    - variables:
        part_route: "{{ (parts_json if parts_json is not string else parts_json | from_json)[1] }}"
        part_type: "{{ (parts_json if parts_json is not string else parts_json | from_json)[2] }}"
        part_name: "{{ (parts_json if parts_json is not string else parts_json | from_json)[3] }}"
        part_artist: "{{ (parts_json if parts_json is not string else parts_json | from_json)[4] }}"
        part_uri: "{{ (parts_json if parts_json is not string else parts_json | from_json)[5] }}"
        route_effective: "{{ 'Spotify Connect' if part_route == 'C' else 'Music Assistant' }}"
        selected:
          uri: "{{ part_uri }}"
          type: "{{ part_type }}"
          name: "{{ part_name }}"
          artist: "{{ part_artist }}"
    - service: script.music_play_uri
      data:
        uri: "{{ selected.uri }}"
        media_type: "{{ selected.type }}"
        route: "{{ route_effective }}"
        title: "{{ selected.name }}"
        artist: "{{ selected.artist }}"
      response_variable: play
    - variables:
        result:
          status: "{{ play.status | default('play_error') }}"
          route: "{{ route_effective }}"
          media_type: "{{ selected.type }}"
          selected: "{{ selected }}"
          candidates: "{{ candidate_lines_json }}"
          retry_after: "{{ play.retry_after | default('') }}"
          http_status: "{{ play.http_status | default('') }}"
    - stop: "music_play_candidate"
      response_variable: result

# --- Schedules: canonical ricardo.v1.SchedulerService client (2026-10-29) ---
# Authoritative alarm/reminder/timer state lives in the durable scheduler.
# Home Assistant only speaks, executes audio through ha-bridge, and calls the
# Connect JSON API. Notes stay in HA todo and are unchanged.
#
# Legacy alarm_* audio scripts above are still the sound executor. The legacy
# todo/timer dispatchers below are kept for rollback but their automations are
# disabled with initial_state: false; only the scheduler is authoritative.

scheduler_rpc:
  alias: "Scheduler: Connect JSON RPC"
  description: "Call one ricardo.v1.SchedulerService RPC and normalize success/error. Never speaks or logs endpoint/token values."
  mode: parallel
  max: 20
  fields:
    method:
      required: true
      description: "SchedulerService method name"
      example: "ListSchedules"
    payload_json:
      default: "{}"
      description: "Request body already serialized with to_json"
  sequence:
    - variables:
        scheduler_endpoint_value: "{{ states('input_text.scheduler_endpoint') | trim | regex_replace('/+$', '') }}"
    - if:
        - condition: template
          value_template: "{{ scheduler_endpoint_value in ['', 'unknown', 'unavailable', 'None'] or not (scheduler_endpoint_value.startswith('http://') or scheduler_endpoint_value.startswith('https://')) }}"
      then:
        - variables:
            rpc_result: "{{ {'status': 'error', 'code': 'config_error', 'message': '', 'http_status': 0, 'error_text': 'Планировщик не настроен: проверьте адрес.', 'data': {}} }}"
        - stop: "scheduler endpoint missing"
          response_variable: rpc_result
    - service: rest_command.scheduler_rpc
      data:
        method: "{{ method }}"
        payload_json: "{{ payload_json | default('{}') }}"
      response_variable: rpc_http
      continue_on_error: true
    - variables:
        rpc_http_status: "{{ rpc_http.status | int(0) if rpc_http is mapping and rpc_http.status is defined else 0 }}"
        rpc_parsed_raw: >-
          {{ (rpc_http.content if (rpc_http is mapping and rpc_http.content is defined and rpc_http.content is mapping)
              else ((rpc_http.content | trim | from_json(default={'__scheduler_parse_error__': true}))
                    if (rpc_http is mapping and rpc_http.content is defined and rpc_http.content is string and (rpc_http.content | trim) != '')
                    else {'__scheduler_parse_error__': true})) }}
        rpc_parsed: >-
          {{ rpc_parsed_raw if rpc_parsed_raw is mapping else {'__scheduler_parse_error__': true} }}
    - variables:
        rpc_code: "{{ rpc_parsed.get('code', '') if rpc_parsed is mapping else '' }}"
        rpc_message: "{{ rpc_parsed.get('message', '') if rpc_parsed is mapping else '' }}"
        rpc_ok: "{{ rpc_http_status >= 200 and rpc_http_status < 300 and rpc_code == '' and not (rpc_parsed is mapping and rpc_parsed.get('__scheduler_parse_error__', false)) }}"
        rpc_error_text: >-
          {% set code = rpc_parsed.get('code', '') if rpc_parsed is mapping else '' %}
          {% if rpc_http_status == 0 %}Планировщик недоступен.
          {% elif code in ['unauthenticated', 'permission_denied'] %}Планировщик отклонил доступ.
          {% elif code in ['invalid_argument', 'out_of_range'] %}Планировщик отклонил параметры.
          {% elif code == 'not_found' %}В планировщике ничего не найдено.
          {% elif code == 'already_exists' %}Такое расписание уже существует.
          {% elif code == 'failed_precondition' %}Это действие сейчас недоступно.
          {% elif code == 'aborted' %}Расписание уже изменилось, повторите команду.
          {% elif code == 'resource_exhausted' %}Лимит планировщика исчерпан.
          {% elif code in ['unavailable', 'deadline_exceeded'] %}Планировщик не отвечает.
          {% elif rpc_parsed is mapping and rpc_parsed.get('__scheduler_parse_error__') %}Планировщик вернул некорректный ответ.
          {% elif rpc_http_status >= 400 %}Планировщик вернул ошибку {{ rpc_http_status }}.
          {% else %}Ошибка планировщика.{% endif %}
    - variables:
        rpc_result: >-
          {{ {'status': ('ok' if rpc_ok else 'error'), 'code': rpc_code,
              'message': rpc_message, 'http_status': rpc_http_status,
              'error_text': ('' if rpc_ok else rpc_error_text | trim),
              'data': (rpc_parsed if rpc_parsed is mapping and not rpc_parsed.get('__scheduler_parse_error__', false) else {})} }}
    - stop: "scheduler rpc"
      response_variable: rpc_result

scheduler_list:
  alias: "Scheduler: list schedules"
  description: "Read schedules through ListSchedules; empty lists are a normal success."
  mode: parallel
  max: 20
  fields:
    kind:
      default: "SCHEDULE_KIND_UNSPECIFIED"
    include_disabled:
      default: false
  sequence:
    - variables:
        list_request_json: "{{ {'includeDisabled': include_disabled | default(false) | bool, 'kind': kind | default('SCHEDULE_KIND_UNSPECIFIED')} | to_json }}"
    - service: script.scheduler_rpc
      data:
        method: "ListSchedules"
        payload_json: "{{ list_request_json }}"
      response_variable: list_rpc
    - variables:
        list_rows: "{{ list_rpc.data.get('schedules', []) if list_rpc.status == 'ok' and list_rpc.data is mapping else [] }}"
        list_result: "{{ {'status': list_rpc.status, 'code': list_rpc.code | default(''), 'http_status': list_rpc.http_status | default(0), 'error_text': list_rpc.error_text | default(''), 'schedules': list_rows} }}"
    - stop: "scheduler list"
      response_variable: list_result

scheduler_resolve_schedule:
  alias: "Scheduler: resolve one schedule by unambiguous label or time"
  description: "Never guesses an id. Empty query with more than one candidate is ambiguous."
  mode: parallel
  max: 20
  fields:
    query:
      default: ""
    kind:
      default: "SCHEDULE_KIND_ALARM"
    include_disabled:
      default: true
  sequence:
    - service: script.scheduler_list
      data:
        kind: "{{ kind }}"
        include_disabled: "{{ include_disabled | default(true) | bool }}"
      response_variable: resolve_list
    - variables:
        resolve_q: "{{ query | default('') | string | trim | lower }}"
        resolve_matches: >-
          {%- set ns = namespace(exact=[], loose=[]) -%}
          {%- for s in (resolve_list.schedules if resolve_list.status == 'ok' else []) -%}
            {%- set label = s.get('label', '') | string | lower -%}
            {%- set due = s.get('nextDueUnix', '0') | int(0) -%}
            {%- set due_text = due | timestamp_custom('%H:%M', true) if due > 0 else '' -%}
            {%- if resolve_q == '' -%}
              {%- set ns.loose = ns.loose + [s] -%}
            {%- elif label == resolve_q -%}
              {%- set ns.exact = ns.exact + [s] -%}
            {%- elif (resolve_q in label) or (due_text != '' and resolve_q == due_text) -%}
              {%- set ns.loose = ns.loose + [s] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.exact if ns.exact | length > 0 else ns.loose }}
    - variables:
        resolve_status: "{{ 'error' if resolve_list.status != 'ok' else ('ok' if resolve_matches | length == 1 else ('ambiguous' if resolve_matches | length > 1 else 'not_found')) }}"
    - variables:
        resolve_result: >-
          {{ {'status': resolve_status, 'code': resolve_list.code | default(''),
              'error_text': resolve_list.error_text | default(''),
              'schedule': (resolve_matches[0] if resolve_matches | length == 1 else {}),
              'count': resolve_matches | length} }}
    - stop: "scheduler resolve schedule"
      response_variable: resolve_result

scheduler_resolve_timer:
  alias: "Scheduler: resolve one timer by unambiguous label"
  mode: parallel
  max: 20
  fields:
    query:
      default: ""
    required_state:
      default: ""
  sequence:
    - variables:
        timer_request_json: "{{ {'includeFinished': false} | to_json }}"
    - service: script.scheduler_rpc
      data:
        method: "ListTimers"
        payload_json: "{{ timer_request_json }}"
      response_variable: timer_rpc
    - variables:
        timer_q: "{{ query | default('') | string | trim | lower }}"
        timer_matches: >-
          {%- set ns = namespace(exact=[], loose=[]) -%}
          {%- for t in (timer_rpc.data.get('timers', []) if timer_rpc.status == 'ok' and timer_rpc.data is mapping else []) -%}
            {%- set state = t.get('state', '') -%}
            {%- set label = t.get('label', '') | string | lower -%}
            {%- if state in ['TIMER_STATE_RUNNING', 'TIMER_STATE_PAUSED'] and (required_state | default('') == '' or state == required_state) -%}
              {%- if timer_q == '' -%}
                {%- set ns.loose = ns.loose + [t] -%}
              {%- elif label == timer_q -%}
                {%- set ns.exact = ns.exact + [t] -%}
              {%- elif timer_q in label -%}
                {%- set ns.loose = ns.loose + [t] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.exact if ns.exact | length > 0 else ns.loose }}
    - variables:
        timer_status: "{{ 'error' if timer_rpc.status != 'ok' else ('ok' if timer_matches | length == 1 else ('ambiguous' if timer_matches | length > 1 else 'not_found')) }}"
    - variables:
        timer_result: >-
          {{ {'status': timer_status, 'code': timer_rpc.code | default(''),
              'error_text': timer_rpc.error_text | default(''),
              'timer': (timer_matches[0] if timer_matches | length == 1 else {}),
              'count': timer_matches | length} }}
    - stop: "scheduler resolve timer"
      response_variable: timer_result

scheduler_active_alarm:
  alias: "Scheduler: find the currently ringing alarm"
  description: "Uses the id stored by alarm_start, then falls back to the scheduler active window."
  mode: parallel
  max: 20
  sequence:
    - variables:
        active_stored_id: "{{ states('input_text.scheduler_active_schedule_id') | trim }}"
        active_stored_label: "{{ states('input_text.scheduler_active_label') | trim }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ active_stored_id not in ['', 'unknown', 'unavailable', 'None'] }}"
          sequence:
            - variables:
                active_result: "{{ {'status': 'ok', 'id': active_stored_id, 'label': active_stored_label, 'source': 'stored', 'http_status': 200, 'error_text': ''} }}"
            - stop: "stored active alarm"
              response_variable: active_result
    - service: script.scheduler_list
      data:
        kind: "SCHEDULE_KIND_ALARM"
        include_disabled: true
      response_variable: active_list
    - variables:
        active_rows: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for s in (active_list.schedules if active_list.status == 'ok' else []) -%}
            {%- if (s.get('activeUntilUnix', '0') | int(0)) > (now().timestamp() | int(0)) and (s.get('activeOccurrenceUnix', '0') | int(0)) > 0 -%}
              {%- set ns.rows = ns.rows + [s] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
    - variables:
        active_status: "{{ 'error' if active_list.status != 'ok' else ('ok' if active_rows | length == 1 else ('ambiguous' if active_rows | length > 1 else 'not_found')) }}"
    - variables:
        active_result: >-
          {{ {'status': active_status, 'id': (active_rows[0].get('id', '') if active_rows | length == 1 else ''),
              'label': (active_rows[0].get('label', '') if active_rows | length == 1 else ''),
              'source': 'active_window', 'http_status': active_list.http_status | default(0),
              'error_text': active_list.error_text | default('')} }}
    - stop: "scheduler active alarm"
      response_variable: active_result


scheduler_confirm_ring_stopped:
  alias: "Scheduler: confirm the executor stopped the captured alarm"
  description: "Wait up to 3 s for alarm_ringing to clear. Local audio stop only when the same captured schedule/event is still ringing; never silence a newer alarm."
  mode: parallel
  max: 20
  fields:
    schedule_id:
      default: ""
    event_id:
      default: ""
  sequence:
    - variables:
        confirm_schedule_id: "{{ schedule_id | default('') | string | trim }}"
        confirm_event_id: "{{ event_id | default('') | string | trim }}"
    - if:
        - condition: template
          value_template: "{{ not is_state('input_boolean.alarm_ringing', 'on') }}"
      then:
        - variables:
            confirm_result: "{{ {'outcome': 'not_ringing'} }}"
        - stop: "already silent"
          response_variable: confirm_result
    - wait_template: "{{ is_state('input_boolean.alarm_ringing', 'off') }}"
      timeout: "00:00:03"
      continue_on_timeout: true
    - variables:
        confirm_same_source: >-
          {{ is_state('input_boolean.alarm_ringing', 'on')
             and confirm_schedule_id not in ['', 'None', 'unknown', 'unavailable']
             and (states('input_text.scheduler_active_schedule_id') | trim) == confirm_schedule_id
             and (confirm_event_id in ['', 'None', 'unknown', 'unavailable']
                  or (states('input_text.scheduler_active_event_id') | trim) == confirm_event_id) }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not is_state('input_boolean.alarm_ringing', 'on') }}"
          sequence:
            - variables:
                confirm_result: "{{ {'outcome': 'executor'} }}"
        - conditions:
            - condition: template
              value_template: "{{ confirm_same_source }}"
          sequence:
            - service: script.alarm_stop
            - variables:
                confirm_result: "{{ {'outcome': 'local'} }}"
      default:
        - variables:
            confirm_result: "{{ {'outcome': 'other'} }}"
    - stop: "scheduler confirm ring stopped"
      response_variable: confirm_result

schedule_announce:
  alias: "Schedules: speak a message on Pulsar"
  mode: restart
  fields:
    message:
      description: "Text to speak"
      example: "Таймер пицца закончился."
    chime:
      description: "Play the alarm chime first"
      example: true
  sequence:
    - if:
        - condition: template
          value_template: "{{ chime | default(false) | bool }}"
      then:
        - service: media_player.play_media
          target:
            entity_id: media_player.iandeks_stantsiia_midi_media_player
          data:
            media_content_id: "http://127.0.0.1:8123/local/alarm_chime.wav"
            media_content_type: music
          continue_on_error: true
        - delay: "00:00:02"
    - service: tts.speak
      target:
        entity_id: tts.piper
      data:
        media_player_entity_id: media_player.iandeks_stantsiia_midi_media_player
        message: "{{ message }}"
        cache: true
        language: ru
        options:
          voice: ru_puriso2-medium
      continue_on_error: true

alarm_ui_create:
  alias: "Alarm: create from UI form (canonical scheduler)"
  mode: single
  sequence:
    - variables:
        time_raw: "{{ states('input_datetime.alarm_form_time') }}"
        hour_num: "{{ time_raw.split(':')[0] | int(7) if ':' in time_raw else 7 }}"
        minute_num: "{{ time_raw.split(':')[1] | int(0) if ':' in time_raw else 0 }}"
        repeat_mode: "{{ states('input_select.alarm_form_repeat') }}"
        name_value: "{{ states('input_text.alarm_form_name') }}"
    - service: script.schedule_alarm_create
      data:
        hour: "{{ hour_num }}"
        minute: "{{ minute_num }}"
        repeat: "{{ repeat_mode }}"
        name: "{{ name_value }}"
    - service: input_text.set_value
      target:
        entity_id: input_text.alarm_form_name
      data:
        value: ""

schedule_alarm_create:
  alias: "Scheduler: create alarm"
  description: "Create an alarm in the canonical SchedulerService with wall time, IANA timezone and repeat."
  mode: single
  fields:
    hour:
      description: "Hour 0-23"
      example: 7
    minute:
      description: "Minute 0-59"
      example: 30
    period:
      description: "утра, дня, вечера, ночи"
      example: "утра"
    day:
      description: "сегодня, завтра"
      example: "завтра"
    repeat:
      description: "Однократно, Каждый день, По будням, По выходным"
      example: "По будням"
    name:
      description: "Optional alarm label"
      example: "Работа"
    second:
      description: "Second 0-59 (relative alarms preserve the target second)"
      example: 45
      default: 0
  sequence:
    - variables:
        hour_num: "{{ hour | default(7) | int(7) }}"
        minute_num: "{{ minute | default(0) | int(0) }}"
        second_num: "{{ (second | default(0) | int(0)) % 60 }}"
        period_raw: "{{ period | default('') | string | lower }}"
        day_raw: "{{ day | default('') | string | lower }}"
        repeat_raw: "{{ repeat | default('Однократно') | string }}"
        repeat_mode: >-
          {{ 'Каждый день' if repeat_raw in ['Каждый день', 'Ежедневно', 'каждый день', 'ежедневно']
             else ('По будням' if repeat_raw in ['По будням', 'по будням', 'По рабочим дням', 'по рабочим дням']
             else ('По выходным' if repeat_raw in ['По выходным', 'по выходным'] else 'Однократно')) }}
        repeat_kind: >-
          {{ 'REPEAT_KIND_DAILY' if repeat_mode | trim == 'Каждый день'
             else ('REPEAT_KIND_WEEKDAYS' if repeat_mode | trim == 'По будням'
             else ('REPEAT_KIND_WEEKENDS' if repeat_mode | trim == 'По выходным' else 'REPEAT_KIND_ONCE')) }}
        adjusted_hour: >-
          {% set h = hour_num | int %}
          {{ (h + 12) if period_raw in ['вечера', 'дня'] and h < 12 else (0 if period_raw in ['ночи', 'утра'] and h == 12 else h) }}
        timezone_name: "{{ now().tzinfo | string | trim }}"
        once_date: >-
          {% set ns = namespace(dt=now().replace(hour=adjusted_hour | int, minute=minute_num | int, second=second_num | int, microsecond=0)) %}
          {% if day_raw == 'завтра' %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% elif ns.dt <= now() %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% endif %}
          {{ ns.dt.strftime('%Y-%m-%d') }}
        alarm_label: >-
          {% if name is defined and name not in ['', 'unknown', 'unavailable', 'None', None] %}{{ name }}
          {% else %}Будильник {{ '%02d:%02d' | format(adjusted_hour | int, minute_num | int) }}{% endif %}
        alarm_idempotency_key: "ha:alarm:{{ now().strftime('%Y%m%dT%H%M%S%f') ~ '-' ~ (now().timestamp() | int) ~ '-' ~ (range(0, 65536) | random) }}"
    - if:
        - condition: template
          value_template: "{{ timezone_name in ['', 'None'] or ('/' not in timezone_name and timezone_name not in ['UTC', 'Etc/UTC']) }}"
      then:
        - variables:
            create_result: "{{ {'status': 'error', 'text': 'Не удалось определить часовой пояс Home Assistant.', 'schedule_id': '', 'label': alarm_label} }}"
        - stop: "invalid timezone"
          response_variable: create_result
    - variables:
        create_request_json: >-
          {{ {'label': alarm_label | trim,
              'kind': 'SCHEDULE_KIND_ALARM',
              'timezone': timezone_name,
              'at': {'hour': adjusted_hour | int, 'minute': minute_num | int, 'second': second_num | int},
              'onceDate': ((once_date | trim) if repeat_kind | trim == 'REPEAT_KIND_ONCE' else ''),
              'repeat': repeat_kind,
              'enabled': true,
              'payloadJson': '{}',
              'idempotencyKey': alarm_idempotency_key} | to_json }}
    - service: script.scheduler_rpc
      data:
        method: "CreateSchedule"
        payload_json: "{{ create_request_json }}"
      response_variable: create_rpc
    - variables:
        created_schedule: "{{ create_rpc.data.get('schedule', {}) if create_rpc.status == 'ok' and create_rpc.data is mapping else {} }}"
        created_label_raw: "{{ created_schedule.get('label', alarm_label) | trim if created_schedule is mapping else alarm_label }}"
        created_due_hm: >-
          {% set due = created_schedule.get('nextDueUnix', '0') | int(0) if created_schedule is mapping else 0 %}
          {{ due | timestamp_custom('%H:%M', true) if due > 0 else '' }}
        created_is_auto: "{{ created_label_raw == ('Будильник ' ~ (created_due_hm | trim)) }}"
        created_repeat_natural: >-
          {% set r = created_schedule.get('repeat', '') if created_schedule is mapping else '' %}
          {{ 'каждый день' if r == 'REPEAT_KIND_DAILY' else ('по будням' if r == 'REPEAT_KIND_WEEKDAYS' else ('по выходным' if r == 'REPEAT_KIND_WEEKENDS' else '')) }}
        created_day_prefix: >-
          {% set once = created_schedule.get('onceDate', '') if created_schedule is mapping else '' %}
          {% set r = created_schedule.get('repeat', '') if created_schedule is mapping else '' %}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
          {% if r == 'REPEAT_KIND_ONCE' and once %}
            {% if once == tomorrow %}завтра,
            {% elif once != today %}{{ once[8:10] }}.{{ once[5:7] }},
            {% endif %}
          {% endif %}
    - variables:
        create_result: >-
          {{ ({'status': 'ok',
              'text': 'Готово. ' ~ ('Будильник' if created_is_auto else '«' ~ created_label_raw ~ '»') ~ ' на ' ~ (created_day_prefix | trim ~ ' ' if (created_day_prefix | trim) else '') ~ (created_due_hm | trim) ~ ((' ' ~ (created_repeat_natural | trim)) if (created_repeat_natural | trim) else '') ~ '.',
              'schedule_id': created_schedule.get('id', ''),
              'label': created_schedule.get('label', alarm_label)}
             if create_rpc.status == 'ok' and created_schedule is mapping and created_schedule.get('id')
             else {'status': 'error', 'text': (create_rpc.error_text | default('Планировщик вернул пустой ответ.')) if create_rpc.status != 'ok' else 'Планировщик вернул пустой ответ.', 'schedule_id': '', 'label': alarm_label}) }}
    - stop: "schedule_alarm_create"
      response_variable: create_result

schedule_alarm_create_relative:
  alias: "Scheduler: create relative alarm"
  mode: single
  fields:
    hours:
      description: "Hours from now"
      example: 1
    minutes:
      description: "Minutes from now"
      example: 30
    name:
      description: "Optional alarm label"
      example: "Работа"
  sequence:
    - variables:
        hours_num: "{{ hours | default(0) | int(0) }}"
        minutes_num: "{{ minutes | default(0) | int(0) }}"
        total_minutes: "{{ [1, (hours_num * 60) + minutes_num] | max | int }}"
        # HA (2026.10) cannot represent a datetime as a script variable value:
        # the native value is rendered to str, so `.date()` on it fails.
        # Numbers/dicts/lists keep their type. Keep one epoch integer and derive
        # every field from it instead.
        relative_target_ts: "{{ (now().timestamp() + (total_minutes | int) * 60) | int }}"
        relative_today: "{{ now().timestamp() | timestamp_custom('%Y-%m-%d', true) }}"
        relative_day_date: "{{ relative_target_ts | timestamp_custom('%Y-%m-%d', true) }}"
        relative_day: "{{ 'завтра' if relative_day_date != relative_today else '' }}"
    - service: script.schedule_alarm_create
      data:
        hour: "{{ relative_target_ts | timestamp_custom('%H', true) | int(0) }}"
        minute: "{{ relative_target_ts | timestamp_custom('%M', true) | int(0) }}"
        second: "{{ relative_target_ts | timestamp_custom('%S', true) | int(0) }}"
        day: "{{ relative_day }}"
        repeat: "Однократно"
        name: "{{ name | default('') }}"
      response_variable: relative_result
    - stop: "schedule_alarm_create_relative"
      response_variable: relative_result

schedule_alarm_status:
  alias: "Scheduler: alarm list text"
  mode: single
  sequence:
    - service: script.scheduler_list
      data:
        kind: "SCHEDULE_KIND_ALARM"
        include_disabled: false
      response_variable: alarm_status_list
    - variables:
        alarm_status_rows: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for s in (alarm_status_list.schedules if alarm_status_list.status == 'ok' else []) -%}
            {%- set due = s.get('nextDueUnix', '0') | int(0) -%}
            {%- if due > 0 and s.get('enabled', true) -%}
              {%- set r = s.get('repeat', '') -%}
              {%- set rtext = {'REPEAT_KIND_ONCE': 'однократно', 'REPEAT_KIND_DAILY': 'ежедневно', 'REPEAT_KIND_WEEKDAYS': 'по будням', 'REPEAT_KIND_WEEKENDS': 'по выходным', 'REPEAT_KIND_CUSTOM': 'по дням недели'}.get(r, '') -%}
              {%- set ns.rows = ns.rows + [{'due': due, 'label': s.get('label', 'Будильник'), 'repeat': rtext}] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.rows | sort(attribute='due') }}
        alarm_status_text: >-
          {% if alarm_status_list.status != 'ok' %}
          Не удалось получить список будильников. {{ alarm_status_list.error_text | default('') }}
          {% elif alarm_status_rows | length == 0 %}
          Будильников нет.
          {% else %}
          {% for row in alarm_status_rows %}{{ row.label }}: {{ row.due | timestamp_custom('%H:%M, %d.%m', true) }}, {{ row.repeat }}{% if not loop.last %}. {% endif %}{% endfor %}
          {% endif %}
        alarm_status_result: "{{ {'status': alarm_status_list.status, 'text': alarm_status_text | trim | replace('\n', ' ') | replace('  ', ' ')} }}"
    - stop: "schedule_alarm_status"
      response_variable: alarm_status_result

schedule_alarm_set_enabled:
  alias: "Scheduler: enable or disable alarm"
  mode: single
  fields:
    query:
      default: ""
    enabled:
      required: true
    all:
      default: false
  sequence:
    - variables:
        set_enabled_flag: "{{ enabled | default(false) | bool }}"
        set_all_flag: "{{ all | default(false) | bool }}"
        set_query: "{{ query | default('') | string | trim }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ set_all_flag }}"
          sequence:
            - service: script.scheduler_list
              data:
                kind: "SCHEDULE_KIND_ALARM"
                include_disabled: true
              response_variable: set_all_list
            - if:
                - condition: template
                  value_template: "{{ set_all_list.status != 'ok' }}"
              then:
                - variables:
                    set_all_result: "{{ {'status': 'error', 'text': set_all_list.error_text | default('Не удалось прочитать будильники.')} }}"
                - stop: "set all list failed"
                  response_variable: set_all_result
            - variables:
                set_all_rows: "{{ set_all_list.schedules }}"
            - repeat:
                for_each: "{{ set_all_rows }}"
                sequence:
                  - service: script.scheduler_rpc
                    data:
                      method: "SetScheduleEnabled"
                      payload_json: "{{ {'id': repeat.item.get('id', ''), 'enabled': set_enabled_flag} | to_json }}"
            - service: script.scheduler_list
              data:
                kind: "SCHEDULE_KIND_ALARM"
                include_disabled: true
              response_variable: set_after_list
            - variables:
                set_all_total: "{{ set_all_rows | length }}"
                set_all_matched: >-
                  {% set ns = namespace(count=0) %}
                  {% set after_rows = set_after_list.schedules if set_after_list.status == 'ok' else [] %}
                  {% for target in set_all_rows %}
                    {% set current = after_rows | selectattr('id', 'eq', target.get('id', '')) | list %}
                    {% if current | length > 0 and (current[0].get('enabled', false) | bool) == set_enabled_flag %}
                      {% set ns.count = ns.count + 1 %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.count }}
                set_all_result: >-
                  {{ ({'status': 'error', 'text': set_after_list.error_text | default('Не удалось проверить результат.')}
                      if set_after_list.status != 'ok'
                      else ({'status': 'ok', 'text': 'Будильников нет.'}
                            if set_all_total | int == 0
                            else ({'status': 'ok', 'text': ('Все будильники включены.' if set_enabled_flag else 'Все будильники выключены.')}
                                  if set_all_matched | int == set_all_total | int
                                  else {'status': 'error', 'text': 'Изменено ' ~ (set_all_matched | trim) ~ ' из ' ~ (set_all_total | trim) ~ '; не удалось изменить ' ~ ((set_all_total | int) - (set_all_matched | int)) ~ ' будильник(ов).'}))) }}
            - stop: "set all alarms"
              response_variable: set_all_result
    - service: script.scheduler_resolve_schedule
      data:
        query: "{{ set_query }}"
        kind: "SCHEDULE_KIND_ALARM"
        include_disabled: true
      response_variable: set_target
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ set_target.status == 'ambiguous' }}"
          sequence:
            - variables:
                set_single_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько будильников. Уточните название.'} }}"
            - stop: "ambiguous alarm"
              response_variable: set_single_result
        - conditions:
            - condition: template
              value_template: "{{ set_target.status != 'ok' }}"
          sequence:
            - variables:
                set_single_result: >-
                  {{ {'status': set_target.status,
                      'text': (set_target.error_text | default('Будильник не найден.') if set_target.status == 'error' else 'Будильник не найден.')} }}
            - stop: "no alarm"
              response_variable: set_single_result
    - service: script.scheduler_rpc
      data:
        method: "SetScheduleEnabled"
        payload_json: "{{ {'id': set_target.schedule.get('id', ''), 'enabled': set_enabled_flag} | to_json }}"
      response_variable: set_rpc
    - variables:
        set_single_result: >-
          {{ ({'status': 'ok', 'text': 'Будильник «' ~ set_target.schedule.get('label', '') ~ '» ' ~ ('включён.' if set_enabled_flag else 'выключен.')}
              if set_rpc.status == 'ok'
              else {'status': 'error', 'text': set_rpc.error_text | default('Не удалось изменить будильник.')}) }}
    - stop: "schedule_alarm_set_enabled"
      response_variable: set_single_result

schedule_alarm_disable:
  alias: "Scheduler: disable alarm(s)"
  mode: single
  fields:
    query:
      default: ""
    all:
      default: false
  sequence:
    - service: script.schedule_alarm_set_enabled
      data:
        query: "{{ query | default('') }}"
        enabled: false
        all: "{{ all | default(false) }}"
      response_variable: disable_result
    - stop: "schedule_alarm_disable"
      response_variable: disable_result

schedule_alarm_delete:
  alias: "Scheduler: delete alarm(s)"
  description: "Delete one unambiguous alarm, or all alarms only when the user explicitly said all."
  mode: single
  fields:
    query:
      default: ""
    all:
      default: false
  sequence:
    - variables:
        delete_all_flag: "{{ all | default(false) | bool }}"
        delete_query: "{{ query | default('') | string | trim }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ delete_all_flag }}"
          sequence:
            - service: script.scheduler_list
              data:
                kind: "SCHEDULE_KIND_ALARM"
                include_disabled: true
              response_variable: delete_all_list
            - if:
                - condition: template
                  value_template: "{{ delete_all_list.status != 'ok' }}"
              then:
                - variables:
                    delete_all_result: "{{ {'status': 'error', 'text': delete_all_list.error_text | default('Не удалось прочитать будильники.')} }}"
                - stop: "delete all list failed"
                  response_variable: delete_all_result
            - repeat:
                for_each: "{{ delete_all_list.schedules }}"
                sequence:
                  - service: script.scheduler_rpc
                    data:
                      method: "DeleteSchedule"
                      payload_json: "{{ {'id': repeat.item.get('id', '')} | to_json }}"
            - service: script.scheduler_list
              data:
                kind: "SCHEDULE_KIND_ALARM"
                include_disabled: true
              response_variable: delete_after_list
            - variables:
                delete_remaining: "{{ delete_after_list.schedules | length if delete_after_list.status == 'ok' else -1 }}"
                delete_all_result: >-
                  {{ ({'status': 'error', 'text': delete_after_list.error_text | default('Не удалось проверить результат.')}
                      if delete_after_list.status != 'ok'
                      else ({'status': 'ok', 'text': 'Все будильники удалены.'}
                            if delete_remaining | int == 0
                            else {'status': 'error', 'text': 'Не удалось удалить ' ~ delete_remaining ~ ' будильник(ов).'})) }}
            - stop: "delete all alarms"
              response_variable: delete_all_result
    - service: script.scheduler_resolve_schedule
      data:
        query: "{{ delete_query }}"
        kind: "SCHEDULE_KIND_ALARM"
        include_disabled: true
      response_variable: delete_target
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ delete_target.status == 'ambiguous' }}"
          sequence:
            - variables:
                delete_single_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько будильников. Уточните название.'} }}"
            - stop: "ambiguous alarm"
              response_variable: delete_single_result
        - conditions:
            - condition: template
              value_template: "{{ delete_target.status != 'ok' }}"
          sequence:
            - variables:
                delete_single_result: >-
                  {{ {'status': delete_target.status,
                      'text': (delete_target.error_text | default('Будильник не найден.') if delete_target.status == 'error' else 'Будильник не найден.')} }}
            - stop: "no alarm"
              response_variable: delete_single_result
    - service: script.scheduler_rpc
      data:
        method: "DeleteSchedule"
        payload_json: "{{ {'id': delete_target.schedule.get('id', '')} | to_json }}"
      response_variable: delete_rpc
    - variables:
        delete_single_result: >-
          {{ ({'status': 'ok', 'text': 'Будильник «' ~ delete_target.schedule.get('label', '') ~ '» удалён.'}
              if delete_rpc.status == 'ok'
              else {'status': 'error', 'text': delete_rpc.error_text | default('Не удалось удалить будильник.')}) }}
    - stop: "schedule_alarm_delete"
      response_variable: delete_single_result

schedule_alarm_delete_all:
  alias: "Scheduler: delete all alarms"
  mode: single
  sequence:
    - service: script.schedule_alarm_delete
      data:
        all: true
      response_variable: delete_all_result
    - stop: "schedule_alarm_delete_all"
      response_variable: delete_all_result

schedule_alarm_update:
  alias: "Scheduler: update alarm time"
  mode: single
  fields:
    query:
      default: ""
    hour:
      required: true
    minute:
      required: true
    period:
      default: ""
    day:
      default: ""
  sequence:
    - service: script.scheduler_resolve_schedule
      data:
        query: "{{ query | default('') }}"
        kind: "SCHEDULE_KIND_ALARM"
        include_disabled: true
      response_variable: update_target
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ update_target.status == 'ambiguous' }}"
          sequence:
            - variables:
                update_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько будильников. Уточните название.'} }}"
            - stop: "ambiguous alarm"
              response_variable: update_result
        - conditions:
            - condition: template
              value_template: "{{ update_target.status != 'ok' }}"
          sequence:
            - variables:
                update_result: >-
                  {{ {'status': update_target.status,
                      'text': (update_target.error_text | default('Будильник не найден.') if update_target.status == 'error' else 'Будильник не найден.')} }}
            - stop: "no alarm"
              response_variable: update_result
    - variables:
        update_period_raw: "{{ period | default('') | string | lower }}"
        update_day_raw: "{{ day | default('') | string | lower }}"
        update_adjusted_hour: >-
          {% set h = hour | default(7) | int(7) %}
          {{ (h + 12) if update_period_raw in ['вечера', 'дня'] and h < 12 else (0 if update_period_raw in ['ночи', 'утра'] and h == 12 else h) }}
        update_once_date: >-
          {% set ns = namespace(dt=now().replace(hour=update_adjusted_hour | int, minute=minute | default(0) | int(0), second=0, microsecond=0)) %}
          {% if update_day_raw == 'завтра' %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% elif ns.dt <= now() %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% endif %}
          {{ ns.dt.strftime('%Y-%m-%d') }}
        update_request_json: >-
          {{ {'schedule': {'id': update_target.schedule.get('id', ''),
              'label': update_target.schedule.get('label', ''),
              'kind': update_target.schedule.get('kind', 'SCHEDULE_KIND_ALARM'),
              'timezone': update_target.schedule.get('timezone', now().tzinfo | string),
              'at': {'hour': update_adjusted_hour | int, 'minute': minute | default(0) | int(0), 'second': 0},
              'onceDate': ((update_once_date | trim) if update_target.schedule.get('repeat', '') == 'REPEAT_KIND_ONCE' else ''),
              'repeat': update_target.schedule.get('repeat', 'REPEAT_KIND_ONCE'),
              'weekdays': update_target.schedule.get('weekdays', []),
              'enabled': update_target.schedule.get('enabled', false),
              'payloadJson': update_target.schedule.get('payloadJson', '{}')},
              'expectedRevision': update_target.schedule.get('revision', '0')} | to_json }}
    - service: script.scheduler_rpc
      data:
        method: "UpdateSchedule"
        payload_json: "{{ update_request_json }}"
      response_variable: update_rpc
    - variables:
        updated_schedule: "{{ update_rpc.data.get('schedule', {}) if update_rpc.status == 'ok' and update_rpc.data is mapping else {} }}"
        updated_label_raw: "{{ updated_schedule.get('label', '') | trim if updated_schedule is mapping else '' }}"
        updated_due_hm: >-
          {% set due = updated_schedule.get('nextDueUnix', '0') | int(0) if updated_schedule is mapping else 0 %}
          {{ due | timestamp_custom('%H:%M', true) if due > 0 else '' }}
        updated_is_auto: "{{ updated_label_raw == ('Будильник ' ~ (updated_due_hm | trim)) }}"
        updated_repeat_natural: >-
          {% set r = updated_schedule.get('repeat', '') if updated_schedule is mapping else '' %}
          {{ 'каждый день' if r == 'REPEAT_KIND_DAILY' else ('по будням' if r == 'REPEAT_KIND_WEEKDAYS' else ('по выходным' if r == 'REPEAT_KIND_WEEKENDS' else ('по дням недели' if r == 'REPEAT_KIND_CUSTOM' else ''))) }}
        updated_day_prefix: >-
          {% set once = updated_schedule.get('onceDate', '') if updated_schedule is mapping else '' %}
          {% set r = updated_schedule.get('repeat', '') if updated_schedule is mapping else '' %}
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}
          {% if r == 'REPEAT_KIND_ONCE' and once %}
            {% if once == tomorrow %}завтра,
            {% elif once != today %}{{ once[8:10] }}.{{ once[5:7] }},
            {% endif %}
          {% endif %}
        update_result: >-
          {{ ({'status': 'ok', 'text': 'Готово. ' ~ ('Будильник' if updated_is_auto else '«' ~ updated_label_raw ~ '»') ~ ' теперь на ' ~ (updated_day_prefix | trim ~ ' ' if (updated_day_prefix | trim) else '') ~ (updated_due_hm | trim) ~ ((' ' ~ (updated_repeat_natural | trim)) if (updated_repeat_natural | trim) else '') ~ '.'}
              if update_rpc.status == 'ok' and updated_schedule is mapping and updated_schedule.get('id')
              else {'status': 'error', 'text': (update_rpc.error_text | default('Планировщик вернул пустой ответ.')) if update_rpc.status != 'ok' else 'Планировщик вернул пустой ответ.'}) }}
    - stop: "schedule_alarm_update"
      response_variable: update_result

schedule_alarm_stop:
  alias: "Scheduler: stop the active alarm occurrence"
  description: "Calls StopSchedule, then waits briefly for the executor. Local audio stop only for the same captured source/event, never a newer alarm."
  mode: single
  sequence:
    - variables:
        stop_captured_event_id: "{{ states('input_text.scheduler_active_event_id') | trim }}"
    - service: script.scheduler_active_alarm
      response_variable: stop_active
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ stop_active.status == 'ok' and stop_active.id not in ['', 'None'] }}"
          sequence:
            - service: script.scheduler_rpc
              data:
                method: "StopSchedule"
                payload_json: "{{ {'id': stop_active.id} | to_json }}"
              response_variable: stop_rpc
            - service: script.scheduler_confirm_ring_stopped
              data:
                schedule_id: "{{ stop_active.id }}"
                event_id: "{{ stop_captured_event_id }}"
              response_variable: stop_confirm
            - variables:
                stop_outcome: "{{ stop_confirm.outcome | default('other') if stop_confirm is mapping else 'other' }}"
                stop_result: >-
                  {{ ({'status': ('ok' if stop_outcome != 'other' else 'error'),
                      'text': ('Останавливаю.' if stop_outcome in ['executor', 'not_ringing']
                               else ('Звонок остановлен локально, исполнитель не подтвердил.' if stop_outcome == 'local'
                                     else 'Исполнитель не подтвердил остановку; активен другой звонок.'))}
                      if stop_rpc.status == 'ok'
                      else {'status': ('not_found' if stop_rpc.code == 'not_found' else 'error'),
                            'text': (stop_rpc.error_text | default('Планировщик не ответил.')) ~ (' Звонок остановлен локально.' if stop_outcome == 'local' else (' Активен другой звонок.' if stop_outcome == 'other' else ''))}) }}
            - stop: "stop alarm"
              response_variable: stop_result
        - conditions:
            - condition: template
              value_template: "{{ stop_active.status == 'error' }}"
          sequence:
            - variables:
                stop_result: >-
                  {{ {'status': 'error', 'text': (stop_active.error_text | default('Планировщик не ответил.')) ~ (' Звонок не остановлен: не удалось определить активный будильник.' if is_state('input_boolean.alarm_ringing', 'on') else '')} }}
            - stop: "stop alarm lookup failed"
              response_variable: stop_result
        - conditions:
            - condition: template
              value_template: "{{ stop_active.status == 'ambiguous' }}"
          sequence:
            - variables:
                stop_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько активных будильников. Уточните, какой остановить.'} }}"
            - stop: "ambiguous active alarm"
              response_variable: stop_result
    - variables:
        stop_result: >-
          {{ {'status': 'error', 'text': 'Не удалось определить будильник в планировщике. Звонок не остановлен.'}
             if is_state('input_boolean.alarm_ringing', 'on')
             else {'status': 'not_found', 'text': 'Будильник не звонит.'} }}
    - stop: "schedule_alarm_stop"
      response_variable: stop_result

schedule_alarm_snooze:
  alias: "Scheduler: snooze the active alarm occurrence"
  description: "SnoozeSchedule owns the delayed FIRE. After success, wait briefly for the executor; local audio stop only for the same captured source/event."
  mode: single
  fields:
    minutes:
      default: 9
  sequence:
    - variables:
        snooze_captured_event_id: "{{ states('input_text.scheduler_active_event_id') | trim }}"
    - service: script.scheduler_active_alarm
      response_variable: snooze_active
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ snooze_active.status == 'ok' and snooze_active.id not in ['', 'None'] }}"
          sequence:
            - service: script.scheduler_rpc
              data:
                method: "SnoozeSchedule"
                payload_json: "{{ {'id': snooze_active.id, 'minutes': minutes | default(9) | int(9)} | to_json }}"
              response_variable: snooze_rpc
            - service: script.scheduler_confirm_ring_stopped
              data:
                schedule_id: "{{ snooze_active.id }}"
                event_id: "{{ snooze_captured_event_id }}"
              response_variable: snooze_confirm
            - variables:
                snooze_outcome: "{{ snooze_confirm.outcome | default('other') if snooze_confirm is mapping else 'other' }}"
                snooze_result: >-
                  {{ ({'status': ('error' if snooze_outcome == 'other' else 'ok'),
                      'text': ('Откладываю будильник на девять минут.' if snooze_outcome in ['executor', 'not_ringing']
                               else ('Будильник отложен. Звонок остановлен локально, исполнитель не подтвердил.' if snooze_outcome == 'local'
                                     else 'Будильник отложен, но активен другой звонок; звук не остановлен.'))}
                      if snooze_rpc.status == 'ok'
                      else {'status': 'error',
                            'text': (snooze_rpc.error_text | default('Планировщик не ответил.')) ~ (' Звонок остановлен локально. Перенос не подтверждён.' if snooze_outcome == 'local' else (' Перенос не подтверждён. Активен другой звонок.' if snooze_outcome == 'other' else ' Перенос не подтверждён.'))}) }}
            - stop: "snoozed"
              response_variable: snooze_result
    - if:
        - condition: state
          entity_id: input_boolean.alarm_ringing
          state: "on"
      then:
        - variables:
            snooze_result: "{{ {'status': 'error', 'text': 'Не удалось определить будильник в планировщике. Звонок не остановлен, повтор не запрошен.'} }}"
        - stop: "snooze unknown alarm"
          response_variable: snooze_result
    - variables:
        snooze_result: "{{ {'status': 'not_found', 'text': 'Будильник не звонит.'} }}"
    - stop: "schedule_alarm_snooze"
      response_variable: snooze_result

schedule_timer_start:
  alias: "Scheduler: start a timer"
  mode: queued
  max: 8
  fields:
    hours:
      default: 0
    minutes:
      default: 0
    seconds:
      default: 0
    name:
      default: ""
  sequence:
    - variables:
        timer_total_seconds: "{{ (hours | default(0) | int(0) * 3600) + (minutes | default(0) | int(0) * 60) + (seconds | default(0) | int(0)) }}"
        timer_duration: "{{ timer_total_seconds | int if timer_total_seconds | int > 0 else 60 }}"
        timer_label: >-
          {% if name is defined and name not in ['', 'unknown', 'unavailable', 'None', None] %}{{ name }}
          {% else %}Таймер{% endif %}
        timer_idempotency_key: "ha:timer:{{ now().strftime('%Y%m%dT%H%M%S%f') ~ '-' ~ (now().timestamp() | int) ~ '-' ~ (range(0, 65536) | random) }}"
    - if:
        - condition: template
          value_template: "{{ timer_duration | int > 604800 }}"
      then:
        - variables:
            timer_result: "{{ {'status': 'error', 'text': 'Слишком длинный таймер. Максимум семь дней.', 'timer_id': ''} }}"
        - stop: "timer too long"
          response_variable: timer_result
    - variables:
        timer_request_json: "{{ {'label': timer_label | trim, 'durationSeconds': timer_duration | int | string, 'idempotencyKey': timer_idempotency_key} | to_json }}"
    - service: script.scheduler_rpc
      data:
        method: "StartTimer"
        payload_json: "{{ timer_request_json }}"
      response_variable: timer_start_rpc
    - variables:
        created_timer: "{{ timer_start_rpc.data.get('timer', {}) if timer_start_rpc.status == 'ok' and timer_start_rpc.data is mapping else {} }}"
        timer_duration_text: >-
          {% set d = timer_duration | int %}
          {% set h = d // 3600 %}
          {% set m = (d % 3600) // 60 %}
          {% set s = d % 60 %}
          {{ ((h | string ~ ' ч ') if h > 0 else '') ~ ((m | string ~ ' мин ') if m > 0 else '') ~ ((s | string ~ ' с') if s > 0 or (h == 0 and m == 0) else '') }}
        timer_result: >-
          {{ ({'status': 'ok', 'text': 'Таймер «' ~ (created_timer.get('label', timer_label) | trim) ~ '» на ' ~ (timer_duration_text | trim) ~ ' установлен.', 'timer_id': created_timer.get('id', '')}
              if timer_start_rpc.status == 'ok' and created_timer is mapping and created_timer.get('id')
              else {'status': 'error', 'text': (timer_start_rpc.error_text | default('Планировщик вернул пустой ответ.')) if timer_start_rpc.status != 'ok' else 'Планировщик вернул пустой ответ.', 'timer_id': ''}) }}
    - stop: "schedule_timer_start"
      response_variable: timer_result

schedule_timer_status:
  alias: "Scheduler: timer list text"
  mode: single
  sequence:
    - variables:
        timer_status_request_json: "{{ {'includeFinished': false} | to_json }}"
    - service: script.scheduler_rpc
      data:
        method: "ListTimers"
        payload_json: "{{ timer_status_request_json }}"
      response_variable: timer_status_rpc
    - variables:
        timer_status_rows: >-
          {%- set now_ts = now().timestamp() | int(0) -%}
          {%- set ns = namespace(rows=[]) -%}
          {%- for t in (timer_status_rpc.data.get('timers', []) if timer_status_rpc.status == 'ok' and timer_status_rpc.data is mapping else []) -%}
            {%- set state = t.get('state', '') -%}
            {%- if state in ['TIMER_STATE_RUNNING', 'TIMER_STATE_PAUSED'] -%}
              {%- if state == 'TIMER_STATE_PAUSED' -%}
                {%- set sec = t.get('remainingSeconds', '0') | int(0) -%}
              {%- else -%}
                {%- set sec = [0, (t.get('dueUnix', '0') | int(0)) - now_ts] | max -%}
              {%- endif -%}
              {%- set h = sec // 3600 -%}
              {%- set m = (sec % 3600) // 60 -%}
              {%- set s = sec % 60 -%}
              {%- set remaining = ((h | string ~ ' ч ') if h > 0 else '') ~ ((m | string ~ ' мин ') if m > 0 else '') ~ ((s | string ~ ' с') if s > 0 or (h == 0 and m == 0) else '') -%}
              {%- set ns.rows = ns.rows + [{'label': t.get('label', 'Таймер'), 'state': ('на паузе' if state == 'TIMER_STATE_PAUSED' else 'работает'), 'remaining': (remaining | trim)}] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.rows }}
        timer_status_text: >-
          {% if timer_status_rpc.status != 'ok' %}
          Не удалось получить список таймеров. {{ timer_status_rpc.error_text | default('') }}
          {% elif timer_status_rows | length == 0 %}
          Активных таймеров нет.
          {% else %}
          {% for row in timer_status_rows %}{{ row.label }}: {{ row.state }}, осталось {{ row.remaining }}{% if not loop.last %}. {% endif %}{% endfor %}
          {% endif %}
        timer_status_result: "{{ {'status': timer_status_rpc.status, 'text': timer_status_text | trim | replace('\n', ' ') | replace('  ', ' ')} }}"
    - stop: "schedule_timer_status"
      response_variable: timer_status_result

schedule_timer_cancel:
  alias: "Scheduler: cancel a timer"
  mode: single
  fields:
    name:
      default: ""
  sequence:
    - service: script.scheduler_resolve_timer
      data:
        query: "{{ name | default('') }}"
      response_variable: cancel_timer
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ cancel_timer.status == 'ambiguous' }}"
          sequence:
            - variables:
                cancel_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько таймеров. Уточните название.'} }}"
            - stop: "ambiguous timer"
              response_variable: cancel_result
        - conditions:
            - condition: template
              value_template: "{{ cancel_timer.status != 'ok' }}"
          sequence:
            - variables:
                cancel_result: >-
                  {{ {'status': cancel_timer.status,
                      'text': (cancel_timer.error_text | default('Таймер не найден.') if cancel_timer.status == 'error' else 'Активных таймеров нет.')} }}
            - stop: "no timer"
              response_variable: cancel_result
    - service: script.scheduler_rpc
      data:
        method: "CancelTimer"
        payload_json: "{{ {'id': cancel_timer.timer.get('id', '')} | to_json }}"
      response_variable: cancel_rpc
    - variables:
        cancel_result: >-
          {{ ({'status': 'ok', 'text': 'Таймер «' ~ cancel_timer.timer.get('label', '') ~ '» отменён.'}
              if cancel_rpc.status == 'ok'
              else {'status': 'error', 'text': cancel_rpc.error_text | default('Не удалось отменить таймер.')}) }}
    - stop: "schedule_timer_cancel"
      response_variable: cancel_result

schedule_timer_pause:
  alias: "Scheduler: pause a timer"
  mode: single
  fields:
    name:
      default: ""
  sequence:
    - service: script.scheduler_resolve_timer
      data:
        query: "{{ name | default('') }}"
        required_state: "TIMER_STATE_RUNNING"
      response_variable: pause_timer
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ pause_timer.status == 'ambiguous' }}"
          sequence:
            - variables:
                pause_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько таймеров. Уточните название.'} }}"
            - stop: "ambiguous timer"
              response_variable: pause_result
        - conditions:
            - condition: template
              value_template: "{{ pause_timer.status != 'ok' }}"
          sequence:
            - variables:
                pause_result: >-
                  {{ {'status': pause_timer.status,
                      'text': (pause_timer.error_text | default('Таймер не найден.') if pause_timer.status == 'error' else 'Работающий таймер не найден.')} }}
            - stop: "no timer"
              response_variable: pause_result
    - service: script.scheduler_rpc
      data:
        method: "PauseTimer"
        payload_json: "{{ {'id': pause_timer.timer.get('id', '')} | to_json }}"
      response_variable: pause_rpc
    - variables:
        pause_result: >-
          {{ ({'status': 'ok', 'text': 'Таймер «' ~ pause_timer.timer.get('label', '') ~ '» на паузе.'}
              if pause_rpc.status == 'ok'
              else {'status': 'error', 'text': pause_rpc.error_text | default('Не удалось поставить таймер на паузу.')}) }}
    - stop: "schedule_timer_pause"
      response_variable: pause_result

schedule_timer_resume:
  alias: "Scheduler: resume a timer"
  mode: single
  fields:
    name:
      default: ""
  sequence:
    - service: script.scheduler_resolve_timer
      data:
        query: "{{ name | default('') }}"
        required_state: "TIMER_STATE_PAUSED"
      response_variable: resume_timer
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ resume_timer.status == 'ambiguous' }}"
          sequence:
            - variables:
                resume_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько таймеров. Уточните название.'} }}"
            - stop: "ambiguous timer"
              response_variable: resume_result
        - conditions:
            - condition: template
              value_template: "{{ resume_timer.status != 'ok' }}"
          sequence:
            - variables:
                resume_result: >-
                  {{ {'status': resume_timer.status,
                      'text': (resume_timer.error_text | default('Таймер не найден.') if resume_timer.status == 'error' else 'Таймер на паузе не найден.')} }}
            - stop: "no timer"
              response_variable: resume_result
    - service: script.scheduler_rpc
      data:
        method: "ResumeTimer"
        payload_json: "{{ {'id': resume_timer.timer.get('id', '')} | to_json }}"
      response_variable: resume_rpc
    - variables:
        resume_result: >-
          {{ ({'status': 'ok', 'text': 'Таймер «' ~ resume_timer.timer.get('label', '') ~ '» продолжен.'}
              if resume_rpc.status == 'ok'
              else {'status': 'error', 'text': resume_rpc.error_text | default('Не удалось продолжить таймер.')}) }}
    - stop: "schedule_timer_resume"
      response_variable: resume_result

schedule_reminder_create:
  alias: "Scheduler: create reminder"
  mode: single
  fields:
    text:
      required: true
    hour:
      default: 9
    minute:
      default: 0
    period:
      default: ""
    day:
      default: ""
  sequence:
    - variables:
        reminder_hour_num: "{{ hour | default(9) | int(9) }}"
        reminder_minute_num: "{{ minute | default(0) | int(0) }}"
        reminder_period_raw: "{{ period | default('') | string | lower }}"
        reminder_day_raw: "{{ day | default('') | string | lower }}"
        reminder_adjusted_hour: >-
          {% set h = reminder_hour_num | int %}
          {{ (h + 12) if reminder_period_raw in ['вечера', 'дня'] and h < 12 else (0 if reminder_period_raw in ['ночи', 'утра'] and h == 12 else h) }}
        reminder_timezone: "{{ now().tzinfo | string | trim }}"
        reminder_once_date: >-
          {% set ns = namespace(dt=now().replace(hour=reminder_adjusted_hour | int, minute=reminder_minute_num | int, second=0, microsecond=0)) %}
          {% if reminder_day_raw == 'завтра' %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% elif ns.dt <= now() %}
            {% set ns.dt = ns.dt + timedelta(days=1) %}
          {% endif %}
          {{ ns.dt.strftime('%Y-%m-%d') }}
        reminder_label: "{{ text | default('Напоминание') | string | trim }}"
        reminder_idempotency_key: "ha:reminder:{{ now().strftime('%Y%m%dT%H%M%S%f') ~ '-' ~ (now().timestamp() | int) ~ '-' ~ (range(0, 65536) | random) }}"
    - if:
        - condition: template
          value_template: "{{ reminder_timezone in ['', 'None'] or ('/' not in reminder_timezone and reminder_timezone not in ['UTC', 'Etc/UTC']) }}"
      then:
        - variables:
            reminder_result: "{{ {'status': 'error', 'text': 'Не удалось определить часовой пояс Home Assistant.'} }}"
        - stop: "invalid timezone"
          response_variable: reminder_result
    - variables:
        reminder_request_json: >-
          {{ {'label': reminder_label,
              'kind': 'SCHEDULE_KIND_REMINDER',
              'timezone': reminder_timezone,
              'at': {'hour': reminder_adjusted_hour | int, 'minute': reminder_minute_num | int, 'second': 0},
              'onceDate': reminder_once_date | trim,
              'repeat': 'REPEAT_KIND_ONCE',
              'enabled': true,
              'payloadJson': '{}',
              'idempotencyKey': reminder_idempotency_key} | to_json }}
    - service: script.scheduler_rpc
      data:
        method: "CreateSchedule"
        payload_json: "{{ reminder_request_json }}"
      response_variable: reminder_rpc
    - variables:
        created_reminder: "{{ reminder_rpc.data.get('schedule', {}) if reminder_rpc.status == 'ok' and reminder_rpc.data is mapping else {} }}"
        reminder_due_text: >-
          {% set due = created_reminder.get('nextDueUnix', '0') | int(0) if created_reminder is mapping else 0 %}
          {{ due | timestamp_custom('%H:%M, %d.%m', true) if due > 0 else '' }}
        reminder_result: >-
          {{ ({'status': 'ok', 'text': 'Напоминание «' ~ (created_reminder.get('label', reminder_label) | trim) ~ '» создано на ' ~ (reminder_due_text | trim) ~ '.'}
              if reminder_rpc.status == 'ok' and created_reminder is mapping and created_reminder.get('id')
              else {'status': 'error', 'text': (reminder_rpc.error_text | default('Планировщик вернул пустой ответ.')) if reminder_rpc.status != 'ok' else 'Планировщик вернул пустой ответ.'}) }}
    - stop: "schedule_reminder_create"
      response_variable: reminder_result

schedule_reminder_status:
  alias: "Scheduler: reminder list text"
  mode: single
  sequence:
    - service: script.scheduler_list
      data:
        kind: "SCHEDULE_KIND_REMINDER"
        include_disabled: false
      response_variable: reminder_status_list
    - variables:
        reminder_status_rows: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for s in (reminder_status_list.schedules if reminder_status_list.status == 'ok' else []) -%}
            {%- set due = s.get('nextDueUnix', '0') | int(0) -%}
            {%- if due > 0 and s.get('enabled', true) -%}
              {%- set ns.rows = ns.rows + [{'due': due, 'label': s.get('label', 'Напоминание')}] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.rows | sort(attribute='due') }}
        reminder_status_text: >-
          {% if reminder_status_list.status != 'ok' %}
          Не удалось получить список напоминаний. {{ reminder_status_list.error_text | default('') }}
          {% elif reminder_status_rows | length == 0 %}
          Напоминаний нет.
          {% else %}
          {% for row in reminder_status_rows %}{{ row.label }}: {{ row.due | timestamp_custom('%H:%M, %d.%m', true) }}{% if not loop.last %}. {% endif %}{% endfor %}
          {% endif %}
        reminder_status_result: "{{ {'status': reminder_status_list.status, 'text': reminder_status_text | trim | replace('\n', ' ') | replace('  ', ' ')} }}"
    - stop: "schedule_reminder_status"
      response_variable: reminder_status_result

schedule_reminder_delete:
  alias: "Scheduler: delete reminder(s)"
  description: "Delete one unambiguous reminder, or all reminders only when the user explicitly said all."
  mode: single
  fields:
    query:
      default: ""
    all:
      default: false
  sequence:
    - variables:
        reminder_delete_all: "{{ all | default(false) | bool }}"
        reminder_delete_query: "{{ query | default('') | string | trim }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ reminder_delete_all }}"
          sequence:
            - service: script.scheduler_list
              data:
                kind: "SCHEDULE_KIND_REMINDER"
                include_disabled: true
              response_variable: reminder_delete_list
            - if:
                - condition: template
                  value_template: "{{ reminder_delete_list.status != 'ok' }}"
              then:
                - variables:
                    reminder_delete_result: "{{ {'status': 'error', 'text': reminder_delete_list.error_text | default('Не удалось прочитать напоминания.')} }}"
                - stop: "reminder delete all list failed"
                  response_variable: reminder_delete_result
            - repeat:
                for_each: "{{ reminder_delete_list.schedules }}"
                sequence:
                  - service: script.scheduler_rpc
                    data:
                      method: "DeleteSchedule"
                      payload_json: "{{ {'id': repeat.item.get('id', '')} | to_json }}"
            - service: script.scheduler_list
              data:
                kind: "SCHEDULE_KIND_REMINDER"
                include_disabled: true
              response_variable: reminder_delete_after
            - variables:
                reminder_delete_remaining: "{{ reminder_delete_after.schedules | length if reminder_delete_after.status == 'ok' else -1 }}"
                reminder_delete_result: >-
                  {{ ({'status': 'error', 'text': reminder_delete_after.error_text | default('Не удалось проверить результат.')}
                      if reminder_delete_after.status != 'ok'
                      else ({'status': 'ok', 'text': 'Все напоминания удалены.'}
                            if reminder_delete_remaining | int == 0
                            else {'status': 'error', 'text': 'Не удалось удалить ' ~ reminder_delete_remaining ~ ' напоминание(й).'})) }}
            - stop: "reminder delete all"
              response_variable: reminder_delete_result
    - service: script.scheduler_resolve_schedule
      data:
        query: "{{ reminder_delete_query }}"
        kind: "SCHEDULE_KIND_REMINDER"
        include_disabled: true
      response_variable: reminder_delete_target
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ reminder_delete_target.status == 'ambiguous' }}"
          sequence:
            - variables:
                reminder_delete_result: "{{ {'status': 'ambiguous', 'text': 'Найдено несколько напоминаний. Уточните текст.'} }}"
            - stop: "ambiguous reminder"
              response_variable: reminder_delete_result
        - conditions:
            - condition: template
              value_template: "{{ reminder_delete_target.status != 'ok' }}"
          sequence:
            - variables:
                reminder_delete_result: >-
                  {{ {'status': reminder_delete_target.status,
                      'text': (reminder_delete_target.error_text | default('Напоминание не найдено.') if reminder_delete_target.status == 'error' else 'Напоминание не найдено.')} }}
            - stop: "no reminder"
              response_variable: reminder_delete_result
    - service: script.scheduler_rpc
      data:
        method: "DeleteSchedule"
        payload_json: "{{ {'id': reminder_delete_target.schedule.get('id', '')} | to_json }}"
      response_variable: reminder_delete_rpc
    - variables:
        reminder_delete_result: >-
          {{ ({'status': 'ok', 'text': 'Напоминание «' ~ (reminder_delete_target.schedule.get('label', '') | trim) ~ '» удалено.'}
              if reminder_delete_rpc.status == 'ok'
              else {'status': 'error', 'text': reminder_delete_rpc.error_text | default('Не удалось удалить напоминание.')}) }}
    - stop: "schedule_reminder_delete"
      response_variable: reminder_delete_result

schedule_note_add:
  alias: "Schedules: add note"
  mode: single
  fields:
    text:
      required: true
  sequence:
    - service: todo.add_item
      target:
        entity_id: todo.notes
      data:
        item: "{{ text }}"
        description: "note"

schedule_note_search:
  alias: "Schedules: search notes"
  mode: single
  fields:
    query:
      default: ""
  sequence:
    - service: todo.get_items
      target:
        entity_id: todo.notes
      response_variable: note_data
    - variables:
        result: >-
          {% set q = query | default('') | string | lower %}
          {% set ns = namespace(rows=[]) %}
          {% for item in note_data.get('todo.notes', {}).get('items', []) %}
            {% if q == '' or q in item.summary | lower or q in (item.description | default('')) | lower %}
              {% set ns.rows = ns.rows + [item.summary] %}
            {% endif %}
          {% endfor %}
          {% if ns.rows | length == 0 %}
            Заметок не найдено.
          {% else %}
            {{ ns.rows | join('. ') }}
          {% endif %}
    - variables:
        response: "{{ {'text': result | trim | replace('\n', ' ') | replace('  ', ' ')} }}"
    - stop: "schedule_note_search"
      response_variable: response

schedule_note_delete:
  alias: "Schedules: delete note"
  mode: single
  fields:
    query:
      required: true
  sequence:
    - service: todo.get_items
      target:
        entity_id: todo.notes
      response_variable: note_data
    - variables:
        rows: >-
          {% set q = query | string | lower %}
          {% set ns = namespace(rows=[]) %}
          {% for item in note_data.get('todo.notes', {}).get('items', []) %}
            {% if q in item.summary | lower or q in (item.description | default('')) | lower %}
              {% set ns.rows = ns.rows + [item.uid] %}
            {% endif %}
          {% endfor %}
          {{ ns.rows }}
    - repeat:
        for_each: "{{ rows }}"
        sequence:
          - service: todo.remove_item
            target:
              entity_id: todo.notes
            data:
              item: "{{ repeat.item }}"

# --- Legacy rollback-only dispatchers ---------------------------------------
# These still write the old HA todo/timer helpers. Their automations are
# disabled (initial_state: false) so they never compete with the canonical
# scheduler. Kept so a cutover can be reverted without reconstructing code.

schedule_alarm_fire:
  alias: "Legacy: fire an alarm item"
  mode: single
  fields:
    uid:
      required: true
    name:
      required: false
    list_id:
      required: true
  sequence:
    - service: input_text.set_value
      target:
        entity_id: input_text.tekushchii_budilnik_uid
      data:
        value: "{{ uid }}"
    - service: input_text.set_value
      target:
        entity_id: input_text.tekushchii_budilnik_nazvanie
      data:
        value: "{{ name | default('Будильник') }}"
    - service: input_text.set_value
      target:
        entity_id: input_text.tekushchii_budilnik_spisok
      data:
        value: "{{ list_id }}"
    - service: script.alarm_start

schedule_alarm_advance:
  alias: "Legacy: advance an alarm item"
  mode: single
  fields:
    uid:
      required: true
    list_id:
      required: true
  sequence:
    - service: todo.get_items
      target:
        entity_id: "{{ list_id }}"
      response_variable: alarm_list
    - variables:
        item: >-
          {% set rows = alarm_list.get(list_id, {}).get('items', []) %}
          {{ (rows | selectattr('uid', 'eq', uid) | list | first) if (rows | selectattr('uid', 'eq', uid) | list | length) > 0 else none }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ item is none }}"
          sequence:
            - stop: "alarm item no longer exists"
        - conditions:
            - condition: template
              value_template: "{{ list_id == 'todo.alarms_once' }}"
          sequence:
            - service: todo.update_item
              target:
                entity_id: "{{ list_id }}"
              data:
                item: "{{ uid }}"
                status: completed
        - conditions:
            - condition: template
              value_template: "{{ item is not none }}"
          sequence:
            - variables:
                next_dt: >-
                  {% set due = as_datetime(item.get('due')) %}
                  {% set ns = namespace(dt=due) %}
                  {% if list_id == 'todo.alarms_daily' %}
                    {% for i in range(0, 370) %}
                      {% if ns.dt <= now() %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
                    {% endfor %}
                  {% elif list_id == 'todo.alarms_weekdays' %}
                    {% for i in range(0, 370) %}
                      {% if ns.dt <= now() or ns.dt.weekday() >= 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
                    {% endfor %}
                  {% elif list_id == 'todo.alarms_weekends' %}
                    {% for i in range(0, 370) %}
                      {% if ns.dt <= now() or ns.dt.weekday() < 5 %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
                    {% endfor %}
                  {% else %}
                    {% for i in range(0, 370) %}
                      {% if ns.dt <= now() %}{% set ns.dt = ns.dt + timedelta(days=1) %}{% endif %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.dt.strftime('%Y-%m-%dT%H:%M:%S') }}{{ now().strftime('%z')[:3] }}:{{ now().strftime('%z')[3:] }}
            - service: todo.update_item
              target:
                entity_id: "{{ list_id }}"
              data:
                item: "{{ uid }}"
                due_datetime: "{{ next_dt }}"
                status: needs_action

schedule_alarm_finalize:
  alias: "Legacy: finish current alarm item"
  mode: single
  sequence:
    - variables:
        uid: "{{ states('input_text.tekushchii_budilnik_uid') }}"
        list_id: "{{ states('input_text.tekushchii_budilnik_spisok') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ uid not in ['', 'unknown', 'unavailable', 'None'] and list_id not in ['', 'unknown', 'unavailable', 'None'] }}"
          sequence:
            - service: script.schedule_alarm_advance
              data:
                uid: "{{ uid }}"
                list_id: "{{ list_id }}"
              continue_on_error: true
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.alarm_ringing
          - input_boolean.alarm_snooze_active
    - service: input_text.set_value
      target:
        entity_id:
          - input_text.tekushchii_budilnik_uid
          - input_text.tekushchii_budilnik_nazvanie
          - input_text.tekushchii_budilnik_spisok
      data:
        value: ""

schedule_alarm_tick:
  alias: "Legacy: alarm dispatcher (disabled during cutover)"
  mode: single
  sequence:
    - variables:
        snooze_raw: "{{ states('input_datetime.alarm_snooze_until') }}"
        current_uid: "{{ states('input_text.tekushchii_budilnik_uid') }}"
        current_name: "{{ states('input_text.tekushchii_budilnik_nazvanie') }}"
        current_list: "{{ states('input_text.tekushchii_budilnik_spisok') }}"
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.alarm_ringing
              state: "on"
          sequence:
            - stop: "already ringing"
        - conditions:
            - condition: state
              entity_id: input_boolean.alarm_snooze_active
              state: "on"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ snooze_raw not in ['unknown', 'unavailable', 'None'] and as_timestamp(snooze_raw) <= as_timestamp(now()) and current_uid not in ['', 'unknown', 'unavailable', 'None'] }}"
                  sequence:
                    - service: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.alarm_snooze_active
                    - service: script.schedule_alarm_fire
                      data:
                        uid: "{{ current_uid }}"
                        name: "{{ current_name }}"
                        list_id: "{{ current_list }}"
                    - stop: "snooze fired"
              default:
                - stop: "waiting for snooze"
    - service: todo.get_items
      target:
        entity_id:
          - todo.alarms_once
          - todo.alarms_daily
          - todo.alarms_weekdays
          - todo.alarms_weekends
      response_variable: alarm_lists
    - variables:
        candidates: >-
          {% set ns = namespace(rows=[]) %}
          {% for list_id, data in alarm_lists.items() %}
            {% for item in data.get('items', []) %}
              {% if item.get('status') == 'needs_action' and item.get('due') %}
                {% set due = as_datetime(item.get('due')) %}
                {% if due <= now() %}
                  {% set ns.rows = ns.rows + [{'uid': item.uid, 'name': item.summary, 'list_id': list_id, 'due': item.get('due'), 'age': (now() - due).total_seconds()}] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.rows }}
        overdue: "{{ candidates | rejectattr('age', 'lt', 600) | list }}"
        ready: "{{ candidates | selectattr('age', 'lt', 600) | sort(attribute='due') | list }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ overdue | length > 0 }}"
          sequence:
            - repeat:
                for_each: "{{ overdue }}"
                sequence:
                  - service: script.schedule_alarm_advance
                    data:
                      uid: "{{ repeat.item.uid }}"
                      list_id: "{{ repeat.item.list_id }}"
                    continue_on_error: true
            - stop: "missed alarms advanced"
        - conditions:
            - condition: template
              value_template: "{{ ready | length > 0 }}"
          sequence:
            - variables:
                pick: "{{ ready | first }}"
            - service: script.schedule_alarm_fire
              data:
                uid: "{{ pick.uid }}"
                name: "{{ pick.name }}"
                list_id: "{{ pick.list_id }}"

schedule_reminder_tick:
  alias: "Legacy: reminder dispatcher (disabled during cutover)"
  mode: single
  sequence:
    - service: todo.get_items
      target:
        entity_id: todo.reminders
      response_variable: reminder_data
    - variables:
        due_items: >-
          {% set ns = namespace(rows=[]) %}
          {% for item in reminder_data.get('todo.reminders', {}).get('items', []) %}
            {% if item.status == 'needs_action' and item.due and as_datetime(item.due) <= now() %}
              {% set ns.rows = ns.rows + [item] %}
            {% endif %}
          {% endfor %}
          {{ ns.rows }}
    - repeat:
        for_each: "{{ due_items }}"
        sequence:
          - service: todo.update_item
            target:
              entity_id: todo.reminders
            data:
              item: "{{ repeat.item.uid }}"
              status: completed
          - service: script.schedule_announce
            data:
              message: "Напоминание: {{ repeat.item.summary }}"
              chime: true
          - service: notify.mobile_app_xiaomi_17
            data:
              title: "Напоминание"
              message: "{{ repeat.item.summary }}"
