            {% if q == '' or q in item.summary | lower or q in (item.description | default('')) | lower %}
              {% set ns.rows = ns.rows + [item.summary] %}
            {% endif %}
          {% endfor %}
          {% if ns.rows | length == 0 %}
            Заметок не найдено.
          {% else %}
            {{ ns.rows | join('. ') }}
          {% endif %}
    - variables:
        response: "{{ {'text': result | trim | replace('\n', ' ') | replace('  ', ' ')} }}"
    - stop: "schedule_note_search"
