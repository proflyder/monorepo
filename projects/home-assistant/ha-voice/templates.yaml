# Home Assistant template entities.
#
# `switch.ricardo_work_profile` is a catalogue/Android-friendly wrapper over
# `input_select.ricardo_voice_profile`: on = Рабочий, off = Личный. The
# input_select stays the single source of truth; the switch only maps it to
# the switch domain understood by the device catalogue.
#
# `switch.komp` wraps the wired desktop: its state mirrors the ping binary
# sensor, turning on sends Wake-on-LAN, turning off schedules the restricted
# SSH shutdown. See the comment above the second switch.

- switch:
    - name: "Рабочий профиль"
      unique_id: ricardo_work_profile
      default_entity_id: switch.ricardo_work_profile
      icon: mdi:account-tie-voice
      state: "{{ is_state('input_select.ricardo_voice_profile', 'Рабочий') }}"
      turn_on:
        - service: input_select.select_option
          target:
            entity_id: input_select.ricardo_voice_profile
          data:
            option: "Рабочий"
      turn_off:
        - service: input_select.select_option
          target:
            entity_id: input_select.ricardo_voice_profile
          data:
            option: "Личный"

# `switch.komp` is the wired Windows desktop as a normal on/off control:
# state mirrors the ping binary sensor; turn_on issues a one-time wakegrant
# logon grant (best-effort) and sends Wake-on-LAN; turn_off asks the restricted
# SSH wrapper to schedule a 60 s shutdown (cancellable from voice or the
# dashboard). It is a plain `switch` domain entity without a role label, so the
# ha-control catalogue exposes it as a device (kind "switch").
- switch:
    - name: "Комп"
      unique_id: komp
      default_entity_id: switch.komp
      icon: mdi:desktop-tower
      state: "{{ is_state('binary_sensor.komp_v_seti', 'on') }}"
      turn_on:
        # Issue a one-time logon grant before waking the machine. The grant
        # service must never block Wake-on-LAN: if it is down the PC still
        # boots and shows its normal sign-in screen (fail closed).
        - service: rest_command.wakegrant_issue
          continue_on_error: true
        - service: wake_on_lan.send_magic_packet
          data:
            mac: !secret komp_mac
      turn_off:
        - service: script.komp_shutdown
