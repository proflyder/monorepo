- switch:
    - name: "Рабочий профиль"
      unique_id: ricardo_work_profile
      default_entity_id: switch.ricardo_work_profile
      icon: mdi:account-tie-voice
      state: "{{ is_state('input_select.ricardo_voice_profile', 'Рабочий') }}"
      turn_on:
        - service: input_select.select_option
          target:
            entity_id: input_select.ricardo_voice_profile
          data:
            option: "Рабочий"
      turn_off:
        - service: input_select.select_option
          target:
            entity_id: input_select.ricardo_voice_profile
          data:
            option: "Личный"

- switch:
    - name: "Комп"
      unique_id: komp
      default_entity_id: switch.komp
      icon: mdi:desktop-tower
      state: "{{ is_state('binary_sensor.komp_v_seti', 'on') }}"
      turn_on:
        - variables:
            komp_off_at: "{{ states('input_datetime.komp_off_requested') }}"
            komp_going_off: >-
              {{ komp_off_at not in ['', 'unknown', 'unavailable', 'None']
                 and (as_timestamp(now()) - as_timestamp(komp_off_at)) < 300 }}
        - if:
            - condition: template
              value_template: >-
                {{ komp_going_off
                   or not is_state('binary_sensor.komp_v_seti', 'on') }}
          then:
            - service: rest_command.wakegrant_issue
              continue_on_error: true
        - service: wake_on_lan.send_magic_packet
          data:
            mac: !secret komp_mac
      turn_off:
        - service: script.komp_shutdown

- button:
    - name: "Заблокировать"
      unique_id: komp_lock
      default_entity_id: button.komp_lock
      icon: mdi:lock
      press:
        - service: script.komp_lock
    - name: "Разблокировать"
      unique_id: komp_unlock
      default_entity_id: button.komp_unlock
      icon: mdi:lock-open
      press:
        - service: script.komp_unlock
