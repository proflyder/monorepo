alarm_previous_source:
  name: "Источник до будильника"
  max: 255
  initial: ""

music_candidates:
  name: "Последние музыкальные кандидаты"
  max: 255
  initial: ""

scheduler_endpoint:
  name: "Scheduler Connect endpoint"
  max: 255
  initial: !secret scheduler_endpoint

# wakegrant LAN NodePort base URL (no trailing slash). Non-secret value, but
# deployment-specific, so the tracked tree holds only the `!secret` reference.
wakegrant_endpoint:
  name: "wakegrant endpoint"
  max: 255
  initial: !secret wakegrant_endpoint

scheduler_active_schedule_id:
  name: "Scheduler: active schedule id"
  max: 64
  initial: ""

scheduler_active_event_id:
  name: "Scheduler: active event id"
  max: 64
  initial: ""

scheduler_active_label:
  name: "Scheduler: active label"
  max: 200
  initial: ""

scheduler_active_kind:
  name: "Scheduler: active kind"
  max: 32
  initial: ""

# Station HTTP control base URL. Non-secret value, but kept out of Git via
# secrets.yaml so the tracked file never contains a real address.
station_base_url:
  name: "Station HTTP control base URL"
  max: 255
  initial: !secret station_base_url

# Currency bot LAN NodePort base URL (no trailing slash, no /api path).
# Non-secret but deployment-specific, so it is kept in secrets.yaml.
currency_bot_endpoint:
  name: "Currency bot API endpoint"
  max: 255
  initial: !secret currency_bot_endpoint

# SSH destination for the wired desktop: `user@host`. Non-secret in meaning but
# deployment-specific, so the tracked tree only holds the `!secret` reference.
# `shell_command` templates cannot read secrets.yaml directly; they read this
# helper, which Home Assistant resets to the secret after every restart.
komp_ssh_target:
  name: "Комп: SSH-адрес"
  max: 128
  initial: !secret komp_ssh_target
