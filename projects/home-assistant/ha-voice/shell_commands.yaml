komp_shutdown: >-
  ssh -i /config/.ssh/komp_ed25519
  -o BatchMode=yes
  -o ConnectTimeout=5
  -o UserKnownHostsFile=/config/.ssh/komp_known_hosts
  -o StrictHostKeyChecking=accept-new
  {{ states('input_text.komp_ssh_target') }}
  shutdown

komp_cancel_shutdown: >-
  ssh -i /config/.ssh/komp_ed25519
  -o BatchMode=yes
  -o ConnectTimeout=5
  -o UserKnownHostsFile=/config/.ssh/komp_known_hosts
  -o StrictHostKeyChecking=accept-new
  {{ states('input_text.komp_ssh_target') }}
  cancel

komp_lock: >-
  ssh -i /config/.ssh/komp_ed25519
  -o BatchMode=yes
  -o ConnectTimeout=5
  -o UserKnownHostsFile=/config/.ssh/komp_known_hosts
  -o StrictHostKeyChecking=accept-new
  {{ states('input_text.komp_ssh_target') }}
  lock
