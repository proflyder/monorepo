# Notes stay in Home Assistant (`todo.notes`). Everything about time — alarms,
# timers and reminders — is routed to Hermes by `station_time.yaml` and handled
# by the mcp-gateway `time` tools on the durable scheduler; no timer or reminder
# sentence templates live here any more.
lists:
  text:
    wildcard: true
  query:
    wildcard: true
language: ru
intents:
  StationNoteAdd:
    data:
    - sentences:
      - запомни {text}
      - запиши {text}
      - сделай заметку {text}
  StationNoteSearch:
    data:
    - sentences:
      - что я записал про {query}
      - найди заметку про {query}
      - покажи заметки про {query}
      - покажи заметки
  StationNoteDelete:
    data:
    - sentences:
      - удали заметку про {query}
      - удали заметку {query}
