apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-telegram
  namespace: hermes-${HERMES_INSTANCE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hermes-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: k8s/hermes-${HERMES_INSTANCE}/telegram
        property: token
    - secretKey: TELEGRAM_ALLOWED_USERS
      remoteRef:
        key: k8s/hermes-${HERMES_INSTANCE}/telegram
        property: allowed_users
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-api
  namespace: hermes-${HERMES_INSTANCE}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hermes-api
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: k8s/hermes-${HERMES_INSTANCE}/api
        property: key
