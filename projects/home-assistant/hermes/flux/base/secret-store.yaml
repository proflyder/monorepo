apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-secrets
  namespace: hermes-${HERMES_INSTANCE}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: hermes-${HERMES_INSTANCE}
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: hermes-${HERMES_INSTANCE}-eso
          serviceAccountRef:
            name: hermes-secrets
