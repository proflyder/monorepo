apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-anthropic
  namespace: hermes-work
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: hermes-anthropic
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: k8s/hermes-work/anthropic
        property: oauth_token
