model:
  provider: "openai-codex"
  default: "gpt-5.6-luna"

display:
  personality: "voice"

web:
  search_backend: "openai-native"

platform_toolsets:
  api_server: [mcp-homeassistant, mcp-music-assistant, web, mcp-infra]
  telegram: [mcp-homeassistant, mcp-music-assistant, web, mcp-infra]

unauthorized_dm_behavior: "ignore"
allow_all_users: false

platforms:
  telegram:
    enabled: true
    extra:
      unauthorized_dm_behavior: "ignore"
      group_allowed_chats: []
      group_allow_from: []
      command_menu:
        max_commands: 60
        priority_mode: prepend
        priority: [report]

skills:
  platform_disabled:
    api_server: [report]

mcp_servers:
  music-assistant:
    url: "http://192.0.2.28:8095/mcp/v1"
    headers:
      Authorization: "Bearer ${HERMES_MA_TOKEN}"
    connect_timeout: 20
    timeout: 90
    trust: full
    tools:
      resources: true
      prompts: true
  homeassistant:
    url: "http://192.0.2.28:8123/api/mcp"
    headers:
      Authorization: "Bearer ${HERMES_HA_TOKEN}"
    connect_timeout: 20
    timeout: 90
    trust: full
    tools:
      resources: true
      prompts: true
      exclude:
        - "StationAlarm*"
        - "StationTimer*"
        - "StationReminder*"
        - "StationTimeRoute*"
        - "script.schedule_alarm_*"
        - "script.schedule_timer_*"
        - "script.schedule_reminder_*"
        - "script.alarm_*"
  infra:
    url: "http://mcp-gateway.home-assistant.svc.cluster.local:8080/mcp"
    headers:
      Authorization: "Bearer ${HERMES_INFRA_TOKEN}"
    connect_timeout: 10
    timeout: 30
    trust: full
    tools:
      resources: true
      prompts: true
