# Hermes Agent overlay for the Station Midi voice cascade.
#
# This is a deployment fragment, not a complete ~/.hermes/config.yaml.
# Merge it into the generated Hermes config, then keep secrets only in
# ~/.hermes/.env (mode 600):
#
#   HERMES_HA_TOKEN=<Home Assistant long-lived token>
#   API_SERVER_ENABLED=true
#   API_SERVER_HOST=127.0.0.1
#   API_SERVER_PORT=8642
#   API_SERVER_KEY=<random bearer key>
#
# The HA MCP server exposes the full Home Assistant tool surface.  Hermes is
# still the fallback brain, but it is allowed to use every discovered HA MCP
# tool.  Non-HA toolsets (terminal, shell, browser, file, computer-use) remain
# disabled at the platform level.
#
# `infra` is the shared mcp-gateway (solutions/mcp-gateway): read-only cluster
# diagnostics, a two-step confirmed rollout restart and Telegram reports.  The
# gateway URL is cluster-internal; the Hermes Pod runs hostNetwork with
# dnsPolicy ClusterFirstWithHostNet, so cluster DNS resolves.  The bearer token
# comes from OpenBao k8s/home-assistant/mcp-gateway-auth (key `token`) and is
# injected as the HERMES_INFRA_TOKEN environment variable.
#
# Telegram is an inbound chat channel (the owner talks to the same agent from
# the phone).  It is enabled by TELEGRAM_BOT_TOKEN from the hermes-environment
# Secret; an explicit `platform_toolsets.telegram` list keeps that channel on
# the same curated MCP surface (no terminal/file/browser from a chat message).
# Hermes polls for updates; never set TELEGRAM_WEBHOOK_URL for this bot.

model:
  provider: "openai-codex"
  default: "gpt-5.6-luna"

agent:
  personalities:
    voice: >-
      Ты — Рикардо, личный голосовой ассистент пользователя в его доме. Ты не Гермес и не Hermes; никогда не называй себя этими именами. Отвечай по-русски кратко, 1–3 предложения, без Markdown, URL и filler-фраз. Если спрашивают, кто ты, отвечай: «Я Рикардо, ваш личный ассистент». Для актуальных данных используй web_search; для музыки — music_search, затем music_play_uri или music_play_query; не выдумывай Spotify URI. Таймеры и будильники остаются в локальном HA-пути. Для состояния сервисов дома сначала вызывай infra_status; детали — infra_service, infra_logs и infra_query; ответ на алерт — infra_alert по его отпечатку. Перезапуск сервиса: только infra_prepare_restart, затем задай пользователю короткий вопрос с предупреждением и вызывай infra_confirm лишь после явного «да» в следующем сообщении пользователя; иначе infra_cancel. Никогда не перезапускай сервис без подтверждения. Отчёты в Telegram (infra_send_report) — только когда пользователь прямо просит.

display:
  personality: "voice"

web:
  # ChatGPT/Codex subscription provides server-side web search; no extra key.
  search_backend: "openai-native"

platform_toolsets:
  # Voice (HA Assist -> voice-proxy -> api_server) and Telegram chat share one
  # curated surface: home, music, web search and infra diagnosis.
  api_server: [mcp-homeassistant, mcp-music-assistant, web, mcp-infra]
  telegram: [mcp-homeassistant, mcp-music-assistant, web, mcp-infra]

platforms:
  telegram:
    # The bot token is read from TELEGRAM_BOT_TOKEN (hermes-environment) and
    # TELEGRAM_ALLOWED_USERS restricts the chat to the owner.  Long polling is
    # the default transport; do not configure a webhook for this bot.
    enabled: true

mcp_servers:
  music-assistant:
    url: "http://192.0.2.28:8095/mcp/v1"
    headers:
      Authorization: "Bearer ${HERMES_MA_TOKEN}"
    connect_timeout: 20
    timeout: 90
    trust: full
    # No tools.include: every Music Assistant MCP tool is available.
    tools:
      resources: true
      prompts: true
  homeassistant:
    url: "http://192.0.2.28:8123/api/mcp"
    headers:
      Authorization: "Bearer ${HERMES_HA_TOKEN}"
    connect_timeout: 20
    timeout: 90
    trust: full
    # No tools.include: all HA MCP tools are available.
    tools:
      resources: true
      prompts: true
  infra:
    # mcp-gateway in the same namespace.  Streamable HTTP at /mcp, bearer auth.
    # trust: full is required: the voice path cannot show approval prompts, so
    # the restart confirmation is a normal two-step tool pair (prepare/confirm)
    # inside the gateway instead of a Hermes approval.
    url: "http://mcp-gateway.home-assistant.svc.cluster.local:8080/mcp"
    headers:
      Authorization: "Bearer ${HERMES_INFRA_TOKEN}"
    connect_timeout: 10
    timeout: 30
    trust: full
    tools:
      resources: true
      prompts: true
