apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hermes.name" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.name" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hermes.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.apiPort }}
      targetPort: api
