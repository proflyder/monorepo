build:
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  NestedBlockDepth:
    active: true
    threshold: 3
  ComplexCondition:
    active: true
    threshold: 4
  CognitiveComplexMethod:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true

style:
  active: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true

formatting:
  active: true
  Filename:
    active: true
  FinalNewline:
    active: true
  Indentation:
    active: true
    indentSize: 4
  NoConsecutiveBlankLines:
    active: true
  NoEmptyFirstLineInMethodBlock:
    active: true
  NoMultipleSpaces:
    active: true
  NoSemicolons:
    active: true
  NoTrailingSpaces:
    active: true
  NoUnusedImports:
    active: true
  NoWildcardImports:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundCurly:
    active: true
  SpacingAroundKeyword:
    active: true
  SpacingAroundOperators:
    active: true
  SpacingAroundParens:
    active: true
  SpacingBetweenPackageAndImports:
    active: true

home-rules:
  NoElseIf:
    active: true
  NoTry:
    active: true
  LongLambda:
    active: true
    maxLines: 3
  NoInlineJsonInTests:
    active: true
  NoHardcodedUiText:
    active: true
